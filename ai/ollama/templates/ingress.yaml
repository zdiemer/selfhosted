{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ollama.fullname" . }}
  labels:
    {{- include "ollama.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Gate the whole host behind basic auth (see templates/middleware-basicauth.yaml).
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "ollama.fullname" . }}-basicauth@kubernetescrd
    # For infra/ingress-policy, whose rule 4 only recognizes forward-auth
    # middlewares (its marker string is "forwardauth"). This host IS
    # authenticated — by the basicAuth middleware on the same router — but the
    # policy can't see that, so it gets the deliberate-decision annotation
    # rather than a middleware renamed to lie to a linter.
    ingress.zachd/public-unauthenticated: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ollama.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
  {{- end }}
{{- end }}
