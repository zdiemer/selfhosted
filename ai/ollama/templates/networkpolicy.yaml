apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ollama.fullname" . }}
  labels:
    {{- include "ollama.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ollama.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: http
          protocol: TCP
    # These two workers are the configured internal inference clients.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: talaria
          podSelector:
            matchLabels:
              app.kubernetes.io/name: talaria
              app.kubernetes.io/instance: talaria
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [general-worker, scraper-worker]
      ports:
        - port: http
          protocol: TCP
