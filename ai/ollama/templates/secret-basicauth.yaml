{{- if .Values.ingress.enabled }}
{{/*
The htpasswd lines the basicAuth middleware checks against. Supplied from the
vault via values.local.yaml; with no users the middleware denies everything,
which is the correct failure for a gate (see values.yaml).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ollama.fullname" . }}-basicauth
  labels:
    {{- include "ollama.labels" . | nindent 4 }}
type: Opaque
data:
  users: {{ join "\n" .Values.auth.basicAuth.users | b64enc | quote }}
{{- end }}
