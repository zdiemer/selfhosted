{{- if not .Values.secrets.smsApiKey }}
{{- fail "secrets.smsApiKey is required. Add apartment-watch to sms-relay's SMS_RELAY_API_KEYS and put the key in values.local.yaml." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apartment-watch.fullname" . }}
  labels:
    {{- include "apartment-watch.labels" . | nindent 4 }}
type: Opaque
stringData:
  APARTMENT_WATCH_SMS_API_KEY: {{ .Values.secrets.smsApiKey | quote }}
