# apartment-watch stipulations.
#
# This file is the whole tuning surface. It is mounted into the CronJob as a
# ConfigMap, so editing it and running ./upgrade.sh is the entire loop — no
# rebuild, no image push.
#
# No secrets here. The sms-relay API key lives in values.local.yaml.

search:
  city: san-francisco
  min_bedrooms: 0            # 0 == studio
  max_bedrooms: 1
  # The budget. Compared against *effective* rent: base rent plus any stated
  # monthly parking fee (see rules.parking below).
  max_effective_rent: 3000
  min_rent: 0

rules:
  laundry:
    # Hard requirement. 'unknown' does NOT pass — a listing that never mentions
    # laundry is far more often a unit without it than a unit with it, and a
    # false match costs a text about somewhere you can't wash clothes.
    required: true
    accept: [in_unit, in_building, on_site]
    reject: [hookups_only, none]

  parking:
    # Desired, not required. Parking never gates a match; matches that have it
    # are flagged in the SMS.
    required: false
    accept: [garage, carport, off_street, valet]
    # What to do when a listing HAS parking but never says what it costs:
    #   included     — assume it's in the rent (add $0)
    #   assume:<n>   — add $n to the rent before the budget test (conservative)
    #   exclude      — drop the listing rather than guess
    unknown_fee: included

# Point-in-polygon against data/sf-neighborhoods.geojson (DataSF "SF Find
# Neighborhoods", gfpk-269f — 117 polygons). Names must match that file exactly.
# Coordinates decide; a poster-supplied neighborhood string is only consulted
# when a listing has no lat/lon, because posters mislabel these constantly.
exclude_neighborhoods:
  - Tenderloin
  - Bayview
  - Hunters Point
  - Potrero Hill
# Neighbours of the above you may or may not also want to exclude — they're
# separate polygons in the same area, so add them here if you do:
#   India Basin, Silver Terrace, Bret Harte, Candlestick Point SRA, Little Hollywood

# Substring match against title + body. Case-insensitive.
exclude_keywords: []
#   - SRO
#   - shared room
#   - sublet

scam_filter:
  # Scored, not a keyword blacklist: several tells have to agree before a
  # listing is discarded, so one unlucky phrase can't kill a real deal. See
  # src/scam.py for the rules and what each is worth.
  enabled: true
  threshold: 4
  # Refresh market_rent below from apartments.com's rent-market-trends page.
  # Monthly, because average asking rent moves by single-digit dollars week to
  # week and this costs a warmed browser navigation through Akamai.
  #
  # A failed lookup NEVER changes matching: it falls back to the cache, then to
  # the static numbers below, and every run logs which one it used.
  market_rent_live:
    enabled: true
    refresh_days: 30

  # SF average asking rent by bedroom count — the fallback when the live lookup
  # is off or has never succeeded. Everything price-related is derived from
  # these, so re-tuning means updating real numbers rather than guessing at
  # thresholds.
  market_rent:
    0: 2698     # studio
    1: 3563     # 1br
    2: 4979     # 2br
    3: 6043     # 3br

  # Below bait_ratio x market, a listing is dropped on that alone. At 60% that
  # is $1,619 for a studio and $2,138 for a 1br — prices that don't exist here.
  #
  # This is the one filter that can hide a real find, since a genuine
  # rent-controlled unit can land under it. It's the first knob to loosen if
  # the digest feels thin.
  bait_ratio: 0.60

  # Between bait_ratio and premium_ratio a listing is cheap but not impossible,
  # and only suspicious if it ALSO claims amenities that don't come cheap
  # (in-unit laundry plus parking). Worth points, never decisive alone — an
  # under-priced good unit is the whole point of this tool.
  premium_ratio: 0.75

  # Optional: hard-code the bait threshold per bedroom count instead of
  # deriving it from market_rent x bait_ratio.
  # price_floors:
  #   0: 1700

# Flag likely rent-controlled buildings (SF: certificate of occupancy before
# 13 June 1979, excluding single-family homes and condos per Costa-Hawkins).
# One cached assessor lookup per matched building. Shows as "RC?" in the text —
# a heuristic on public data, not a legal determination.
# When a listing states a street address, look it up in the SF assessor's
# parcel records and use THAT location instead of the map pin. Posters place
# pins by hand and get them wrong — a 755 O'Farrell listing (Tenderloin)
# carried a pin 800m north in Nob Hill and so escaped the neighbourhood
# exclusion. Cached forever per address, shared with the rent-control lookup.
geocode_addresses: true

rent_control: true

sources:
  # SF's official Below Market Rate portal. THE source on a tight budget:
  # income-restricted units far under market that never appear anywhere else,
  # allocated by lottery rather than by who emails first.
  #
  # BMR has an income FLOOR as well as a ceiling — earning too much
  # disqualifies you exactly like earning too little — so set the range
  # honestly. A unit qualifies if the ranges overlap; borderline cases are
  # flagged "check" in the text rather than silently dropped.
  #
  # This source is trusted: it skips the scam filter (its rents are below
  # market by design) and the laundry rule (it publishes no amenities). Rent,
  # bedrooms and excluded neighbourhoods still apply.
  dahlia:
    enabled: true
    every_hours: 1        # one small JSON API call
    household_size: 1     # decides the income CEILING — see below
    # A listing whose deadline passed longer ago than this is dropped even if
    # the portal still marks it Active. Some sit "Active" for months.
    stale_days: 60
    # Strict: only units she actually qualifies for. 0 means a listing over
    # the income ceiling is dropped, not surfaced with a "worth asking" note.
    # Raise this (e.g. 0.10) to also see near-misses — the ceiling depends on
    # the portal's own definition of gross household income, so a couple of
    # percent over is sometimes still worth a call.
    income_overage_tolerance: 0
    annual_income_min: 93000     # REPLACE — gross annual household income
    annual_income_max: 93000     # REPLACE

  # Craigslist is the load-bearing source: it serves a no-JS result list that
  # honours the query string, so it needs no browser at all, and its detail
  # pages carry structured laundry/parking codes plus coordinates.
  craigslist:
    enabled: true
    every_hours: 1        # no browser, so polling every hour is nearly free
    max_detail_fetches: 150

  # Needs the stealth browser (F5 "Client Challenge"). Ships laundry and
  # bedrooms inline as schema.org JSON-LD, so no detail fetches at all.
  zumper:
    enabled: true
    # Browser sources stay daily: a poll here is a full stealth-browser
    # navigation, and doing that 16x a day from one residential IP is how the
    # IP gets flagged — which loses the source outright, not just one run.
    every_hours: 24

  # Needs the stealth browser AND a warm-up navigation — a cold request gets an
  # Akamai challenge shell every time. See fetch.Fetcher.warm_up.
  apartments_com:
    enabled: true
    # Daily, for the same reason as zumper — and more so: this one needs a
    # warmed navigation through Akamai, the most detection-sensitive path here.
    every_hours: 24

  # The most expensive source: its result cards carry price and location but
  # not laundry, so every candidate costs a full browser navigation. Budget is
  # deliberately small; Craigslist is doing the heavy lifting.
  zillow:
    enabled: true
    # Daily. It has also produced zero matches in every live run — detail pages
    # still 403 and its list skews to $3,500+ — so there's no case for polling
    # it harder.
    every_hours: 24
    max_detail_fetches: 12

  # Not implemented, on purpose:
  #   hotpads   — PerimeterX refuses it even from a warmed browser session, and
  #               it's Zillow-owned, so its inventory is already covered above.
  #   padmapper — Zumper's own site and Zumper's own inventory. Renders its
  #               listings from a map XHR with nothing parseable in the HTML.

# Applies to every source: how many *unseen* listings may have their detail page
# fetched in one run. Already-seen listings never cost a request, so this only
# bites on the first run or after a flood of new postings. When it trims, the
# run says so in the log rather than quietly returning a short list.
max_detail_fetches: 60

# Jittered pause between requests, in seconds.
request_delay_seconds: [1.5, 4.0]

alerts:
  to: "+15555550123"        # REPLACE — the number that gets the digest
  # The text is now a single LINK, so listings live on the run page instead of
  # in the message — one SMS segment no matter how many matched. That's what
  # fixed the carrier dropping messages: ~27 segments in 70 minutes read as
  # A2P spam.
  #
  # This caps how many listings go on one run page; anything beyond keeps
  # notified_at NULL and leads the next window's page.
  max_listings_per_digest: 25
  max_messages_per_run: 1
  # Where run pages are served. Must match the chart's ingress host.
  web_base_url: https://homes.diemer.codes
  # Local hours at which a digest may go out. The CronJob scrapes hourly, but
  # only these runs text — checking often finds listings sooner without texting
  # more, because dedup means each listing is sent once, ever. Anything found
  # between windows waits for the next one.
  # Empty list => send on every run.
  send_hours: [9, 13, 18]
  timezone: America/Los_Angeles
  # No matches => no text. Silence means "nothing qualified", which is why the
  # source-health check below exists.
  quiet_on_zero_matches: true
  # If a source returns zero listings this many runs in a row, say so — a
  # broken parser and a quiet market look identical otherwise.
  health_alert_after_stale_runs: 3
  health_alert_cooldown_days: 3
