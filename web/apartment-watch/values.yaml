# apartment-watch — a CronJob, a PVC, a ConfigMap, and a Secret. No Service and
# no Ingress: nothing ever connects *to* this, it only reaches out.

image:
  repository: ghcr.io/zdiemer/apartment-watch
  tag: "v1"
  # Static tags, so the node must re-pull to see a rebuilt v1. IfNotPresent
  # would serve a stale layer forever; Always costs one registry round-trip a
  # day, which is nothing against a ~1.3GB image it already has cached.
  pullPolicy: Always

# Set imageCredentials.pat in values.local.yaml only if the GHCR package is
# private. The convention in this repo is a public package (the cluster is
# multi-node and every node pulls anonymously).
imageCredentials:
  registry: ghcr.io
  username: zdiemer
  pat: ""

imagePullSecrets: []

schedule:
  # Hourly, 07:00-22:00 Pacific. Cheap listings go within hours, so the value
  # is in finding them fast — but scraping often is NOT texting often: which
  # sources run on a given tick is `every_hours` in criteria.yaml, and a digest
  # only goes out during `alerts.send_hours`. Overnight ticks are skipped
  # because nothing posts then and every browser poll is IP exposure.
  cron: "0 7-22 * * *"
  # Without this the schedule is UTC and drifts an hour twice a year.
  timeZone: America/Los_Angeles
  # One SQLite writer, ever.
  concurrencyPolicy: Forbid
  # Four sources through a humanized browser is minutes, not seconds. The retry
  # that matters is tomorrow's run, not a second attempt at a wall.
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600

# The run-page view: one URL per digest, so the SMS is a single short link
# instead of a wall of listing URLs. Same image as the CronJob, different
# entrypoint, sharing the same PVC read-only.
web:
  enabled: true
  service:
    port: 8080
  resources:
    requests:
      cpu: 10m
      # ~83Mi resident, just over the old 64Mi request.
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

# No auth, by design: the token in the URL is unguessable, the contents are
# public rental listings, and a login prompt on a link you tap from a text is
# the fastest way to make it go unused.
ingress:
  enabled: true
  className: traefik
  host: homes.zachd.duckdns.org
  # Served over the shared Cloudflare tunnel too. Add the hostname in the
  # Cloudflare dashboard (Zero Trust -> Networks -> Tunnels -> Public
  # Hostnames) pointing at https://traefik.kube-system.svc.cluster.local:443
  # with No TLS Verify ON; that auto-creates the proxied DNS record.
  cloudflareHosts:
    - homes.diemer.codes
  tls:
    enabled: true
    certResolver: duckdns
    domain: zachd.duckdns.org
    wildcardSan: "*.zachd.duckdns.org"

smsRelay:
  # In-cluster, so this bypasses the ingress and Authelia entirely.
  url: http://sms-relay.infra.svc.cluster.local:8000

persistence:
  data:
    size: 1Gi
    accessMode: ReadWriteOnce
    # "" => cluster default StorageClass (k3s local-path). Must render as an
    # ABSENT field, never as an empty string — storageClassName: "" means "no
    # class at all" and leaves the PVC Pending forever.
    storageClass: truenas-iscsi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    # Camoufox is a real Firefox. `money` had its valuation sync OOM-killed
    # (exit 137) at 1Gi rendering Zillow; 3Gi is the number that stopped it.
    memory: 3Gi

# Extra env for the job container, e.g. APARTMENT_WATCH_FORCE_DIGEST.
extraEnv: {}

secrets:
  # Per-service API key from sms-relay's SMS_RELAY_API_KEYS map. Set in
  # values.local.yaml — never here.
  smsApiKey: ""

# ---------------------------------------------------------------------------
# Egress
# ---------------------------------------------------------------------------
# Route this run's outbound scraping through the cluster's forward proxy
# (infra/egress-proxy) instead of straight out of the house.
#
# WHAT THIS BUYS TODAY. On `lane: direct` the traffic still leaves from the same
# address it always did — what changes is that it is authenticated as
# apartment-watch, counted, and logged per destination. That is the measurement
# this needs before any allowlist can be written honestly, and it is a change
# with no behavioural risk to weigh against it.
#
# WHAT MOVING LANES WOULD COST, and why it is not done here yet: src/fetch.py
# runs Camoufox with geoip=True, which derives locale, timezone and lat/long
# FROM THE EXIT IP. An exit that is not plausibly near San Francisco makes the
# fingerprint describe somewhere the traffic is not coming from, which is a
# louder signal to PerimeterX than the current residential address is. Move this
# to `vps` only once that exit is known to be US West Coast.
egress:
  proxy:
    enabled: true
    lane: direct

    # MUST be `explicit` for this chart. See src/egress.py: httpx and urllib
    # honour HTTP_PROXY and Camoufox does not, so `env` would send the cheap
    # tier and the liveness sweep through the proxy while the browser tier —
    # the one facing PerimeterX and Akamai — kept leaving direct. A split egress
    # is worse than either address on its own. `env` would also catch
    # notify.py's post to sms-relay inside the cluster.
    mode: explicit

  # Declared destinations. Empty means "anywhere" at the proxy for now — fill
  # this from a real measurement (scripts/egress-audit.sh), never from memory,
  # then tighten. An allowlist written from imagination breaks the run at the
  # worst possible moment and teaches everyone to widen it back to empty.
  allowedHosts: []
