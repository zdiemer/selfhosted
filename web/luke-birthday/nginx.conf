# luke.diemer.codes — hand-written static files, served flat.
#
# Nothing here is content-hashed (index.html, geo.css, geo.js, img/*), so no
# asset can be cached long: a fix to the page has to be able to reach someone
# who already loaded it. Five minutes for the markup and code, a day for the
# images, which are generated once and never change under the same name.

map $uri $site_cache_control {
    "/index.html"    "no-store";
    "/"              "no-store";
    "/healthz"       "no-store";
    "~^/img/"        "public, max-age=86400";
    "/hbd.wav"       "public, max-age=86400";
    default          "public, max-age=300";
}

server {
    # 8080, not 80: nginx-unprivileged runs as uid 101 and cannot bind a
    # privileged port. The Service maps 80 -> 8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;

    # One add_header set at server level. add_header does NOT merge, so a
    # per-location Cache-Control would silently drop the two headers below —
    # hence the map above.
    add_header Cache-Control $site_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Not an SPA: a miss is a miss. No index.html fallback, so a typo'd asset
    # path shows up as a 404 instead of quietly returning the page markup.
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # GIF/JPEG/PNG/WAV are already compressed or not worth it; text is the win.
    gzip_types text/css application/javascript image/svg+xml;
}
