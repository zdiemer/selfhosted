apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rachel-freeman.fullname" . }}
  labels:
    {{- include "rachel-freeman.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "rachel-freeman.databaseUrl" . | quote }}
  PAYLOAD_SECRET: {{ required "app.payloadSecret is required — set it in values.local.yaml" .Values.app.payloadSecret | quote }}
  # Deliberately NOT `required`. The gallery, the admin panel and the uploads
  # all work without Stripe; only the Buy button needs it. Letting the store
  # deploy and be filled with artwork before the payment account exists is the
  # difference between "set this up in one sitting" and "blocked on a signup".
  # The checkout route reports a clear "payments are not configured yet" when
  # these are empty, rather than failing obscurely.
  STRIPE_SECRET_KEY: {{ .Values.app.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.app.stripeWebhookSecret | quote }}
