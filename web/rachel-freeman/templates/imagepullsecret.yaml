{{/*
This chart's GHCR package is PRIVATE, which is the exception in this repo —
sibling charts publish a public package and every node pulls anonymously.

It is private because the package is someone else's shop rather than my
infrastructure: there is nothing secret in the image (every credential arrives
as env at runtime), but "public" is a decision to publish another person's
storefront source, and that is not mine to make by default.

Named `imagepullsecret.yaml`, not the `ghcr-secret.yaml` that sibling charts
use, because this repo's .gitignore has a blanket `*-secret.yaml` rule for real
secret manifests — and it silently swallows templates too. This file renders a
secret; it doesn't contain one.
*/}}
{{- if .Values.imageCredentials.pat }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rachel-freeman.fullname" . }}-ghcr
  labels:
    {{- include "rachel-freeman.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}"
      .Values.imageCredentials.registry
      .Values.imageCredentials.username
      .Values.imageCredentials.pat
      (printf "%s:%s" .Values.imageCredentials.username .Values.imageCredentials.pat | b64enc)
      | b64enc }}
{{- end }}
