apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rachel-freeman.fullname" . }}-postgres
  labels:
    {{- include "rachel-freeman.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  # These key names are what the postgres image's entrypoint reads, and what
  # infra/k8up's PreBackupPod pulls in wholesale with envFrom — so the dump
  # follows a password rotation here without a second copy to update.
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.password is required — set it in values.local.yaml" .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
