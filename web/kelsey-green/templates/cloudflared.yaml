{{- if .Values.cloudflared.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kelsey-green.fullname" . }}-cloudflared
  labels:
    {{- include "kelsey-green.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cloudflared.replicaCount }}
  selector:
    matchLabels:
      {{- include "kelsey-green.cloudflaredSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        # Read by scripts/ci-lint-availability.sh — see infra/cloudflared for
        # the full reasoning. The probe reports tunnel health; no Service
        # routes here, so there is no Endpoints race to wait out.
        availability.zachd/prestop-exempt: >-
          outbound-only connector; nothing routes to it through a Service
      labels:
        {{- include "kelsey-green.cloudflaredSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Hard spread — same reasoning as the site Deployment next door. Both
      # connectors on one node means one drain takes kelsey.green off the
      # Cloudflare path entirely.
      #
      # No preStop sleep: nothing routes here through a Service. The drain that
      # matters is cloudflared's own on SIGTERM, so the grace period just has to
      # be long enough to let it unregister from the edge and finish in-flight
      # requests rather than dropping them.
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "kelsey-green.cloudflaredSelectorLabels" . | nindent 14 }}
      containers:
        - name: cloudflared
          image: "{{ .Values.cloudflared.image.repository }}:{{ .Values.cloudflared.image.tag }}"
          imagePullPolicy: {{ .Values.cloudflared.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The connection is outbound-only: cloudflared dials Cloudflare's edge
          # and holds it open. Nothing listens, no port is forwarded, and the
          # home IP can change without anything breaking.
          args:
            - tunnel
            - --no-autoupdate
            # Surface the connector's health on a port we can probe.
            - --metrics=0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kelsey-green.fullname" . }}-cloudflared
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.cloudflared.resources | nindent 12 }}
{{- end }}
