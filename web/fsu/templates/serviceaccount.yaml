{{- if .Values.terminal.enabled }}
{{/*
A ServiceAccount bound to nothing, for the pod that runs a shell.

The pod already sets automountServiceAccountToken: false, so there is no token
in the container to steal. This exists so that the shell does not run as
`default` — which in a shared namespace accumulates RoleBindings nobody
remembers granting. Between a dedicated namespace and a dedicated, unbound
ServiceAccount, "a leaked token would be worth nothing" is a property of the
cluster rather than a claim in a comment.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fsu.fullname" . }}-terminal
  labels:
    {{- include "fsu.labels" . | nindent 4 }}
    app.kubernetes.io/component: terminal
automountServiceAccountToken: false
{{- end }}
