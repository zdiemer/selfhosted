{{- if and .Values.ingress.enabled .Values.terminal.enabled .Values.auth.forwardAuth.enabled }}
{{/*
Traefik Middleware that bounces /cloysta and /hashtable through Authelia. Only
those two — see ingress-terminal.yaml for why the auth split needs a second
Ingress object rather than an annotation.

Rendered into THIS chart's namespace (rather than reusing the one the Authelia
chart ships in `auth`) so the Ingress can reference it without Traefik's
allowCrossNamespace — the cross-namespace hop is just the plain HTTP `address`
URL below, which is always allowed. Same pattern as web/diemer-codes,
finance/money and docs/stirling-pdf.

Authelia's sessionDomain is zachd.duckdns.org, so fsu.zachd.duckdns.org is
already inside the existing SSO realm. Verify whether auth/authelia's
access_control default policy covers it or whether a per-domain rule is wanted:
that file carries explicit `- domain:` entries for keepass, money and sms-relay.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "fsu.fullname" . }}-terminal-forwardauth
  labels:
    {{- include "fsu.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://{{ .Values.auth.forwardAuth.autheliaService }}.{{ .Values.auth.forwardAuth.autheliaNamespace }}.svc.cluster.local:{{ .Values.auth.forwardAuth.autheliaPort }}{{ .Values.auth.forwardAuth.autheliaPath }}
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
{{- end }}
