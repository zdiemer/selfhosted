# fsu.zachd.duckdns.org — hand-written static pages plus one JAR. No build step,
# no npm, no framework. Same shape as web/luke-birthday.
#
# Nothing here is content-hashed, so the markup and stylesheet cannot be cached
# long: a fix has to be able to reach someone who already loaded the page. The
# JAR is the exception — it is rebuilt only when the image tag changes, and the
# image tag is immutable, so it can be cached hard.

map $uri $site_cache_control {
    "/"                  "no-store";
    "/index.html"        "no-store";
    "/healthz"           "no-store";
    # Immutable per image tag: build.sh refuses to push over an existing tag,
    # so this file's bytes cannot change under this URL without a redeploy.
    "/breakout.jar"      "public, max-age=86400";
    default              "public, max-age=300";
}

server {
    # 8080, not 80: nginx-unprivileged runs as uid 101 and cannot bind a
    # privileged port. The Service maps 80 -> 8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;

    # One add_header set at server level. add_header does NOT merge, so a
    # per-location Cache-Control would silently drop the headers below — hence
    # the map above.
    add_header Cache-Control $site_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # DELIBERATELY NOT SET: Cross-Origin-Opener-Policy / -Embedder-Policy.
    # CheerpJ 4.3 does not require cross-origin isolation, and COEP:
    # require-corp would break the two ttyd iframes and the /pybank iframe,
    # none of which send CORP headers. If a future CheerpJ ever complains about
    # SharedArrayBuffer, scope the headers to `location = /breakout.html` only —
    # and note that doing so makes the cjrtnc.leaningtech.com CDN a hard
    # dependency on THEIR CORP headers.

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Not an SPA: a miss is a miss. No index.html fallback, so a typo'd asset
    # path shows up as a 404 rather than quietly returning the page markup.
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # A JAR is a zip. Compressing it again costs CPU and saves nothing, so
    # application/java-archive is deliberately absent from this list.
    gzip_types text/css application/javascript image/svg+xml text/plain;
}
