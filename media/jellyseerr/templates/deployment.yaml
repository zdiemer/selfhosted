apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jellyseerr.fullname" . }}
  labels:
    {{- include "jellyseerr.labels" . | nindent 4 }}
spec:
  replicas: 1
  # RWO config volume — Recreate or the upgrade deadlocks on the attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "jellyseerr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jellyseerr.selectorLabels" . | nindent 8 }}
        ingress.enabled: "true"
    spec:
      # Covers the preStop sleep plus flushing its SQLite request database.
      terminationGracePeriodSeconds: 45
      containers:
        - name: jellyseerr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TZ
              value: America/Los_Angeles
          # Endpoint removal races SIGTERM, so Traefik can still route here
          # while the app is shutting down.
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          ports:
            - name: http
              containerPort: 5055
          volumeMounts:
            - name: config
              mountPath: /app/config
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "jellyseerr.fullname" . }}-config
