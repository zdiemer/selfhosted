{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "jellyseerr.fullname" . }}
  labels:
    {{- include "jellyseerr.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # UNAUTHENTICATED, DELIBERATELY (infra/ingress-policy rule 4).
    # Jellyseerr signs users in with their Jellyfin account, so it owns its own
    # session. Forward-auth would add a second, unrelated login in front of a
    # service whose whole purpose is to be handed to family.
    ingress.zachd/public-unauthenticated: "true"
    # Deliberately NO Authelia forward-auth: Jellyseerr signs users in with
    # their Jellyfin account, so a second portal is just a second login.
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "jellyseerr.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
    {{- range .Values.ingress.cloudflareHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "jellyseerr.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
  {{- end }}
{{- end }}
