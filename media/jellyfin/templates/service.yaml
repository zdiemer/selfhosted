apiVersion: v1
kind: Service
metadata:
  name: {{ include "jellyfin.fullname" . }}
  labels:
    {{- include "jellyfin.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "jellyfin.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.service.nodePort.enabled }}
---
# LAN door for smart TVs and anything else that prefers a plain IP:port —
# http://<any-node-ip>:{{ .Values.service.nodePort.port }}. Bypasses Traefik,
# DNS and TLS entirely, so it works even when hairpin NAT or the DuckDNS name
# is being weird. LAN-only in practice: the router doesn't forward this port.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jellyfin.fullname" . }}-lan
  labels:
    {{- include "jellyfin.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "jellyfin.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      nodePort: {{ .Values.service.nodePort.port }}
{{- end }}
