image:
  repository: docker.io/jellyfin/jellyfin
  tag: "10.11.11"
  pullPolicy: IfNotPresent

# The media library, mounted straight off the NAS's NFS export (created for
# this namespace; the SMB `media` share is the same dataset, so desktops see
# the same files). NFS rather than SMB because the arr stack depends on
# hardlinks for instant imports, and the whole namespace should see one
# filesystem. Metadata and artwork are never written here — they live in the
# config PVC.
media:
  server: "192.168.4.36"
  path: /mnt/vault/media
  mountPath: /media
  # Read-write so "Delete from disk" in the Jellyfin UI actually works. This
  # was read-only until deleting a show meant opening Sonarr every time.
  #
  # Understand what it widens: Jellyfin is deliberately NOT behind Authelia
  # (TV apps can't answer a forward-auth bounce), so its own accounts are the
  # only gate on an rw mount of the whole library. Deletion additionally
  # requires the per-user "Allow media deletion" policy, which is OFF for
  # every user by default — leave it off for everyone but the admin account
  # and that stays the real gate. Jellyfin deletes for real (unlink, no
  # trash), and the arr apps will happily re-download whatever vanishes
  # unless the series/movie is removed there too.
  #
  # Set back to true to restore the old posture; nothing else depends on the
  # mount being writable.
  readOnly: false

# Hardware transcode. zachd-ubuntu-1 is the Ryzen 2200G — the only node with
# a real GPU (Vega 8, VAAPI H.264/HEVC both directions). Pinning Jellyfin
# there costs flexibility but buys smooth remote/phone playback of
# high-bitrate files. The container must be privileged to open /dev/dri:
# non-privileged pods are denied device nodes by the device cgroup, and this
# cluster has no GPU device plugin. renderGid is the `render` group on that
# node (`stat -c %g /dev/dri/renderD128`), so the jellyfin user can open the
# render node.
# DRAINING zachd-ubuntu-1 TAKES JELLYFIN DOWN, and that is accepted rather than
# overlooked — scripts/k3s/drain-preflight.sh reports this pod as unmovable, so
# the reasoning belongs next to the cause.
#
# The pin is a hardware fact, not a scheduling preference: this is the only node
# with a usable GPU, and the pod additionally hostPath-mounts /dev/dri, which
# exists nowhere else. Relaxing it needs a second machine with a render node —
# at which point label both and switch this to a label selector rather than a
# hostname.
#
# Setting transcode.enabled: false unpins the pod immediately (no nodeSelector,
# no /dev/dri mount) at the cost of CPU-only transcoding, which this fleet
# cannot do for high-bitrate files. That is the lever if the node ever needs a
# long maintenance window rather than a quick drain.
transcode:
  enabled: true
  nodeName: zachd-ubuntu-1
  renderGid: 992

# Jellyfin runs as this uid/gid; the NAS media dirs are owned 1000:1000.
runAsUser: 1000
runAsGroup: 1000

service:
  type: ClusterIP
  port: 8096
  # LAN door for smart TVs: a second NodePort Service so TV apps can reach
  # http://<any-node-ip>:30096 without DNS, hairpin NAT, or TLS quirks.
  # Same pattern as infra/headlamp's :30100. The DuckDNS ingress stays the
  # primary (and remote) address.
  nodePort:
    enabled: true
    port: 30096

# Advertised to clients that autodiscover the server.
publishedServerUrl: https://jellyfin.zachd.duckdns.org

persistence:
  # /config holds the SQLite databases, metadata, artwork and per-user state.
  # Artwork for a large library adds up (see games/romm: 50Gi wasn't crazy).
  # iSCSI, not nfs — SQLite wants real fsync and per-file round-trips are
  # what made RomM's covers unbearable on nfs.
  config:
    size: 30Gi
    storageClass: truenas-iscsi
    accessMode: ReadWriteOnce
  # /cache (transcodes, image cache) is scratch — emptyDir, node-local, free
  # to vanish on reschedule.
  #
  # 40Gi, up from 20Gi: kubelet evicted the pod on 2026-08-09 with "Usage of
  # EmptyDir volume cache exceeds the limit 20Gi". The limit is enforced by
  # killing the pod, so hitting it drops playback mid-stream rather than
  # failing a write.
  #
  # This is headroom, not a fix. Observed growth is ~10Gi per 12h of use
  # (interrupted transcode sessions leave their segments behind), so 40Gi
  # buys days, not forever. The real levers are in the Jellyfin UI — the
  # scheduled transcode-cleanup task and playback → transcode throttling.
  #
  # Ceiling on the number: this is node-local disk on zachd-ubuntu-1, which
  # had ~54Gi free when this was raised. Going much past 40Gi trades a
  # jellyfin eviction for DiskPressure evicting whatever else lands there.
  cacheSizeLimit: 40Gi

# NO Authelia forward-auth here, deliberately: TV/phone/desktop Jellyfin apps
# speak the Jellyfin API directly and cannot answer an HTML login bounce.
# Jellyfin's own accounts are the gate (plus Quick Connect for TV sign-in).
ingress:
  enabled: true
  className: traefik
  host: jellyfin.zachd.duckdns.org
  # NOT on the Cloudflare tunnel, deliberately: sustained high-bitrate video
  # through CF's free proxy is a ToS gray area. jellyfin.diemer.codes is served
  # instead by the Caddy media lane on the egress VPS
  # (infra/egress-proxy/vps/caddy-media.Caddyfile.template), which terminates
  # TLS itself and reverse-proxies over Tailscale to this app's LAN NodePort
  # (jellyfin-lan, :30096) — our bandwidth, no ToS ceiling. That path lives
  # entirely on the VPS + DNS; nothing about it is configured in this chart.
  cloudflareHosts: []
  tls:
    enabled: true

resources:
  # The GPU node runs hot (~87% CPU requested, mostly talaria) — keep the
  # request small enough to actually fit; VAAPI means playback rarely needs
  # much CPU anyway.
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    # Software-transcode fallback (when VAAPI can't take a codec) is a CPU
    # hog; no CPU limit so it can burst, but keep memory bounded.
    memory: 4Gi
