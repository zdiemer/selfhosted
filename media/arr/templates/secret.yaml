{{/*
PIA credentials for gluetun (OPENVPN_USER / OPENVPN_PASSWORD in
qbittorrent.yaml). Both are `required`: gluetun with empty credentials does not
fail closed in a useful way — it retries the OpenVPN handshake forever while the
pod reports Running, which looks like a slow tunnel rather than a missing
secret. Better to refuse to render.

Values come from values.local.yaml (op://homelab/media-arr) and never touch git.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arr.fullname" . }}-pia
  labels:
    {{- include "arr.labels" . | nindent 4 }}
    app.kubernetes.io/component: qbittorrent
type: Opaque
stringData:
  username: {{ required "pia.username is required — the p1234567 login from https://www.privateinternetaccess.com/account. See values.local.yaml.example" .Values.pia.username | quote }}
  password: {{ required "pia.password is required — the password for pia.username. See values.local.yaml.example" .Values.pia.password | quote }}
