{{/*
FlareSolverr — headless Chrome that solves the Cloudflare interstitial for
the public indexers that sit behind one (1337x, EZTV, KickAss, ExtraTorrent
and friends all reject a plain HTTP client). Prowlarr calls it as an indexer
proxy: the request goes here, Chrome does the challenge, cookies come back.

Not one of .Values.apps — no /config PVC (entirely stateless, every session
is thrown away), no /media mount, no ingress. Nothing outside the cluster
should reach an endpoint that fetches arbitrary URLs on request.
*/}}
{{- if .Values.flaresolverr.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arr.fullname" . }}-flaresolverr-runner
data:
  runner.py: |
{{ .Files.Get "files/flaresolverr-runner.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arr.fullname" . }}-flaresolverr
  labels:
    {{- include "arr.labels" . | nindent 4 }}
    app.kubernetes.io/component: flaresolverr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "arr.appSelectorLabels" (dict "root" . "app" "flaresolverr") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/runner: {{ .Files.Get "files/flaresolverr-runner.py" | sha256sum }}
      labels:
        {{- include "arr.appSelectorLabels" (dict "root" . "app" "flaresolverr") | nindent 8 }}
    spec:
      # A solve holds Chrome for tens of seconds; 60 matches the sibling apps
      # and leaves room for the preStop sleep below.
      terminationGracePeriodSeconds: 60
      containers:
        - name: flaresolverr
          image: "{{ .Values.flaresolverr.image }}:{{ .Values.flaresolverr.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/dumb-init", "--", "python", "-u", "/opt/flaresolverr-runner/runner.py"]
          env:
            - name: TZ
              value: {{ .Values.timezone }}
            - name: LOG_LEVEL
              value: {{ .Values.flaresolverr.logLevel }}
            # Chrome is only ever driven by Prowlarr over the ClusterIP
            # Service, so it listens on all interfaces inside the pod.
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.flaresolverr.port | quote }}
            - name: MAX_BROWSER_REQUESTS
              value: {{ .Values.flaresolverr.maxBrowserRequests | quote }}
            # A solved challenge is reusable, so sessions are cached rather
            # than spawning a browser per query. They still expire — a stale
            # clearance cookie fails the same as no cookie.
            - name: SESSION_TTL_MINUTES
              value: {{ .Values.flaresolverr.sessionTtlMinutes | quote }}
          # Endpoint removal races SIGTERM: Prowlarr reaches this over the
          # ClusterIP Service, so a dying pod can still be handed a solve.
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          ports:
            - name: http
              containerPort: {{ .Values.flaresolverr.port }}
          # Chrome wants somewhere real to put its shared memory; the default
          # 64Mi /dev/shm is the classic renderer-crash-under-load footgun.
          volumeMounts:
            - name: runner
              mountPath: /opt/flaresolverr-runner
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          # The wrapper reserves HTTP workers for /health even when all browser
          # slots are busy. Keep a generous startup window for Chromium.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources.flaresolverr | nindent 12 }}
      volumes:
        - name: runner
          configMap:
            name: {{ include "arr.fullname" . }}-flaresolverr-runner
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.flaresolverr.shmSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arr.fullname" . }}-flaresolverr
  labels:
    {{- include "arr.labels" . | nindent 4 }}
    app.kubernetes.io/component: flaresolverr
spec:
  type: ClusterIP
  selector:
    {{- include "arr.appSelectorLabels" (dict "root" . "app" "flaresolverr") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.flaresolverr.port }}
      targetPort: http
{{- end }}
