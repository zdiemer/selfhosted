{{- if and .Values.ingress.enabled .Values.auth.forwardAuth.enabled }}
{{/*
Traefik Middleware bouncing every request through Authelia before it reaches
the UI. Rendered into THIS chart's namespace so the Ingress can reference it
without Traefik's allowCrossNamespace — the cross-namespace hop is just the
plain HTTP `address` URL, which is always allowed. Same shape as media/arr.

Unlike the arr apps, bitmagnet has no login of its own, so this is the only
thing standing in front of it.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "bitmagnet.fullname" . }}-forwardauth
  labels:
    {{- include "bitmagnet.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://{{ .Values.auth.forwardAuth.autheliaService }}.{{ .Values.auth.forwardAuth.autheliaNamespace }}.svc.cluster.local:{{ .Values.auth.forwardAuth.autheliaPort }}{{ .Values.auth.forwardAuth.autheliaPath }}
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
{{- end }}
