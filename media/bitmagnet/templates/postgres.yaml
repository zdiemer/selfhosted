apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bitmagnet.fullname" . }}-postgres
  labels:
    {{- include "bitmagnet.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  {{- if not .Values.persistence.postgres.backup }}
  annotations:
    # Opt out of k8up's cluster-wide opt-out backup. See values.yaml for why.
    k8up.io/backup: "false"
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.postgres.accessMode }}
  storageClassName: {{ .Values.persistence.postgres.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.postgres.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bitmagnet.fullname" . }}-postgres
  labels:
    {{- include "bitmagnet.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate           # single RWO PVC → never two pods at once
  selector:
    matchLabels:
      {{- include "bitmagnet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/postgres-secret.yaml") . | sha256sum }}
      labels:
        {{- include "bitmagnet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      # 30s is the k8s default and it is not enough for a database: a drain
      # sends SIGTERM and hard-kills at the deadline mid-checkpoint, which is
      # the window where corruption lives.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          # Endpoint removal races SIGTERM, so bitmagnet can still be handed
          # this pod's address while it is shutting down.
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "bitmagnet.fullname" . }}-postgres
          # Alpine's postgres writes pgdata under /var/lib/postgresql/data; the
          # subPath keeps initdb away from the lost+found some CSI drivers
          # leave at the volume root.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "bitmagnet.fullname" . }}-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bitmagnet.fullname" . }}-postgres
  labels:
    {{- include "bitmagnet.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "bitmagnet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
