{{/*
Bitmagnet's Postgres. Its own instance rather than a shared one: the crawler
writes continuously and the index is the largest table in the cluster, and
none of that should share a buffer cache (or a restore) with anything that
matters.

Credentials come from values.local.yaml (op://homelab/media-bitmagnet) and
never touch git.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bitmagnet.fullname" . }}-postgres
  labels:
    {{- include "bitmagnet.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.password is required — see values.local.yaml.example (op://homelab/media-bitmagnet)" .Values.postgres.password | quote }}
