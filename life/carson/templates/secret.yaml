{{- if not .Values.secrets.smsApiKey }}
{{- fail "secrets.smsApiKey is required. Add carson to sms-relay's SMS_RELAY_API_KEYS and put the key in values.local.yaml." }}
{{- end }}
{{- if not .Values.secrets.feedToken }}
{{- fail "secrets.feedToken is required — it is the only thing protecting the calendar feed. Generate: python3 -c 'import secrets; print(secrets.token_urlsafe(32))'" }}
{{- end }}
{{- if not .Values.sms.to }}
{{- fail "sms.to is required (E.164), or reminders would compose and go nowhere." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "carson.fullname" . }}
  labels:
    {{- include "carson.labels" . | nindent 4 }}
type: Opaque
stringData:
  CARSON_SMS_API_KEY: {{ .Values.secrets.smsApiKey | quote }}
  CARSON_FEED_TOKEN: {{ .Values.secrets.feedToken | quote }}
  CARSON_SMS_TO: {{ .Values.sms.to | quote }}
