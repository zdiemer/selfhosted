<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A searchable personal archive of forum conversations, writing, and recovered images from the early web.">
  <title>{% block title %}Early Internet Archive{% endblock %}</title>
  <link rel="stylesheet" href="/static/archive.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="/" aria-label="Early Internet Archive home">
        <span class="signal" aria-hidden="true"><span></span></span>
        <span class="wordmark-copy"><strong>Early Internet Archive</strong><small>Personal collection</small></span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/search" {% if request.url.path == '/search' or request.url.path.startswith('/item/') %}aria-current="page"{% endif %}>Writing</a>
        <a href="/gallery" {% if request.url.path == '/gallery' or request.url.path.startswith('/asset/') %}aria-current="page"{% endif %}>Images</a>
      </nav>
    </div>
  </header>
  <main id="main-content" tabindex="-1">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div><strong>Early Internet Archive</strong><p>Preserved pages presented as evidence, not rewritten history.</p></div>
      <nav aria-label="Footer navigation"><a href="/">Home</a><a href="/search">Writing</a><a href="/gallery">Images</a></nav>
    </div>
  </footer>
</body>
</html>
