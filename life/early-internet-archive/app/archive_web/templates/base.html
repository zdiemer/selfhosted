<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Early Internet Archive{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/archive.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/"><span class="signal" aria-hidden="true"></span>Early Internet Archive</a>
    <nav aria-label="Main navigation">
      <a href="/search">Writing</a>
      <a href="/gallery">Images</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <p>A provenance-first personal archive. Preserved pages are presented as evidence, not rewritten history.</p>
  </footer>
</body>
</html>
