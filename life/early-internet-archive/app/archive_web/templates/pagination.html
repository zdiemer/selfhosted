{% if pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page > 1 %}<a class="page-link previous" href="{{ pagination_url(request, page - 1) }}"><span aria-hidden="true">←</span> Previous</a>{% else %}<span class="page-link placeholder" aria-hidden="true"></span>{% endif %}
  <span class="page-position"><strong>{{ page }}</strong><span aria-hidden="true"> / </span><span class="sr-only">of</span>{{ pages }}</span>
  {% if page < pages %}<a class="page-link next" href="{{ pagination_url(request, page + 1) }}">Next <span aria-hidden="true">→</span></a>{% else %}<span class="page-link placeholder" aria-hidden="true"></span>{% endif %}
</nav>
{% endif %}
