{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "early-internet-archive.fullname" . }}
  labels:
    {{- include "early-internet-archive.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # The archive is private even on the tailnet: every route passes through
    # the namespace-local middleware below and then Authelia.
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "early-internet-archive.fullname" . }}-forwardauth@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "early-internet-archive.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
{{- end }}
