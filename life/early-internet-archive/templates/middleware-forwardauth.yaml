{{- if .Values.ingress.enabled }}
{{/*
Rendered in this release's namespace so the Ingress can name it without
Traefik's allowCrossNamespace. The HTTP address may still target Authelia's
Service in the auth namespace.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "early-internet-archive.fullname" . }}-forwardauth
  labels:
    {{- include "early-internet-archive.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://{{ .Values.auth.forwardAuth.autheliaService }}.{{ .Values.auth.forwardAuth.autheliaNamespace }}.svc.cluster.local:{{ .Values.auth.forwardAuth.autheliaPort }}{{ .Values.auth.forwardAuth.autheliaPath }}
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
{{- end }}
