{{- if .Values.networkPolicy.enabled }}
{{/*
The web tier is a closed reader: it queries the catalog copied into emptyDir
and opens recovered media from the read-only PVC. It does not need DNS or any
other egress. NFS mounting is performed by the node/CSI stack, not by the pod.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "early-internet-archive.fullname" . }}
  labels:
    {{- include "early-internet-archive.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "early-internet-archive.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  egress: []
{{- end }}
