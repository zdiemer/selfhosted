; PlatformIO project for the laundry sensor.
;
;   pio run -t upload          build + flash over USB
;   pio device monitor         watch the readings (115200 baud)
;
; Board `esp32dev` is the generic ESP32-WROOM-32 DevKit profile — the right one
; for an "ESP32-D" devkit. If yours enumerates but will not flash, hold BOOT
; while upload starts.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -Wall
; No library dependencies on purpose. The MPU-6050 is six register writes and
; one 14-byte burst read (see src/main.cpp) — an Adafruit/Electronic Cats driver
; would be a pinned dependency, a unit-conversion layer and a sensor-fusion
; stack we do not use, in front of code that is shorter than its own README.
lib_deps =
