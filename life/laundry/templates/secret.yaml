{{- if not .Values.secrets.ingestToken }}
{{- fail "secrets.ingestToken is required — it is the only thing in front of the LAN ingest port. Generate: openssl rand -hex 32" }}
{{- end }}
{{- if not .Values.secrets.smsApiKey }}
{{- fail "secrets.smsApiKey is required. Add `laundry` to sms-relay's apiKeys and put the key in values.local.yaml." }}
{{- end }}
{{- if not .Values.sms.to }}
{{- fail "sms.to is required (E.164 or 10 digits), or a finished load would be detected and told to nobody." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "laundry.fullname" . }}
  labels:
    {{- include "laundry.labels" . | nindent 4 }}
type: Opaque
stringData:
  LAUNDRY_INGEST_TOKEN: {{ .Values.secrets.ingestToken | quote }}
  LAUNDRY_SMS_API_KEY: {{ .Values.secrets.smsApiKey | quote }}
  LAUNDRY_SMS_TO: {{ .Values.sms.to | quote }}
