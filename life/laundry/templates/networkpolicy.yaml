apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "laundry.fullname" . }}
  labels:
    {{- include "laundry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "laundry.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        # Metrics share the HTTP listener; only the trusted Alloy agent may scrape.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: http
    # Sensors arrive through ServiceLB with SNAT. Their separate, token-gated
    # listener must remain reachable regardless of the forwarding node.
    - ports:
        - protocol: TCP
          port: ingest
