{{- if and .Values.ingress.enabled .Values.auth.forwardAuth.enabled }}
{{/*
Traefik Middleware bouncing dashboard requests through Authelia. Rendered into
THIS chart's namespace (rather than reusing the one in `auth`) so the Ingress
can reference it without Traefik's allowCrossNamespace — the cross-namespace
hop is just the plain HTTP `address` URL below, which is always allowed.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "laundry.fullname" . }}-forwardauth
  labels:
    {{- include "laundry.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://{{ .Values.auth.forwardAuth.autheliaService }}.{{ .Values.auth.forwardAuth.autheliaNamespace }}.svc.cluster.local:{{ .Values.auth.forwardAuth.autheliaPort }}{{ .Values.auth.forwardAuth.autheliaPath }}
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
{{- end }}
