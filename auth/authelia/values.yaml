image:
  repository: authelia/authelia
  tag: "4.39.20"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9091

# Public URL where Authelia answers. Must be HTTPS — RomM and every other
# modern OIDC client refuses HTTP issuers. Points at the same wildcard cert
# the other services use (see README §Prerequisites).
externalUrl: "https://auth.zachd.duckdns.org"

# Cookie domain for SSO across services. All protected apps must live under
# this domain so the session cookie is sent to them.
sessionDomain: "zachd.duckdns.org"

# Additional cookie domains Authelia protects, beyond the primary above. Each
# needs its own reachable Authelia URL (published via the Cloudflare tunnel —
# infra/cloudflared). A browser can't share one cookie across two registrable
# domains, so each domain is its own SSO realm. Empty = single-domain (duckdns).
extraSessionCookies:
  - domain: "diemer.codes"
    autheliaUrl: "https://auth.diemer.codes"

persistence:
  # Holds the SQLite storage database (user 2FA registrations, OIDC consent
  # history). Tiny; a few MB after years of use.
  #
  # storageClass is deliberately blank, which means local-path: this is the
  # survival tier. If the NAS is down and Authelia cannot start, you cannot log
  # in to fix the NAS. That is a decision about AVAILABILITY and says nothing
  # about durability — k8up backs the volume up either way.
  size: 1Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# Which node the local-path volume above lives on. Empty = let the scheduler
# choose, which is how SSO ended up on a 4GB Chromebook. See the comment in
# templates/deployment.yaml. Changing this does NOT move existing data: the
# old PV keeps its own node affinity, so a move means draining the SQLite off
# by hand (it is a single ~320KB file) and letting a fresh PVC provision here.
nodeSelector:
  kubernetes.io/hostname: zachd-ubuntu-2

# Session store. Without this, sessions live in the Authelia process, so every
# restart — an upgrade, a node drain, an eviction — logs every user out of every
# gated service on top of the ~15s of 401s while the pod is gone. Redis makes
# the restart cost only the 401s.
#
# It does NOT make Authelia highly available: storage is still SQLite on a
# single RWO volume, so Authelia stays one replica. Moving storage to Postgres
# would allow two, but would put the login path on the NAS and give up the
# survival tier above. See templates/redis.yaml for the full argument.
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  networkPolicy:
    # This is the authentication for the port — there is no Redis password, so
    # only the Authelia pods may reach 6379 at all. Turning this off exposes
    # session tokens to anything with pod-network access.
    enabled: true
  resources:
    requests:
      cpu: 10m
      # Sessions for a handful of users are a few hundred KB. The request is
      # small on purpose: several nodes here are already past 80% of their
      # bookable memory.
      memory: 32Mi
    limits:
      memory: 128Mi

# The file-based user backend. Suitable for a small friend group; skip the
# LDAP song-and-dance. Actual user entries come from values.local.yaml.
# Each entry needs a password hashed with:
#   docker run --rm authelia/authelia:latest \
#     authelia crypto hash generate argon2 --password 'plaintext'
users: {}
# Example (in values.local.yaml):
#   users:
#     zachd:
#       displayname: "Zach"
#       email: "zach.diemer@gmail.com"
#       groups: [admins]
#       password: "$argon2id$v=19$m=65536,t=3,p=4$..."

# Access control. "bypass" for the Authelia portal itself; anything else is
# two-factor by default. Tighten per-rule below.
accessControl:
  default_policy: "two_factor"
  rules:
    # RomM: the DuckDNS/tailnet host (romm.zachd.duckdns.org) carries NO
    # forward-auth middleware — it uses RomM's own login (+ optional OIDC) and
    # is already gated by being tailnet-only, so native RomM clients work there.
    # The PUBLIC host romm.diemer.codes IS behind forward-auth (games/romm,
    # auth.forwardAuth.publicOnly), so it lands here; the explicit rule for it
    # sits with the other diemer.codes hosts below. default_policy: two_factor
    # already covers it — the rule is explicit-for-parity.
    # KeeWeb (browser KeePass client). WebDAV is NOT here — native KeePass
    # apps can't do an OIDC redirect, so webdav.zachd uses its own static
    # Basic auth (see ../keepass/).
    - domain: "keepass.zachd.duckdns.org"
      policy: "two_factor"
    # money — personal FI dashboard (finance/money). Single user, DuckDNS-only
    # (deliberately not on the diemer.codes tunnel). Explicit for parity;
    # default_policy already gates it.
    - domain: "money.zachd.duckdns.org"
      policy: "two_factor"
    # sms-relay — the cluster's SMS gateway (infra/sms-relay). Explicit for
    # parity; default_policy already gates it. Note the handset's inbound
    # webhook does NOT pass through here: that path has its own Ingress with no
    # forward-auth middleware, and is authenticated by an HMAC signature
    # instead, because a phone cannot complete an interactive login.
    - domain: "sms-relay.zachd.duckdns.org"
      policy: "two_factor"
    # Same apps on the diemer.codes tunnel (infra/cloudflared). default_policy is
    # already two_factor, so these are explicit-for-parity rather than strictly
    # required; keeping them mirrors the duckdns hosts as those get retired.
    #
    # keepass.diemer.codes was here and is gone: KeeWeb is tailnet-only now
    # (auth/keepass keeweb.ingress.cloudflareHosts is empty), so the rule
    # guarded a host Traefik no longer routes. A rule for a dead host is worse
    # than no rule — it reads as coverage during a review while protecting
    # nothing, and default_policy: two_factor catches the host anyway if it
    # ever comes back.
    # romm.diemer.codes — public (Cloudflare) host only; the tailnet host stays
    # on RomM's own login so native clients keep working. See games/romm
    # auth.forwardAuth.publicOnly.
    - domain: "romm.diemer.codes"
      policy: "two_factor"

# OIDC clients (values.local.yaml holds the real secrets). Each entry is a
# client app that delegates auth to Authelia. Client secrets are stored
# *hashed* here; the plaintext lives in the consuming app's config.
oidc:
  enabled: true
  # HMAC secret for signing OIDC tokens — generate once with:
  #   openssl rand -hex 64
  # Stored in values.local.yaml as oidc.hmacSecret.
  hmacSecret: ""
  # RSA private key for signing id_tokens. Generate once with:
  #   openssl genrsa -out issuer.key 4096
  # Paste the PEM into values.local.yaml as oidc.issuerPrivateKey.
  issuerPrivateKey: ""
  clients: []
  # Example (in values.local.yaml):
  #   oidc:
  #     clients:
  #       - id: romm
  #         description: RomM
  #         secret: "$pbkdf2-sha512$310000$..."   # see README for hashing
  #         public: false
  #         authorization_policy: two_factor
  #         redirect_uris:
  #           - https://romm.zachd.duckdns.org/api/oauth/openid
  #         scopes: [openid, profile, email, groups]
  #         userinfo_signing_algorithm: none

# App-level secrets. All of these must be set in values.local.yaml.
secrets:
  # openssl rand -hex 64
  jwtSecret: ""
  # openssl rand -hex 64
  sessionSecret: ""
  # openssl rand -hex 64
  storageEncryptionKey: ""
  # SMTP for password reset + 2FA enrollment notifications. Any relay works
  # (Gmail app password, Fastmail, SendGrid, Mailgun, etc).
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
    sender: "Authelia <noreply@zachd.duckdns.org>"

ingress:
  enabled: false                      # flip on once secrets + users are populated
  className: traefik
  host: auth.zachd.duckdns.org
  # Additional hosts published via the Cloudflare tunnel (infra/cloudflared). TLS
  # for these is terminated at Cloudflare, so they are NOT added to the ACME cert
  # list. A list — add more domains here to serve this app on them too.
  cloudflareHosts:
    - auth.diemer.codes
  tls:
    enabled: true
    # See RomM README §DuckDNS follow-up for why the wildcard SAN is needed.

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
