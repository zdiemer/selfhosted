# Self-hosted KeePass: WebDAV server (for native clients) + KeeWeb (browser UI).
# Both deploy into the `auth` namespace alongside Authelia so the KeeWeb
# Ingress can reference Authelia's forward-auth Middleware without a
# cross-namespace `@kubernetescrd` reference.

webdav:
  image:
    # Was bytemark/webdav:2.4 — Apache mod_dav, last published 2018-12-14 by a
    # hosting company that no longer exists. Nothing was wrong with it
    # functionally; the problem is that an abandoned image cannot receive a
    # patch, and this endpoint is the front door to a password vault. Renovate
    # could never have flagged it either: the tag it watches will never move,
    # so "no update available" and "no maintainer" look identical.
    #
    # hacdias/webdav is a single Go binary on `scratch` — no shell, no OS
    # packages, nothing to patch but the binary itself — and is actively
    # maintained. Config moved from env vars to a file; see
    # templates/webdav-config.yaml.
    # renovate: datasource=docker depName=ghcr.io/hacdias/webdav
    repository: ghcr.io/hacdias/webdav
    tag: "v5.14.2"
    pullPolicy: IfNotPresent
  # hacdias' default. bytemark served on 80; the Service still publishes
  # service.port, so nothing outside this chart needs to know.
  containerPort: 6065
  service:
    port: 80
  ingress:
    enabled: false                        # flip on in values.local.yaml
    className: traefik
    host: webdav.zachd.duckdns.org
    # Additional hosts published via the Cloudflare tunnel (infra/cloudflared). TLS
    # for these is terminated at Cloudflare, so they are NOT added to the ACME cert
    # list. A list — add more domains here to serve this app on them too.
    #
    # Emptied deliberately: the .kdbx WebDAV endpoint is tailnet-only now
    # (webdav.zachd.duckdns.org over Tailscale) — its static HTTP Basic auth was
    # never meant to be the sole guard on the public internet.
    cloudflareHosts: []
  persistence:
    # Holds the .kdbx file(s). 1Gi is wildly more than needed; KeePass DBs
    # are typically <1MB.
    size: 1Gi
    storageClass: truenas-nfs
    accessMode: ReadWriteOnce
  # Static HTTP Basic credentials for native KeePass clients (KeePassXC,
  # KeePass2Android, Strongbox iOS). The plaintext password rides over HTTPS
  # on every request. NOTE: the .kdbx itself is encrypted by your KeePass
  # master password — this Basic auth is gatekeeping access to an already-
  # encrypted blob. Set both fields in values.local.yaml.
  auth:
    username: ""
    password: ""
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

keeweb:
  # Two, unlike its webdav sibling, which is stuck at one by the RWO volume
  # holding the .kdbx. keeweb holds nothing — the SPA runs entirely in the
  # browser and fetches the vault itself — so it is one of the few things here
  # that can genuinely roll and drain with no gap at all. It idles at ~3Mi, so
  # the second replica is free in a way most of this cluster is not.
  replicaCount: 2
  image:
    # Checked 2026-08-11 while replacing the webdav image, and deliberately
    # left alone: 1.18.7 IS the newest build of the newest upstream release
    # (keeweb/keeweb v1.18.7, 2021-07-18). The project is not archived — it
    # still sees commits — it simply has not cut a release in five years, so
    # there is nothing newer to move to.
    #
    # A previous note here suggested lscr.io/linuxserver/keeweb. That image
    # does not exist (404); do not chase it.
    #
    # Lower risk than the webdav container was: this serves static assets for a
    # client-side SPA, the vault is fetched by the browser rather than passing
    # through it, and it sits behind Authelia forward-auth.
    repository: antelle/keeweb
    tag: "1.18.7"
    pullPolicy: IfNotPresent
  service:
    port: 80
  ingress:
    enabled: false                        # flip on in values.local.yaml
    className: traefik
    host: keepass.zachd.duckdns.org
    # Additional hosts published via the Cloudflare tunnel (infra/cloudflared). TLS
    # for these is terminated at Cloudflare, so they are NOT added to the ACME cert
    # list. A list — add more domains here to serve this app on them too.
    #
    # Emptied deliberately: KeeWeb is tailnet-only now, joining its WebDAV
    # sibling (emptied above in dcd3566) so the whole vault lives behind one
    # boundary. Authelia in front of it was real, but it made a browser at any
    # coffee shop one password-plus-TOTP away from the password database, and
    # a Cloudflare-terminated hostname is a standing invitation to credential
    # stuffing that the tailnet simply does not answer. The keepass.diemer.codes
    # tunnel hostname is already gone from the CF dashboard.
    cloudflareHosts: []
    # Authelia forward-auth Middleware — full OIDC + TOTP. Format is
    # `<namespace>-<release>-forwardauth@kubernetescrd`. If you renamed
    # the Authelia Helm release or namespace, update accordingly.
    middleware: "auth-authelia-forwardauth@kubernetescrd"
  # Optional: mount a KeePass key file into KeeWeb's static-asset directory
  # so any authenticated browser can fetch it once. Reachable at
  # https://<keeweb host>/<filename>; gated by the same Authelia forward-auth
  # as the rest of KeeWeb. NEVER mounted into the WebDAV pod — keeping the
  # key file off the same host as the .kdbx is the whole point of a key file.
  #
  # Native KeePass clients (KeePassXC, KeePass2Android, Strongbox) should
  # keep the key file on-device — do NOT pull it from this URL on a phone or
  # desktop, since the value of a key file is "lives somewhere different
  # from the .kdbx" and an Authelia password is not that separation.
  keyfile:
    enabled: false
    filename: "keyfile.bin"
    # base64-encoded bytes of your existing key file. Set in values.local.yaml:
    #   contentBase64: "$(base64 -w0 < /path/to/your.keyx)"
    contentBase64: ""
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
