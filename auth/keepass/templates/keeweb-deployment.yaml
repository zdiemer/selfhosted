apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keepass.fullname" . }}-keeweb
  labels:
    {{- include "keepass.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Explicit, because the absence of a strategy block reads exactly like a
  # deliberate choice while actually meaning "whatever RollingUpdate 25%/25%
  # does". keeweb is a static web UI with no volume — it holds nothing, and
  # the vault it opens is fetched by the browser from webdav — so surging to
  # a second pod before the first goes away is free and makes this the one
  # half of this chart that upgrades without a gap. Contrast webdav next door,
  # which is Recreate because it does hold the RWO volume.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "keepass.keeweb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if .Values.keeweb.keyfile.enabled }}
      annotations:
        checksum/keyfile: {{ include (print $.Template.BasePath "/keeweb-keyfile-secret.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "keepass.keeweb.selectorLabels" . | nindent 8 }}
        {{- if .Values.keeweb.ingress.enabled }}
        # Ships this pod's logs to infra/alloy. Derived from the chart's
        # own ingress switch, so the allowlist cannot drift out of sync.
        logging.zachd/external-ingress: "true"
        {{- end }}
    spec:
      containers:
        - name: keeweb
          image: "{{ .Values.keeweb.image.repository }}:{{ .Values.keeweb.image.tag }}"
          imagePullPolicy: {{ .Values.keeweb.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          {{- if .Values.keeweb.keyfile.enabled }}
          volumeMounts:
            # Mount the key file as a single static asset in nginx's docroot.
            # Reachable at https://<keeweb host>/<filename> behind Authelia
            # forward-auth. subPath ensures only this one file lands; the
            # rest of the SPA bundle baked into the image is untouched.
            - name: keyfile
              mountPath: /usr/share/nginx/html/{{ .Values.keeweb.keyfile.filename }}
              subPath: {{ .Values.keeweb.keyfile.filename }}
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.keeweb.resources | nindent 12 }}
      {{- if .Values.keeweb.keyfile.enabled }}
      volumes:
        - name: keyfile
          secret:
            secretName: {{ include "keepass.fullname" . }}-keyfile
            defaultMode: 0444
      {{- end }}
