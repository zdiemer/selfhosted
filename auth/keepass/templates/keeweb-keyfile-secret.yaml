{{- if .Values.keeweb.keyfile.enabled }}
{{/*
Holds the bytes of the user's KeePass key file. Mounted into the KeeWeb
container as a static asset so any authenticated browser can fetch it
once and cache it in localStorage. Authelia forward-auth gates the route.

Stored as `data.<filename>` (binary-safe) so the deployment can mount it
with a fixed subPath. The base64 encoding in values.local.yaml is decoded
by Kubernetes when the Secret materializes.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keepass.fullname" . }}-keyfile
  labels:
    {{- include "keepass.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.keeweb.keyfile.filename }}: {{ required "keeweb.keyfile.contentBase64 required when keyfile.enabled" .Values.keeweb.keyfile.contentBase64 | quote }}
{{- end }}
