{{- if .Values.webdav.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "keepass.fullname" . }}-webdav
  labels:
    {{- include "keepass.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # UNAUTHENTICATED, DELIBERATELY (infra/ingress-policy rule 4).
    # Static Basic auth, not Authelia — native KeePass clients speak WebDAV and
    # cannot complete an OIDC redirect. Differently authenticated, not
    # unauthenticated; see values.yaml and the keeweb ingress next door, which
    # IS behind forward-auth because a browser can redirect.
    ingress.zachd/public-unauthenticated: "true"
spec:
  ingressClassName: {{ .Values.webdav.ingress.className }}
  rules:
    - host: {{ .Values.webdav.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "keepass.fullname" . }}-webdav
                port:
                  number: {{ .Values.webdav.service.port }}
    {{- /*
      Extra hosts served over the Cloudflare tunnel: TLS is terminated at
      Cloudflare's edge, so these are deliberately absent from the ACME cert list
      below. Traefik routes them by Host header; the tunnel dials in with No TLS
      Verify. A list, so the service can be published across any number of
      external domains. See infra/cloudflared.
    */}}
    {{- range .Values.webdav.ingress.cloudflareHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "keepass.fullname" $ }}-webdav
                port:
                  number: {{ $.Values.webdav.service.port }}
    {{- end }}
  tls:
    - hosts:
        - {{ .Values.webdav.ingress.host }}
{{- end }}
