apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keepass.fullname" . }}-webdav
  labels:
    {{- include "keepass.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate           # single RWO PVC → never two pods at once
  selector:
    matchLabels:
      {{- include "keepass.webdav.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/webdav-secret.yaml") . | sha256sum }}
      labels:
        {{- include "keepass.webdav.selectorLabels" . | nindent 8 }}
        {{- if .Values.webdav.ingress.enabled }}
        # Ships this pod's logs to infra/alloy. Derived from the chart's
        # own ingress switch, so the allowlist cannot drift out of sync.
        logging.zachd/external-ingress: "true"
        {{- end }}
    spec:
      # Covers the preStop sleep plus finishing a PUT in flight. This is where
      # the .kdbx actually lives, and a write cut in half is the vault — so this
      # is the one half of the chart where the grace period is not cosmetic.
      terminationGracePeriodSeconds: 45
      containers:
        - name: webdav
          image: "{{ .Values.webdav.image.repository }}:{{ .Values.webdav.image.tag }}"
          imagePullPolicy: {{ .Values.webdav.image.pullPolicy }}
          # Endpoint removal races SIGTERM. A client saving the vault can be
          # handed this pod while it is going away, and a truncated PUT here is
          # worse than a failed one.
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          ports:
            - name: http
              containerPort: 80
          env:
            - name: AUTH_TYPE
              value: Basic
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "keepass.fullname" . }}-webdav
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keepass.fullname" . }}-webdav
                  key: password
            - name: LOCATION
              value: /
          volumeMounts:
            - name: data
              mountPath: /var/lib/dav
          resources:
            {{- toYaml .Values.webdav.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "keepass.fullname" . }}-webdav
