{{/* The broker accepts pickle tasks: only the application may reach it. */}}
{{- range $component := list "redis" "postgres" "tika" "gotenberg" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "paperless.fullname" $ }}-{{ $component }}
  labels:
    {{- include "paperless.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "paperless.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  {{- if has $component (list "tika" "gotenberg") }}
  # Document parsers need no outbound network access.
  policyTypes: [Ingress, Egress]
  egress: []
  {{- else }}
  policyTypes: [Ingress]
  {{- end }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "paperless.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: paperless
        {{- if eq $component "postgres" }}
        # Logical backups execute in K8up's dedicated database client pod.
        - podSelector:
            matchLabels:
              k8up.io/backupCommandPod: "true"
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ if eq $component "redis" }}6379{{ else if eq $component "postgres" }}5432{{ else if eq $component "tika" }}9998{{ else }}3000{{ end }}
{{- end }}
