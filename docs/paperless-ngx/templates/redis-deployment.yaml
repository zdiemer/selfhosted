apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paperless.fullname" . }}-redis
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "paperless.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "paperless.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      # Deliberately the short end of the range. This Redis persists nothing
      # (see the --save "" args below), so there is no flush to wait for — the
      # grace period only has to cover the preStop sleep and letting paperless's
      # open connections close rather than reset.
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # Paperless's Celery broker is fine with an in-memory Redis; tasks
          # in flight when the pod restarts get retried by paperless on boot.
          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"
          # Reached through a ClusterIP Service by paperless, so endpoint
          # removal races SIGTERM here the same as for an ingress-facing pod.
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
