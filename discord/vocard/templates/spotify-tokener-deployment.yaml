{{- if .Values.spotifyTokener.enabled }}
{{- $ctx := merge (dict "componentName" "spotify-tokener") . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vocard.fullname" $ctx }}
  labels:
    {{- include "vocard.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  # Explicit rather than inherited. This is a stateless token endpoint with no
  # volume, so it surges to a second pod and drains the first with no gap —
  # which matters because the bot asks it to resolve every Spotify URL, and a
  # gap here is a user-visible "couldn't play that" in Discord.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "vocard.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vocard.labels" $ctx | nindent 8 }}
    spec:
      # Covers the preStop sleep; this holds nothing and has no
      # shutdown work of its own.
      terminationGracePeriodSeconds: 30
      containers:
        - name: spotify-tokener
          image: "{{ .Values.images.spotifyTokener.repository }}:{{ .Values.images.spotifyTokener.tag }}"
          imagePullPolicy: {{ .Values.images.spotifyTokener.pullPolicy }}
          ports:
            - name: http
              containerPort: 49152
              protocol: TCP
          env:
            - name: SPOTIFY_TOKENER_ADDR
              value: "0.0.0.0:49152"
          # Endpoint removal races SIGTERM, so the bot can be handed this pod
          # while it is going away — which is a failed Spotify resolve in
          # Discord, the exact gap maxUnavailable: 0 above is meant to close.
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          # maxUnavailable: 0 above is only worth anything if "available" means
          # something. With no probe a pod counts as Ready the moment the
          # container starts, so the rollout would tear down the old pod while
          # the new one was still binding its socket — the exact gap the
          # strategy is there to prevent. tcpSocket rather than httpGet: the
          # upstream image exposes no documented health path, and "is it
          # listening" is the whole question here.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.spotifyTokener.resources | nindent 12 }}
{{- end }}
