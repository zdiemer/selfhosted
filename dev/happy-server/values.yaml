image:
  # Built from the slopus/happy monorepo's Dockerfile.server by build.sh
  # (there is no upstream-published server image), pushed to a PUBLIC GHCR
  # package so every node can pull it anonymously — see
  # minecraft/claude-bridge/build.sh for why we never side-load images.
  repository: "ghcr.io/zdiemer/happy-server"
  # v1 = monorepo tag cli-1.1.10 (the HAPPY_REF pin in build.sh). Bump both
  # together, deliberately.
  tag: "v1"

  # PINNED BY DIGEST, and this is the one chart where it matters most.
  #
  # `v1` is a tag WE move: build.sh rebuilds from the slopus/happy monorepo and
  # pushes over it. Combined with pullPolicy below, every pod restart — a node
  # drain, an eviction, an OOM kill at 3am — silently pulled whatever `v1`
  # pointed at then. Nothing recorded which build was actually serving, so
  # "roll back to what was working" had no answer, and a rebuild that broke
  # something would surface at the next unrelated restart rather than at deploy.
  #
  # That is a bad trade for any service. For this one it is the relay that
  # fronts dev/claude-workspace's session daemon, whose sessions are children of
  # a pod holding cluster-admin — so "whatever got pushed most recently" decides
  # what runs next to the most privileged thing in the cluster.
  #
  # The digest is what the live pod is running as of this pin, read from its
  # status.containerStatuses[].imageID rather than from the registry, so it is
  # the build that is known to work rather than the newest one.
  #
  # HOW TO BUMP: ./build.sh, then read the digest it pushed —
  #   crane digest ghcr.io/zdiemer/happy-server:v1
  # or after deploying once with the digest cleared:
  #   kubectl -n happy get pod -l app.kubernetes.io/name=happy-server \
  #     -o jsonpath='{.items[0].status.containerStatuses[0].imageID}'
  # Set it here and re-run upgrade.sh. Clearing this falls back to the tag,
  # which is the old behaviour and is fine for a deliberate one-off.
  digest: "sha256:a94573a2b70df8ad40adde4d0fcb0adc2778f33529c6c27970a9d6f4d58539b3"

  # IfNotPresent, not Always — with a digest, `Always` is pure cost. A digest
  # names exactly one immutable blob, so re-checking the registry on every
  # restart can only ever return the layer already on the node, at the price of
  # a network round trip in the startup path and a hard dependency on GHCR being
  # up in order for a pod to reschedule. Restore `Always` only if the digest
  # above is cleared.
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  # Upstream default port per packages/happy-server docs. The Dockerfile's
  # EXPOSE says 3000, so we set PORT explicitly in the deployment and treat
  # this value as the single source of truth.
  port: 3005

# Master secret for the server's auth/token signing (HANDY_MASTER_SECRET).
# REQUIRED, set in values.local.yaml (gitignored) — generate once with
#   openssl rand -base64 48
# and never rotate casually: existing client sessions are bound to it.
masterSecret: ""

persistence:
  # /data holds everything: the embedded PGlite database and blob files
  # (<data>/files/). No external Postgres/Redis/S3 — the standalone image
  # runs self-contained. Message payloads are E2E-encrypted by the clients
  # before they land here.
  data:
    size: 5Gi
    storageClass: truenas-iscsi   # NAS-backed block; PGlite needs real fsync
    accessMode: ReadWriteOnce

security:
  # The server only writes under /data (PVC) and /tmp (emptyDir); flip this
  # off in values.local.yaml if an upstream bump starts writing into the app
  # dir, and note the version in the README.
  readOnlyRootFilesystem: true

networkPolicy:
  enabled: true

ingress:
  # Disabled for first boot. Flip on (in values.local.yaml) after the pod is
  # Ready and a port-forward smoke test passes — see README.
  enabled: false
  className: traefik
  host: happy.zachd.duckdns.org
  # DELIBERATELY EMPTY — tailnet-only, and the reasoning is different from
  # every other chart's.
  #
  # This is the one chart in the web tier with no Authelia forward-auth, and
  # for a good reason (see templates/ingress.yaml): the Happy apps talk REST +
  # WebSocket and cannot complete an interactive login. But "no forward-auth"
  # plus "published on the Cloudflare tunnel" meant this server was an
  # unauthenticated public endpoint whose only protection was Happy's own
  # pairing and HANDY_MASTER_SECRET — and it is the control plane for
  # dev/claude-workspace's happy daemon, whose spawned sessions are child
  # processes of a pod holding cluster-admin. A break in this relay is
  # cluster-admin RCE, not a leaked chat log.
  #
  # WHY NOT A GATE INSTEAD. Cloudflare Access needs either an interactive
  # browser login or a service token in CF-Access-Client-Id headers; mTLS
  # needs a client certificate. The Happy mobile app does none of the three,
  # so every "gate it at the edge" option either breaks the app or is
  # decoration. Delisting is the only control here that actually holds.
  #
  # THE COST, STATED PLAINLY: Happy stops working when the phone is off the
  # tailnet. That is the trade, and it is the right way round for a personal
  # dev tool fronting a cluster-admin shell.
  #
  # As with every delisting, also delete the Public Hostname entry from the
  # tunnel in the Cloudflare dashboard — this list is only half of it.
  cloudflareHosts: []
  tls:
    enabled: true
    # DuckDNS can only write TXT at the account's top-level, so sub-subdomain
    # certs must ride a wildcard SAN. See infra/duckdns.

resources:
  requests:
    cpu: 50m
    # ~465Mi resident at rest, well over the old 256Mi request.
    memory: 512Mi
  limits:
    memory: 1Gi
