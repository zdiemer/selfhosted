{{- /*
  Provisioning rides the sysprep CD, and that CD only exists because the answer
  file does. Without this guard, turning provision on while unattend is off
  renders nothing at all and reports success — the guest just quietly never
  runs the script.
*/ -}}
{{- if and .Values.provision.enabled (not .Values.unattend.enabled) }}
{{- fail "provision.enabled requires unattend.enabled: the script is delivered on the sysprep CD, which is only attached when the answer file is" }}
{{- end }}
{{- if .Values.unattend.enabled }}
{{- $name := include "win11.name" . -}}
{{- $u := .Values.unattend -}}
{{- $p := .Values.provision -}}
{{- $body := "" -}}
{{- if $p.enabled -}}
{{-   if not (or $p.script $p.scriptFile) }}{{ fail "provision.enabled is true but neither provision.script nor provision.scriptFile is set — there is nothing to run" }}{{ end -}}
{{-   $body = $p.script | default (.Files.Get $p.scriptFile) -}}
{{-   if not $body }}{{ fail (printf "provision.scriptFile %q is empty or not in the chart" $p.scriptFile) }}{{ end -}}
{{-   $head := list (printf "# GENERATED by the win11 chart from provision.%s." (ternary "script" (printf "scriptFile: %s" $p.scriptFile) (ne $p.script ""))) "# Runs once at first logon, after the virtio guest tools. Edit the chart," "# not this file: the CD is rebuilt from the Secret every time the VM starts." "$ErrorActionPreference = 'Stop'" -}}
{{-   range $k, $v := $p.env }}{{ $head = append $head (printf "$Env:%s = %s" $k (include "win11.ps1" $v)) }}{{ end -}}
{{-   $body = printf "%s\n%s" (join "\n" $head) $body -}}
{{- /*
        ASCII ONLY, and this is not pedantry — it is the difference between a
        script that runs and one that does not parse.

        Windows PowerShell 5.1 (what a Windows 11 guest has; pwsh is not
        installed) decodes a .ps1 with no BOM using the ANSI codepage, NOT
        UTF-8. An em dash inside a string literal therefore arrives as three
        mojibake bytes ending in a double quote, which closes the literal early
        and the parse collapses several lines later with "Unexpected token".
        The reported error points nowhere near the actual character.

        A BOM would also fix it, but a BOM has to survive Helm, a YAML block
        scalar, a Secret and an ISO build intact, and it fails silently when it
        does not. Refusing non-ASCII is the version that cannot rot.
  */ -}}
{{-   if regexMatch "[^[:ascii:]]" $body }}{{ fail "provision script contains non-ASCII characters. Windows PowerShell 5.1 reads a BOM-less .ps1 as ANSI, so any such character corrupts the file and it fails to parse in the guest. Use plain ASCII (-- for an em dash)." }}{{ end -}}
{{- end -}}
{{- $pw := required "unattend.password is required when unattend.enabled — set it in values.local.yaml (op://homelab/dev-win11)" $u.password -}}
{{/*
Windows Setup's answer file, delivered as a CD-ROM.

KubeVirt's `sysprep` volume source builds an ISO from this Secret and attaches
it; Windows Setup scans removable media for autounattend.xml and runs itself
from what it finds. A Secret rather than a ConfigMap because the local account
password is in here — Setup only accepts it as plaintext, so it must not sit in
a ConfigMap.

THE THREE PASSES, AND WHY EACH ONE IS HERE:

  windowsPE   runs inside the installer. Loads the virtio storage driver (or
              Setup shows an empty disk list and cannot continue), wipes and
              partitions the disk, and picks the edition out of the ISO.
  specialize  runs after the image is laid down. Names the machine and turns
              Remote Desktop on, which is what makes the VM reachable at all.
  oobeSystem  runs at first boot. Skips the out-of-box screens, creates the
              local account, and installs the rest of the virtio drivers.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-sysprep
  labels:
    {{- include "win11.labels" . | nindent 4 }}
type: Opaque
stringData:
  autounattend.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <unattend xmlns="urn:schemas-microsoft-com:unattend">

      <settings pass="windowsPE">
        <component name="Microsoft-Windows-International-Core-WinPE"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <SetupUILanguage><UILanguage>{{ include "win11.xml" $u.locale }}</UILanguage></SetupUILanguage>
          <InputLocale>{{ include "win11.xml" $u.locale }}</InputLocale>
          <SystemLocale>{{ include "win11.xml" $u.locale }}</SystemLocale>
          <UILanguage>{{ include "win11.xml" $u.locale }}</UILanguage>
          <UserLocale>{{ include "win11.xml" $u.locale }}</UserLocale>
        </component>

        <!--
          THE STEP THAT MAKES THE INSTALL POSSIBLE AT ALL.
          Windows ships no virtio driver, so without this Setup's disk picker is
          empty and a human has to click "Load driver". The virtio ISO's drive
          letter is not knowable ahead of time in WinPE, so every plausible
          letter is listed; missing paths are ignored rather than fatal.
        -->
        <component name="Microsoft-Windows-PnpCustomizationsWinPE"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <DriverPaths>
            {{- range $i, $drive := (list "D" "E" "F" "G") }}
            <PathAndCredentials wcm:action="add" wcm:keyValue="{{ add $i 1 }}"
                                xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
              <Path>{{ $drive }}:\viostor\w11\amd64</Path>
            </PathAndCredentials>
            {{- end }}
          </DriverPaths>
        </component>

        <component name="Microsoft-Windows-Setup"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <DiskConfiguration>
            <!--
              WipeDisk on disk 0. The only fixed disk attached is the virtio
              root volume — the two ISOs are SATA CD-ROMs — so this cannot eat
              anything else. The layout is the standard UEFI/GPT one Windows 11
              requires: ESP, MSR, then the OS partition taking the remainder.
            -->
            <Disk wcm:action="add" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
              <DiskID>0</DiskID>
              <WillWipeDisk>true</WillWipeDisk>
              <CreatePartitions>
                <CreatePartition wcm:action="add">
                  <Order>1</Order><Type>EFI</Type><Size>300</Size>
                </CreatePartition>
                <CreatePartition wcm:action="add">
                  <Order>2</Order><Type>MSR</Type><Size>16</Size>
                </CreatePartition>
                <CreatePartition wcm:action="add">
                  <Order>3</Order><Type>Primary</Type><Extend>true</Extend>
                </CreatePartition>
              </CreatePartitions>
              <ModifyPartitions>
                <ModifyPartition wcm:action="add">
                  <Order>1</Order><PartitionID>1</PartitionID>
                  <Label>System</Label><Format>FAT32</Format>
                </ModifyPartition>
                <ModifyPartition wcm:action="add">
                  <Order>2</Order><PartitionID>2</PartitionID>
                </ModifyPartition>
                <ModifyPartition wcm:action="add">
                  <Order>3</Order><PartitionID>3</PartitionID>
                  <Label>Windows</Label><Letter>C</Letter><Format>NTFS</Format>
                </ModifyPartition>
              </ModifyPartitions>
            </Disk>
            <WillShowUI>OnError</WillShowUI>
          </DiskConfiguration>

          <ImageInstall>
            <OSImage>
              <InstallFrom>
                <MetaData wcm:action="add" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
                  <Key>/IMAGE/NAME</Key>
                  <Value>{{ include "win11.xml" $u.imageName }}</Value>
                </MetaData>
              </InstallFrom>
              <InstallTo><DiskID>0</DiskID><PartitionID>3</PartitionID></InstallTo>
              <WillShowUI>OnError</WillShowUI>
            </OSImage>
          </ImageInstall>

          <UserData>
            <AcceptEula>true</AcceptEula>
            {{- with $u.productKey }}
            <ProductKey><Key>{{ include "win11.xml" . }}</Key><WillShowUI>OnError</WillShowUI></ProductKey>
            {{- end }}
          </UserData>
        </component>
      </settings>

      <settings pass="specialize">
        <component name="Microsoft-Windows-Shell-Setup"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <ComputerName>{{ include "win11.xml" $u.computerName }}</ComputerName>
          <TimeZone>{{ include "win11.xml" $u.timezone }}</TimeZone>
        </component>
        {{- if $u.realTimeIsUniversal }}
        <!--
          THE GUEST CLOCK, AND WHY IT IS WRONG BY DEFAULT.
          QEMU presents the emulated RTC as UTC. Windows assumes a hardware
          clock holds LOCAL time, so it reads UTC off the RTC, calls it local,
          and then adds the timezone offset again to derive "UTC" - landing the
          guest a full offset ahead (7 hours here, on Pacific daylight time).

          Windows itself looks fine: the taskbar clock is merely wrong, and the
          usual reaction is to fix it by hand, which papers over it until the
          next boot re-reads the RTC. What it actually breaks is anything that
          signs a timestamped token. A GitHub Actions runner mints an OAuth
          token stamped in the future and the service is refused every start
          with "The token is not valid until ..." - a message that says nothing
          about clocks.

          RealTimeIsUniversal tells Windows the RTC is already UTC, which is
          what it is. Preferred over KubeVirt's clock.timezone (libvirt
          offset='timezone'): that would need the IANA name alongside the
          Windows name above, two spellings of one fact, and leaves the guest
          disagreeing with the host about what the hardware clock means.
        -->
        <component name="Microsoft-Windows-Deployment"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <RunSynchronous>
            <RunSynchronousCommand wcm:action="add" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
              <Order>1</Order>
              <Description>Treat the hardware clock as UTC</Description>
              <Path>reg add "HKLM\SYSTEM\CurrentControlSet\Control\TimeZoneInformation" /v RealTimeIsUniversal /t REG_DWORD /d 1 /f</Path>
            </RunSynchronousCommand>
          </RunSynchronous>
        </component>
        {{- end }}
        {{- if $u.enableRdp }}
        <!-- Remote Desktop off is the Windows default; leaving it that way means
             the VM installs perfectly and nothing can ever connect to it. -->
        <component name="Microsoft-Windows-TerminalServices-LocalSessionManager"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <fDenyTSConnections>false</fDenyTSConnections>
        </component>
        <component name="Microsoft-Windows-TerminalServices-RDP-WinStationExtensions"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <UserAuthentication>{{ if $u.disableNla }}0{{ else }}1{{ end }}</UserAuthentication>
        </component>
        <!-- Opening the port is a separate step from enabling the service. -->
        <component name="Networking-MPSSVC-Svc"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <FirewallGroups>
            <FirewallGroup wcm:action="add" wcm:keyValue="RemoteDesktop"
                           xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
              <Active>true</Active>
              <Group>@FirewallAPI.dll,-28752</Group>
              <Profile>all</Profile>
            </FirewallGroup>
          </FirewallGroups>
        </component>
        {{- end }}
      </settings>

      <settings pass="oobeSystem">
        <!--
          THE COMPONENT THAT ACTUALLY SKIPS OOBE'S FIRST SCREENS.
          The International-Core-WinPE component in the windowsPE pass above
          covers Setup only; it says nothing about the installed system. With
          no locale declared for this pass, OOBE has nothing to apply and
          stops to ask — "Is this the right country or region?", then the
          keyboard pages — no matter what the Hide*Page flags below say. The
          machine installs perfectly and then waits for a human, which is the
          same failure the answer file exists to prevent.
        -->
        <component name="Microsoft-Windows-International-Core"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <InputLocale>{{ include "win11.xml" $u.locale }}</InputLocale>
          <SystemLocale>{{ include "win11.xml" $u.locale }}</SystemLocale>
          <UILanguage>{{ include "win11.xml" $u.locale }}</UILanguage>
          <UserLocale>{{ include "win11.xml" $u.locale }}</UserLocale>
        </component>
        <component name="Microsoft-Windows-Shell-Setup"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
          <OOBE>
            <HideEULAPage>true</HideEULAPage>
            <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
            <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
            <!-- Windows 11 pushes a Microsoft account by default and there is
                 nobody here to decline it. This plus a LocalAccount below is
                 what keeps OOBE from parking on the sign-in screen forever. -->
            <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
            <ProtectYourPC>3</ProtectYourPC>
          </OOBE>
          <UserAccounts>
            <LocalAccounts>
              <LocalAccount wcm:action="add" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
                <Name>{{ include "win11.xml" $u.username }}</Name>
                <DisplayName>{{ include "win11.xml" $u.username }}</DisplayName>
                <Group>Administrators</Group>
                <Password><Value>{{ include "win11.xml" $pw }}</Value><PlainText>true</PlainText></Password>
              </LocalAccount>
            </LocalAccounts>
          </UserAccounts>
          {{- if $u.autoLogon }}
          <AutoLogon>
            <Enabled>true</Enabled>
            <Username>{{ include "win11.xml" $u.username }}</Username>
            <Password><Value>{{ include "win11.xml" $pw }}</Value><PlainText>true</PlainText></Password>
          </AutoLogon>
          {{- end }}
          <FirstLogonCommands>
            <!-- The virtio ISO's letter is not fixed, so hunt for the installer
                 rather than assuming one. This is what brings up the NIC:
                 viostor (loaded in WinPE above) only covers the disk. -->
            <SynchronousCommand wcm:action="add" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
              <Order>1</Order>
              <Description>Install virtio guest tools</Description>
              <CommandLine>cmd /c "for %d in (D E F G) do @if exist %d:\virtio-win-guest-tools.exe start /wait %d:\virtio-win-guest-tools.exe /install /quiet /norestart"</CommandLine>
            </SynchronousCommand>
            {{- if $p.enabled }}
            <!-- SECOND, and the order is the whole point: the command above is
                 what installs the NIC, so a provisioning script that fetches
                 anything can only work after it has finished. Same "hunt for
                 the drive" trick as the virtio ISO — the sysprep CD's letter
                 is no more predictable than any other's. Output goes to a
                 transcript because nobody is watching this run: without it a
                 failure here is invisible, and the only symptom is a guest
                 that came up looking fine and did not do the thing. -->
            <SynchronousCommand wcm:action="add" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
              <Order>2</Order>
              <Description>Run guest provisioning script</Description>
              <CommandLine>{{ include "win11.xml" "powershell -NoProfile -ExecutionPolicy Bypass -Command \"Start-Transcript -Path C:\\Windows\\Temp\\provision.log; $s = 68..90 | ForEach-Object { [char]$_ + ':\\provision.ps1' } | Where-Object { Test-Path $_ } | Select-Object -First 1; if (-not $s) { throw 'provision.ps1 not found on any drive' }; & $s; Stop-Transcript\"" }}</CommandLine>
            </SynchronousCommand>
            {{- end }}
          </FirstLogonCommands>
        </component>
      </settings>
    </unattend>
{{- if $p.enabled }}
  {{- /*
    A SECOND FILE ON THE SAME CD. KubeVirt's sysprep volume ISOs every entry in
    the mounted Secret, not only autounattend.xml — it validates that one of
    autounattend.xml/unattend.xml is present and then hands the whole directory
    to the ISO builder. So an extra key here simply appears next to the answer
    file on the CD Windows has already been given, which is why this needs no
    second volume and no network fetch.
  */}}
  provision.ps1: |
{{ $body | indent 4 }}
{{- end }}
{{- end }}
