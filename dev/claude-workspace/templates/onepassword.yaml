{{- if .Values.secrets.onePassword.enabled }}
{{- $op := .Values.secrets.onePassword }}
{{- if not $op.existingSecret }}
{{- if not $op.email }}{{ fail "secrets.onePassword.enabled requires either existingSecret, or email/secretKey/password" }}{{ end }}
{{- if not $op.secretKey }}{{ fail "secrets.onePassword.enabled requires secrets.onePassword.secretKey (values.local.yaml)" }}{{ end }}
{{- if not $op.password }}{{ fail "secrets.onePassword.enabled requires secrets.onePassword.password (values.local.yaml)" }}{{ end }}
# NOT named *-secret.yaml on purpose: the root .gitignore's `*-secret.yaml` glob
# is meant for rendered manifests but also swallows chart TEMPLATES named that
# way, silently and with no error (see README §Conventions).
#
# RENDERED ONLY WHEN existingSecret IS EMPTY, which should be never outside a
# first bootstrap. Anything that reaches helm as a value is written verbatim
# into sh.helm.release.v1.<name>.vN, and helm keeps ten revisions — so rendering
# this puts the account password in ten copies in etcd, on top of the one in the
# Secret itself. The whole point of secrets.onePassword.existingSecret is to
# have these three arrive without helm ever seeing them.
#
# The three files scripts/op-session.sh looks for. They are mounted read-only
# and read in place; op never opens them (the directory op insists on writing is
# ~/.config/op, which is a different thing entirely).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claude-workspace.fullname" . }}-1password
  labels:
    {{- include "claude-workspace.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Line 1 is the sign-in address, line 2 the email — the two things
  # `op account add` takes as flags.
  op-account: |
    {{ $op.address }}
    {{ $op.email }}
  op-secret-key: {{ $op.secretKey | quote }}
  op-password: {{ $op.password | quote }}
{{- end }}
{{- end }}
