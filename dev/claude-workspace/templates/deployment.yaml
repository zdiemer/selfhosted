apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "claude-workspace.fullname" . }}
  labels:
    {{- include "claude-workspace.labels" . | nindent 4 }}
spec:
  # Single replica — one RWO home PVC and one tmux server; two pods would
  # split-brain both.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "claude-workspace.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if .Values.messaging.enabled }}
      annotations:
        # Restart the pod when the messaging Secret's contents change — env
        # vars are frozen at container start.
        checksum/messaging: {{ include (print $.Template.BasePath "/messaging.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "claude-workspace.labels" . | nindent 8 }}
        {{- if .Values.ingress.enabled }}
        # Ships this pod's logs to infra/alloy. Derived from the chart's
        # own ingress switch, so the allowlist cannot drift out of sync.
        logging.zachd/external-ingress: "true"
        {{- end }}
    spec:
      # Covers the preStop sleeps plus letting the long-lived terminal and
      # bakery connections close rather than reset. Nothing here flushes to
      # disk on exit — the home PVC is written continuously — so this is
      # about the request path, not durability.
      terminationGracePeriodSeconds: 45
      {{- if .Values.rbac.clusterAdmin }}
      # Cluster ops seat: kubectl/helm in the pod authenticate as this SA
      # (cluster-admin — see rbac.yaml and the values warning).
      serviceAccountName: {{ include "claude-workspace.fullname" . }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsUser: 1000          # `node` user from the base image
        runAsGroup: 1000
        fsGroup: 1000
        # Without this, fsGroup recursively re-permissions the ENTIRE home PVC
        # to g+rw on every pod start — which silently breaks ~/.ssh key perms
        # (ssh refuses 0660 keys). Everything is already owned 1000:1000, so
        # skip the relabel when the mount root matches.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Bootstrap the home PVC on first boot: the standard dirs claude,
        # happy, and ssh expect, with the right perms. Idempotent.
        - name: init-home
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /home/node/.claude /home/node/.happy /home/node/code
              mkdir -p /home/node/.ssh && chmod 700 /home/node/.ssh
              mkdir -p /home/node/.local/share/tailscale
              chmod 700 /home/node/.local/share/tailscale
              mkdir -p /home/node/.docker && chmod 700 /home/node/.docker
              # gh CLI auth (one-time `gh auth login`) persists here on the PVC.
              mkdir -p /home/node/.config/gh && chmod 700 /home/node/.config/gh
              {{- if .Values.bakery.enabled }}
              # Bakery state (sessions/artifacts DB) + its agent's creds (~/.pi,
              # a one-time interactive login).
              mkdir -p {{ .Values.bakery.dataDir }} /home/node/.pi
              chmod 700 /home/node/.pi
              {{- end }}
              mkdir -p /home/node/.config/selfhosted
              chmod 700 /home/node/.config/selfhosted
              {{- if .Values.messaging.enabled }}
              # Signal registration + gateway state (session map, Baileys
              # auth keys). Both survive restarts on the PVC — losing either
              # means re-pairing.
              mkdir -p /home/node/.local/share/signal-cli
              chmod 700 /home/node/.local/share/signal-cli
              mkdir -p /home/node/.config/selfhosted/messaging-gateway
              chmod 700 /home/node/.config/selfhosted/messaging-gateway
              {{- end }}
              {{- if .Values.secrets.onePassword.enabled }}
              # NOT copied onto the PVC any more. The old comment here said op
              # refuses a config directory it cannot write, which conflated two
              # directories: these three files are read-only INPUTS to
              # scripts/op-session.sh and op never opens them. The directory op
              # needs writable is ~/.config/op, which is still on the PVC.
              #
              # The copy mattered because the PVC is a zvol reached over
              # cleartext iSCSI, so staging them here wrote the account password
              # across the LAN and left it on a second machine's disk. They are
              # mounted read-only at /var/run/op-credentials instead, on tmpfs
              # like every Secret volume, and the containers are pointed at them
              # with OP_ACCOUNT_FILE / OP_SECRET_KEY_FILE / OP_PASSWORD_FILE —
              # which op-session.sh has always honoured.
              #
              # Leftovers from before this change would keep working and keep
              # being the copy that gets read, so remove them.
              rm -f /home/node/.config/selfhosted/op-account \
                    /home/node/.config/selfhosted/op-secret-key \
                    /home/node/.config/selfhosted/op-password
              echo "1password credentials mounted read-only (not staged to the PVC)"
              {{- end }}
              echo "home initialized"
          volumeMounts:
            - name: home
              mountPath: /home/node
            {{- if .Values.secrets.onePassword.enabled }}
            - name: op-credentials
              mountPath: /var/run/op-credentials
              readOnly: true
            {{- end }}
      containers:
        # ttyd: the real Claude Code TUI in the browser. `tmux new -A -s main`
        # attaches every browser connection to the same session, so closing
        # Safari (or iOS suspending it) leaves claude running; reopening
        # /term lands back in the live session.
        - name: term
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.security.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          # -W: writable (ttyd ≥1.7 defaults to read-only). --base-path lets
          # the ingress route /term here with no StripPrefix middleware, so
          # the websocket URL survives Traefik and the Cloudflare tunnel
          # unchanged.
          command:
            - ttyd
            - -W
            - -p
            - {{ .Values.service.termPort | quote }}
            - --base-path
            - /term
            - tmux
            - new
            - -A
            - -s
            - main
          env:
            - name: HOME
              value: /home/node
            # scripts/k3s/_common.sh: non-sudo node commands ssh as $SSH_USER.
            # The pod's local user `node` exists on no node, so go root — the
            # same access run_on_node_sudo already uses.
            - name: SSH_USER
              value: root
            # Point the happy CLI (mobile remote control) at the self-hosted
            # relay (dev/happy-server). Public URL on purpose: the QR pairing
            # flow may embed it, and the phone can only reach the public host.
            # Egress rides the existing TCP-443-to-public rule (hairpin NAT);
            # if hairpin ever breaks, the netpol also allows the cluster-local
            # fallback — see happy.serverUrl in values.yaml.
            - name: HAPPY_SERVER_URL
              value: {{ .Values.happy.serverUrl | quote }}
            {{- if .Values.secrets.onePassword.enabled }}
            # scripts/op-session.sh reads these three paths rather than
            # ~/.config/selfhosted, so the credentials stay on the read-only
            # Secret mount and never reach the PVC. The variables are its own
            # documented interface, so the script needs no change.
            - name: OP_ACCOUNT_FILE
              value: /var/run/op-credentials/op-account
            - name: OP_SECRET_KEY_FILE
              value: /var/run/op-credentials/op-secret-key
            - name: OP_PASSWORD_FILE
              value: /var/run/op-credentials/op-password
            {{- end }}
          # Endpoint removal races SIGTERM, so Traefik can still route here
          # while the container is shutting down.
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          ports:
            - name: term
              containerPort: {{ .Values.service.termPort }}
          # TCP probes: ttyd's HTTP surface under --base-path is an
          # implementation detail; the listener itself is the health signal.
          readinessProbe:
            tcpSocket:
              port: term
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: term
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secrets.onePassword.enabled }}
            # Only `term` gets these: it is the container a human works in and
            # the only one that runs scripts/secrets.sh. The others have no use
            # for vault access, so they do not get it.
            - name: op-credentials
              mountPath: /var/run/op-credentials
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources.term | nindent 12 }}
        {{- if .Values.happy.daemon.enabled }}
        # happy daemon: an always-on supervised sidecar so the Happy app can
        # spawn NEW sessions the moment the pod is Ready — no manual
        # `happy daemon start` from /term after every restart. `start-sync` is
        # the daemon's foreground entrypoint (plain `start` forks and exits, no
        # good as a container process); it installs SIGTERM handlers, so k8s
        # stops/restarts it cleanly. It shares ~/.happy on the PVC (pairing keys
        # + the daemon.state.json.lock singleton) with the interactive `happy`
        # in /term; because both run the same image = same happy version, the
        # interactive one detects this daemon and defers instead of starting a
        # rival (a version skew would make them kill each other — see the
        # happy.daemon note in values.yaml). Phone-spawned sessions run as
        # CHILDREN of this container, so it carries claude-sized resources.
        - name: happy-daemon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.security.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          # Loop rather than a bare `exec`: on a restart where the interactive
          # path already spawned a same-version daemon, start-sync finds the
          # lock held, prints "already running", and exits 0 — the loop retries
          # after a pause instead of the container flapping into CrashLoopBackOff.
          # In the normal case (fresh pod, this is the first happy process)
          # start-sync wins the lock and blocks in the foreground until SIGTERM.
          command: ["sh", "-c"]
          args:
            - |
              {{- if .Values.happy.restartNotice.enabled }}
              # Backgrounded: it retries against the relay for up to a minute
              # and must not hold up the daemon that phone sessions need.
              /etc/claude-workspace/happy-restart-notice.sh up &
              {{- end }}
              while true; do
                happy daemon start-sync || true
                sleep 10
              done
          {{- if .Values.happy.restartNotice.enabled }}
          # Phone-spawned sessions are children of THIS container, so a deploy
          # kills them and they just disappear from the app. preStop runs before
          # SIGTERM, which is the only point where their liveness is still
          # knowable. Bounded well inside terminationGracePeriodSeconds, and
          # always exits 0 — a failed notification must not stall termination.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - timeout 8 /etc/claude-workspace/happy-restart-notice.sh down || true
          {{- end }}
          env:
            - name: HOME
              value: /home/node
            # Same relay the term container's happy CLI uses; the daemon reads
            # HAPPY_SERVER_URL with highest precedence over ~/.happy/settings.json.
            - name: HAPPY_SERVER_URL
              value: {{ .Values.happy.serverUrl | quote }}
          # No probes: the daemon's only health surface is an HTTP control
          # server on a 127.0.0.1 EPHEMERAL port recorded in
          # ~/.happy/daemon.state.json (`happy daemon status` always exits 0 and
          # is useless as a probe). Not worth an exec-probe that parses the
          # state file — same "no probes on purpose" stance as tailscaled below.
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
            {{- if .Values.happy.restartNotice.enabled }}
            - name: happy-notice
              mountPath: /etc/claude-workspace
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources.happyDaemon | nindent 12 }}
        {{- end }}
        {{- if .Values.bakery.enabled }}
        # Bakery server: the Bun API + WebSocket backend (routes under /api/*).
        # The browser reaches it directly through the ingress path-split, so it
        # binds 0.0.0.0; Authelia is the only gate (no PI_WEB_AUTH_TOKEN unless
        # bakery.authToken is set). State lives on the PVC under dataDir.
        - name: bakery-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.bakery.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          command: ["bash", "-lc", "cd /opt/bakery && exec bun run start"]
          env:
            - name: HOME
              value: /home/node
            - name: PI_WEB_HOST
              value: "0.0.0.0"
            - name: PI_WEB_PORT
              value: {{ .Values.service.bakeryServerPort | quote }}
            - name: PI_WEB_WORKSPACE_ROOT
              value: {{ .Values.bakery.workspaceRoot | quote }}
            - name: PI_WEB_DATA_DIR
              value: {{ .Values.bakery.dataDir | quote }}
            # Same-origin as the web UI, so this is the only allowed CORS/WS origin.
            - name: PI_WEB_ALLOWED_ORIGINS
              value: {{ .Values.bakery.apiBase | quote }}
            {{- if .Values.bakery.authToken }}
            - name: PI_WEB_AUTH_TOKEN
              value: {{ .Values.bakery.authToken | quote }}
            {{- end }}
            {{- range $k, $v := .Values.bakery.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # Endpoint removal races SIGTERM, so Traefik can still route here
          # while the container is shutting down.
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          ports:
            - name: bakery-api
              containerPort: {{ .Values.service.bakeryServerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: bakery-api
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: bakery-api
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources.bakeryServer | nindent 12 }}
        # Bakery web: the Vite dev server (the SPA). VITE_PI_WEB_API_BASE bakes
        # the absolute origin the client uses for REST + WS, so the browser
        # never sees the :3141 default. PI_WEB_ALLOWED_HOSTS is Vite's own
        # Host-header allowlist — the ingress host must be in it or Vite 403s.
        - name: bakery-web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.bakery.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          command: ["bash", "-lc", "cd /opt/bakery && exec bun run dev:web:lan"]
          env:
            - name: HOME
              value: /home/node
            - name: PI_WEB_ALLOWED_HOSTS
              value: {{ .Values.bakery.host | quote }}
            - name: VITE_PI_WEB_API_BASE
              value: {{ .Values.bakery.apiBase | quote }}
            {{- if .Values.bakery.authToken }}
            # Baked so the browser authenticates automatically (defense-in-depth
            # behind Authelia; the token still rides in the client bundle).
            - name: VITE_PI_WEB_AUTH_TOKEN
              value: {{ .Values.bakery.authToken | quote }}
            {{- end }}
          # Endpoint removal races SIGTERM, so Traefik can still route here
          # while the container is shutting down.
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          ports:
            - name: bakery-web
              containerPort: {{ .Values.service.bakeryWebPort }}
          # TCP probe: Vite's allowedHosts rejects an httpGet with a pod-IP Host
          # header (403), so the listener itself is the health signal — same
          # reasoning as ttyd's probes above.
          readinessProbe:
            tcpSocket:
              port: bakery-web
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: bakery-web
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources.bakeryWeb | nindent 12 }}
        {{- end }}
        {{- if .Values.messaging.enabled }}
        # Messaging gateway: Signal/WhatsApp → headless `claude -p` in this
        # same $HOME (subscription creds + session jsonls on the PVC, so chat
        # can `!resume` a tmux/Happy session). Claude runs are CHILDREN of
        # this container — claude-sized memory. Outbound-only (Baileys
        # websocket + the signal-cli unix socket on /tmp): no ports, no
        # netpol changes. No probes: pre-pairing there is nothing healthy to
        # probe — same stance as tailscaled below.
        - name: messaging-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.security.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          command: ["bash", "-lc", "cd /opt/messaging-gateway && exec bun run src/main.ts"]
          env:
            - name: HOME
              value: /home/node
            - name: GW_APP_DIR
              value: /opt/messaging-gateway
            - name: GW_SIGNAL_ENABLED
              value: {{ .Values.messaging.signal.enabled | quote }}
            - name: GW_WA_ENABLED
              value: {{ .Values.messaging.whatsapp.enabled | quote }}
            - name: GW_DEFAULT_CWD
              value: {{ .Values.messaging.defaultCwd | quote }}
            - name: GW_APPROVAL_TIMEOUT_SECONDS
              value: {{ .Values.messaging.approvalTimeoutSeconds | quote }}
            - name: GW_ALLOWED_TOOLS
              value: {{ .Values.messaging.allowedTools | quote }}
            - name: GW_MODEL
              value: {{ .Values.messaging.model | quote }}
            - name: GW_EFFORT
              value: {{ .Values.messaging.effort | quote }}
            - name: GW_BASH_ENABLED
              value: {{ .Values.messaging.bash.enabled | quote }}
            - name: GW_BASH_TIMEOUT_SECONDS
              value: {{ .Values.messaging.bash.timeoutSeconds | quote }}
            - name: GW_BASH_MAX_OUTPUT_CHARS
              value: {{ .Values.messaging.bash.maxOutputChars | quote }}
            - name: GW_USAGE_DAYS
              value: {{ .Values.messaging.usageDays | quote }}
            - name: GW_ATTACHMENTS_ENABLED
              value: {{ .Values.messaging.attachments.enabled | quote }}
            - name: GW_ATTACHMENT_MAX_MB
              value: {{ .Values.messaging.attachments.maxMB | quote }}
            - name: GW_PROGRESS_ENABLED
              value: {{ .Values.messaging.progress.enabled | quote }}
            - name: GW_PROGRESS_EDIT_SECONDS
              value: {{ .Values.messaging.progress.editSeconds | quote }}
            - name: GW_PROGRESS_SIGNAL_EDIT_SECONDS
              value: {{ .Values.messaging.progress.signalEditSeconds | quote }}
            - name: GW_REACTIONS_ENABLED
              value: {{ .Values.messaging.reactions.enabled | quote }}
            - name: GW_REACT_QUEUED
              value: {{ .Values.messaging.reactions.queued | quote }}
            - name: GW_REACT_WORKING
              value: {{ .Values.messaging.reactions.working | quote }}
            - name: GW_REACT_DONE
              value: {{ .Values.messaging.reactions.done | quote }}
            - name: GW_REACT_ERROR
              value: {{ .Values.messaging.reactions.error | quote }}
            - name: GW_RESTART_NOTICE_ENABLED
              value: {{ .Values.messaging.restartNotice.enabled | quote }}
            - name: GW_RESTART_NOTICE_MINUTES
              value: {{ .Values.messaging.restartNotice.withinMinutes | quote }}
            - name: GW_RESTART_NOTICE_DEDUPE_MINUTES
              value: {{ .Values.messaging.restartNotice.dedupeMinutes | quote }}
            - name: GW_SHUTDOWN_GRACE_SECONDS
              value: {{ .Values.messaging.restartNotice.shutdownGraceSeconds | quote }}
            {{- with .Values.messaging.systemPrompt }}
            - name: GW_SYSTEM_PROMPT
              value: {{ . | quote }}
            {{- end }}
            - name: GW_GROUPS_ENABLED
              value: {{ .Values.messaging.groups.enabled | quote }}
            - name: GW_GROUPS_REQUIRE_MENTION
              value: {{ .Values.messaging.groups.requireMention | quote }}
            - name: GW_GROUP_ALLOWED_TOOLS
              value: {{ .Values.messaging.groups.allowedTools | quote }}
            - name: GW_GROUP_CONTEXT_LINES
              value: {{ .Values.messaging.groups.contextLines | quote }}
            - name: GW_GROUP_RATE_LIMIT
              value: {{ .Values.messaging.groups.rateLimit | quote }}
            - name: GW_GROUP_RATE_WINDOW_MINUTES
              value: {{ .Values.messaging.groups.rateWindowMinutes | quote }}
            {{- with .Values.messaging.groups.systemPrompt }}
            - name: GW_GROUP_SYSTEM_PROMPT
              value: {{ . | quote }}
            {{- end }}
          envFrom:
            # SIGNAL_NUMBER / SIGNAL_ALLOWED_SENDERS / WA_ALLOWED_SENDERS —
            # the sender allowlist is the gateway's ONLY auth.
            - secretRef:
                name: {{ include "claude-workspace.fullname" . }}-messaging
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources.messagingGateway | nindent 12 }}
        {{- if .Values.messaging.signal.enabled }}
        # signal-cli daemon (native binary, no JVM): JSON-RPC over a unix
        # socket on the shared /tmp emptyDir — the tailscaled-socket pattern.
        # Registration state is on the PVC (~/.local/share/signal-cli); the
        # one-time `signal-cli register/verify` happens from the term
        # container BEFORE messaging.enabled is flipped on (README).
        - name: signal-cli
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.security.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/signal-gw
              exec signal-cli daemon \
                --socket /tmp/signal-gw/signal-cli.sock \
                --receive-mode on-connection
          env:
            - name: HOME
              value: /home/node
          # No probes: with no registered account the daemon is up but
          # useless, and a probe would flap it before first pairing.
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources.signalCli | nindent 12 }}
        {{- end }}
        {{- end }}
        {{- if .Values.tailscale.enabled }}
        # tailscaled with userspace networking: outbound dials go through its
        # in-process netstack, which is all `tailscale ssh root@<node>` needs —
        # no TUN device, no root, no extra capabilities. The term container's
        # `tailscale` CLI reaches it over the socket on the shared /tmp.
        # State (node key, prefs) lives on the home PVC so the one-time
        # `tailscale up` login survives restarts.
        - name: tailscaled
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/tailscale
              exec tailscaled \
                --tun=userspace-networking \
                --statedir=/home/node/.local/share/tailscale \
                --socket=/tmp/tailscale/tailscaled.sock
          env:
            - name: HOME
              value: /home/node
          # No probes on purpose: `tailscale status` exits non-zero while
          # logged out, and a probe would kill the container before the
          # one-time interactive `tailscale up` could ever happen.
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
        {{- end }}
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: {{ include "claude-workspace.fullname" . }}-home
        # Shared tmpfs — tmux sockets (/tmp/tmux-1000), the tailscaled socket,
        # npm/npx caches, git temp objects. Ephemeral by design; roomier than
        # the bridge's since interactive dev leans on /tmp harder.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        {{- if and .Values.happy.daemon.enabled .Values.happy.restartNotice.enabled }}
        - name: happy-notice
          configMap:
            name: {{ include "claude-workspace.fullname" . }}-happy-notice
            defaultMode: 0555
        {{- end }}
        {{- if .Values.secrets.onePassword.enabled }}
        - name: op-credentials
          secret:
            secretName: {{ include "claude-workspace.opSecretName" . }}
            # 0400 and read-only. These are inputs to scripts/op-session.sh,
            # which never writes them; the directory op itself needs writable is
            # ~/.config/op, which stays on the PVC.
            defaultMode: 0400
        {{- end }}
