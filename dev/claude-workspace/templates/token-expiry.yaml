{{- if .Values.tokenExpiry.enabled }}
{{/*
A CronJob rather than a sidecar, for one reason that outranks the others: this
chart's Deployment uses `strategy: Recreate`, so adding a container to it means
every upgrade of this watcher tears down the live workspace — the shell, the
Happy sessions, the messaging gateway. A separate CronJob is deployable while
someone is working in /term.

It borrows the model-catalog's shape: the home PVC is RWO, so podAffinity puts
the Job on the workspace's node, and no fsGroup is set because a recursive chmod
on this volume would wreck exactly the credential permissions being watched.
Unlike the catalog it mounts no code of its own beyond the script and runs once
a day, so there is nothing to gain from pinning a digest — the mutable tag is
resolved once per day, not once per minute.

Egress: the chart's NetworkPolicy selects the Deployment's pods only, so Job
pods are unselected and need no exception for ntfy.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "claude-workspace.fullname" . }}-token-expiry
  labels:
    {{- include "claude-workspace.labels" . | nindent 4 }}
data:
  monitor.py: |
{{ .Files.Get "token-expiry/monitor.py" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "claude-workspace.fullname" . }}-token-expiry
  labels:
    {{- include "claude-workspace.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.tokenExpiry.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One retry: a transient ntfy blip should not cost a day's reminder, and
      # the check is idempotent — a second run publishes the same message.
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: claude-workspace-token-expiry
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      {{- include "claude-workspace.selectorLabels" . | nindent 22 }}
          containers:
            - name: monitor
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python3", "/opt/token-expiry/monitor.py"]
              env:
                - name: CREDENTIALS_FILE
                  value: /home/node/.claude/.credentials.json
                - name: WARN_DAYS
                  value: {{ .Values.tokenExpiry.warnDays | quote }}
                - name: NTFY_URL
                  value: {{ .Values.tokenExpiry.ntfy.url | quote }}
                - name: NTFY_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.tokenExpiry.ntfy.existingSecret | quote }}
                      key: {{ .Values.tokenExpiry.ntfy.passwordKey | quote }}
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: code
                  mountPath: /opt/token-expiry
                  readOnly: true
                # The whole home, read-only, because that is where the PVC's
                # ~/.claude lives; the script opens one file inside it.
                - name: home
                  mountPath: /home/node
                  readOnly: true
          volumes:
            - name: code
              configMap:
                name: {{ include "claude-workspace.fullname" . }}-token-expiry
            - name: home
              persistentVolumeClaim:
                claimName: {{ include "claude-workspace.fullname" . }}-home
{{- end }}
