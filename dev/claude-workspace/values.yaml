image:
  # Custom image (Dockerfile in this dir): node + claude-code CLI + happy CLI
  # (mobile remote control via dev/happy-server) + bakery (bun) + ttyd + tmux
  # + dev basics. Built by build.sh, pushed to a PUBLIC GHCR package so every
  # node can pull it anonymously — see minecraft/claude-bridge/build.sh for
  # why we never side-load images.
  repository: "ghcr.io/zdiemer/claude-workspace"
  # v4: merges the happy swap with the bakery surface (built pod-side as an
  #     unpushed v3; that tag was later overwritten by the happy build — v4
  #     is the first tag containing both).
  # v3: swaps CloudCLI (claudecodeui) for the happy CLI — the mobile surface
  # is now the Happy app against the self-hosted relay (dev/happy-server).
  # v2: adds kubectl/helm/buildctl/tailscale for cluster ops (see README
  # "Cluster powers").
  # v11: groups are allowlisted by ROOM — every member of a listed group may
  #      address the bot, with `!` commands still owner-only.
  # v10: read receipts follow the mention gate — in a group the bot only marks
  #      read what it will actually answer.
  # v9: group mentions are structured-only — a real @-mention or a reply to the
  #     bot. Resolves the account's own ACI from the signal-cli account store,
  #     without which no Signal @-mention can ever match.
  # v8: messaging gains model/effort switching (!model, !effort, !clear), a
  #     harness system prompt (plain text, phone-shaped replies), read
  #     receipts, and mention-gated group chats with their own tool ceiling.
  # v7: fixes the messaging surface's first contact with both networks — pins
  #     baileys exactly (a caret resolved *backwards* to a year-old client that
  #     WhatsApp refuses with a 405) and matches the Signal allowlist on the
  #     sender's ACI, which is the only identifier Signal actually sends.
  # v6: adds the messaging surface — signal-cli (native binary) + the
  #     gateway app at /opt/messaging-gateway (Signal/WhatsApp → headless
  #     claude, see `messaging:` below and README "Messaging surface").
  tag: "v11"
  # Static tag, so always re-pull on pod (re)start to pick up rebuilds.
  pullPolicy: Always

service:
  type: ClusterIP
  # ttyd web terminal (served under /term, see ingress).
  termPort: 7681
  # Bakery is two processes: the Bun API/WebSocket server and the Vite web UI.
  # The browser talks to BOTH directly (there is no Vite→server proxy), so the
  # ingress path-splits one host: /api → server, everything else → web. Ports
  # match bakery's own defaults (PI_WEB_PORT / vite --port).
  bakeryServerPort: 3141
  bakeryWebPort: 5173

persistence:
  # One PVC = the pod's entire $HOME (/home/node). Holds ~/.claude (OAuth
  # creds + conversation jsonl), ~/.happy (happy CLI pairing keys), ~/.ssh,
  # and all repo checkouts under ~/code. Everything that matters survives
  # pod restarts and reschedules; nothing is node-pinned.
  home:
    size: 20Gi
    # iSCSI, NOT nfs. This holds ~100k small files (node_modules, git objects),
    # and NFS pays a round-trip per file: copying it to truenas-nfs ran at
    # 349kB/s and would have taken hours. iSCSI presents a block device with a
    # local ext4 on top, so file creation is a local metadata operation. The
    # claim is ReadWriteOnce anyway, so it never needed RWX.
    storageClass: truenas-iscsi
    accessMode: ReadWriteOnce

security:
  # Everything in the pod (claude, happy, tmux) writes under $HOME or /tmp.
  # Escape hatch: if a tool update insists on writing into its npm package
  # dir, flip this off in values.local.yaml.
  readOnlyRootFilesystem: true

rbac:
  # ⚠️ Binds the workspace's ServiceAccount to cluster-admin (same tradeoff as
  # infra/headlamp): the pod can deploy/delete anything in the cluster,
  # including its own chart. Authelia forward-auth on the ingress is the ONLY
  # gate in front of that power — keep auth.forwardAuth.enabled on. Flip this
  # off to return the pod to zero API access (no SA token mounted at all).
  clusterAdmin: true

tailscale:
  # Runs a tailscaled container (userspace networking, no TUN, no root) so the
  # scripts/k3s maintenance scripts can `tailscale ssh root@<node>` from the
  # pod. State lives on the home PVC; auth is a one-time interactive
  # `tailscale up` from the web terminal — see README.
  enabled: true

networkPolicy:
  enabled: true
  # LAN subnet the k3s nodes live on. Used for the kube-API egress rule: the
  # API ClusterIP (10.43.0.1:443) is DNAT'd to <node>:6443, and depending on
  # where the netpol is evaluated the packet may already carry the node IP.
  nodeCIDR: "192.168.4.0/24"

auth:
  # Gate the web terminal at the Traefik ingress with Authelia forward-auth
  # (same pattern as docs/stirling-pdf). ttyd is never safe to expose bare:
  # it is a remote shell on the cluster.
  forwardAuth:
    enabled: true
    autheliaService: authelia     # Authelia release/service name
    autheliaNamespace: auth       # namespace Authelia runs in
    autheliaPort: 9091
    autheliaPath: /api/authz/forward-auth

ingress:
  # Disabled for first boot. Flip on (in values.local.yaml) after the pod is
  # Ready and a port-forward smoke test passes — see README.
  enabled: false
  className: traefik
  host: claude.zachd.duckdns.org
  # Additional hosts published via the Cloudflare tunnel (infra/cloudflared).
  # TLS for these terminates at Cloudflare, so they are NOT in the ACME cert
  # list. Requires a one-time Public Hostname entry in the CF dashboard.
  cloudflareHosts:
    - claude.diemer.codes
  tls:
    enabled: true
    # DuckDNS can only write TXT at the account's top-level, so sub-subdomain
    # certs must ride a wildcard SAN. See infra/duckdns.
    certResolver: duckdns
    domain: zachd.duckdns.org
    wildcardSan: "*.zachd.duckdns.org"

happy:
  # Relay URL for the happy CLI (HAPPY_SERVER_URL on the term container).
  # Public URL on purpose — the QR pairing flow may embed it, and the phone
  # can only reach the public host; pod egress rides the 443-to-public rule
  # via hairpin NAT. If hairpin ever breaks, switch to the cluster-local
  # Service (the netpol already allows it):
  #   serverUrl: "http://happy-server.happy.svc.cluster.local:3005"
  # — but then the app must be pointed at the public host manually, never
  # via a scanned URL.
  serverUrl: "https://happy.zachd.duckdns.org"
  daemon:
    # Run `happy daemon` as an always-on supervised sidecar so the Happy app
    # can spawn NEW sessions in any ~/code dir the moment the pod is up — no
    # more opening /term to run `happy daemon start` by hand after every
    # restart (the daemon, like tmux, otherwise dies with the pod). The
    # container's process is `happy daemon start-sync`, the daemon's FOREGROUND
    # entrypoint (plain `start` forks off and exits — useless for a container);
    # k8s then restarts it like any other container.
    #
    # It shares ~/.happy (pairing keys + the daemon.state.json.lock singleton)
    # with the interactive `happy` run in /term. That's safe BECAUSE every
    # container is the same image = the same happy version: interactive `happy`
    # only auto-spawns a daemon when none of a MATCHING version is already
    # running, so it defers to this one. A version mismatch would make one kill
    # and replace the other — never pin happy differently across containers.
    #
    # NOTE: the phone's spawned sessions run as CHILD PROCESSES of this
    # container, so it needs claude-sized memory headroom (resources.happyDaemon
    # below), not just the daemon's own tiny footprint.
    enabled: true

bakery:
  # The bakery web harness (github.com/seemethere/bakery), vendored into the
  # image (image.tag v4+). Two containers — the Bun server and the Vite web —
  # share the same $HOME PVC as the rest of the workspace.
  enabled: true
  # Bakery's web client bakes ONE absolute API origin at serve time
  # (VITE_PI_WEB_API_BASE below), so bakery is reachable on exactly this host —
  # NOT over the diemer.codes Cloudflare tunnel like the / and /term surfaces.
  # Serving it on a second domain would need a second build (a fork we avoided).
  # This host rides the *.zachd.duckdns.org wildcard cert and Authelia's
  # zachd.duckdns.org SSO cookie (auth/authelia sessionDomain), so no extra
  # cert or access-control rule is needed — default_policy two_factor covers it.
  host: bakery.zachd.duckdns.org
  # Absolute origin the web client uses for REST + WebSocket. Must equal the
  # host above (same-origin → the Authelia cookie and CORS both just work; the
  # ingress routes /api on this origin to the Bun server). Leaving the default
  # :3141 in the client would force a second public port — this avoids it.
  apiBase: "https://bakery.zachd.duckdns.org"
  # Directories bakery agent sessions may touch (comma-separated allowlist).
  # The workspace repos, same as everything else on this pod.
  workspaceRoot: /home/node/code
  # Bakery's own state (metadata sqlite, sessions, artifacts, worktrees). On the
  # PVC so it survives restarts. Its coding agent's credentials live in ~/.pi
  # (a one-time interactive login — see README "Bakery surface").
  dataDir: /home/node/.pi-web-agent
  # Bakery requires no token of its own: Authelia forward-auth is the gate, same
  # as the / and /term surfaces. Set a token here only for defense-in-depth —
  # it is passed to the server AND baked into the web client, so the browser
  # authenticates automatically with no Settings-dialog entry.
  authToken: ""
  # bun/vite dev servers write transpile caches into /opt/bakery, so this
  # container can't take the read-only rootfs the other surfaces use.
  readOnlyRootFilesystem: false
  # Extra env for the bakery SERVER container (e.g. PI_WEB_DEFAULT_MODEL,
  # PI_WEB_ALLOWED_MODELS, PI_WEB_FAKE_AGENT).
  extraEnv: {}

messaging:
  # Signal/WhatsApp → headless `claude -p` in this pod's $HOME: the
  # low-bandwidth surface (airline free-messaging wifi passes Signal/WhatsApp
  # but not real traffic). Two extra containers: messaging-gateway (bun app
  # baked at /opt/messaging-gateway) and a signal-cli daemon. Sessions share
  # ~/.claude with tmux/Happy, so `!resume` in chat continues a session
  # started at the desk. See README "Messaging surface" for pairing.
  #
  # Off until the Signal number is registered (see README) — the daemon
  # crash-loops with no account, and the gateway would sit idle.
  enabled: false
  # Where a fresh chat runs claude. `!cwd <repo>` switches per chat.
  defaultCwd: /home/node/code/selfhosted
  # Minutes a permission prompt waits for a 1/2/3 reply before denying — in
  # seconds. Generous because the whole point is spotty connectivity.
  approvalTimeoutSeconds: 300
  # Tools claude may use WITHOUT a chat prompt (read-only set). Everything
  # else round-trips "Claude wants: … reply 1/2/3" — unless a chat has
  # `!auto on`, which skips permissions entirely for that chat.
  allowedTools: >-
    Read Glob Grep LS WebFetch WebSearch TodoWrite
    Bash(git status:*) Bash(git log:*) Bash(git diff:*) Bash(ls:*) Bash(rg:*)
  # Model and reasoning depth for every run. `!model` / `!effort` override per
  # chat at runtime; these are the defaults every chat starts from.
  model: claude-opus-5
  effort: medium
  # Appended to Claude Code's own system prompt — it teaches the run that the
  # far end is a phone (plain text, no Markdown, short replies). Leave empty to
  # use the gateway's built-in default; set it here to override entirely.
  systemPrompt: ""
  groups:
    # ⚠️ OFF, deliberately, for two reasons.
    #
    # Disclosure: every member of a group sees whatever claude prints, so the
    # sender allowlist decides who may *drive* the bot but not who *reads* it.
    #
    # Authority: in a group the ROOM is the credential — every member of a
    # listed group may address the bot, and the personal sender allowlist is
    # not consulted. That is deliberate (it is what makes a shared room useful)
    # and it is bounded: group runs get `allowedTools` only, never auto mode,
    # and share one rate limit. `!` commands stay owner-only. But everyone in
    # the room can spend the subscription, so allowlist rooms you'd hand a
    # metered API key to — see signal.allowedGroups / whatsapp.allowedGroups.
    #
    # With no groups listed, this does nothing: it fails closed.
    enabled: false
    # Only answer when actually tagged — a real @-mention, or a reply to one of
    # the bot's own messages. Structured address only: matching the bot's name
    # in the message text was tried and removed, because "claude" comes up in
    # ordinary conversation and answering that is the failure this prevents.
    # Off means it answers every allowlisted message in the room, which no
    # group tolerates for long.
    requireMention: true
    # Groups get their own, much smaller tool set — no filesystem, no shell, no
    # writes. Anything outside this list is denied outright rather than
    # prompted: the room would see the prompt, and only one member could answer.
    allowedTools: WebFetch WebSearch
    # Lines of surrounding group conversation handed to the model as context.
    # The whole room's chat is included, not just the allowlisted sender's —
    # "what did we decide?" is unanswerable otherwise.
    contextLines: 50
    # Runs per group per window. This is a personal Claude subscription, and a
    # group is the one surface where other people can spend it.
    rateLimit: 20
    rateWindowMinutes: 60
    # Extra system prompt for group runs only (empty = gateway default).
    systemPrompt: ""
  signal:
    enabled: true
    # The bot's own number (E.164), registered via `signal-cli register` from
    # the term container — a dedicated number, NOT a linked device on a
    # personal account. Secret-ish: set in values.local.yaml.
    number: ""
    # ONLY these senders are heard at all (E.164). This gateway is a shell on
    # the cluster — keep it to your own numbers. values.local.yaml.
    #
    # Signal identifies senders by ACI (UUID), not number, under phone-number
    # privacy — list BOTH. Find the UUID in the daemon log's `Envelope from:`.
    allowedSenders: []
    # Group IDs whose members may all address the bot (see messaging.groups).
    # Base64, from the daemon log's `Group info: Id:`. values.local.yaml.
    allowedGroups: []
  whatsapp:
    # Baileys speaks the unofficial WhatsApp Web protocol: outbound websocket
    # only (no ingress), but Meta bans automation-smelling numbers — keep it
    # on a dedicated number, keep volume low, and expect to re-pair after a
    # ban. Off by default; Signal is the primary channel.
    enabled: false
    # Sender phone numbers, digits only (JID user part, e.g. "15551234567").
    allowedSenders: []
    # Group JIDs whose members may all address the bot, e.g.
    # "1234567890-1234567890@g.us". values.local.yaml.
    allowedGroups: []

# How this pod gets the per-chart values.local.yaml files it needs to deploy.
secrets:
  relay:
    # Unpack secret/selfhosted-secrets (published by scripts/secrets.sh) into the
    # checkout on every pod start. Before this, a restart left the pod with
    # whatever the PVC happened to hold and someone had to remember to run
    # `secrets.sh pull --from-cluster` by hand — and a fresh deploy from here
    # would fail on `required` values or, worse, render a secret empty.
    #
    # optional: the Secret may not exist yet on a brand-new cluster, and the pod
    # must still start.
    enabled: true
    secretName: selfhosted-secrets
    # Where the selfhosted checkout lives on the PVC. Skipped if absent.
    repoPath: /home/node/code/selfhosted
  onePassword:
    # Give the pod its own vault access, so a secret edited HERE reaches
    # 1Password instead of waiting for the laptop to publish over the top of it.
    # The relay above stays regardless — it is the bootstrap path and needs no
    # credentials.
    #
    # This does put the account password on the PVC. The honest accounting: this
    # SA is already cluster-admin (templates/rbac.yaml) and can read every
    # rendered chart Secret, which carries most of these same values; what is
    # genuinely new is reach into vault items no chart has deployed yet.
    # Everything is gated behind Authelia. Values belong in values.local.yaml.
    enabled: false
    # Shorthand from `op account list`.
    account: my
    address: my.1password.com
    email: ""
    # Both of these are secrets — set them in values.local.yaml, never here.
    secretKey: ""
    password: ""

resources:
  # tmux spawns `claude` (and `happy`, which wraps another claude) — hungry
  # Node processes, so a roomy memory ceiling.
  term:
    requests:
      cpu: 50m
      # ~2.9Gi resident with a session live, against a 128Mi request — the
      # scheduler was booking this pod at 4% of what it actually holds.
      memory: 2560Mi
    limits:
      # 2.9Gi steady against a 3Gi ceiling left nothing for a second session;
      # 4Gi restores headroom rather than waiting for the OOM kill.
      memory: 4Gi
  # The happy daemon process is tiny, but it HOSTS the claude sessions the phone
  # spawns (they are its children) — so give it the same roomy ceiling as the
  # term container's tmux-hosted sessions, with a low request (idle when no
  # phone session is running).
  happyDaemon:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 3Gi
  # Bakery server runs the coding agent (a hungry process); the Vite web is a
  # lighter dev server.
  bakeryServer:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  bakeryWeb:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  # The gateway process is tiny, but claude runs are its CHILDREN (same shape
  # as happyDaemon) — claude-sized ceiling, idle-sized request. The gateway
  # caps itself at 2 concurrent claude runs (GW_MAX_CONCURRENT).
  messagingGateway:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 3Gi
  # Native-image signal-cli daemon: no JVM heap ballooning, but give it room
  # for attachment buffers and the receive queue.
  signalCli:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
