image:
  # Custom image (Dockerfile in this dir): node + claude-code CLI + happy CLI
  # (mobile remote control via dev/happy-server) + bakery (bun) + ttyd + tmux
  # + dev basics. Built by build.sh, pushed to a PUBLIC GHCR package so every
  # node can pull it anonymously — see minecraft/claude-bridge/build.sh for
  # why we never side-load images.
  repository: "ghcr.io/zdiemer/claude-workspace"
  # v4: merges the happy swap with the bakery surface (built pod-side as an
  #     unpushed v3; that tag was later overwritten by the happy build — v4
  #     is the first tag containing both).
  # v3: swaps CloudCLI (claudecodeui) for the happy CLI — the mobile surface
  # is now the Happy app against the self-hosted relay (dev/happy-server).
  # v2: adds kubectl/helm/buildctl/tailscale for cluster ops (see README
  # "Cluster powers").
  # v21: identity hardening. Only cryptographic identifiers authenticate — a
  #      Signal ACI, or the WhatsApp JID the session is with; phone numbers and
  #      the server's LID↔number alias fields no longer admit anyone. Adds the
  #      TOTP session unlock (messaging.unlock), with `!bash`/`!auto` needing a
  #      code from the last few minutes. ⚠️ REQUIRES `SIGNAL_ALLOWED_SENDERS`
  #      to contain the ACI: a number-only allowlist locks you out.
  # v20: the status message's edits actually land. Each one now targets the
  #      revision the last one produced — Signal ignores an edit aimed at a
  #      superseded revision, which is why v19's ticker still showed stale
  #      text — and they are budgeted against Signal's ten-revision cap:
  #      nine progress edits on a doubling gap, the tenth kept for the receipt.
  # v19: the live status message redraws on its own ticker instead of only when
  #      a stream event lands, so a single tool call that runs for a minute in
  #      silence no longer freezes it — the elapsed clock keeps counting. Signal
  #      redraws every 5s (its own knob), WhatsApp stays at 3s.
  # v18: picks up the NAS retention count fix in scripts/secrets.sh. Inert in
  #      the pod (it cannot reach the NAS and never backs up), rebuilt anyway:
  #      a copy that lags its source is precisely what v17 exists to complain
  #      about, and leaving it to warn about a change that does not affect it
  #      is how a warning stops being read.
  # v17: the bundled `secrets` CLI can now tell it has gone stale — it carries
  #      the sha256 of the sources it was cut from and says so when the pod's
  #      checkout has moved past it. v16 fixed the drift; this is what stops
  #      the pod's copy from drifting again unnoticed.
  # v16: rebuilds the bundled `secrets` CLI, which had drifted from its source.
  #      The bundle is generated at build time, so it freezes scripts/ as of
  #      the last image build — v15 shipped a copy from before apartment-watch
  #      was deprecated (it still looked for two archived vault items and
  #      reported the chart broken) and from before the bundle could find the
  #      pod's own checkout. Nothing else in the image changed.
  # v15: adds the `secrets` CLI to PATH — read and edit 1Password-backed chart
  #      secrets from the pod with no selfhosted checkout and no script path
  #      (scripts/build-secrets-cli.sh).
  # v14: the messaging surface gets reactions (👀 working, ✅ done, and 👍/👎
  #      on a permission prompt to answer it), a live status message edited as
  #      tool calls land, attachments both ways, !more / !use / !sessions, an
  #      expiring !auto, and a word on both sides of a restart.
  # v13: chat gains `!bash` (a shell command with no model in the loop),
  #      `!plan` (plan mode per chat), and `!usage` (subscription spend summed
  #      from the ~/.claude transcripts, since nothing else counts it).
  # v12: WhatsApp accepts LID-addressed DMs and matches every identifier a
  #      sender arrives under; every skip path now says why it skipped.
  # v11: groups are allowlisted by ROOM — every member of a listed group may
  #      address the bot, with `!` commands still owner-only.
  # v10: read receipts follow the mention gate — in a group the bot only marks
  #      read what it will actually answer.
  # v9: group mentions are structured-only — a real @-mention or a reply to the
  #     bot. Resolves the account's own ACI from the signal-cli account store,
  #     without which no Signal @-mention can ever match.
  # v8: messaging gains model/effort switching (!model, !effort, !clear), a
  #     harness system prompt (plain text, phone-shaped replies), read
  #     receipts, and mention-gated group chats with their own tool ceiling.
  # v7: fixes the messaging surface's first contact with both networks — pins
  #     baileys exactly (a caret resolved *backwards* to a year-old client that
  #     WhatsApp refuses with a 405) and matches the Signal allowlist on the
  #     sender's ACI, which is the only identifier Signal actually sends.
  # v6: adds the messaging surface — signal-cli (native binary) + the
  #     gateway app at /opt/messaging-gateway (Signal/WhatsApp → headless
  #     claude, see `messaging:` below and README "Messaging surface").
  tag: "v21"
  # Static tag, so always re-pull on pod (re)start to pick up rebuilds.
  pullPolicy: Always

service:
  type: ClusterIP
  # ttyd web terminal (served under /term, see ingress).
  termPort: 7681
  # Bakery is two processes: the Bun API/WebSocket server and the Vite web UI.
  # The browser talks to BOTH directly (there is no Vite→server proxy), so the
  # ingress path-splits one host: /api → server, everything else → web. Ports
  # match bakery's own defaults (PI_WEB_PORT / vite --port).
  bakeryServerPort: 3141
  bakeryWebPort: 5173

persistence:
  # One PVC = the pod's entire $HOME (/home/node). Holds ~/.claude (OAuth
  # creds + conversation jsonl), ~/.happy (happy CLI pairing keys), ~/.ssh,
  # and all repo checkouts under ~/code. Everything that matters survives
  # pod restarts and reschedules; nothing is node-pinned.
  home:
    size: 20Gi
    # iSCSI, NOT nfs. This holds ~100k small files (node_modules, git objects),
    # and NFS pays a round-trip per file: copying it to truenas-nfs ran at
    # 349kB/s and would have taken hours. iSCSI presents a block device with a
    # local ext4 on top, so file creation is a local metadata operation. The
    # claim is ReadWriteOnce anyway, so it never needed RWX.
    storageClass: truenas-iscsi
    accessMode: ReadWriteOnce

security:
  # Everything in the pod (claude, happy, tmux) writes under $HOME or /tmp.
  # Escape hatch: if a tool update insists on writing into its npm package
  # dir, flip this off in values.local.yaml.
  readOnlyRootFilesystem: true

rbac:
  # ⚠️ Binds the workspace's ServiceAccount to cluster-admin (same tradeoff as
  # infra/headlamp): the pod can deploy/delete anything in the cluster,
  # including its own chart. Authelia forward-auth on the ingress is the ONLY
  # gate in front of that power — keep auth.forwardAuth.enabled on. Flip this
  # off to return the pod to zero API access (no SA token mounted at all).
  clusterAdmin: true

tailscale:
  # Runs a tailscaled container (userspace networking, no TUN, no root) so the
  # scripts/k3s maintenance scripts can `tailscale ssh root@<node>` from the
  # pod. State lives on the home PVC; auth is a one-time interactive
  # `tailscale up` from the web terminal — see README.
  enabled: true

networkPolicy:
  enabled: true
  # LAN subnet the k3s nodes live on. Used for the kube-API egress rule: the
  # API ClusterIP (10.43.0.1:443) is DNAT'd to <node>:6443, and depending on
  # where the netpol is evaluated the packet may already carry the node IP.
  nodeCIDR: "192.168.4.0/24"

auth:
  # Gate the web terminal at the Traefik ingress with Authelia forward-auth
  # (same pattern as docs/stirling-pdf). ttyd is never safe to expose bare:
  # it is a remote shell on the cluster.
  forwardAuth:
    enabled: true
    autheliaService: authelia     # Authelia release/service name
    autheliaNamespace: auth       # namespace Authelia runs in
    autheliaPort: 9091
    autheliaPath: /api/authz/forward-auth

ingress:
  # Disabled for first boot. Flip on (in values.local.yaml) after the pod is
  # Ready and a port-forward smoke test passes — see README.
  enabled: false
  className: traefik
  host: claude.zachd.duckdns.org
  # DELIBERATELY EMPTY — this host is tailnet-only, and must stay that way.
  #
  # It used to publish claude.diemer.codes over the Cloudflare tunnel. What
  # that meant in practice: a ttyd web terminal on a pod holding a cluster-
  # admin ClusterRoleBinding (templates/rbac.yaml) and the repo checkout's
  # every values.local.yaml, reachable from the open internet, with the
  # `auth.forwardAuth.enabled` boolean below as the only thing in the way.
  # One flag, one middleware-name typo, or one Authelia misconfiguration
  # between the internet and cluster-admin is not a defensible number.
  #
  # Now that infra/duckdns is in `mode: tailnet`, the host above resolves to a
  # 100.x address that the public internet cannot route, so reaching this
  # requires being on the tailnet FIRST and then passing Authelia. Two
  # independent gates, which is the right number for a root shell.
  #
  # Re-adding a Cloudflare host here re-opens that path in one line. Don't,
  # without a second gate that does not depend on this chart's own values.
  #
  # Removing the entry from THIS list is only half the delisting: the tunnel's
  # Public Hostname entry lives in the Cloudflare dashboard (Zero Trust ->
  # Networks -> Tunnels), and until it is deleted there, CF still accepts the
  # request and forwards it to a Traefik that no longer has a matching router.
  # That is a 404 rather than an outage, so nothing tells you it is still
  # configured.
  cloudflareHosts: []
  tls:
    enabled: true
    # DuckDNS can only write TXT at the account's top-level, so sub-subdomain
    # certs must ride a wildcard SAN. See infra/duckdns.

happy:
  # Relay URL for the happy CLI (HAPPY_SERVER_URL on the term container).
  #
  # THE DUCKDNS HOST, AND IT MUST STAY A NAME THE PHONE CAN ALSO REACH. That is
  # the whole constraint, and it is easy to get wrong in a tidying pass: this
  # URL is what the QR pairing flow embeds, so a value that only the POD can
  # resolve produces a QR the phone cannot use, and pairing silently becomes a
  # manual URL-typing exercise.
  #
  # This was briefly changed to the cluster-local Service
  # (http://happy-server.happy.svc.cluster.local:3005) during the tunnel
  # delisting, on the reasoning that the public host was going away. That
  # reasoning was wrong: the value here was never the diemer.codes host, it was
  # always this duckdns one, and delisting happy.diemer.codes did not touch it.
  # Now that infra/duckdns is in tailnet mode, this name resolves to a 100.x
  # node address that BOTH ends reach — the pod over the cluster's DNS and the
  # phone over the tailnet. One name, both paths, QR pairing intact.
  #
  # The cluster-local Service remains the correct fallback if this pod ever
  # needs to reach the relay while DNS or the tailnet is broken — the netpol
  # allows it — but pairing must then be done by typing the URL, so it is a
  # break-glass value rather than the default.
  serverUrl: "https://happy.zachd.duckdns.org"
  daemon:
    # Run `happy daemon` as an always-on supervised sidecar so the Happy app
    # can spawn NEW sessions in any ~/code dir the moment the pod is up — no
    # more opening /term to run `happy daemon start` by hand after every
    # restart (the daemon, like tmux, otherwise dies with the pod). The
    # container's process is `happy daemon start-sync`, the daemon's FOREGROUND
    # entrypoint (plain `start` forks off and exits — useless for a container);
    # k8s then restarts it like any other container.
    #
    # It shares ~/.happy (pairing keys + the daemon.state.json.lock singleton)
    # with the interactive `happy` run in /term. That's safe BECAUSE every
    # container is the same image = the same happy version: interactive `happy`
    # only auto-spawns a daemon when none of a MATCHING version is already
    # running, so it defers to this one. A version mismatch would make one kill
    # and replace the other — never pin happy differently across containers.
    #
    # NOTE: the phone's spawned sessions run as CHILD PROCESSES of this
    # container, so it needs claude-sized memory headroom (resources.happyDaemon
    # below), not just the daemon's own tiny footprint.
    enabled: true
  restartNotice:
    # Push to the phone when a deploy takes the daemon down and when it comes
    # back, via `happy notify`. Because phone-spawned sessions are children of
    # the daemon container, a `Recreate` rollout kills them and they otherwise
    # just vanish from the app with no explanation.
    #
    # Only fires when a session was actually live: a preStop hook checks
    # sessions.json for a "running" session belonging to THIS pod (every record
    # from a dead pod still says running — the process never got to update it,
    # so the host check is what makes this meaningful) and leaves a marker that
    # the next boot reports and clears. A restart while you aren't using Happy
    # stays silent.
    #
    # Best-effort by construction: SIGKILL, an eviction or a node failure skips
    # preStop, so there is no marker and no notice. The alternative — inferring
    # it on boot from stale state — is what produces "20 sessions interrupted"
    # after a quiet restart.
    enabled: true

bakery:
  # The bakery web harness (github.com/seemethere/bakery), vendored into the
  # image (image.tag v4+). Two containers — the Bun server and the Vite web —
  # share the same $HOME PVC as the rest of the workspace.
  enabled: true
  # Bakery's web client bakes ONE absolute API origin at serve time
  # (VITE_PI_WEB_API_BASE below), so bakery is reachable on exactly this host —
  # NOT over the diemer.codes Cloudflare tunnel like the / and /term surfaces.
  # Serving it on a second domain would need a second build (a fork we avoided).
  # This host rides the *.zachd.duckdns.org wildcard cert and Authelia's
  # zachd.duckdns.org SSO cookie (auth/authelia sessionDomain), so no extra
  # cert or access-control rule is needed — default_policy two_factor covers it.
  host: bakery.zachd.duckdns.org
  # Absolute origin the web client uses for REST + WebSocket. Must equal the
  # host above (same-origin → the Authelia cookie and CORS both just work; the
  # ingress routes /api on this origin to the Bun server). Leaving the default
  # :3141 in the client would force a second public port — this avoids it.
  apiBase: "https://bakery.zachd.duckdns.org"
  # Directories bakery agent sessions may touch (comma-separated allowlist).
  # The workspace repos, same as everything else on this pod.
  workspaceRoot: /home/node/code
  # Bakery's own state (metadata sqlite, sessions, artifacts, worktrees). On the
  # PVC so it survives restarts. Its coding agent's credentials live in ~/.pi
  # (a one-time interactive login — see README "Bakery surface").
  dataDir: /home/node/.pi-web-agent
  # Bakery requires no token of its own: Authelia forward-auth is the gate, same
  # as the / and /term surfaces. Set a token here only for defense-in-depth —
  # it is passed to the server AND baked into the web client, so the browser
  # authenticates automatically with no Settings-dialog entry.
  authToken: ""
  # bun/vite dev servers write transpile caches into /opt/bakery, so this
  # container can't take the read-only rootfs the other surfaces use.
  readOnlyRootFilesystem: false
  # Extra env for the bakery SERVER container (e.g. PI_WEB_DEFAULT_MODEL,
  # PI_WEB_ALLOWED_MODELS, PI_WEB_FAKE_AGENT).
  extraEnv: {}

messaging:
  # Signal/WhatsApp → headless `claude -p` in this pod's $HOME: the
  # low-bandwidth surface (airline free-messaging wifi passes Signal/WhatsApp
  # but not real traffic). Two extra containers: messaging-gateway (bun app
  # baked at /opt/messaging-gateway) and a signal-cli daemon. Sessions share
  # ~/.claude with tmux/Happy, so `!resume` in chat continues a session
  # started at the desk. See README "Messaging surface" for pairing.
  #
  # Off until the Signal number is registered (see README) — the daemon
  # crash-loops with no account, and the gateway would sit idle.
  enabled: false
  # Where a fresh chat runs claude. `!cwd <repo>` switches per chat.
  defaultCwd: /home/node/code/selfhosted
  # How long a prompt waits for a reply before denying, in seconds. Generous
  # because the whole point is spotty connectivity — and because most of these
  # are now claude asking a question or proposing a plan, which is worth the
  # walk back to the phone. Not unbounded: an unanswered prompt holds a claude
  # slot until it resolves.
  approvalTimeoutSeconds: 1800
  # Wall-clock ceiling on one claude run, in seconds. 0 = none, which is the
  # default: the only runs a fixed cap reliably kills are the long ones that
  # were working (a build, a migration, one parked on an approval), and the
  # answer they had already earned goes with them. `!stop` ends a run on
  # demand and a redeploy ends them all.
  claudeTimeoutSeconds: 0
  # Tools claude may use WITHOUT a chat prompt (read-only set). Everything
  # else round-trips "Claude wants: … reply 1/2/3". `!auto on` allows those
  # unprompted too — but a question or a plan still reaches the chat, because
  # an auto-allowed question comes back unanswered and silently vanishes.
  allowedTools: >-
    Read Glob Grep LS WebFetch WebSearch TodoWrite
    Bash(git status:*) Bash(git log:*) Bash(git diff:*) Bash(ls:*) Bash(rg:*)
  # Model and reasoning depth for every run. `!model` / `!effort` override per
  # chat at runtime; these are the defaults every chat starts from.
  model: claude-opus-5
  effort: medium
  bash:
    # `!bash <cmd>` — a shell command straight from chat, no model in the loop.
    # For the cheap questions (`kubectl get pods`) where a whole claude run plus
    # a permission round-trip costs four messages to answer one line.
    #
    # On by default, and it is not the widening it looks like: `!` commands are
    # owner-only, `!bash` additionally refuses group chats, and the same 1:1 can
    # already `!auto on` and have claude run anything unprompted. Set false to
    # make the model the only path to the shell.
    enabled: true
    # SIGTERM (then SIGKILL) after this long — one chat runs one bash at a time,
    # so a wedged command would otherwise hold the slot until the pod restarts.
    timeoutSeconds: 120
    # Output is capped before chunking, so a runaway `cat` can't grow the heap.
    maxOutputChars: 8000
  unlock:
    # TOTP session unlock for 1:1 chats — the second half of the auth story.
    #
    # The allowlist answers "is this the owner's account?". It cannot answer "is
    # the owner holding the phone?", which is the question a stolen or linked
    # device asks. And the read-only baseline is not a consolation prize here:
    # Read/Grep over ~/code in a pod with 1Password access can exfiltrate every
    # secret in the fleet, so the gate is on the session, not on writes.
    #
    # A chat locks after `idleHours` of silence, after any pod restart (state is
    # in memory deliberately), and at `maxHours` regardless. Unlocking is one
    # message containing the six digits. `!bash` and `!auto` additionally need a
    # code from the last `freshSeconds` — a session open since this morning is
    # permission to talk, not to hand over a shell.
    #
    # OFF until `totpSecret` is set, so an existing deploy is unchanged until
    # you have actually enrolled the secret in an authenticator.
    #
    # Base32, generated locally: `openssl rand -base32 20 | tr -d '='`. Enrol it
    # with otpauth://totp/claude-gateway?secret=<SECRET>&issuer=selfhosted —
    # any app (Google Authenticator, 1Password, Aegis) computes codes offline,
    # nothing is sent anywhere. values.local.yaml.
    totpSecret: ""
    idleHours: 12
    maxHours: 24
    freshSeconds: 300
    # Wrong codes before a cooldown, and how long it lasts.
    maxAttempts: 5
    lockoutMinutes: 15
  # Days `!usage` sums when called bare (`!usage 30` overrides, max 90). It adds
  # up the usage blocks in ~/.claude transcripts — every claude run in this pod,
  # chat and tmux and Happy alike — because there is no CLI or API for the
  # subscription's own counters.
  usageDays: 7
  progress:
    # The live status message: one message sent when a run starts, edited in
    # place with the current tool call, then collapsed to a one-line receipt
    # ("done · 14 tools · 1m42s") when the answer goes out. Without it a long
    # run is indistinguishable from the bot being down.
    #
    # It is always a separate message from the reply — the reply is chunked
    # across up to four messages and can't be an edit target.
    enabled: true
    # Redraw cadence for that message on WhatsApp. Not a cosmetic knob:
    # WhatsApp is reached through an unofficial client (see "ban risk"), so a
    # fast tick is not on the table. The last state always lands regardless.
    editSeconds: 3
    # Signal's FIRST gap; each later one doubles (5s, 10s, 20s …). Not a
    # cadence, because Signal caps a message at ten revisions and drops the
    # rest: the status gets nine progress edits and keeps the tenth for the
    # receipt, so they are spent densely while the interesting steps happen
    # and sparsely after, covering ~45 minutes. Raising this stretches the
    # whole run at the cost of the early detail.
    signalEditSeconds: 5
  reactions:
    # Emoji on the sender's own message: working → done/failed, with the queued
    # one while another run in the same chat is still going. This is the only
    # feature here that shows up in a group whether the room asked or not,
    # hence its own switch.
    enabled: true
    queued: "🕒"
    working: "👀"
    done: "✅"
    error: "❌"
  restartNotice:
    # Redeploying this chart is a `Recreate` rollout — the pod is torn down
    # before the new one pulls, so a run in flight just stops. Since a chat can
    # trigger that itself (`!bash ./build.sh && ./upgrade.sh`), silence there
    # reads as the bot having crashed.
    enabled: true
    # Only chats active this recently are told. An hour is roughly "still
    # holding the phone"; a day would be a ping out of nowhere.
    withinMinutes: 60
    # Suppress the notice if the last one was this recent, so a crash-looping
    # pod can't turn into a message per restart.
    dedupeMinutes: 10
    # Hard cap on time spent messaging in-flight chats on SIGTERM before
    # exiting anyway. terminationGracePeriodSeconds is the real ceiling.
    shutdownGraceSeconds: 5
  attachments:
    # Photos in, files out. A phone camera is the fastest way to show the
    # workspace an error on a screen, and a rendered chart or a screenshot is
    # the one kind of answer this surface could never give before.
    #
    # Inbound media is saved under ~/.cache/messaging-gateway/inbox and the run
    # is told the paths, so claude reads them like any other file (the inbox is
    # pruned to a week at startup — a cache, not an archive). Outbound, claude
    # puts [[send:/abs/path]] on its own line and the gateway turns that into a
    # real attachment; the marker is honoured in 1:1 chats only, since a group
    # can steer text and the marker is parsed from text.
    enabled: true
    # Both directions. Well under what either network allows, because the
    # binding constraint is a phone on a bad connection, not the protocol.
    maxMB: 8
  # Appended to Claude Code's own system prompt — it teaches the run that the
  # far end is a phone (plain text, no Markdown, short replies). Leave empty to
  # use the gateway's built-in default; set it here to override entirely.
  systemPrompt: ""
  groups:
    # ⚠️ OFF, deliberately, for two reasons.
    #
    # Disclosure: every member of a group sees whatever claude prints, so the
    # sender allowlist decides who may *drive* the bot but not who *reads* it.
    #
    # Authority: in a group the ROOM is the credential — every member of a
    # listed group may address the bot, and the personal sender allowlist is
    # not consulted. That is deliberate (it is what makes a shared room useful)
    # and it is bounded: group runs get `allowedTools` only, never auto mode,
    # and share one rate limit. `!` commands stay owner-only. But everyone in
    # the room can spend the subscription, so allowlist rooms you'd hand a
    # metered API key to — see signal.allowedGroups / whatsapp.allowedGroups.
    #
    # With no groups listed, this does nothing: it fails closed.
    enabled: false
    # Only answer when actually tagged — a real @-mention, or a reply to one of
    # the bot's own messages. Structured address only: matching the bot's name
    # in the message text was tried and removed, because "claude" comes up in
    # ordinary conversation and answering that is the failure this prevents.
    # Off means it answers every allowlisted message in the room, which no
    # group tolerates for long.
    requireMention: true
    # Groups get their own, much smaller tool set — no filesystem, no shell, no
    # writes. Anything outside this list is denied outright rather than
    # prompted: the room would see the prompt, and only one member could answer.
    allowedTools: WebFetch WebSearch
    # Lines of surrounding group conversation handed to the model as context.
    # The whole room's chat is included, not just the allowlisted sender's —
    # "what did we decide?" is unanswerable otherwise.
    contextLines: 50
    # Runs per group per window. This is a personal Claude subscription, and a
    # group is the one surface where other people can spend it.
    rateLimit: 20
    rateWindowMinutes: 60
    # Extra system prompt for group runs only (empty = gateway default).
    systemPrompt: ""
  signal:
    enabled: true
    # The bot's own number (E.164), registered via `signal-cli register` from
    # the term container — a dedicated number, NOT a linked device on a
    # personal account. Secret-ish: set in values.local.yaml.
    number: ""
    # ONLY these senders are heard at all, and ONLY as ACIs (UUIDs) — a phone
    # number here is ignored, with a warning at startup.
    #
    # The ACI is the identity Signal's sealed-sender certificate is issued for;
    # a number is recyclable by the carrier, moveable by SIM swap, and
    # re-registerable by whoever holds it next. Since a match on ANY identifier
    # admits the sender, listing both made the number the real gate — for a
    # shell on a cluster-admin pod. Find the UUID in the daemon log:
    # `Envelope from: "Name" <uuid>`. values.local.yaml.
    allowedSenders: []
    # Group IDs whose members may all address the bot (see messaging.groups).
    # Base64, from the daemon log's `Group info: Id:`. values.local.yaml.
    allowedGroups: []
  whatsapp:
    # Baileys speaks the unofficial WhatsApp Web protocol: outbound websocket
    # only (no ingress), but Meta bans automation-smelling numbers — keep it
    # on a dedicated number, keep volume low, and expect to re-pair after a
    # ban. Off by default; Signal is the primary channel.
    enabled: false
    # The JID user part the sender's client actually sends: digits for a phone
    # JID ("15551234567"), or the LID user part for a client that has migrated.
    # Only the JID the encrypted session is with is matched — the server's
    # LID↔number alias fields are not, since they are WhatsApp's claim about
    # who someone is rather than proof. If a client moves to LIDs the gateway
    # logs `sender not allowlisted (ids: …)`; list what it prints.
    allowedSenders: []
    # Group JIDs whose members may all address the bot, e.g.
    # "1234567890-1234567890@g.us". values.local.yaml.
    allowedGroups: []

# How this pod reaches the secrets it needs to deploy.
#
# It resolves them itself, from 1Password, exactly as the laptop does — see
# scripts/lib/secret-values.sh. There used to be a `relay` here: a Secret
# (selfhosted-secrets) holding a tar of EVERY chart's values.local.yaml, which
# init-home unpacked onto the PVC on every start. It was removed once the pod
# had its own vault access, because it was a plaintext copy of every secret in
# the fleet living in etcd and on an iSCSI volume, to feed files nothing reads
# any more.
#
# It also never did the job it claimed. The unpack was gated on the checkout
# already existing on the PVC, so on a genuinely fresh volume it printed "no
# checkout or no bundle yet" and skipped; the real bootstrap is a git clone,
# which needs the ssh key or gh auth, and neither was ever in the bundle.
secrets:
  onePassword:
    # Give the pod its own vault access, so a secret edited HERE reaches
    # 1Password instead of waiting for the laptop to publish over the top of it.
    enabled: false
    # Shorthand from `op account list`.
    account: my

    # THE CREDENTIALS DO NOT PASS THROUGH HELM. Name a Secret created
    # out-of-band and the chart renders none of its own:
    #
    #   op read "op://homelab/1password-account/values.local.yaml" \
    #     | kubectl -n claude create secret generic claude-workspace-1password \
    #         --from-file=/dev/stdin --dry-run=client -o yaml | kubectl apply -f -
    #
    # WHY, since this reverses how it was set up on 2026-08-12: putting the
    # account password in values.local.yaml made it a managed secret like any
    # other, which meant it was pushed to the vault as its own item, packed into
    # the weekly NAS archive, shipped in the relay bundle, and written into
    # sh.helm.release.v1.* on every upgrade — helm keeps ten of those. The
    # password to the vault was inside the vault, inside the backup of the
    # vault, and in ten copies in etcd. scripts/systemd/README.md promises the
    # opposite: "they are not put inside the thing they protect."
    #
    # An existingSecret is the only shape that keeps it out of the helm release
    # history, because values are what release history stores.
    existingSecret: ""

    # Only used when existingSecret is empty, which should be never outside a
    # first bootstrap. Left in so the old path still renders rather than
    # silently producing a Secret with blank fields.
    address: my.1password.com
    email: ""
    secretKey: ""
    password: ""

resources:
  # tmux spawns `claude` (and `happy`, which wraps another claude) — hungry
  # Node processes, so a roomy memory ceiling.
  term:
    requests:
      cpu: 50m
      # ~2.9Gi resident with a session live, against a 128Mi request — the
      # scheduler was booking this pod at 4% of what it actually holds.
      memory: 2560Mi
    limits:
      # 2.9Gi steady against a 3Gi ceiling left nothing for a second session;
      # 4Gi restores headroom rather than waiting for the OOM kill.
      memory: 4Gi
  # The happy daemon process is tiny, but it HOSTS the claude sessions the phone
  # spawns (they are its children) — so give it the same roomy ceiling as the
  # term container's tmux-hosted sessions, with a low request (idle when no
  # phone session is running).
  happyDaemon:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 3Gi
  # Bakery server runs the coding agent (a hungry process); the Vite web is a
  # lighter dev server.
  bakeryServer:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  bakeryWeb:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  # The gateway process is tiny, but claude runs are its CHILDREN (same shape
  # as happyDaemon) — claude-sized ceiling, idle-sized request. The gateway
  # caps itself at 2 concurrent claude runs (GW_MAX_CONCURRENT).
  #
  # Sized like `term` rather than like the gateway process, because a chat
  # session is not only a model in a loop: it runs whatever the work needs, and
  # that lands in THIS cgroup. On 2026-08-15 an `npm install` for a new project
  # (652 packages, Next + Payload build tooling) took the container past 3Gi
  # twice and the kernel OOM-killed it — exit 137, taking Signal and WhatsApp
  # down with it mid-conversation. The gateway's own logs were clean, which is
  # the tell: nothing crashed, the cgroup was simply full.
  #
  # The request matters as much as the limit. At 128Mi the scheduler was booking
  # this pod at a few percent of what it actually holds, so the node accepted
  # neighbours it had no room for.
  messagingGateway:
    requests:
      cpu: 50m
      memory: 1536Mi
    limits:
      # 4Gi to match `term`: the same claude-sized session, plus room for one
      # build alongside it. Heavy image builds should still go to the in-cluster
      # buildkitd (BUILDKIT_HOST) rather than run here.
      memory: 4Gi
  # Native-image signal-cli daemon: no JVM heap ballooning, but give it room
  # for attachment buffers and the receive queue.
  signalCli:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
