{{- if and .Values.ingress.enabled .Values.auth.forwardAuth.enabled }}
{{/*
Optional Authelia gate in front of Guacamole's own login. Off by default — see
auth.forwardAuth in values.yaml for why (the host is already tailnet-only).

Rendered into THIS chart's namespace, pointing at the Authelia Service in its
own namespace by plain URL, so it works without Traefik's allowCrossNamespace.
Same pattern as docs/stirling-pdf.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "guacamole.fullname" . }}-forwardauth
  labels:
    {{- include "guacamole.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://{{ .Values.auth.forwardAuth.autheliaService }}.{{ .Values.auth.forwardAuth.autheliaNamespace }}.svc.cluster.local:{{ .Values.auth.forwardAuth.autheliaPort }}{{ .Values.auth.forwardAuth.autheliaPath }}
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
{{- end }}
