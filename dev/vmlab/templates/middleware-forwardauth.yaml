{{- if and .Values.ingress.enabled .Values.auth.forwardAuth.enabled }}
{{/*
Rendered into THIS namespace, pointing at Authelia by plain URL, so it works
without Traefik's allowCrossNamespace. Same pattern as dev/guacamole.

Unlike Guacamole this defaults ON — see auth.forwardAuth in values.yaml. The
short version: Guacamole gates VMs that already exist and has its own login;
this creates pods that hold /dev/kvm.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "vmlab.fullname" . }}-forwardauth
  labels:
    {{- include "vmlab.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://{{ .Values.auth.forwardAuth.autheliaService }}.{{ .Values.auth.forwardAuth.autheliaNamespace }}.svc.cluster.local:{{ .Values.auth.forwardAuth.autheliaPort }}{{ .Values.auth.forwardAuth.autheliaPath }}
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
{{- end }}
