apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-devices
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: gpu-devices}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gpu-devices}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        media.zachd/vaapi: "true"
      containers:
        - name: plugin
          image: {{ .Values.image }}
          args:
            - --device
            - '{"name":"render","groups":[{"count":{{ .Values.shares }},"paths":[{"path":"/dev/dri/renderD128"}]}]}'
            - --listen=127.0.0.1:8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: plugins, mountPath: /var/lib/kubelet/device-plugins}
            - {name: dri, mountPath: /dev/dri, readOnly: true}
      volumes:
        - name: plugins
          hostPath: {path: /var/lib/kubelet/device-plugins, type: Directory}
        - name: dri
          hostPath: {path: /dev/dri, type: Directory}
