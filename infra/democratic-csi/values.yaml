# Shared configuration for BOTH democratic-csi releases.
#
# This chart is installed twice from one directory — once per driver, because
# democratic-csi runs one deployment per backend protocol:
#
#   democratic-csi-iscsi   values.yaml + values-iscsi.yaml   -> truenas-iscsi
#   democratic-csi-nfs     values.yaml + values-nfs.yaml     -> truenas-nfs
#
# Only settings that are genuinely identical for both drivers belong here.
# Connection details and dataset paths are repeated in each overlay rather than
# shared from this file: helm does not template values files, so a `truenas.host`
# key here could not be read by the subchart. It would look like configuration
# and do nothing.
#
# Secrets (the TrueNAS API key) live in the gitignored values.local.yaml — see
# values.local.tpl.yaml and scripts/secrets.sh.
#
# Prerequisites, all of which upgrade.sh pre-flights:
#   - infra/snapshot-controller installed FIRST (VolumeSnapshotClass is its CRD)
#   - NFS + iSCSI services enabled on the TrueNAS (both ship disabled)
#   - open-iscsi + nfs-common on every node (scripts/k3s/iscsi-prereq.sh)

democratic-csi:
  controller:
    # Leader-elected; a second replica is availability, not throughput. A
    # controller outage stalls provisioning, it never touches volume data.
    replicaCount: 1

    # No nodeSelector, no affinity. Pinning the component that hands out
    # unpinned storage would be self-defeating.
    nodeSelector: {}
    affinity: {}

    driver:
      logLevel: info

      # PIN THE DRIVER IMAGE. Every other image this chart deploys — attacher,
      # provisioner, resizer, snapshotter, registrar, csi-proxy, the busybox
      # cleanup — ships pinned to a version by upstream. The two that actually
      # implement the driver, and that sit under every PVC in the cluster, ship
      # as `latest`. That was the only unpinned thing in the storage layer.
      #
      # WHY A DIGEST AND NOT A TAG. `latest` does not correspond to any released
      # tag. Resolved 2026-08-21:
      #
      #   latest  sha256:944d0e65…   <- what all 16 driver containers were running
      #   v1.9.5  sha256:fc3b7d7e…   <- newest release
      #   v1.9.3  sha256:8ce65ce5…   <- what Chart.yaml's appVersion claims
      #
      # So the cluster was running an untagged floating build that matches no
      # release, and appVersion was decorative. Pinning to v1.9.5 here would
      # have been a silent version CHANGE dressed up as a hygiene fix; pinning
      # to the digest already running is provably a no-op and stops the drift
      # today. Moving to a real release is a separate, staged change that runs
      # the verification gate in README.md first.
      #
      # The `@sha256` split across registry/tag is forced by the chart, which
      # renders `image: "{{ registry }}:{{ tag }}"` with no digest support. The
      # concatenation yields a valid canonical reference.
      image:
        registry: ghcr.io/democratic-csi/democratic-csi@sha256
        tag: 944d0e65077efbd9c1fdf23997eec8fac4b4bfb7c3de400f63e33a0a849c5ced

  node:
    # DaemonSet — this lands on all 7 nodes, including the 3.7GiB laptop, so
    # the footprint matters more here than anywhere else in this chart.
    nodeSelector: {}

    # Tolerate everything. A CSI node plugin is node infrastructure in the same
    # class as flannel or kube-proxy: if it is missing from a node, no volume of
    # that class can ever mount there, and the pod that needs one sits in
    # ContainerCreating with no obvious cause.
    #
    # Without this the DaemonSet desires 6 of 7 nodes — zachd-ubuntu carries
    # node-role.kubernetes.io/control-plane:NoSchedule. That node is not
    # hypothetical: minecraft/claude-bridge is pinned to it with a matching
    # toleration, so its PVC would have migrated onto a class that cannot mount
    # where its pod is required to run.
    tolerations:
      - operator: Exists

    driver:
      logLevel: info

      # Same pin as the controller above — same image, same reasoning. Both
      # references must move together: a controller and a node plugin on
      # different builds is a combination nobody upstream tests.
      image:
        registry: ghcr.io/democratic-csi/democratic-csi@sha256
        tag: 944d0e65077efbd9c1fdf23997eec8fac4b4bfb7c3de400f63e33a0a849c5ced

  csiDriver:
    # Delegate fsGroup so a pod's securityContext.fsGroup is applied by the
    # driver at mount rather than by the kubelet recursively chown-ing every
    # file. On a large volume that walk is the difference between a pod starting
    # in seconds and in minutes.
    fsGroupPolicy: ReadWriteOnceWithFSType
