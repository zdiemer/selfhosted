# Retire abandoned UUID-suffixed agent identities; registration recovery no
# longer depends on pruning. See ../post-render.py and README.md.

lapi:
  # The Deployment to exec `cscli` in, and the container inside it. `cscli
  # machines` operates on the LAPI's own database, so it has to run there —
  # the DB is a ReadWriteOnce PVC and a second pod opening that SQLite file
  # concurrently is how you corrupt it, not how you read it.
  #
  # These track the crowdsec release name. Renaming that release without
  # updating these does not silently prune nothing: `kubectl exec` exits
  # non-zero on a missing deployment and the job fails, which is the intent.
  deployment: crowdsec-lapi
  container: crowdsec-lapi

prune:
  # Delete machines whose last heartbeat is older than this.
  #
  # Active agents heartbeat regularly. This removes old UUID identities;
  # it does not participate in normal restart recovery.
  duration: 24h

schedule:
  timeZone: America/Los_Angeles
  # Daily, at a minute nothing else in the repo uses (traefik-certs 04:17 Mon,
  # renovate 05:30 Sat, versions-report 07:00 Sat).
  #
  # Daily cleanup bounds abandoned identity count without affecting restarts.
  cron: "40 4 * * *"
  # Two of these racing would both be issuing deletes against the same table.
  # Nothing good comes of it and there is no reason to allow it.
  concurrencyPolicy: Forbid
  # One exec into a pod that is already running. If this has not finished in
  # five minutes the LAPI is unwell and the job should say so rather than hang.
  activeDeadlineSeconds: 300
  # Unlike traefik-certs (backoffLimit: 0, because a retried ACME order burns
  # rate limit) a retry here costs nothing and the usual failure is a transient
  # API blip or a LAPI mid-rollout. Let it try again before reporting failure.
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

images:
  # Only needs `kubectl exec`; cscli comes from the LAPI pod. Same image and pin
  # as infra/traefik-certs so there is one renovate target for both.
  # renovate: datasource=docker depName=alpine/kubectl
  kubectl: alpine/kubectl:1.36.2

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
