# CrowdSec — detection over the Traefik access log. DETECTION ONLY, today.
#
# These are values for the upstream crowdsec/crowdsec chart (no local Chart.yaml
# — upgrade.sh drives `helm upgrade crowdsec/crowdsec` directly, same wrapper
# pattern as minecraft/).
#
#     traefik pod stdout ──/var/log/containers──▶ agent DaemonSet (parse, match
#     scenarios) ──▶ LAPI (decisions, PVC-backed) ──▶ nobody, yet
#
# WHY NO BOUNCER. The obvious enforcement point — Traefik's CrowdSec plugin —
# fetches from plugins.traefik.io at every Traefik pod start. With Recreate
# strategy and a single replica, a failed fetch turns any routine restart into
# an extended cluster-wide ingress outage. Not worth it. When enforcement is
# wanted, the right bouncer is Cloudflare's (blocks at the CF edge, zero
# Traefik involvement) — once DuckDNS is tailnet-only, Cloudflare is the only
# public HTTP path, so edge blocking is complete coverage anyway.
#
# Decisions are still made and visible (`cscli alerts list`, `cscli metrics`
# in the lapi pod, or the console if enrolled) — they just don't block. That
# is the point: see what detection fires for a few weeks before letting it
# cut anyone off.

# k3s runs containerd — the raw-log parser needs to know (docker vs cri format).
container_runtime: containerd

# ---------------------------------------------------------------------------
# Where decisions go
# ---------------------------------------------------------------------------
# CrowdSec bans things now (infra/traefik runs the bouncer plugin), and until
# this existed the only way to know it had was to exec into a pod and run
# `cscli decisions list`. The alerts were real and nobody was reading them.
#
# WHY NOT GRAFANA, which already has thirteen alert rules. Because Grafana Cloud
# is OUTSIDE and sms-relay is deliberately tailnet-only — it carries message
# bodies, so it is the one service kept off the Cloudflare tunnel entirely.
# Grafana Cloud cannot reach it, which is the actual reason
# infra/grafana-dashboards routes everything to a dead-end contact point. That
# is a real architectural constraint, not an unfinished job. CrowdSec's LAPI, by
# contrast, runs in this cluster and can reach the Service directly.
#
# WHAT GETS A TEXT, AND WHAT DOES NOT. The cluster bans roughly five addresses a
# day, essentially all of them WordPress scanners and directory probes walking
# the URL space. A text per ban is five texts a day of "the internet is still
# the internet", which is how a notification channel gets muted and then
# ignored. So profiles.yaml below splits them: routine web scanners are banned
# SILENTLY, and anything else — an ssh brute force, a CVE exploit attempt, a
# scenario nobody has seen before — sends a message. The signal is "something
# unusual", not "something happened".
profiles:
  # The scenarios considered routine. Every one of these has actually fired here
  # and every one was a scanner. Adding to this list makes things quieter;
  # removing from it makes them louder, and both are one deploy.
  routineScenarios:
    - crowdsecurity/http-probing
    - crowdsecurity/http-sensitive-files
    - crowdsecurity/http-wordpress-scan
    - crowdsecurity/http-admin-interface-probing
    - crowdsecurity/http-technology-probing
    - crowdsecurity/http-crawl-non_statics
    - crowdsecurity/http-bad-user-agent

# NOTIFICATIONS LIVE IN values.local.yaml, both halves of them, and the reason
# is a failure mode rather than tidiness.
#
# The notification config carries an API key and a phone number, so it cannot be
# here. But profiles.yaml is what REFERENCES the notifier by name, and a profile
# naming a plugin that was never configured is exactly the kind of half-applied
# state that fails at the worst moment. Keeping both in the same file means they
# arrive together or not at all:
#
#   * with values.local.yaml — profiles.yaml (with `notifications: [sms_relay]`)
#     and the sms_relay plugin are both mounted;
#   * without it — the default profiles.yaml from values.yaml applies, which
#     bans exactly the same things and simply notifies nobody.
#
# A deploy from a fresh clone with no secrets is therefore still correct and
# still enforcing, just silent. See values.local.yaml.example for the shape.


# ---------------------------------------------------------------------------
# Whitelist — the prerequisite for ever enforcing
# ---------------------------------------------------------------------------
# THIS MUST LAND BEFORE A BOUNCER DOES, not with it. While CrowdSec is
# detection-only a false positive is a row in a table; the moment anything
# enforces, the same false positive is an outage, and the ranges below are
# exactly the ones whose loss you would feel: the tunnel, the LAN, the tailnet.
#
# Mounted into the agent pods as a parser in s02-enrich (see config.parsers
# below). A whitelist at the PARSER stage drops the event before any scenario
# counts it, so a whitelisted source cannot accumulate toward a decision at all
# — as opposed to being banned and then ignored, which still fills the
# decisions table with noise you learn to scroll past.
#
# WHY EACH RANGE:
#
#   10.42.0.0/16   the pod CIDR. Traefik's ClientHost is frequently an internal
#                  hop rather than the real origin — cloudflared pods on the
#                  tunnel path, klipper-lb SNAT on the direct one. infra/traefik
#                  sets forwardedHeaders.trustedIPs so the real client IP is
#                  recovered from X-Forwarded-For / CF-Connecting-IP, and the
#                  live alerts confirm it works (every decision so far names a
#                  real public address). But if that config is ever lost or
#                  mis-set, EVERY request looks like it comes from a cloudflared
#                  pod, and the first scenario to fire bans the tunnel itself —
#                  taking down every public host at once. This range is the
#                  guard against a self-inflicted total outage.
#   10.43.0.0/16   the service CIDR, same reasoning for in-cluster callers.
#   192.168.4.0/24 the node LAN. Also what klipper-lb SNATs to.
#   100.64.0.0/10  the tailnet. Every host worth reaching is now tailnet-only,
#                  so this is the range that carries all of our own traffic —
#                  and the recovery path if a decision ever needs removing.
#   127.0.0.1      loopback, for completeness; health probes and Traefik's own
#                  internal routers.
#
# Deliberately NOT here: the Cloudflare edge ranges. Requests arriving from
# Cloudflare carry the real client in CF-Connecting-IP, which is what the
# parser reads — whitelisting CF's own addresses would be whitelisting the
# entire internet that reaches us through the tunnel.
#
# NOTE ON SHAPE: this is an upstream chart driven values-only (no local
# Chart.yaml, see upgrade.sh), so there is nothing here that can template a
# friendlier `whitelist:` block into place. The key below is the chart's own
# (`config.parsers.s02-enrich`) and the value is the literal parser file
# CrowdSec will load. Inventing a nicer-looking key would render nothing and
# report nothing — the same silent no-op this repo keeps running into.
config:
  # The default profile, WITHOUT any notification reference. values.local.yaml
  # replaces this wholesale with a two-profile version that adds the routine
  # filter and the sms_relay notification; helm replaces scalar strings rather
  # than merging them, so whichever file is last wins cleanly.
  #
  # NOTE this sits under the SAME `config:` key as the whitelist parser below,
  # and has to. Two `config:` blocks in one values file is not an error YAML
  # reports — the loader silently keeps the last one, so the first block's
  # contents vanish with nothing to notice. That is how this nearly shipped
  # with the whitelist quietly deleting profiles.yaml.
  profiles.yaml: |
    name: default_ip_remediation
    filters:
      - Alert.Remediation == true && Alert.GetScope() == "Ip"
    decisions:
      - type: ban
        duration: 4h
    on_success: break
  parsers:
    s02-enrich:
      trusted-networks.yaml: |
        name: home-k3s/trusted-networks
        description: "Never ban cluster-internal hops, the LAN, or the tailnet"
        whitelist:
          reason: "cluster-internal hops, the LAN, and the tailnet"
          cidr:
            - "10.42.0.0/16"
            - "10.43.0.0/16"
            - "192.168.4.0/24"
            - "100.64.0.0/10"
            - "127.0.0.1/32"
      # Talaria's frontend posts to this RPC on every page load to promote a
      # refresh-token cookie; signed-out visitors get a 401 BY DESIGN, and a
      # frontend retry loop (2026-08-20: the broken browse page) turns that
      # into a 401 stream that http-generic-401-bf reads as brute force —
      # it banned Zach's own home IP. Refresh tokens are high-entropy, so
      # exempting this one path from counting toward scenarios costs nothing.
      talaria-token-refresh.yaml: |
        name: home-k3s/talaria-token-refresh
        description: "Talaria token-refresh 401s are benign, not brute force"
        whitelist:
          reason: "signed-out sessions 401 on the token-refresh RPC by design"
          expression:
            - evt.Meta.http_path == '/api/users/UpdateRefreshTokenHandler'

agent:
  # Which pod logs the DaemonSet tails from /var/log/containers on each node.
  # Traefik is the cluster's single ingress choke point, so this one program is
  # a complete record of external HTTP — but only across nodes the agent
  # actually runs on. See the toleration below for why that is not automatic.
  acquisition:
    - namespace: kube-system
      podName: traefik-*
      program: traefik
  env:
    - name: COLLECTIONS
      value: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 250Mi

  # WHY A TOLERATION. "Traefik is the choke point" only holds if an agent runs
  # everywhere Traefik does. Traefik is a 3-replica Deployment and one replica
  # lands on zachd-ubuntu, which carries the stock
  # node-role.kubernetes.io/control-plane:NoSchedule taint. With the chart's
  # default empty tolerations the DaemonSet reported a contented 6/6 Ready
  # across a 7-node fleet, and roughly a third of external HTTP was never
  # parsed by anything — no gap visible in `cscli metrics`, because the agent
  # that would have counted it was never scheduled. A DaemonSet that silently
  # covers most of the cluster is worse than one that fails loudly.
  #
  # The other two control-plane nodes (zachd-ubuntu-laptop, -laptop-1) are
  # untainted, so this toleration only changes zachd-ubuntu today. Keep it
  # keyed to the taint rather than using a blanket `operator: Exists`: if a
  # node is ever cordoned or tainted for a real reason, the agent should stay
  # off it like everything else.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

lapi:
  # Bouncer API keys + the decisions DB live here; losing them means
  # re-registering everything, so both PVCs stay on (chart default sizes:
  # 1Gi data / 100Mi config).
  #
  # Moved off local-path onto truenas-iscsi on 2026-08-21 via migrate-pvcs.sh.
  # They were local-path with node affinity pinned to zachd-ubuntu-laptop, which
  # meant the decisions DB existed on exactly one node's disk and that node could
  # never be retired without losing it. That was the last thing blocking its
  # demotion from control plane.
  #
  # existingClaim rather than storageClassName: the claims were created and
  # populated out-of-band so the data could be copied and checksummed BEFORE the
  # chart was pointed at them. Switching to existingClaim makes helm prune the
  # old chart-managed PVCs — both old PVs were patched to Retain first, so they
  # survive as Released and remain the rollback path.
  #
  # NOTE the data volume is mounted with subPath: crowdsec, so the database is
  # at <volume-root>/crowdsec/crowdsec.db, not at the root.
  persistentVolume:
    config:
      existingClaim: crowdsec-config-nas
    data:
      existingClaim: crowdsec-db-nas
  resources:
    requests:
      cpu: 50m
      memory: 150Mi
    limits:
      memory: 500Mi

  # Console enrollment (app.crowdsec.net) is optional and carries a secret, so
  # it lives in values.local.yaml:
  #
  #   lapi:
  #     env:
  #       - name: ENROLL_KEY
  #         value: "..."
  #       - name: ENROLL_INSTANCE_NAME
  #         value: "home-k3s"
  #
  # NOTE helm merges maps but REPLACES arrays: values.local.yaml's lapi.env
  # replaces this one wholesale, which is why this stays empty.
  env: []
