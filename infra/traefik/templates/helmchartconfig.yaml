{{/*
k3s ships Traefik as a managed HelmChart. A HelmChartConfig named after that
release lets us overlay values onto it without owning the install — the
helm-controller merges this in and redeploys Traefik whenever `valuesContent`
changes.

Edits here are no longer an outage — Traefik is stateless since issuance moved
to infra/traefik-certs, so it runs three spread replicas and rolls with
maxUnavailable 0. Still worth keeping deliberate: this is every route into the
cluster, and upgrade.sh diffs against the live object and makes you confirm.

The whole body is a YAML string, so it is plain text templating rather than
structured values — mind the indentation, and remember `helm lint` cannot see
inside it. `helm template ... | yq .spec.valuesContent` is the real check.
*/}}
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: {{ .Values.helmChart.name }}
  namespace: {{ .Values.helmChart.namespace }}
  labels:
    {{- include "traefik-config.labels" . | nindent 4 }}
spec:
  valuesContent: |-
    {{- /*
      No PVC. This is the change the rest of the file depends on: Traefik holds
      no ACME state, so nothing forces one replica or a Recreate rollout.

      Stated explicitly rather than dropped. helm-controller recomputes the
      release's values from scratch each reconcile (HelmChart's valuesContent
      merged with this one), so omitting the key would fall back to the chart
      default and happen to be false too — but "happens to match the upstream
      default" is not a property to depend on for the thing that decides
      whether ingress can be drained.
    */}}
    persistence:
      enabled: false
    deployment:
      kind: Deployment
      replicas: {{ .Values.replicaCount }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- /*
        Endpoint removal races SIGTERM here as it does anywhere else, but the
        blast radius is the whole cluster's ingress: klipper-lb's DaemonSet and
        kube-proxy both have to notice this pod is going before it stops
        answering, or in-flight requests to every host become connection
        errors. Traefik's own graceful shutdown handles what is already
        in-flight after that.
      */}}
      lifecycle:
        preStop:
          sleep:
            seconds: {{ .Values.preStopSleepSeconds }}
    updateStrategy:
      type: {{ .Values.updateStrategy.type }}
      rollingUpdate:
        maxSurge: {{ .Values.updateStrategy.rollingUpdate.maxSurge }}
        maxUnavailable: {{ .Values.updateStrategy.rollingUpdate.maxUnavailable }}
    {{- /*
      A drain must never be able to take the ingress below a working pair.
      Safe to demand here precisely because replicas > 1 — the same budget
      against a single replica would block every drain in the cluster forever.
    */}}
    podDisruptionBudget:
      enabled: true
      minAvailable: {{ .Values.minAvailable }}
    {{- /*
      Hard spread, not a preference: three replicas on two nodes would mean a
      single drain could still cost two of them. The Traefik chart's own pod
      labels are what the selector has to match — `app.kubernetes.io/instance`
      is `<release>-<namespace>`, which for the k3s-managed release is
      `traefik-kube-system`, not `traefik`.
    */}}
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: {{ .Values.helmChart.name }}
            app.kubernetes.io/instance: {{ .Values.helmChart.name }}-{{ .Values.helmChart.namespace }}
    {{- /*
      The default certificate, from the Secret infra/traefik-certs maintains.
      `websecure` already has `http.tls=true` cluster-wide, so every router on
      it picks this up without naming anything — which is what lets the
      Ingresses drop their per-host certresolver annotations entirely.
    */}}
    tlsStore:
      default:
        defaultCertificate:
          secretName: {{ .Values.defaultCertificate.secretName }}
    {{- if or .Values.httpsRedirect.enabled .Values.forwardedHeaders.trustedIPs .Values.rateLimit.enabled }}
    ports:
      {{- if .Values.httpsRedirect.enabled }}
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
      {{- end }}
      {{- if or .Values.forwardedHeaders.trustedIPs .Values.rateLimit.enabled }}
      websecure:
        {{- with .Values.forwardedHeaders.trustedIPs }}
        {{- /*
          Without this, Traefik discards X-Forwarded-For / CF-Connecting-IP
          from every hop it doesn't trust — and BOTH ingress paths arrive via
          an internal hop (cloudflared pods on the pod CIDR, klipper-lb SNAT
          on pod/node CIDRs), so the real client IP was invisible.
        */}}
        forwardedHeaders:
          trustedIPs:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
        {{- end }}
        {{- if .Values.rateLimit.enabled }}
        {{- /*
          Entrypoint-level middleware: applies to every router on websecure.
          The Middleware object itself is templates/middleware.yaml — same
          chart on purpose, see the header comment there.
        */}}
        middlewares:
          - {{ .Values.helmChart.namespace }}-edge-ratelimit@kubernetescrd
        {{- end }}
      {{- end }}
    {{- end }}
    logs:
      general:
        level: INFO
      access:
        enabled: {{ .Values.accessLog.enabled }}
        {{- if .Values.accessLog.enabled }}
        format: {{ .Values.accessLog.format }}
        addInternals: {{ .Values.accessLog.addInternals }}
        {{- /*
          Only emit filter keys that carry a value. A `true` here renders as a
          bare valueless CLI flag (`--accesslog.filters.retryattempts`), which
          Traefik 3.6.7 accepts at startup and then silently ignores the whole
          access log for — no error, no output. See values.yaml.
        */}}
        filters:
          statuscodes: {{ .Values.accessLog.filters.statuscodes | quote }}
          minduration: {{ .Values.accessLog.filters.minduration | quote }}
          {{- if .Values.accessLog.filters.retryattempts }}
          retryattempts: true
          {{- end }}
        fields:
          general:
            defaultmode: {{ .Values.accessLog.fields.general.defaultmode }}
            names:
              {{- range $k, $v := .Values.accessLog.fields.general.names }}
              {{ $k }}: {{ $v }}
              {{- end }}
          headers:
            # `drop` keeps cookies / Authorization / Remote-* out of the log.
            defaultmode: {{ .Values.accessLog.fields.headers.defaultmode }}
            names:
              {{- range $k, $v := .Values.accessLog.fields.headers.names }}
              {{ $k }}: {{ $v }}
              {{- end }}
        {{- end }}
    {{- /*
      The certresolver used to be declared here, with the DuckDNS token handed
      in as DUCKDNS_TOKEN. Both are gone: infra/traefik-certs runs the ACME
      challenge now and Traefik only reads the resulting Secret, so this
      release needs no ACME arguments, no provider credentials, and no restart
      when the token rotates.

      Both keys are simply absent now rather than emitted empty. Values are
      recomputed from scratch on each reconcile, so absent means the chart
      default (empty) — there is no stale previous value to overwrite.

      If a certresolver is ever reintroduced here, delete infra/traefik-certs
      in the same change. Two things issuing for the same names is not an error
      either of them can detect; it just consumes Let's Encrypt's duplicate
      certificate limit twice as fast and leaves you guessing which one served
      the cert you are looking at.
    */}}
