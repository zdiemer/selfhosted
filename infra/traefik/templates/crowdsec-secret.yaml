{{/*
The CrowdSec bouncer API key, as a Secret in kube-system.

WHY A SECRET AND A FILE, RATHER THAN THE MIDDLEWARE. The plugin accepts the key
either inline (`crowdsecLapiKey`) or from a path (`crowdsecLapiKeyFile`), and
this chart uses the path. A Middleware is an ordinary CRD, not a Secret — an
inline key would sit in plaintext in the object, readable by anything with
`get middlewares` and visible in `helm get manifest`, `kubectl get -o yaml` and
any cluster backup of CRDs. The file form keeps it in the one object designed
to hold it.

Rendered into kube-system rather than this chart's namespace because that is
where the k3s-managed Traefik runs and a pod can only mount a Secret from its
own namespace — the same cross-namespace rendering infra/duckdns does for the
DuckDNS token.

The key itself is a BOUNCER credential: it authorizes reading decisions from
the LAPI, not writing them, so its blast radius is "someone learns which IPs
are banned". Rotate with:

    kubectl -n crowdsec exec deploy/crowdsec-lapi -- cscli bouncers delete traefik-plugin
    kubectl -n crowdsec exec deploy/crowdsec-lapi -- cscli bouncers add traefik-plugin -o raw

then update values.local.yaml (and 1Password) and re-run upgrade.sh.
*/}}
{{- if .Values.crowdsec.enabled }}
{{- if not .Values.crowdsec.bouncerKey }}
{{- fail "crowdsec.bouncerKey is required when crowdsec.enabled — set it in values.local.yaml (see README)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.crowdsec.secretName }}
  namespace: {{ .Values.helmChart.namespace }}
  labels:
    {{- include "traefik-config.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The key name here is the filename Traefik sees under the mount path, and it
  # must match the `crowdsecLapiKeyFile` value in templates/middleware.yaml.
  {{ .Values.crowdsec.secretKey }}: {{ .Values.crowdsec.bouncerKey | quote }}
{{- end }}
