{{/*
Edge-wide rate limit, applied at the websecure ENTRYPOINT (helmchartconfig.yaml
names it under ports.websecure.middlewares), so it covers every router in the
cluster without touching any per-app Ingress. Entrypoint middlewares are static
config, so allowCrossNamespace is not involved — but the reference and this
object must move in lockstep: if the entrypoint names a middleware that does
not exist, EVERY router on websecure errors. That is why this lives in the
same chart as the HelmChartConfig (helm applies both synchronously, before
helm-controller's async Traefik redeploy) and why it renders into
kube-system, the namespace the @kubernetescrd reference encodes — same
cross-namespace trick as infra/duckdns's token Secret.

Never delete this object while rateLimit.enabled still references it; disable
the flag (which drops both together) and let upgrade.sh restart Traefik.
*/}}
{{- if .Values.rateLimit.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: edge-ratelimit
  namespace: {{ .Values.helmChart.namespace }}
  labels:
    {{- include "traefik-config.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ .Values.rateLimit.average }}
    burst: {{ .Values.rateLimit.burst }}
    sourceCriterion:
      {{- /*
        CF-Connecting-IP is authoritative on the Cloudflare path: the CF edge
        overwrites it, so clients cannot spoof their bucket. On the direct
        path the header is absent and every request shares ONE bucket — which
        also means a direct-path attacker can dodge buckets by inventing the
        header. Acceptable: limits are sized so the shared bucket never
        bothers legitimate LAN/tailnet use, and once the router closes
        (DuckDNS → tailnet-only) the direct path stops being internet-facing.
      */}}
      requestHeaderName: CF-Connecting-IP
{{- end }}
{{- if .Values.crowdsec.enabled }}
---
{{/*
The CrowdSec bouncer middleware.

CREATING THIS OBJECT ENFORCES NOTHING. It only takes effect where it is
referenced — either from an Ingress's router.middlewares annotation or, once
`crowdsec.entrypoint` is true, from the websecure entrypoint in
helmchartconfig.yaml. That separation is deliberate: it makes it possible to
attach the bouncer to a single router and watch it before every route in the
cluster depends on it.

SAME LOCKSTEP HAZARD AS edge-ratelimit ABOVE, and worse in one respect: if the
entrypoint names a middleware that does not exist, EVERY router on websecure
errors. So this object and the entrypoint reference must move together, which is
why they live in the same chart and are gated by the same `crowdsec.enabled`
flag — disabling it removes both, in one apply, in the right order.

Note the plugin key (`bouncer` here) must match the name the plugin is
registered under in the static config. Traefik matches them by string, and a
mismatch does not fail the deploy — it fails the ROUTER, at request time, as a
500. Both come from .Values.crowdsec.pluginName so they cannot drift.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: {{ .Values.helmChart.namespace }}
  labels:
    {{- include "traefik-config.labels" . | nindent 4 }}
spec:
  plugin:
    {{ .Values.crowdsec.pluginName }}:
      # Strings, not booleans. The plugin parses its own config out of the CRD's
      # free-form JSON and expects string scalars — the upstream example writes
      # `Enabled: "true"` for the same reason.
      enabled: "true"
      crowdsecMode: {{ .Values.crowdsec.mode | quote }}
      crowdsecLapiHost: {{ .Values.crowdsec.lapiHost | quote }}
      crowdsecLapiScheme: {{ .Values.crowdsec.lapiScheme | quote }}
      {{- /*
        From a file, never inline — an inline key would sit in plaintext in an
        ordinary CRD. See templates/crowdsec-secret.yaml.
      */}}
      crowdsecLapiKeyFile: {{ printf "%s/%s" .Values.crowdsec.mountPath .Values.crowdsec.secretKey | quote }}
      {{- with .Values.crowdsec.forwardedHeadersTrustedIPs }}
      forwardedHeadersTrustedIPs:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.crowdsec.clientTrustedIPs }}
      clientTrustedIPs:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
{{- end }}
