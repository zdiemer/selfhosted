# Traefik: the cluster's single ingress choke point.
#
# WHAT THIS CHART IS. k3s ships Traefik as a managed HelmChart and owns the
# install. We do not. This chart owns exactly one object — a HelmChartConfig
# named `traefik` in kube-system — which k3s's helm-controller merges into that
# release. Everything Traefik-wide is set here: the default certificate, the
# http->https redirect, the scale and rollout strategy, and access logging.
#
# WHY IT'S SEPARATE FROM infra/duckdns. It used to live there, because the
# certresolver needed the DuckDNS token and that chart owns the token. Traefik
# no longer runs ACME at all — infra/traefik-certs does, and reads that token
# instead — but the split still stands on its own: this object is Traefik's
# whole config overlay, not a DNS concern.
#
# CHANGES HERE ARE NO LONGER AN OUTAGE, AND THAT IS NEW. This file used to open
# by saying every change was a cluster-wide ingress outage, because a
# ReadWriteOnce acme.json forced one replica and a `Recreate` rollout. Issuance
# has moved out (see defaultCertificate below), so Traefik is stateless: three
# replicas, spread across nodes, rolling with maxUnavailable 0, behind a
# PodDisruptionBudget. helm-controller still redeploys Traefik whenever
# `valuesContent` changes — it just does so without a gap now.
#
# What replaced the outage is a quieter failure mode worth knowing: if the
# certificate Secret goes missing, Traefik keeps serving, on its own self-signed
# default. Every host gets a browser warning and nothing crashes. upgrade.sh
# checks for the Secret before it applies anything.

# The k3s-managed Traefik release: chart name + namespace. The HelmChartConfig
# must match both exactly or helm-controller silently ignores it — no error,
# no event, it just never applies.
helmChart:
  name: traefik
  namespace: kube-system

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------
# There is no certresolver here any more, and no ACME at all. Issuance moved to
# infra/traefik-certs, which renews the wildcard into a Secret on a schedule;
# Traefik just reads it. See the defaultCertificate block below for what that
# bought and what it costs.
#
# The DuckDNS token that used to be read here as DUCKDNS_TOKEN is now read by
# that chart's CronJob instead. infra/duckdns still owns the Secret and still
# renders it into this namespace, so nothing changes on its side — but Traefik
# no longer needs a rollout restart when the token rotates, because Traefik no
# longer reads it.

# Traefik no longer holds any ACME state. It reads a certificate out of a
# Secret and never writes one.
#
# WHAT THIS REPLACED, AND WHY. Traefik used to run the DNS-01 challenge itself
# and persist the result to acme.json on a ReadWriteOnce local-path PVC. That
# one file set the availability ceiling for the whole cluster's ingress:
#
#   * one replica, because two pods cannot hold an RWO volume and two Traefiks
#     racing on one acme.json corrupt it;
#   * `Recreate` rollouts, so every change here was a cluster-wide gap;
#   * and a hard pin to whichever node held the local-path volume, so that node
#     could never be drained without taking all ingress down with it.
#
# The old comment here called scaling out "a real project needing RWX storage
# or an entirely different cert store". It was the second one: infra/traefik-
# certs renews the wildcard into this Secret on a schedule, which makes Traefik
# stateless and everything below possible.
#
# THE COUPLING IS REAL AND SILENT. If this Secret is missing or renamed,
# Traefik does not fail — it serves its own self-signed default certificate on
# every host, which is a browser warning everywhere rather than an outage. The
# name must match infra/traefik-certs' `certSecret.name`.
defaultCertificate:
  secretName: traefik-wildcard-tls

# ---------------------------------------------------------------------------
# Scale
# ---------------------------------------------------------------------------
# Three, not two. Traefik is the single ingress choke point, so this is the one
# place where surviving a node loss *during* a rollout is worth the extra pod —
# with minAvailable 2 below, a drain and a rollout can overlap without dropping
# below a working pair. Each replica is ~50Mi, which the cluster can afford
# where a second tika could not.
replicaCount: 3

# How many must stay up during a voluntary disruption (a drain; not a crash).
# 2 of 3 leaves headroom for exactly one node going away at a time, which is
# how scripts/k3s rolls the fleet.
minAvailable: 2

# Held open after SIGTERM so the Endpoints removal reaches kube-proxy and the
# klipper-lb DaemonSet before the pod stops accepting connections. Traefik
# drains its own in-flight requests after that, within the grace period below.
preStopSleepSeconds: 10
terminationGracePeriodSeconds: 90

# ---------------------------------------------------------------------------
# Rollout strategy
# ---------------------------------------------------------------------------
# THE KEY IS `updateStrategy`, NOT `deployment.strategy`. That is still true
# and still the thing to get wrong: an earlier version of this config set
# `deployment.strategy.type`, which the Traefik chart does not read, so the
# live Deployment quietly sat on the chart default for as long as that config
# existed. Setting a key the chart ignores looks identical to setting one it
# honours.
#
# Recreate is gone with the PVC that forced it. Nothing is shared between
# replicas any more, so this rolls: maxSurge 1 brings a new pod up before an
# old one goes, and maxUnavailable 0 means the cluster never drops below three
# working Traefiks during a config change. That is the difference between
# "every change here is a cluster-wide outage" — which is what the header of
# this file used to say — and a change nobody notices.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# ---------------------------------------------------------------------------
# Access logging
# ---------------------------------------------------------------------------
# Every external HTTP request in this cluster passes through Traefik, so this
# one log is a complete record of external ingress by construction — no matter
# which namespace or repo owns the thing being reached. Before this existed the
# cluster had literally zero request-level visibility: ~2 log lines per day, and
# no way to answer "is anything scanning me" or "why did that 502".
#
# Shipped off-node by infra/alloy. See that chart for retention and volume.
accessLog:
  enabled: true

  # JSON so Alloy can parse fields into labels without regex. `common` is the
  # Apache-style default and is markedly worse to query.
  format: json

  # Keep every status code. The instinct is to log only 4xx/5xx, but the 2xx
  # stream is exactly what makes "someone is walking my URL space" visible, and
  # at home traffic volumes the cost is negligible (~0.3-1 GB/month total).
  #
  # retryattempts is deliberately FALSE rather than true. With it on, the chart
  # renders a bare valueless `--accesslog.filters.retryattempts` flag, and
  # Traefik 3.6.7 then starts cleanly, reports the flag in its args, serves
  # traffic, increments its metrics — and writes no access log at all. It is a
  # silent no-op, which is the worst possible failure for a logging change.
  # Leave this off unless you have verified lines actually appear with it on.
  filters:
    statuscodes: ""
    retryattempts: false
    minduration: ""

  # Don't log Traefik's own internal routers (ping, dashboard, the acme
  # endpoint). They are health noise, not ingress.
  addInternals: false

  fields:
    general:
      defaultmode: keep
      names:
        # Redundant with StartUTC, and doubles the timestamp cost per line.
        StartLocal: drop
        # Duplicates RequestMethod + RequestPath + RequestProtocol verbatim.
        RequestLine: drop
        # Ephemeral source ports; noise, and they wreck label cardinality if
        # anything downstream ever promotes them.
        ClientPort: drop
        RequestPort: drop
        # Only meaningful with compression middleware, which we don't run.
        GzipRatio: drop
        RequestCount: drop

    headers:
      # THIS LINE IS SECURITY-LOAD-BEARING. `drop` is what keeps session
      # cookies, Authelia's Remote-* identity headers, and Authorization out of
      # logs that leave the house. Only add to the allowlist below something you
      # are certain never carries a credential.
      defaultmode: drop
      names:
        User-Agent: keep
        Referer: keep
        # The real client IP: klipper-lb + the Cloudflare tunnel both mean
        # ClientHost is frequently an internal hop, not the actual origin.
        X-Forwarded-For: keep
        # Cloudflare's authoritative client IP (the CF edge overwrites it, so
        # unlike XFF it can't be client-spoofed on that path). It's also what
        # the edge-ratelimit middleware buckets on — keep it visible so a 429
        # in the log can be attributed to a source.
        CF-Connecting-IP: keep

# CAVEAT worth knowing before adding a service: Traefik's `RequestPath` field
# includes the query string, and these logs go to a third party. Nothing here
# puts a secret in a query string today — sms-relay's webhook is HMAC-signed in
# the body, Authelia's `?rd=` is just a redirect target — but a future service
# that accepts `?token=` would leak it. Drop RequestPath above if that changes.

# ---------------------------------------------------------------------------
# Entrypoints
# ---------------------------------------------------------------------------
# Blanket http->https redirect. Every ingress in this repo pins
# `router.entrypoints: websecure`; this makes port 80 a redirect rather than a
# second, unencrypted way in. infra/ingress-policy enforces the pinning.
httpsRedirect:
  enabled: true

# Which upstream hops Traefik believes about X-Forwarded-* / CF-Connecting-IP.
# Both ingress paths arrive via an internal hop — cloudflared pods (pod CIDR)
# and klipper-lb SNAT (pod + node CIDRs) — so without this the real client IP
# never reaches Traefik, and any IP-based middleware buckets the whole
# internet into one address. These are the live cluster CIDRs: pods
# 10.42.0.0/16, node LAN 192.168.4.0/24.
#
# Do NOT add public CIDRs here: trusting a range means believing whatever
# X-Forwarded-For it sends, and everything outside these two ranges is either
# Cloudflare (which we read via CF-Connecting-IP instead) or an attacker.
forwardedHeaders:
  trustedIPs:
    - 10.42.0.0/16
    - 192.168.4.0/24

# Edge-wide rate limit, applied at the websecure entrypoint so every router in
# the cluster gets it without per-chart edits (templates/middleware.yaml has
# the full design notes, including why buckets key on CF-Connecting-IP).
#
# Sizing: per-source req/s sustained (average) with a burst allowance. 25/100
# is deliberately generous — a Jellyfin seek storm, a busy SPA, or the Happy
# websocket handshake sit far below it, while a scanner walking the URL space
# at hundreds of req/s hits 429s quickly. All direct-path (non-Cloudflare)
# traffic shares ONE bucket, so don't tighten this without remembering that
# bucket covers every tailnet/LAN client combined.
rateLimit:
  enabled: true
  average: 25
  burst: 100

# ---------------------------------------------------------------------------
# CrowdSec bouncer — the enforcement point
# ---------------------------------------------------------------------------
# infra/crowdsec has been detecting since it was installed and blocking nothing.
# This is what makes its decisions bite: a Traefik plugin that checks the client
# IP against the LAPI's decision list and answers 403 for a banned one.
#
# WHY THIS AND NOT THE CLOUDFLARE BOUNCER. The Cloudflare Workers bouncer blocks
# further out, at the edge, which is genuinely better placement — but it wants a
# broad API token (Workers Scripts, Workers KV, Turnstile, Zone DNS) and on the
# free plan it is bounded by 1,000 KV writes/day, which truncates the blocklist,
# and 100k requests/day, after which it stops remediating. It also needs its
# routes set fail-open so quota exhaustion doesn't serve error pages. For a
# home cluster that is a lot of moving parts and a paid plan to do the job this
# plugin does for nothing.
#
# WHY THE ORIGINAL OBJECTION NO LONGER HOLDS. infra/crowdsec's values.yaml
# rejected this plugin, and was right to at the time: the plugin is fetched from
# plugins.traefik.io at Traefik start, and with ONE replica on a Recreate
# rollout a failed fetch turned every restart into a cluster-wide ingress
# outage. Traefik now runs three replicas, rolling, with maxUnavailable 0. A
# failed fetch now means a new pod does not become Ready and the old ones keep
# serving — the rollout stalls instead of the cluster going dark.
#
# WHAT THAT LEAVES, stated plainly rather than waved away: you cannot roll
# Traefik while plugins.traefik.io is unreachable. That is a real coupling to a
# third party, it is just a much smaller one than "ingress is down". If it ever
# bites, set enabled: false here and re-run upgrade.sh — that removes both the
# plugin and the middleware reference together.
crowdsec:
  enabled: true

  # Pinned. Plugins are fetched and compiled at Traefik start, so an unpinned
  # version means the code running in the ingress path can change under you on
  # an unrelated restart. Bump deliberately.
  # renovate: datasource=github-releases depName=maxlerebourg/crowdsec-bouncer-traefik-plugin
  version: "v1.7.1"
  moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"

  # The name Traefik's static config registers the plugin under. The Middleware
  # spec must use this exact key (see templates/middleware.yaml) — Traefik
  # matches them by string, and a mismatch is a router-level error, not a
  # startup one, so it surfaces as 500s rather than a failed deploy.
  pluginName: bouncer

  # WHERE THE BOUNCER APPLIES.
  #
  #   false — the Middleware exists but nothing references it, so nothing is
  #           enforced. Attach it to one router by hand
  #           (traefik.ingress.kubernetes.io/router.middlewares:
  #           kube-system-crowdsec-bouncer@kubernetescrd) to watch it in
  #           production against real traffic first.
  #   true  — referenced from the websecure entrypoint, so EVERY router in the
  #           cluster is bounced, including charts in other repos that will
  #           never read this file. That is the end state and the reason this
  #           lives at the entrypoint rather than in 26 Ingresses.
  #
  # Flipped to true after the single-router test passed end to end on
  # old.diemer.codes: a decision added for the probing source produced a 403
  # there within ~30s while every other host still served 200, and removing the
  # decision restored it. Block, scope and recovery all confirmed before this
  # was allowed to cover every route in the cluster.
  entrypoint: true

  # `stream` is the recommended mode and the only one that keeps Traefik off the
  # LAPI's critical path: the bouncer pulls the decision list every 60s and
  # answers from its own cache, so a request never waits on CrowdSec and a LAPI
  # outage degrades to "the list stops updating" rather than "every request
  # blocks". `live` queries per-IP and `none` queries every request; both put a
  # network hop in front of every page load for no benefit here.
  mode: stream

  # The LAPI, cross-namespace. crowdsec-service is the chart's Service name.
  lapiHost: "crowdsec-service.crowdsec.svc.cluster.local:8080"
  lapiScheme: http

  # Where the bouncer key Secret is mounted into the Traefik container, and the
  # filename within it. These three must agree with each other and with
  # templates/crowdsec-secret.yaml; they are values rather than literals for
  # exactly that reason.
  secretName: traefik-crowdsec-bouncer
  secretKey: bouncer-key
  mountPath: /etc/traefik/crowdsec

  # REQUIRED — set in values.local.yaml (gitignored), materialized from
  # 1Password. Generate with:
  #   kubectl -n crowdsec exec deploy/crowdsec-lapi -- cscli bouncers add traefik-plugin -o raw
  bouncerKey: ""

  # Proxies whose X-Forwarded-For the PLUGIN believes. Distinct from
  # forwardedHeaders.trustedIPs above, which is what TRAEFIK believes: the
  # plugin does its own client-IP resolution and has its own trust list, so
  # setting one and not the other means the bouncer buckets every request under
  # an internal hop and bans the tunnel the first time anything trips.
  # Same two CIDRs, for the same reason.
  forwardedHeadersTrustedIPs:
    - 10.42.0.0/16
    - 192.168.4.0/24

  # Clients that bypass the bouncer entirely, before any cache or LAPI lookup.
  #
  # This is deliberately redundant with the whitelist parser in infra/crowdsec:
  # that one stops our own traffic ever BECOMING a decision, this one stops a
  # decision ever being APPLIED to us. Two independent mechanisms, because the
  # failure this guards against — locking ourselves out of every service at
  # once — is the expensive one, and a whitelist that only exists on the
  # detection side is one config error away from not existing.
  clientTrustedIPs:
    - 10.42.0.0/16
    - 10.43.0.0/16
    - 192.168.4.0/24
    - 100.64.0.0/10

# NOT configured here, deliberately:
#   * The dashboard (`--api.dashboard=true` is on, but the `traefik` entrypoint
#     is absent from the LoadBalancer Service, so it is unreachable from
#     outside). Leave it that way.
#   * Prometheus metrics: k3s already passes --metrics.prometheus=true on the
#     `metrics` entrypoint (:9100). infra/alloy scrapes the pod IP directly, so
#     that port never needs to reach the Service or the LoadBalancer.
