apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudflared.fullname" . }}
  labels:
    {{- include "cloudflared.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudflared.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "cloudflared.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread connectors across nodes so a single node drain never takes the
      # tunnel fully offline. This is the claim the comment always made; as a
      # preferred podAntiAffinity it was a hint the scheduler could decline,
      # which would put both connectors on one node and make the claim false
      # with nothing reporting it. DoNotSchedule enforces it — and with 10
      # nodes and 2 replicas there is no state where that is unsatisfiable.
      #
      # matchLabelKeys scopes the skew to one pod-template-hash so a rollout
      # spreads the incoming ReplicaSet against itself rather than stalling
      # against the pods it is replacing.
      #
      # No preStop sleep here, unlike the ingress-facing pods: nothing routes to
      # this via a Service. cloudflared dials out and the edge decides what to
      # send it, so the drain that matters is the one cloudflared performs
      # itself on SIGTERM — it unregisters from the edge and lets in-flight
      # requests finish. The grace period is what has to be long enough for
      # that; 30s is cloudflared's own default drain window, and cutting it
      # short is what turns a rollout into a handful of edge-side 502s.
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "cloudflared.selectorLabels" . | nindent 14 }}
      containers:
        - name: cloudflared
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Outbound-only: cloudflared dials Cloudflare's edge and holds it open.
          # The public-hostname routing is delivered by Cloudflare via the token
          # (dashboard-managed tunnel), so there is no local config to mount.
          args:
            - tunnel
            - --no-autoupdate
            # Surface the connector's health on a port we can probe.
            - --metrics=0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudflared.fullname" . }}
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
