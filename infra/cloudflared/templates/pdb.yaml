{{/*
Bounds voluntary disruption (drains, not crashes). Both connectors going at once
takes every diemer.codes and talaria.deals hostname offline until one comes
back — the DuckDNS ingress path is unaffected, so this is a partial outage, but
it is the only path for the hostnames Cloudflare fronts.

Gated on replicaCount > 1 deliberately: minAvailable: 1 against a single replica
is unsatisfiable by evicting it, so the drain blocks indefinitely rather than
failing. Scaling down has to take the PDB with it.
*/}}
{{- if gt (int .Values.replicaCount) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cloudflared.fullname" . }}
  labels:
    {{- include "cloudflared.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "cloudflared.selectorLabels" . | nindent 6 }}
{{- end }}
