apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cdi-boundary
  namespace: cdi
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        {{- range .Values.apiAddresses }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cdi-apiserver-ingress
  namespace: cdi
spec:
  podSelector:
    matchLabels: {cdi.kubevirt.io: cdi-apiserver}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.controlPlaneSources }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {port: 8443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cdi-uploadproxy-targets
  namespace: cdi
spec:
  podSelector:
    matchLabels: {cdi.kubevirt.io: cdi-uploadproxy}
  policyTypes: [Egress]
  egress:
    # Upload clients use authenticated kubectl port-forward, not pod ingress.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: dev}
          podSelector:
            matchLabels: {cdi.kubevirt.io: cdi-upload-server}
      ports:
        - {port: 8443, protocol: TCP}
