{{- range $namespace := list "renovate" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shared-infrastructure-boundary
  namespace: {{ $namespace }}
spec:
  # Dedicated namespaces: also covers future Jobs and unlabeled pods.
  podSelector: {}
  policyTypes:
    - Egress
    {{- if eq $namespace "renovate" }}
    - Ingress
  ingress: []
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{ toJson $.Values.publicExclusions }}
      ports:
        - {port: 80, protocol: TCP}
        - {port: 443, protocol: TCP}
{{- end }}
