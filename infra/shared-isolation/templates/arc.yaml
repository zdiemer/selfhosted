apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shared-infrastructure-boundary
  namespace: arc-systems
spec:
  # ARC listeners live here alongside the controller, not in runner namespaces.
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        {{- range .Values.apiAddresses }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{ toJson .Values.publicExclusions }}
      ports:
        - {port: 443, protocol: TCP}
