{{- range $role := list "agent" "lapi" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-{{ $role }}-boundary
  namespace: crowdsec
spec:
  # Backup and maintenance Jobs have separate dependencies and are not selected.
  podSelector:
    matchLabels: {k8s-app: crowdsec, type: {{ $role }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: alloy}
          podSelector:
            matchLabels: {app.kubernetes.io/name: alloy, app.kubernetes.io/instance: alloy}
      ports:
        - {port: 6060, protocol: TCP}
    {{- if eq $role "lapi" }}
    - from:
        - podSelector:
            matchLabels: {k8s-app: crowdsec, type: agent}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: infra}
          podSelector:
            matchLabels: {app.kubernetes.io/name: cluster-status}
      ports:
        - {port: 8080, protocol: TCP}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{ toJson $.Values.publicExclusions }}
      ports:
        - {port: 443, protocol: TCP}
    {{- if eq $role "agent" }}
    - to:
        - podSelector:
            matchLabels: {k8s-app: crowdsec, type: lapi}
      ports:
        - {port: 8080, protocol: TCP}
    {{- else }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: infra}
          podSelector:
            matchLabels: {app.kubernetes.io/name: sms-relay}
      ports:
        - {port: 8000, protocol: TCP}
    {{- end }}
{{- end }}
