apiVersion: v2
name: egress-proxy
description: The cluster's single egress choke point — a CONNECT-only forward proxy that services opt into, so outbound traffic is attributable, measurable and movable off the home address
type: application
version: 1.0.0
# Tracks the Canonical-maintained squid image in values.yaml. Note that the tag
# and the binary disagree: ubuntu/squid:6.6-24.04_edge currently ships Squid
# 6.14. Canonical publishes no `_stable` tags at all — the 24.04 track is
# `_edge` — so read the real version back rather than trusting the tag:
#   kubectl -n infra exec deploy/egress-proxy -- squid -v | head -1
appVersion: "6.14"
maintainers:
  - name: zachd
