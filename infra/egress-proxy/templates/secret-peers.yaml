{{/*
The cache_peer declarations, in a Secret because each carries
`login=user:password` on the same line as its hostname and there is no way to
reference a Secret from inside a squid directive.

ALWAYS rendered, even with no peers: squid's `include` fails hard on a missing
file, so an empty lane set still needs a peers.conf that exists and says nothing.

Only the DECLARATIONS live here. The matching `cache_peer_access ... deny all`
closing rules are emitted at the end of squid.conf instead, because
cache_peer_access is first-match-wins and a deny placed here — before the
client section that allows specific services — would deny every peer to
everyone.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "egress-proxy.fullname" . }}-peers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "egress-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  peers.conf: |
    # Managed by the egress-proxy Helm chart. Included by squid.conf.
    {{- $anyPeer := false }}
    {{- range $laneName, $lane := .Values.lanes }}
    {{- if and (eq $lane.kind "parent") $lane.enabled }}
    {{- range $peer := $lane.peers }}
    {{- if $peer.host }}
    {{- $anyPeer = true }}
    {{- $login := index $.Values.peerLogins $peer.name | default dict }}
    {{- /* Peer names must be unique across the whole config, so they are the
           peer's own name, not the lane's — a round-robin lane has several. */}}
    {{- $opts := list "no-query" (printf "name=%s" $peer.name) }}
    {{- if $login.username }}{{ $opts = append $opts (printf "login=%s:%s" $login.username $login.password) }}{{ end }}
    {{- if $lane.tls }}{{ $opts = append $opts "tls" }}{{ $opts = append $opts (printf "tls-domain=%s" $peer.host) }}{{ end }}
    {{- if $lane.roundRobin }}{{ $opts = append $opts "round-robin" }}{{ end }}
    cache_peer {{ $peer.host }} parent {{ $peer.port }} 0 {{ join " " $opts }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if not $anyPeer }}
    # No parent lanes are enabled. Every client is on `direct`, which exits from
    # whichever node the pod lands on — that is, from the house.
    {{- end }}
