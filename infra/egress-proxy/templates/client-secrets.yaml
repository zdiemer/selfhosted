{{/*
One Secret per client, rendered INTO THAT CLIENT'S NAMESPACE.

A secretKeyRef cannot cross namespaces, so the alternative is every consuming
chart carrying its own copy of a credential this release owns. infra/duckdns
already establishes the pattern — it renders its token Secret into both `infra`
and `kube-system` from one release.

The name is fixed (`egress-proxy-client`) rather than derived from the release,
so a consuming chart references a constant and never needs to know what this
release is called.

WHAT A CONSUMER DOES WITH `url` DEPENDS ON THE CLIENT, and getting that wrong is
a real bug rather than a style choice — see the egress.proxy.mode contract.
discord/smitele-bot in particular must NOT receive this as HTTP_PROXY: it sets
trust_env=False deliberately, because curl_cffi reads HTTPS_PROXY on its own and
Camoufox does not, so an environment-set proxy sends the crawl through one
address while the clearance cookie was minted at another.
*/}}
{{- range .Values.clients }}
{{- $pw := index $.Values.clientPasswords .name | default "" }}
{{- if not $pw }}
{{- fail (printf "client %q has no password. Add it under clientPasswords in values.local.yaml (upgrade.sh generates one for you)." .name) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: egress-proxy-client
  namespace: {{ .namespace }}
  labels:
    {{- include "egress-proxy.labels" $ | nindent 4 }}
  {{- $client := . }}
  {{- $lanes := include "egress-proxy.clientLanes" (dict "root" $ "client" $client) | fromYamlArray }}
  annotations:
    egress.zachd/lanes: {{ join "," $lanes | quote }}
    egress.zachd/client: {{ .name | quote }}
type: Opaque
stringData:
  # The preferred exit. A consumer that only understands one proxy uses this and
  # behaves exactly as it did before lanes became a list.
  url: {{ include "egress-proxy.clientUrl" (dict "root" $ "client" $client) | quote }}
  # EVERY lane this client may use, in preference order, comma-separated.
  #
  # For a consumer that can move between exits — smitele-bot walks this when
  # tracker.gg bans an address — this is the whole list. It is safe to walk
  # precisely because each lane has its own port: the app keys its Cloudflare
  # clearance on scheme://host:port, so every entry here is a distinct bucket
  # with its own cookie and its own daily solve budget. Sharing a port would
  # turn this list into a 403 storm rather than a rotation.
  {{- $urls := list }}
  {{- range $lane := $lanes }}
  {{- $urls = append $urls (include "egress-proxy.laneUrl" (dict "root" $ "client" $client "lane" $lane)) }}
  {{- end }}
  urls: {{ join "," $urls | quote }}
  # Split form, for consumers that build their own URL or need the parts
  # separately (Playwright's proxy object rejects inline user:pass@host).
  # Refers to the preferred lane.
  host: {{ printf "%s.%s.svc.cluster.local" (include "egress-proxy.fullname" $) $.Release.Namespace | quote }}
  port: {{ include "egress-proxy.lanePort" (dict "root" $ "client" $client "lane" (first $lanes)) | quote }}
  username: {{ .name | quote }}
  password: {{ $pw | quote }}
{{- end }}
