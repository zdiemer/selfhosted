apiVersion: v1
kind: Service
metadata:
  name: {{ include "egress-proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "egress-proxy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "egress-proxy.selectorLabels" . | nindent 4 }}
  ports:
    {{- /* One port per active lane — the port is how a client selects its exit. */}}
    {{- range $laneName, $lane := (include "egress-proxy.activeLanes" . | fromYaml) }}
    - name: lane-{{ $laneName | trunc 10 | trimSuffix "-" }}
      port: {{ $lane.port }}
      targetPort: {{ $lane.port }}
      protocol: TCP
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "egress-proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "egress-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "egress-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "egress-proxy.labels" . | nindent 8 }}
      annotations:
        # Squid reads its config once at start. Without these a config change
        # applies cleanly, reports success, and changes nothing until something
        # unrelated happens to restart the pod.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-squid.yaml") . | sha256sum }}
        checksum/peers: {{ include (print $.Template.BasePath "/secret-peers.yaml") . | sha256sum }}
    spec:
      # On the critical path for every opted-in service: if this is evicted,
      # their egress stops. Not platform-core — it holds no state, and a restart
      # costs a reconnect rather than a recovery.
      priorityClassName: platform-app
      # replicaCount is 2 for availability, but until this block existed nothing
      # made the scheduler honour that: both squids could sit on one node, and a
      # single drain took the cluster's whole egress path with it. The other
      # two-replica charts at least had a soft podAntiAffinity; this one — the
      # egress choke point — had nothing.
      #
      # DoNotSchedule rather than ScheduleAnyway: with 9 nodes and 2 replicas
      # there is no plausible state where "spread these two" is unsatisfiable,
      # so a soft preference here only buys the chance to silently not apply.
      #
      # matchLabelKeys scopes the skew calculation to one pod-template-hash, so
      # during a rollout the incoming ReplicaSet is spread among its own pods
      # rather than against the outgoing ones. Without it the surge pod counts
      # against the old pods' placement and can find every node "full", which
      # turns DoNotSchedule into a stuck rollout.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "egress-proxy.selectorLabels" . | nindent 14 }}
      securityContext:
        runAsNonRoot: true
        # uid 13 is `proxy` in the Ubuntu image, and owns /var/log/squid and
        # /var/spool/squid there.
        runAsUser: 13
        runAsGroup: 13
        fsGroup: 13
      # Longer than the web tier's 30s: squid's own shutdown gives in-flight
      # tunnels time to finish before it exits, and a CONNECT tunnel carrying a
      # long scrape or an upload is exactly the traffic that should not be cut
      # mid-request. Covers the preStop sleep on top of that.
      terminationGracePeriodSeconds: 45
      containers:
        - name: squid
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Deliberately NOT the image's entrypoint. That script regenerates a
          # snakeoil TLS cert (needs a writable /etc/ssl/private and root) and
          # tails four log files into stdout to work around file-based logging
          # — neither of which applies here: there is no TLS termination, and
          # the config already logs to stdio. Invoking squid directly keeps the
          # container non-root with a read-only root filesystem.
          command: ["/usr/sbin/squid"]
          args: ["-N", "-f", "/etc/squid/squid.conf"]
          # Clients reach this through a ClusterIP Service, so endpoint removal
          # races SIGTERM the same way it does for an ingress-facing pod: a
          # service can open a CONNECT tunnel to a squid that is already
          # shutting down, and it surfaces as a failed outbound request in the
          # client rather than as anything visible here. Hold the container open
          # while the Endpoints update propagates.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            {{- range $laneName, $lane := (include "egress-proxy.activeLanes" . | fromYaml) }}
            - name: lane-{{ $laneName | trunc 10 | trimSuffix "-" }}
              containerPort: {{ $lane.port }}
              protocol: TCP
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- $hexes := list }}
          {{- range $laneName, $lane := (include "egress-proxy.activeLanes" . | fromYaml) }}
          {{- $hexes = append $hexes (printf "%04X" (int $lane.port)) }}
          {{- end }}
          {{- $portHexes := join " " (sortAlpha $hexes) }}
          # THE PROBE DOES NOT CONNECT TO THE PROXY. It reads the kernel's
          # socket table and asserts that something is bound to EVERY lane's
          # port in LISTEN state (0A) — the same fact a tcpSocket probe
          # establishes, without opening a client connection. Checking every
          # lane matters: a single lane failing to bind would otherwise leave
          # the pod Ready while one exit silently refused connections.
          #
          # That matters because squid logs every probe connection as an
          # aborted transaction (`url=error:transaction-end-before-headers`),
          # roughly 17k lines a day across two pods, and none of squid's
          # access_log ACLs will suppress them: `method NONE` is evaluated in a
          # context with no HTTP request, so squid warns and logs the line
          # anyway (adding a second noise line per probe), and filtering on
          # `src` does not take either. Not generating the transaction is the
          # only thing that actually works.
          #
          # Not an HTTP probe for a separate reason: every request needs
          # credentials, so an unauthenticated probe would read its own 407 as
          # a failure.
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - >-
                  for h in {{ $portHexes }}; do
                  awk -v p=":$h\$" '$4=="0A" && $2 ~ p {f=1} END{exit !f}'
                  /proc/net/tcp6 /proc/net/tcp || exit 1; done
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - >-
                  for h in {{ $portHexes }}; do
                  awk -v p=":$h\$" '$4=="0A" && $2 ~ p {f=1} END{exit !f}'
                  /proc/net/tcp6 /proc/net/tcp || exit 1; done
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
              readOnly: true
            - name: peers
              mountPath: /etc/squid/peers
              readOnly: true
            - name: auth
              mountPath: /etc/squid/secret
              readOnly: true
            - name: spool
              mountPath: /var/spool/squid
            - name: logs
              mountPath: /var/log/squid
            - name: run
              mountPath: /var/run/squid
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "egress-proxy.fullname" . }}
        - name: peers
          secret:
            secretName: {{ include "egress-proxy.fullname" . }}-peers
        - name: auth
          secret:
            # Built by upgrade.sh, not by Helm: the htpasswd entries need a
            # hash function no template has, and regenerating them on every
            # render would churn the Secret on every upgrade.
            secretName: {{ include "egress-proxy.fullname" . }}-auth
        # Squid wants these writable even with no cache_dir configured, and the
        # root filesystem is read-only.
        - name: spool
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: run
          emptyDir: {}
