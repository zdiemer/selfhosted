#!/usr/sbin/nft -f
# Firewall for the cluster's egress exit. Written by bootstrap.sh.
#
# DEFENCE IN DEPTH, NOT THE CONTROL. Proxy auth in squid.conf is what actually
# keeps this from being an open relay. This narrows who can even try.
#
# FAILS CLOSED BY CONSTRUCTION. The `home_v4` set starts EMPTY and is filled by
# egress-allow-home from DNS. If that lookup breaks, the set stays as it was and
# eventually admits nobody — the cluster loses its exit, which is loud. It never
# widens on failure, which is the property that matters for a rule whose job is
# to keep strangers out.

# SCOPED RESET, NOT `flush ruleset`. This file used to open with `flush ruleset`,
# which wipes EVERY table in the kernel — not just ours.
#
# That was harmless while this box ran one firewall. It stopped being harmless
# the moment CrowdSec's firewall bouncer arrived: the bouncer maintains its own
# `crowdsec`/`crowdsec6` tables holding the live ban set, and `flush ruleset`
# deletes them along with everything else. Every `systemctl restart nftables` —
# including a plain re-run of bootstrap.sh, and every reboot — would silently
# unban every address the bouncer had blocked, and leave it unbanned until the
# bouncer next resynced. A security control that quietly empties itself on
# restart is worse than not having it, because the dashboard still says it is on.
#
# `table inet egress` before `delete` is not redundant: delete fails on a table
# that does not exist, which would break the very first run. Declaring it first
# makes the delete idempotent — a documented nft idiom for exactly this.
table inet egress
delete table inet egress

table inet egress {
    # The house, by current address. Refreshed every 5 minutes from DuckDNS,
    # because a residential address changes without warning and the cluster
    # would otherwise be locked out until someone noticed.
    set home_v4 {
        type ipv4_addr
        flags interval
    }
    set home_v6 {
        type ipv6_addr
        flags interval
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif lo accept

        # ICMP, so path MTU discovery works and the box is diagnosable.
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 accept

        # SSH stays open to the world deliberately: locking it to the same DDNS
        # set would mean a failed lookup plus a changed home address locks you
        # out of the box entirely, with no console on most cheap providers. Use
        # keys and disable password auth instead.
        #
        # THE TAILNET PATH IS EXEMPT AND MUST STAY FIRST. Tailscale SSH answers
        # on this port over tailscale0 (the banner is literally SSH-2.0-Tailscale),
        # and it is the recovery path when a rule below turns out to be wrong.
        # Rate-limiting your own way back in is how a hardening change becomes an
        # incident, so this rule is unmetered and precedes the metered one.
        iifname "tailscale0" tcp dport @SSH_PORT@ accept

        # Public SSH, metered. This does not replace keys-only auth — it blunts
        # the volume. A box with a public :22 sees thousands of credential-
        # stuffing attempts a day; each one costs a TCP handshake, an sshd fork
        # and a journald line, and that noise is also what buries a real signal.
        #
        # 10/minute with a burst of 5 is far above any human's reconnect rate and
        # far below a scanner's. `ct state new` so only connection attempts
        # count, never established sessions — a long-running session is one
        # `new` packet no matter how much it transfers.
        #
        # Two meters, not one: `ip saddr` and `ip6 saddr` are different
        # selectors, and a single meter cannot key on both. A v4-only meter would
        # leave IPv6 unmetered, which is the half an attacker would find.
        #
        # `timeout 5m` bounds meter growth. Without it every source address that
        # ever knocked stays resident, which is a slow memory leak on a box whose
        # whole appeal is that it is small.
        tcp dport @SSH_PORT@ ct state new meter ssh4 { ip saddr timeout 5m limit rate over 10/minute burst 5 packets } drop
        tcp dport @SSH_PORT@ ct state new meter ssh6 { ip6 saddr timeout 5m limit rate over 10/minute burst 5 packets } drop
        tcp dport @SSH_PORT@ accept

        # The proxy, over the tailnet. This is the preferred path: WireGuard
        # encrypts the whole hop, so the proxy credential and the CONNECT target
        # hostnames stop crossing the ISP in cleartext — which they otherwise do
        # on every request, because squid's own cache_peer TLS does not work
        # against this box (see README).
        #
        # Matched on the INTERFACE, not on 100.64.0.0/10: a source CIDR can be
        # spoofed from the public side, an arrival on tailscale0 cannot.
        # `iifname` rather than `iif` so the ruleset still loads when tailscaled
        # is not running and the interface does not exist.
        iifname "tailscale0" tcp dport @PROXY_PORT@ accept

        # The proxy, from the house over the public internet. Only rendered when
        # PUBLIC_FALLBACK=true, which is the posture for a box that is NOT on
        # the tailnet.
        #
        # Turning it off is the point of the tailnet path: with no public
        # listener, the proxy credential that crosses the ISP in cleartext has
        # nothing to be replayed against, and the "residential address changed
        # and locked the cluster out" failure mode disappears with it.
        @PUBLIC_FALLBACK_V4@
        @PUBLIC_FALLBACK_V6@

        # The Minecraft relay (haproxy on this box, forwarding over the
        # tailnet to the cluster). Public by necessity — game clients can't
        # authenticate to a firewall — and only rendered when MC_RELAY=true.
        # The Minecraft server's own whitelist is the access control.
        #
        # WHY A METER IN FRONT OF IT. The whitelist is an APPLICATION control:
        # it decides who may play, after the connection has crossed this box,
        # traversed WireGuard to a cluster node, and woken a JVM that autopauses
        # when idle. None of that is free, and none of it is reached by rejecting
        # the connection here. A trivial connect-loop against :25565 is both a
        # bandwidth amplifier over the tailnet and a way to keep the server
        # permanently awake — the whitelist stops none of it.
        #
        # 30/minute burst 20 is shaped for how Minecraft clients actually behave:
        # the server list pings every server on the screen on open, and a player
        # rage-reconnecting still sits far under it. haproxy has its own
        # stick-table limit for what gets past this (see the .cfg template) —
        # this is the cheap kernel-level floor, that is the connection-aware one.
        @MC_@tcp dport 25565 ct state new meter mc4 { ip saddr timeout 5m limit rate over 30/minute burst 20 packets } drop
        @MC_@tcp dport 25565 ct state new meter mc6 { ip6 saddr timeout 5m limit rate over 30/minute burst 20 packets } drop
        @MC_@tcp dport 25565 accept

        # The media lane (Caddy on this box: HTTPS for jellyfin.diemer.codes,
        # reverse-proxied over the tailnet). 80 is needed for the ACME HTTP
        # challenge and the http->https redirect; 443 is the service. Only
        # rendered when MEDIA_RELAY=true. Jellyfin's own accounts are the auth.
        #
        # DELIBERATELY SLACK, and it has to be. This lane carries video: a
        # Jellyfin client opens many parallel connections for a single stream,
        # a seek storm opens more, and a household watching on three devices is
        # a genuinely busy source from one WAN address. 240/minute burst 120 is
        # roughly two new connections a second sustained per source, which no
        # viewer reaches and which still costs a flooder three orders of
        # magnitude more than it costs this box.
        #
        # This is the ONLY limiter on this lane — Caddy has no rate limiting in
        # the standard build (it needs a plugin, and this box runs the stock
        # package). CrowdSec is what adds behavioural blocking on top; see the
        # crowdsec section of bootstrap.sh.
        @MEDIA_@tcp dport { 80, 443 } ct state new meter web4 { ip saddr timeout 5m limit rate over 240/minute burst 120 packets } drop
        @MEDIA_@tcp dport { 80, 443 } ct state new meter web6 { ip6 saddr timeout 5m limit rate over 240/minute burst 120 packets } drop
        @MEDIA_@tcp dport { 80, 443 } accept

        # The TURN lane (coturn on this box), for games/cloud-game. WebRTC media
        # cannot cross the Cloudflare tunnel — cloudflared proxies HTTP origins
        # and there is no inbound UDP path — so internet players relay here
        # instead. Only rendered when TURN_RELAY=true. coturn's own long-term
        # credential is the auth; this lane is the usual defence in depth.
        #
        # NO RATE METER, on purpose. The other lanes meter NEW connections, a
        # thing UDP does not have: every media packet is `ct state new` or close
        # to it, so a meter here would throttle a working game, not an attacker.
        # The abuse bounds that do apply are coturn's own — user-quota,
        # total-quota and max-bps in /etc/turnserver.conf — which are expressed
        # in allocations and bandwidth, the units that actually mean something
        # for a relay.
        #
        # 3478 is the control port (allocate/permission); the wide range is the
        # relay ports, one UDP port per allocation, and must match min-port /
        # max-port in /etc/turnserver.conf.
        @TURN_@udp dport 3478 accept
        @TURN_@udp dport 49152-49500 accept

        # Everything else is dropped rather than rejected, so a scanner learns
        # nothing about which ports exist.
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;

        # ------------------------------------------------------------------
        # WHAT THIS BOX MAY REACH ON THE TAILNET
        # ------------------------------------------------------------------
        # Outbound to the internet stays wide open (policy accept) — this is a
        # forward proxy, so "everywhere" is the job. The tailnet is different.
        #
        # THE ASYMMETRY THIS FIXES. The input chain is careful about who may
        # reach this box. Nothing was ever careful about what this box may
        # reach, and it sits on a tailnet that also carries ten cluster nodes,
        # the NAS, and every personal device. It is simultaneously the most
        # exposed machine in the estate — a public IP running sshd, a public
        # HTTPS listener and a public game port — and, until this rule, one with
        # unrestricted L3 access to all of them. Tailscale SSH's own auth is a
        # real control for logging IN to a node; it does nothing about this box
        # opening :6443 on the API server, or :445 on the NAS.
        #
        # WHAT IT LEGITIMATELY NEEDS, and it is a short list:
        #   25565  haproxy, to whichever node holds the Minecraft pod
        #   30096  Caddy, to the jellyfin-lan NodePort
        # That is all. squid resolves and dials PUBLIC addresses; CrowdSec talks
        # to its own LAPI on loopback; the DuckDNS refresh and ACME both go out
        # over the internet. Nothing else here has business inside the tailnet.
        #
        # ESTABLISHED FIRST, and it is load-bearing: inbound Tailscale SSH is
        # answered from this chain, so without it the reply packets to your own
        # session would be dropped and this rule would lock you out of the box
        # it is protecting.
        ct state established,related accept

        # ICMP to the tailnet stays, so `tailscale ping` and path MTU still work
        # and the box remains diagnosable from here.
        oifname "tailscale0" ip protocol icmp accept
        oifname "tailscale0" ip6 nexthdr ipv6-icmp accept

        # The two relay lanes, and nothing else.
        oifname "tailscale0" tcp dport { 25565, 30096 } accept

        # Everything else into the tailnet is dropped. Matched on the INTERFACE
        # rather than on 100.64.0.0/10 for the same reason the input chain does:
        # the interface is what the packet actually left through, and it cannot
        # be arranged by an attacker who has landed on this box.
        oifname "tailscale0" drop
    }
}
