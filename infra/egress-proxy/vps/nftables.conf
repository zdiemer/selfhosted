#!/usr/sbin/nft -f
# Firewall for the cluster's egress exit. Written by bootstrap.sh.
#
# DEFENCE IN DEPTH, NOT THE CONTROL. Proxy auth in squid.conf is what actually
# keeps this from being an open relay. This narrows who can even try.
#
# FAILS CLOSED BY CONSTRUCTION. The `home_v4` set starts EMPTY and is filled by
# egress-allow-home from DNS. If that lookup breaks, the set stays as it was and
# eventually admits nobody — the cluster loses its exit, which is loud. It never
# widens on failure, which is the property that matters for a rule whose job is
# to keep strangers out.

flush ruleset

table inet egress {
    # The house, by current address. Refreshed every 5 minutes from DuckDNS,
    # because a residential address changes without warning and the cluster
    # would otherwise be locked out until someone noticed.
    set home_v4 {
        type ipv4_addr
        flags interval
    }
    set home_v6 {
        type ipv6_addr
        flags interval
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif lo accept

        # ICMP, so path MTU discovery works and the box is diagnosable.
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 accept

        # SSH stays open to the world deliberately: locking it to the same DDNS
        # set would mean a failed lookup plus a changed home address locks you
        # out of the box entirely, with no console on most cheap providers. Use
        # keys and disable password auth instead.
        tcp dport @SSH_PORT@ accept

        # The proxy, over the tailnet. This is the preferred path: WireGuard
        # encrypts the whole hop, so the proxy credential and the CONNECT target
        # hostnames stop crossing the ISP in cleartext — which they otherwise do
        # on every request, because squid's own cache_peer TLS does not work
        # against this box (see README).
        #
        # Matched on the INTERFACE, not on 100.64.0.0/10: a source CIDR can be
        # spoofed from the public side, an arrival on tailscale0 cannot.
        # `iifname` rather than `iif` so the ruleset still loads when tailscaled
        # is not running and the interface does not exist.
        iifname "tailscale0" tcp dport @PROXY_PORT@ accept

        # The proxy, from the house over the public internet. Only rendered when
        # PUBLIC_FALLBACK=true, which is the posture for a box that is NOT on
        # the tailnet.
        #
        # Turning it off is the point of the tailnet path: with no public
        # listener, the proxy credential that crosses the ISP in cleartext has
        # nothing to be replayed against, and the "residential address changed
        # and locked the cluster out" failure mode disappears with it.
        @PUBLIC_FALLBACK_V4@
        @PUBLIC_FALLBACK_V6@

        # Everything else is dropped rather than rejected, so a scanner learns
        # nothing about which ports exist.
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
