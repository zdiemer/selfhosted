{{- if .Values.dns.loadBalancer }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "adguard.fullname" . }}-dns
  labels:
    {{- include "adguard.labels" . | nindent 4 }}
spec:
  # See values.yaml dns: why LoadBalancer, and why no source ranges.
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    {{- include "adguard.selectorLabels" . | nindent 4 }}
  ports:
    - { name: dns-udp, port: {{ .Values.dns.servicePort }}, targetPort: dns-udp, protocol: UDP }
    - { name: dns-tcp, port: {{ .Values.dns.servicePort }}, targetPort: dns-tcp, protocol: TCP }
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "adguard.fullname" . }}
  labels:
    {{- include "adguard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "adguard.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
