{{- if not .Values.render }}
{{/*
The PAT every scale set registers with. ARC reads the key `github_token`
from a Secret named in each scale set's githubConfigSecret — one Secret, in
the runners namespace, shared by all of them.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: actions-runner-github
  labels:
    {{- include "actions-runner.labels" . | nindent 4 }}
type: Opaque
stringData:
  github_token: {{ required "github.token required in values.local.yaml" .Values.github.token | quote }}
{{- end }}
