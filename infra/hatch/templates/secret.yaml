{{/*
No `required`/`fail` guards here, unlike carson — and that is a deliberate
trade, not an oversight.

A chart whose templates cannot render from tracked values alone drops out of
scripts/ci-lint-charts.sh (via TEMPLATE_SKIP) AND, silently, out of
scripts/ci-lint-availability.sh, which does `helm template ... || { skipped++;
continue; }`. This is the chart with two replicas, a PDB, a spread constraint
and a preStop hook — precisely what that lint exists to check.

So the fail-closed check lives in the application instead: main.py exits
non-zero when HATCH_API_KEYS is empty or unparseable, which CrashLoops a
keyless release without it ever answering a request. upgrade.sh's sv_has gate
catches it before helm even runs.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hatch.fullname" . }}
  labels:
    {{- include "hatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  HATCH_API_KEYS: {{ .Values.secrets.apiKeys | quote }}
  HATCH_GRAFANA_TOKEN: {{ .Values.secrets.grafanaToken | quote }}
