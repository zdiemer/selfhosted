{{- if .Values.imageCredentials.pat }}
{{/*
Only rendered when a PAT is supplied. The GHCR package is public today, so this
is normally absent — kept so making the package private is a values edit.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hatch.fullname" . }}-registry
  labels:
    {{- include "hatch.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .Values.imageCredentials.registry .Values.imageCredentials.username .Values.imageCredentials.pat (printf "%s:%s" .Values.imageCredentials.username .Values.imageCredentials.pat | b64enc) | b64enc }}
{{- end }}
