# Ingress conventions, enforced by the API server rather than by memory.
#
# WHY THIS EXISTS. Most of this cluster's ingress comes from charts in this
# repo, which all copy the same annotation block. But not all of it: whatnowgg
# deploys its dev environment here from a separate private repo and redeploys
# every few hours, talaria's chart lives in another repo entirely, and money is
# a submodule that isn't even checked out. A convention those charts can't see
# is a convention that drifts.
#
# It already had. whatnowgg's Ingress carried no TLS annotations and no
# entrypoint pin at all, so Traefik served it with its own self-signed
# certificate and bound the router to every entrypoint. Nothing alerted; it just
# quietly looked broken to anyone who visited. That is exactly the failure this
# policy makes impossible to reintroduce — including by a repo that never reads
# this one.
#
# WHY ValidatingAdmissionPolicy AND NOT KYVERNO. This is three CEL expressions.
# VAP is built into the API server (GA since 1.30, and this cluster is on
# v1.34.3), so it costs no pods, no webhook, no certificate rotation, and no new
# failure mode in the admission path. A webhook-based policy engine that is down
# either blocks every write or silently permits everything; a VAP cannot be
# down, because it is the API server.

# The three rules. Each maps to one CEL expression in the policy template.
rules:
  # 1. Route through Traefik explicitly. An Ingress with no ingressClassName
  #    depends on whatever the cluster's default IngressClass happens to be,
  #    which is invisible in the manifest and can change under you.
  requireIngressClass:
    enabled: true
    className: traefik

  # 2. Pin the router to the TLS entrypoint. Without this annotation Traefik
  #    binds the router to every non-internal entrypoint, so the host answers on
  #    plain :80 as well as :443 — which is how whatnowgg spent its first weeks.
  requireEntrypoint:
    enabled: true
    entrypoint: websecure

  # 3. Require that the host gets a real certificate rather than Traefik's
  #    self-signed default. There are now three ways to satisfy that, and the
  #    third is new:
  #
  #      a. a certresolver annotation — how it worked when Traefik ran ACME
  #         itself. Nothing in this repo does this any more, but the rule still
  #         accepts it so a chart from another repo is not broken by our change;
  #      b. the edge-termination annotation below, for Cloudflare-fronted hosts;
  #      c. `router.tls: "true"` alone, which is now sufficient because
  #         infra/traefik sets a cluster-wide default certificate (the wildcard
  #         maintained by infra/traefik-certs) via a TLSStore. Any router on
  #         `websecure` picks it up without naming anything.
  #
  #    Without (c) this rule would flag all 26 Ingresses the moment they dropped
  #    their certresolver annotations — turning the signal it exists to provide
  #    into noise everyone learns to ignore.
  requireCertResolver:
    enabled: true
    # The annotation that satisfies (c). Kept as a value rather than hardcoded
    # because it is the same key rule 2 pins, and they must not drift.
    tlsAnnotation: traefik.ingress.kubernetes.io/router.tls

# THE ONE LEGITIMATE EXEMPTION from rule 3.
#
# Hosts published through the Cloudflare tunnel terminate TLS at Cloudflare's
# edge. The tunnel then dials Traefik with "No TLS Verify" on, so the
# certificate Traefik presents is never validated — the tunnel is the trust
# boundary. Asking the `duckdns` resolver for a `talaria.deals` cert would not
# merely be pointless, it would FAIL: DNS-01 can only answer for the duckdns.org
# zone, and one failing domain can take the whole ACME order down, wildcard
# included.
#
# So those ingresses genuinely must not name a certresolver. They opt out
# explicitly, by annotation, rather than by being quietly skipped — the
# distinction between "deliberately edge-terminated" and "someone forgot" is the
# entire point of the rule.
edgeTlsAnnotation: ingress.zachd/tls-terminates-at-edge

# ---------------------------------------------------------------------------
# RULE 4, IN ITS OWN POLICY: is this host authenticated, or deliberately not?
# ---------------------------------------------------------------------------
# The three rules above are about how a host is SERVED — class, entrypoint,
# certificate. None of them ask the question that actually matters for a new
# Ingress: is anything in front of it?
#
# Nothing did. An Ingress could publish a service to the internet with no
# forward-auth and no note explaining why, and the cluster would accept it in
# silence — which is exactly the shape of the whatnowgg drift that created this
# chart, one layer up. 18 of the 24 live Ingresses carry no forward-auth
# middleware, and most of them are RIGHT not to: Authelia cannot sit behind
# itself, sms-relay's webhook is HMAC-signed because a phone cannot complete a
# login, Jellyfin's TV apps need the raw API, gamedex is published deliberately.
# The problem was never the absence of auth. It was that "deliberate" and
# "forgot" looked identical.
#
# So this rule does not require auth. It requires an ANSWER: either a
# forward-auth middleware, or an explicit annotation saying this host is
# unauthenticated on purpose.
#
# WHY A SEPARATE POLICY OBJECT, and not a fourth expression in the one above.
# `validationActions` lives on the BINDING and applies to every rule in the
# policy it binds. The rules above are enforcing (Deny) and have been verified
# against every live Ingress; this one would reject 18 of them today, including
# Ingresses from repos that cannot see this file — talaria, whatnowgg and the
# gamedex/smitele-bot submodules are read-only from here, so their charts cannot
# be annotated by us. Adding this as a fourth expression would silently promote
# it to Deny and break the next foreign deploy on a rule its authors never read.
#
# A second policy with its own binding is what buys the staged rollout: Warn
# while the in-repo charts get annotated and the foreign ones are chased, then
# flipped independently, exactly as the rules above were.
authPolicy:
  enabled: true

  # The annotation that says "unauthenticated, and that is the decision".
  # Same spirit as edgeTlsAnnotation above — stated, not inferred.
  publicAnnotation: ingress.zachd/public-unauthenticated

  # A middleware reference counts as authenticated when its value mentions
  # forward-auth. Deliberately a substring match rather than an exact name:
  # every chart here names its own middleware
  # (<ns>-<release>-forwardauth@kubernetescrd), so there is no single string to
  # compare against, and requiring one would mean this policy needs editing
  # every time a chart is added.
  #
  # The looseness is acceptable because of what this rule is FOR. It is not an
  # access control — Authelia is. It is a prompt to answer a question, and a
  # chart that names a forward-auth middleware has answered it.
  forwardAuthMarker: forwardauth

  binding:
    # Warn + Audit, NOT Deny. See above: 18 live Ingresses fail this today and
    # some of them live in repos this one cannot edit. Flip to Deny once
    # upgrade.sh's pre-flight reports zero failures — the same gate the rules
    # above passed through.
    validationActions:
      - Warn
      - Audit

# Namespaces the policy ignores entirely. kube-system holds objects created by
# k3s itself, which answer to upstream defaults rather than to ours.
exemptNamespaces:
  - kube-system

binding:
  # HOW FAILURES ARE HANDLED. Now ENFORCING: a non-conforming Ingress is
  # rejected at admission (Deny), and the rejection is also written to the audit
  # log (Audit). This started as Warn+Audit to avoid breaking a foreign repo's
  # deploy on a rule its authors had never read; it was flipped to Deny once
  # every live Ingress across all namespaces was verified to pass all three
  # rules (class=traefik, entrypoint=websecure, certresolver-or-edge-TLS).
  #
  # WATCH-POINT: whatnowgg redeploys its dev env here every few hours from a
  # separate repo, and its Ingress only pins the entrypoint when TLS is enabled.
  # It passes today. If a whatnowgg deploy ever starts failing admission, that
  # is this rule doing its job — not a regression here. `failurePolicy: Ignore`
  # (see the template) means a policy-evaluation error still fails open, so the
  # only thing Deny blocks is a genuine rule violation. Revert to [Warn, Audit]
  # if you need to unblock a foreign deploy in a hurry.
  validationActions:
    - Deny
    - Audit
