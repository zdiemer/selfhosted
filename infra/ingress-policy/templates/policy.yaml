{{/*
Two cluster-scoped objects: the policy (the rules) and the binding (where they
apply and how hard). They are separate on purpose — the binding's
`validationActions` is how this goes from advisory to enforcing without
touching a single rule.

CEL note: annotation keys contain dots, so they must be indexed as map keys
(`annotations['a.b/c']`), never with field selectors. Every expression guards
with `in` first, because a missing annotations map makes indexing a hard error
rather than a false.
*/}}
{{- $edge := .Values.edgeTlsAnnotation }}
{{- $ep := "traefik.ingress.kubernetes.io/router.entrypoints" }}
{{- $cr := "traefik.ingress.kubernetes.io/router.tls.certresolver" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "ingress-policy.fullname" . }}
  labels:
    {{- include "ingress-policy.labels" . | nindent 4 }}
spec:
  # Ignore rather than Fail: if a rule is ever malformed, an unevaluatable
  # policy must not become an outage that blocks every Ingress write in the
  # cluster. The rules protect against drift, which is a slow problem; being
  # unable to deploy at all is a fast one.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups:   ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["ingresses"]
  validations:
    {{- if .Values.rules.requireIngressClass.enabled }}
    - expression: >-
        has(object.spec.ingressClassName) &&
        object.spec.ingressClassName == '{{ .Values.rules.requireIngressClass.className }}'
      message: >-
        Ingress must set spec.ingressClassName: {{ .Values.rules.requireIngressClass.className }}.
        Without it the Ingress silently depends on whichever IngressClass is
        currently the cluster default.
      reason: Invalid
    {{- end }}

    {{- if .Values.rules.requireEntrypoint.enabled }}
    - expression: >-
        has(object.metadata.annotations) &&
        '{{ $ep }}' in object.metadata.annotations &&
        object.metadata.annotations['{{ $ep }}'] == '{{ .Values.rules.requireEntrypoint.entrypoint }}'
      message: >-
        Ingress must set the annotation
        {{ $ep }}: {{ .Values.rules.requireEntrypoint.entrypoint }}.
        Without it Traefik binds the router to every non-internal entrypoint, so
        the host also answers unencrypted on :80.
      reason: Invalid
    {{- end }}

    {{- if .Values.rules.requireCertResolver.enabled }}
    {{- $tls := .Values.rules.requireCertResolver.tlsAnnotation }}
    {{- /*
      Three accepted forms: a certresolver, `router.tls: "true"` (which now
      picks up the cluster-wide default certificate from infra/traefik's
      TLSStore), or an explicit statement that TLS ends at Cloudflare's edge.

      The edge exemption is an annotation rather than a namespace carve-out so
      that "deliberately edge-terminated" stays distinguishable from "someone
      forgot" — which is the whole reason the rule exists.
    */}}
    - expression: >-
        has(object.metadata.annotations) && (
          '{{ $cr }}' in object.metadata.annotations ||
          ('{{ $tls }}' in object.metadata.annotations &&
           object.metadata.annotations['{{ $tls }}'] == 'true') ||
          ('{{ $edge }}' in object.metadata.annotations &&
           object.metadata.annotations['{{ $edge }}'] == 'true')
        )
      message: >-
        Ingress must set {{ $tls }}: "true" (which picks up the cluster default
        wildcard certificate), or name a certresolver in {{ $cr }}, or declare
        {{ $edge }}: "true" if TLS deliberately terminates at the Cloudflare
        edge. Without one of those, Traefik falls back to its self-signed
        default certificate.
      reason: Invalid
    {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "ingress-policy.fullname" . }}
  labels:
    {{- include "ingress-policy.labels" . | nindent 4 }}
spec:
  policyName: {{ include "ingress-policy.fullname" . }}
  validationActions:
    {{- toYaml .Values.binding.validationActions | nindent 4 }}
  matchResources:
    {{- with .Values.exemptNamespaces }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- toYaml . | nindent 12 }}
    {{- end }}
{{- if .Values.authPolicy.enabled }}
---
{{/*
RULE 4, in its own policy object so it can be advisory while the three above
stay enforcing. See values.yaml for why that separation is load-bearing.

The question this asks is not "is this authenticated" but "did anyone decide".
A forward-auth middleware answers it one way; the public annotation answers it
the other. Silence is the only failure.
*/}}
{{- $mw := "traefik.ingress.kubernetes.io/router.middlewares" }}
{{- $pub := .Values.authPolicy.publicAnnotation }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "ingress-policy.fullname" . }}-auth
  labels:
    {{- include "ingress-policy.labels" . | nindent 4 }}
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups:   ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["ingresses"]
  validations:
    - expression: >-
        has(object.metadata.annotations) && (
          ('{{ $mw }}' in object.metadata.annotations &&
           (object.metadata.annotations['{{ $mw }}'].lowerAscii().contains('{{ .Values.authPolicy.forwardAuthMarker }}') ||
            object.metadata.annotations['{{ $mw }}'].lowerAscii().contains('{{ .Values.authPolicy.basicAuthMarker }}'))) ||
          ('{{ $pub }}' in object.metadata.annotations &&
           object.metadata.annotations['{{ $pub }}'] == 'true')
        )
      message: >-
        Ingress must either route through Authelia forward-auth or basic
        auth (a {{ $mw }} value naming a forwardauth or basicauth
        middleware), or declare
        {{ $pub }}: "true" to state that this host is deliberately
        unauthenticated. Plenty of hosts here are legitimately public — the
        point is that "deliberate" and "forgotten" must not look identical.
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "ingress-policy.fullname" . }}-auth
  labels:
    {{- include "ingress-policy.labels" . | nindent 4 }}
spec:
  policyName: {{ include "ingress-policy.fullname" . }}-auth
  validationActions:
    {{- toYaml .Values.authPolicy.binding.validationActions | nindent 4 }}
  matchResources:
    {{- with .Values.exemptNamespaces }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- toYaml . | nindent 12 }}
    {{- end }}
{{- end }}
