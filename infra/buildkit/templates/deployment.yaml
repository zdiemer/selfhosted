apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "buildkit.fullname" . }}
  labels:
    {{- include "buildkit.labels" . | nindent 4 }}
spec:
  # One RWO cache PVC → one pod; Recreate so an upgrade never has two
  # buildkitds fighting over the same snapshot store.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "buildkit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "buildkit.labels" . | nindent 8 }}
      annotations:
        checksum/seccomp: {{ .Files.Get "profiles/buildkit.json" | sha256sum }}
        checksum/apparmor: {{ .Files.Get "profiles/buildkit.apparmor" | sha256sum }}
        checksum/subids: {{ include (print $.Template.BasePath "/subids.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      hostUsers: false
      automountServiceAccountToken: false
      # Covers the preStop sleep plus letting buildkitd write out its cache
      # metadata. A build cut off mid-flight is only a failed build the caller
      # retries, but a cache left inconsistent costs every later build a rebuild
      # of layers it already had.
      terminationGracePeriodSeconds: 60
      {{- if .Values.scheduling.nodeName }}
      # nodeSelector, NOT nodeName: nodeName bypasses the scheduler, so a full
      # node means kubelet-rejected pods churning forever; a selector just Pends.
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.scheduling.nodeName }}
      {{- end }}
      initContainers:
        # Image file capabilities do not survive this nested userns setup.
        # Copy the two map helpers without xattrs, then make them setuid root
        # INSIDE the pod user namespace (never host root). Main mount is read-only.
        - name: uidmap-helpers
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: [sh, -ec, 'cp /usr/bin/newuidmap /usr/bin/newgidmap /helpers/; chmod 4755 /helpers/*']
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - name: uidmap-helpers
              mountPath: /helpers
      containers:
        - name: buildkitd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/buildkit/buildkitd.toml
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --tlscacert
            - /etc/buildkit/tls/ca.crt
            - --tlscert
            - /etc/buildkit/tls/tls.crt
            - --tlskey
            - /etc/buildkit/tls/tls.key
            - --addr
            - tcp://0.0.0.0:{{ .Values.service.port }}
          env:
            - name: PATH
              value: /opt/helpers:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            # Required to mount a fresh procfs for each RUN's PID namespace.
            # Legal only with hostUsers:false; scoped to the pod's user namespace.
            procMount: Unmasked
            capabilities:
              drop: [ALL]
              add: [SETUID, SETGID, SETFCAP]
            seccompProfile:
              type: Localhost
              localhostProfile: buildkit.json
            appArmorProfile:
              type: Localhost
              localhostProfile: buildkit
          # Endpoint removal races SIGTERM: a buildctl client can be handed this
          # pod's address while the daemon is going away, which surfaces as a
          # connection reset partway through a build.
          lifecycle:
            preStop:
              sleep:
                seconds: 3
          ports:
            - name: buildkitd
              containerPort: {{ .Values.service.port }}
          # Probes use the local Unix socket; remote clients must authenticate.
          readinessProbe:
            exec:
              command: ["buildctl", "--addr", "unix:///run/user/1000/buildkit/buildkitd.sock", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["buildctl", "--addr", "unix:///run/user/1000/buildkit/buildkitd.sock", "debug", "workers"]
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: uidmap-helpers
              mountPath: /opt/helpers
              readOnly: true
            - name: subids
              mountPath: /etc/subuid
              subPath: subuid
              readOnly: true
            - name: subids
              mountPath: /etc/subgid
              subPath: subgid
              readOnly: true
            - name: config
              mountPath: /etc/buildkit/buildkitd.toml
              subPath: buildkitd.toml
              readOnly: true
            - name: tls
              mountPath: /etc/buildkit/tls
              readOnly: true
            - name: cache
              mountPath: /home/user/.local/share/buildkit
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: uidmap-helpers
          emptyDir: {}
        - name: subids
          configMap:
            name: buildkit-subids
        - name: config
          configMap: {name: buildkit-config}
        - name: tls
          secret:
            secretName: buildkit-server-tls
        - name: cache
          {{- if .Values.cache.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.cache.claimName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
