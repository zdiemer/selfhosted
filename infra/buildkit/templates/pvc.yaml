{{- if .Values.cache.enabled }}
{{- $root := . }}
{{- range $name := list .Values.cache.claimName .Values.cache.legacyClaimName }}
{{- if $name }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "buildkit.labels" $root | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $root.Values.cache.size }}
  {{- with $root.Values.cache.storageClass }}
  # Only rendered when non-empty: an explicit `storageClassName: ""` disables
  # dynamic provisioning entirely and the PVC sits Pending forever.
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
