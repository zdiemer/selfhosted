image:
  repository: moby/buildkit
  # -rootless variant: buildkitd runs as uid 1000 inside a user namespace it
  # creates itself (rootlesskit). Keep the version in lockstep with
  # BUILDKIT_VERSION in dev/claude-workspace/Dockerfile — client/daemon are
  # compatible across a range, but pinning them equal removes doubt.
  tag: v0.32.2-rootless
  pullPolicy: IfNotPresent

service:
  # The workspace image bakes BUILDKIT_HOST=tcp://buildkitd.buildkit.svc.cluster.local:1234,
  # so the Service is named `buildkitd` (see service.yaml) and this port must
  # stay 1234 unless both are changed together.
  port: 1234

cache:
  # Build cache (layers, snapshots). buildkitd's default GC keeps it bounded;
  # tune via a buildkitd.toml ConfigMap if this ever fills.
  # NOTE: local-path can't expand a bound PVC — changing size means deleting
  # the PVC (and its Retained PV) and letting the next upgrade re-provision.
  # Cache is disposable, so that's cheap, but it must be done by hand.
  enabled: true
  size: 100Gi
  storageClass: ""              # "" → cluster default (k3s local-path)

scheduling:
  # Pin to the 20-core/32Gi build node so big images (rachelfreeman's frontend)
  # stop OOMKilling the daemon on the small workers. Hostname selector, same
  # convention as jellyfin's transcode pin; "" → unpinned, scheduler's choice.
  # The cache PVC is local-path (node-bound), so changing this also means
  # recreating the PVC on the new node — see the cache note above.
  nodeName: zachd-ubuntu-4

networkPolicy:
  enabled: true
  # Only pods in this namespace may reach the (unauthenticated) TCP listener.
  clientNamespace: claude

resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    # Sized for the worst known build (rachelfreeman) with headroom; the pinned
    # node has 32Gi. No CPU limit on purpose — builds should use every core.
    memory: 16Gi
