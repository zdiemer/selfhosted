apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cluster-status.fullname" . }}-web
  labels:
    {{- include "cluster-status.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen {{ .Values.web.port }};
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # status.json is a few hundred KB of JSON whose key names repeat once per
      # pod, so it compresses 8-10x — and it is re-fetched by every open tab
      # every {{ .Values.collector.intervalSeconds }}s, which is the whole reason this matters. nginx's
      # stock config ships gzip commented out, so this was going over the wire
      # uncompressed for as long as the page existed.
      #
      # Three things here are easy to get wrong:
      #   - text/html is ALWAYS gzipped and must not appear in gzip_types;
      #     listing it is a warning at best and confusing at worst.
      #   - gzip_vary matters because Traefik sits in front of this. Without it
      #     a cache upstream can hand a gzipped body to a client that did not
      #     ask for one.
      #   - level 5, not 9. Nine buys ~3% more on JSON for roughly double the
      #     CPU, on a container with a 10m CPU request.
      gzip on;
      gzip_types application/json application/javascript text/css application/manifest+json image/svg+xml;
      gzip_min_length 1024;
      gzip_comp_level 5;
      gzip_vary on;

      # The collector's output lives on the shared emptyDir, not in the web root.
      # no-store because it changes every {{ .Values.collector.intervalSeconds }}s and
      # Cloudflare would otherwise happily serve a cached copy for ages.
      location = /status.json {
        alias /data/status.json;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Content-Type "application/json" always;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      # Icons, manifest and preview card, from the brand ConfigMap. `root`
      # appends the whole request URI, so /icon.svg resolves to
      # /usr/share/nginx/brand/icon.svg — one block instead of six aliases.
      #
      # Named explicitly rather than matched by extension: everything else on
      # this server falls through to the SPA shell, and a regex like \.png$
      # would start 404ing anything added later instead of quietly serving the
      # page. The list is the contract with the brand ConfigMap.
      #
      # A day, not a year. These names carry no content hash, so the cache
      # lifetime is also how long a redesigned mark keeps showing the old one —
      # the same reasoning web/old-diemer-codes applies to its unfingerprinted
      # site.css. A day costs one conditional request and bounds the staleness
      # to something a person would sit through.
      location ~ ^/(icon\.svg|icon-192\.png|icon-512\.png|icon-maskable-512\.png|apple-touch-icon\.png|og\.png)$ {
        root /usr/share/nginx/brand;
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
      }

      # Service favicons, written into the shared emptyDir by the collector's
      # icon lane. Same volume as status.json, a directory rather than a file —
      # so a service added to the catalog needs no change here.
      #
      # ^~ so this cannot be overtaken by the brand regex above if that list
      # ever grows a pattern; the two directories are different volumes and
      # crossing them would 404 every tile at once.
      #
      # An hour, not a day. These are refetched on catalog.icons.ttlHours and
      # carry no content hash, so the cache lifetime is how long a service that
      # rebrands keeps the old mark — and unlike the brand assets, nobody
      # deploys anything when it changes.
      #
      # 404 is a normal answer here and not worth a log line per tile: a slug
      # with no icon yet is exactly what the page's monogram fallback is for.
      location ^~ /icons/ {
        alias /data/icons/;
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
      }

      # Its own block only because of the content type. nginx's mime.types has
      # no .webmanifest, so this came back application/octet-stream, and Chrome
      # then declines to install the app while the manifest itself fetches
      # perfectly — a miserable thing to diagnose.
      #
      # default_type rather than a `types {}` block: a types block inside a
      # location REPLACES the inherited map rather than adding to it, which
      # would have taken image/png off the icons above.
      location = /manifest.webmanifest {
        root /usr/share/nginx/brand;
        access_log off;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
      }

      # The page shell must revalidate on every load. So must app.css and
      # app.js, which is what this block now covers: the rendering logic moved
      # out of the shell into app.js, and all three are served with no content
      # hash in the URL — so without an explicit header a browser applies
      # *heuristic* caching (a fraction of the Last-Modified age) and can keep
      # showing old code for hours after a deploy. The symptom is the worst
      # kind: status.json is no-store and therefore current, so the page renders
      # fresh data through stale code and simply omits whatever the new version
      # added. no-cache still allows a 304, so this costs a conditional request,
      # not a re-download.
      #
      # Splitting the page into three files did not weaken that. It does mean a
      # deploy can briefly pair a new index.html with a not-yet-revalidated
      # app.js — but no-cache forces a conditional request on each, so that
      # window is one round-trip rather than the hours the heuristic would give.
      location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
      }
    }
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Cluster Status</title>

    <!--
      Icons and the preview card, served out of the brand ConfigMap (see the
      location block above; drawn by scripts/gen-brand.py). noindex above keeps
      this out of search results, which is a separate thing from the card: the
      URL still gets pasted into chats, and the card is what shows up there.

      No favicon.ico anywhere — every browser that matters takes the SVG, and
      an .ico would be a third transcription of the mark to keep in sync.
    -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#09090b">
    <meta name="color-scheme" content="light dark">

    {{/*
      og: tags for a page nobody outside the tailnet can fetch. Kept, and
      retargeted at the duckdns host rather than deleted: the link previews
      that matter are the ones rendered by clients that CAN reach the page —
      a Signal or iMessage link shared between our own tailnet devices — and
      those need the URL to match what is actually served, or the preview
      silently falls back to a bare link. The old status.diemer.codes values
      would now point a previewer at a host the tunnel no longer routes.
    */}}
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ .Values.ingress.host }}">
    <meta property="og:title" content="Cluster Status">
    <meta property="og:description" content="Live health for the seven-node k3s cluster at home — nodes, pods, storage and every service on top.">
    <meta property="og:url" content="https://{{ .Values.ingress.host }}/">
    <meta property="og:image" content="https://{{ .Values.ingress.host }}/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ .Values.ingress.host }} — is everything up?">
    <meta name="twitter:card" content="summary_large_image">

    <!--
      The stylesheet and the script are separate files, not inline blocks —
      see the Cache-Control note on `location /` above, which now governs all
      three. They are all no-cache, so a deploy costs three conditional
      requests and the window in which a new shell could pair with a
      revalidating old app.js is one round-trip rather than hours.

      defer, not async: app.js reads #root and #verdict on load, and async
      would let it run mid-parse before they exist.
    -->
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
    </head>
    <body>
    <div class="wrap">
      <!--
        The verdict, above everything. This page used to open on the summary
        card, which meant working out whether anything was wrong by reading four
        figures and a pill row — on a phone, below the fold. Now it says so.

        Sticky, because the node list is long and the answer is the one thing
        that should not scroll away.

        The mark is <img src="/icon.svg"> rather than an inline <svg>. The
        artwork already exists as two transcriptions (the SVG and the Pillow
        calls in scripts/gen-brand.py); pasting the paths in here would make it
        three, and this one would be the copy nobody remembers to update.
      -->
      <header class="top">
        <div class="top-row">
          <span class="brand">
            <img src="/icon.svg" width="22" height="22" alt="">
            <h1>Cluster Status</h1>
          </span>
          <span class="verdict" id="verdict"><i class="dot"></i><span id="verdict-t">Checking…</span></span>
        </div>
        <div class="sub" id="meta">Loading…</div>
        <div class="why" id="why" hidden></div>
      </header>
      <div id="root"></div>
    </div>
    </body>
    </html>
  app.css: |
      /* ---------------------------------------------------------------- tokens
         Zinc neutrals, and the three series colours the page has always used
         for pods / k3s / system. Semantic state (ok / warn / bad) is kept
         separate from those three on purpose: "this bar segment is k3s" and
         "this number is alarming" are different jobs, and collapsing them is
         how a chart ends up saying a node is on fire because its runtime is
         busy. */
      :root {
        --bg: #ffffff; --fg: #0a0a0a; --muted: #71717a; --muted-bg: #f4f4f5;
        --border: #e4e4e7; --card: #ffffff; --destructive: #dc2626;
        --pods: #10b981; --k3s: #0ea5e9; --system: #f59e0b;
        --ok: #10b981; --warn: #eab308; --info: #3b82f6;
        --raise: 0 1px 2px rgba(9, 9, 11, .04);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --muted-bg: #27272a;
          --border: #27272a; --card: #101012; --destructive: #f87171;
          --ok: #34d399; --warn: #facc15; --info: #60a5fa;
          --raise: none;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        /* viewport-fit=cover is set on the meta tag, so the side padding has to
           clear the notch cutouts in landscape or the first character of every
           node name lands under one. */
        padding: 1rem max(.75rem, env(safe-area-inset-left)) 3rem;
        background: var(--bg); color: var(--fg);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      @media (min-width: 640px) { body { padding: 1.5rem 1rem 4rem; } }
      .wrap { max-width: 1200px; margin: 0 auto; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      /* Every figure on this page sits in a column with another figure above or
         below it. Proportional digits make those columns ripple as the numbers
         change, which on a page that repaints every 15s reads as movement where
         nothing has happened. */
      .mono, .stat-v, table, .barlbl, .pill b { font-variant-numeric: tabular-nums; }

      /* ------------------------------------------------------------- verdict
         The answer, before any of the evidence. A status page that opens on a
         summary card makes you read four numbers and a pill row to find out
         whether anything is wrong; this says so, and colours itself. Sticky,
         because the node list is long and the answer should not scroll away. */
      .top {
        position: sticky; top: 0; z-index: 5;
        margin: -1rem calc(-1 * max(.75rem, env(safe-area-inset-left))) 1rem;
        padding: .875rem max(.75rem, env(safe-area-inset-left));
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }
      @media (min-width: 640px) {
        .top { margin: -1.5rem -1rem 1.25rem; padding: 1.25rem 1rem 1rem; }
      }
      .top-row { display: flex; align-items: center; gap: .625rem; flex-wrap: wrap; }
      .brand { display: flex; align-items: center; gap: .5rem; min-width: 0; }
      .brand svg { width: 22px; height: 22px; border-radius: 5px; display: block; flex: none; }
      h1 { font-size: 1.0625rem; margin: 0; font-weight: 600; letter-spacing: -.01em; }
      .verdict {
        display: inline-flex; align-items: center; gap: .4375rem;
        border-radius: 999px; padding: .1875rem .5625rem .1875rem .5rem;
        font-size: 12px; font-weight: 600; line-height: 1.4;
        color: var(--vc, var(--ok));
        background: color-mix(in srgb, var(--vc, var(--ok)) 13%, transparent);
        border: 1px solid color-mix(in srgb, var(--vc, var(--ok)) 28%, transparent);
      }
      .verdict .dot {
        width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none;
      }
      /* Only the healthy state pulses. A red badge that also breathes reads as
         decorative; a still red badge next to a live green one does not. */
      @media (prefers-reduced-motion: no-preference) {
        .verdict.good .dot { animation: beat 2.4s ease-in-out infinite; }
      }
      @keyframes beat { 0%, 70%, 100% { opacity: 1; } 85% { opacity: .35; } }
      .top .sub { margin-top: .3125rem; }
      .why { color: var(--muted); font-size: 12px; }
      .why b { color: var(--fg); font-weight: 600; }

      .sub { color: var(--muted); font-size: 12px; }
      h2 {
        font-size: 11px; margin: 1.75rem 0 .625rem; font-weight: 600;
        text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
        display: flex; align-items: center; gap: .5rem;
      }
      h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }

      /* ---------------------------------------------------------------- cards */
      .card {
        background: var(--card); border: 1px solid var(--border); border-radius: 10px;
        margin-bottom: .625rem; box-shadow: var(--raise);
      }
      .card-h { padding: .75rem .875rem .5rem; display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap; align-items: center; }
      .card-t { font-weight: 600; font-size: .8125rem; letter-spacing: -.005em; }
      /* space-between distributes THREE children, and a folded card header has
         three: the disclosure marker, the title, and the summary chip. Without
         this the title floats into the middle of the card while the other two
         sit at the edges. Pinning the title to the left makes the count of
         children stop mattering. */
      .card-h > .card-t { margin-right: auto; }
      .card-c { padding: 0 .875rem .875rem; }
      @media (min-width: 640px) {
        .card-h { padding: .875rem 1rem .5rem; }
        .card-c { padding: 0 1rem 1rem; }
      }
      .count { color: var(--muted); font-weight: 500; }
      /* A <summary> is the card header for the folded workload lists. The
         default marker is a black triangle that ignores the type colour, so it
         is replaced with one built from the same muted token as everything else
         on the row. list-style:none is what Safari needs; ::-webkit-details-marker
         is what older Safari needs. */
      summary { cursor: pointer; list-style: none; }
      summary::-webkit-details-marker { display: none; }
      summary::before {
        content: "\25B8"; color: var(--muted); font-size: 11px; margin-right: -.125rem;
        transition: transform .12s ease; display: inline-block;
      }
      details[open] > summary::before { transform: rotate(90deg); }
      summary:hover { background: var(--muted-bg); border-radius: 10px 10px 0 0; }
      summary:focus-visible { outline: 2px solid var(--info); outline-offset: -2px; border-radius: 10px; }
      @media (prefers-reduced-motion: reduce) { summary::before { transition: none; } }
      .grid { display: grid; gap: 1rem; }
      /* A grid or flex item defaults to min-width:auto, which is "never shrink
         below your content" — so one long mono line inside a bar label pushed
         its track wider than the track was allotted, the wrap with it, and the
         whole document sideways. On a 390px phone this page was 593px wide and
         had been for as long as it has existed. Everything here is meant to
         truncate or wrap instead, and this is what lets it. */
      .grid > *, .node-bars > *, .card, .wrap { min-width: 0; }
      .g4 { grid-template-columns: repeat(2, 1fr); gap: .875rem 1rem; }
      .g3 { grid-template-columns: 1fr; }
      .g2 { grid-template-columns: 1fr; }
      @media (min-width: 640px) { .g4 { grid-template-columns: repeat(4, 1fr); } }
      @media (min-width: 1024px) { .g3 { grid-template-columns: repeat(3, 1fr); } .g2 { grid-template-columns: repeat(2, 1fr); } }

      /* ----------------------------------------------------------------- tiles
         The catalog grid. A launcher, not a table: the question it answers is
         "where do I click", and 45 rows of hostname answered that badly.

         auto-fill with a minmax track rather than a column count, so the same
         rule gives three across on a phone and eight on a laptop without a
         breakpoint for each. The floor drops on the narrowest screens because
         a 9.5rem minimum leaves two tiles and a wide gutter on a 360px phone. */
      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: .5rem; }
      /* Tighter on a phone, where this card is three across and fifteen rows
         deep before anything else on the page starts. Trimming the padding and
         the mark is ~15% of that height for nothing a reader would miss. */
      @media (max-width: 520px) {
        .tiles { grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr)); gap: .375rem; }
        .tile { padding: .625rem .375rem .5rem; gap: .3125rem; }
        .tile-i, .tile-m { width: 30px; height: 30px; }
        .tile-m { font-size: 13px; }
      }
      .tile {
        position: relative; display: flex; flex-direction: column; align-items: center;
        gap: .375rem; text-align: center; min-width: 0; padding: .75rem .5rem .625rem;
        border: 1px solid var(--border); border-radius: 10px; background: var(--card);
        color: inherit; text-decoration: none; box-shadow: var(--raise);
      }
      a.tile:hover { background: var(--muted-bg); border-color: var(--muted); }
      a.tile:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
      /* Nothing to click — a Discord bot, or a service published nowhere. It is
         still a service and still belongs on a page that claims to list them
         all, so it is dimmed rather than dropped. */
      .tile.off { box-shadow: none; background: transparent; }
      .tile.off .tile-n { color: var(--muted); }
      .tile-i, .tile-m { width: 34px; height: 34px; border-radius: 8px; flex: none; display: block; }
      /* contain, not cover: these are logos at wildly different aspect ratios
         and cropping one to fill a square eats the mark. */
      .tile-i { object-fit: contain; }
      /* IN DARK MODE THE MARK GETS A LIGHT PLATE, and it is not decoration.
         A favicon is drawn for a browser tab, which is light on most people's
         machines, so a good many of them are BLACK ON TRANSPARENT — Prowlarr,
         Radarr, Sonarr, ntfy and talaria all are. On a #101012 card those tiles
         rendered as empty squares: the grid looked broken for five services
         that were perfectly healthy.
         The plate restores the background the artwork was drawn against. It
         costs nothing for the marks that carry their own opaque background
         (Gamedex, Smite-le, old.diemer.codes) and nothing for the mid-tone
         colour marks, and there is no equivalent risk in the other direction:
         a white-on-transparent favicon would be invisible in a light browser
         tab, so essentially nobody ships one.
         Light mode needs no rule — the card is already white. */
      @media (prefers-color-scheme: dark) {
        .tile-i { background: #fafafa; padding: 2px; }
      }
      /* The fallback when a service has no favicon, or has one this collector
         cannot reach — the two workspace pods carry NetworkPolicies that refuse
         it, correctly. A monogram on a colour derived from the name is stable
         per service and distinguishable at a glance, which is the whole job. */
      .tile-m {
        display: flex; align-items: center; justify-content: center;
        font-size: 14px; font-weight: 700; letter-spacing: -.02em; color: #fff;
      }
      .tile-n { font-size: 12px; font-weight: 600; line-height: 1.3; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* The address, truncated from the RIGHT: the leftmost label is the name
         that identifies the service and the tail is the domain it shares with
         thirty others. `jellyfin.zachd.du…` is legible; `…d.duckdns.org` is not. */
      .tile-h { font-size: 10px; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
      /* Public hosts read at full contrast, tailnet ones muted. It is the one
         distinction this grid exists to make — "can I open this from the bus" —
         and it costs a colour rather than a badge on every tile. */
      .tile-h.pub { color: var(--fg); opacity: .75; }
      /* A tile with no link may wrap that line instead of truncating it. On a
         linked tile the text is a shorthand and the href holds the truth, so
         losing the tail costs nothing; on an unlinked one the line IS the
         answer, and `mc.zachd.duckdn…` drops the port — the only part of a
         Minecraft address a client needs. */
      .tile.off .tile-h { white-space: normal; overflow-wrap: anywhere; }
      .tile-s { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 999px; }
      /* Green at low opacity: present enough to confirm on inspection, quiet
         enough that a red one is the only thing you see from across the room. */
      .tile-s.ok { background: var(--ok); opacity: .35; }
      .tile-s.warn { background: var(--warn); }
      .tile-s.down { background: var(--destructive); }
      .tile-s.unknown { background: var(--muted); }
      .cat {
        display: flex; align-items: baseline; gap: .5rem; margin: .875rem 0 .5rem;
        font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
      }
      .cat:first-child { margin-top: .25rem; }
      details.cat-f { margin-top: .25rem; }
      details.cat-f > summary.cat { margin: .875rem 0 .25rem; }
      details.cat-f[open] > summary.cat { margin-bottom: .5rem; }

      .stat-l { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
      /* No word-break here. It used to be break-word, which split "122.6 GB"
         across two lines on a phone and knocked the tile below it out of
         alignment; these values are short and the container is a grid cell that
         can take them. */
      .stat-v { font-size: 1.0625rem; font-weight: 600; letter-spacing: -.02em; margin-top: 1px; }
      .stat-s { font-size: 11px; color: var(--muted); }

      /* ----------------------------------------------------------------- bars */
      .bar { position: relative; display: flex; height: 10px; width: 100%; overflow: hidden; border-radius: 999px; background: var(--muted-bg); }
      .bar > i { height: 100%; display: block; }
      .marker { position: absolute; top: -1px; height: calc(100% + 2px); width: 2px; background: var(--fg); opacity: .55; }
      /* nowrap + a shrinking left half. This was flex-wrap:wrap, so on a narrow
         column the percentage dropped onto its own line and every node card in
         the list ended up a different height. */
      .barlbl { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; font-size: 11px; color: var(--muted); margin-top: 4px; }
      .barlbl > :first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .barlbl > :last-child { flex: none; }

      .legend { display: flex; flex-wrap: wrap; gap: .25rem .875rem; font-size: 11px; color: var(--muted); }
      .legend span { display: inline-flex; align-items: center; gap: .375rem; }
      .sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

      .pill { display: inline-flex; align-items: center; gap: .375rem; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 500; }
      .pills { display: flex; flex-wrap: wrap; gap: .375rem; margin: .875rem 0; }

      /* --------------------------------------------------------------- tables */
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--border); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
      td { padding: 5px 6px; border-bottom: 1px solid var(--border); }
      tr:last-child td { border-bottom: 0; }
      .r { text-align: right; }
      .c { text-align: center; }
      .scroll { overflow-x: auto; }

      /* On a phone none of these tables fit: the problem-pod table is six
         columns of pod names, and .scroll turned it into a sideways drag on the
         one view where you are least able to do that. Below 700px every row
         becomes a small record instead, carrying the header text down as a
         label per cell (data-l, set where the row is built).

         The fields FLOW rather than stacking one per line. Stacking was the
         first attempt and is the obvious thing to reach for, but it multiplies
         every table's height by its column count — with 71 deployments and a
         node's 63 pods on the page, it turned the document into 21,000px of
         scroll. Inline-flex chips wrap to one or two lines per record and stay
         labelled, which is the part that mattered. */
      @media (max-width: 699px) {
        .scroll { overflow-x: visible; }
        table, tbody { display: block; width: 100%; }
        thead { display: none; }
        tr {
          display: flex; flex-wrap: wrap; align-items: baseline; gap: 1px .75rem;
          padding: .5rem 0; border-bottom: 1px solid var(--border);
        }
        tr:last-child { border-bottom: 0; }
        td {
          display: inline-flex; align-items: baseline; gap: .3125rem;
          width: auto; padding: 0; border: 0; text-align: left;
        }
        td::before {
          content: attr(data-l); flex: none;
          color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
        }
        /* The record's title: its own full-width line, and the only cell
           allowed to break mid-token — pod names are long and unhyphenatable. */
        td:first-child { flex-basis: 100%; font-weight: 500; overflow-wrap: anywhere; }
        td:first-child::before { display: none; }
        /* An empty cell with a label is worse than no cell: it reads as missing
           data rather than as nothing to say. */
        td:empty { display: none; }
      }

      /* ---------------------------------------------------------------- nodes */
      .node-btn { width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; padding: .75rem .875rem; display: flex; flex-direction: column; gap: .75rem; border-radius: 10px; }
      .node-btn:hover { background: var(--muted-bg); }
      .node-btn:focus-visible { outline: 2px solid var(--info); outline-offset: -2px; }
      @media (min-width: 900px) { .node-btn { flex-direction: row; align-items: center; justify-content: space-between; padding: .75rem 1rem; } .node-bars { max-width: 40rem; flex-shrink: 0; } }
      .node-bars { display: grid; grid-template-columns: 1fr; gap: .75rem; width: 100%; }
      @media (min-width: 640px) { .node-bars { grid-template-columns: repeat(3, 1fr); } }
      .node-meta { display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 11px; color: var(--muted); margin-top: 3px; }
      /* Marks the least useful, longest thing in a line — the OS string on a
         node row, the "· req N" tail on a bar label. Dropped rather than
         ellipsised on narrow screens, because truncating the line takes the
         figure at the END of it (the percentage) with it, and that is the one
         anybody came for. */
      @media (max-width: 479px) { .opt { display: none; } }
      /* Always dropped inside a node row, at every width. Those three bars share
         one node's worth of horizontal space, so even on a wide desktop the tail
         does not fit and gets ellipsised mid-token — "· req …" is strictly worse
         than nothing. The requested figure is still on the bar itself, as the
         marker and in its hover title. The cluster-wide bars up in the summary
         are three times wider and keep theirs. */
      .node-bars .opt { display: none; }
      .chev { display: inline-block; width: 12px; color: var(--muted); }
      .detail { border-top: 1px solid var(--border); padding: .875rem; }
      .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: .375rem; }

      .ev { border-bottom: 1px solid var(--border); padding: .5rem 0; }
      .ev:last-child { border-bottom: 0; }
      .ev-h { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
      .ev-m { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; margin-top: 2px; }
      .err { border: 1px solid var(--destructive); background: color-mix(in srgb, var(--destructive) 10%, transparent); color: var(--destructive); padding: .75rem; border-radius: 8px; }
      .tile-l { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
      @media (min-width: 640px) { .tile-l { display: none; } }
      ol { margin: 0; padding-left: 1.25rem; }
      li { margin: 2px 0; }
      .between { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; }
      .trunc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  app.js: |
    (function () {
      'use strict';
      // Matches the collector's scrape interval: polling faster than it collects
      // just re-fetches the same file.
      var POLL_MS = {{ mul .Values.collector.intervalSeconds 1000 }};
      // The order the catalog's category headings appear in. Page ordering, not
      // data, so it rides in the script rather than in status.json — which is
      // re-fetched every {{ .Values.collector.intervalSeconds }}s and has no business carrying a list that
      // changes on a deploy.
      var CATEGORIES = {{ .Values.catalog.categories | toJson }};
      var expanded = {};
      // Warnings by default. The collector now sends Normal events too, but
      // making the page noisier out of the box would undo the reason the
      // warnings card was readable in the first place.
      var eventFilter = 'warn';

      function esc(s) {
        // Event messages are arbitrary text straight from Kubernetes and this
        // page is public — nothing reaches innerHTML unescaped.
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function fmtBytes(n) {
        n = Number(n);
        if (!isFinite(n) || n <= 0) return '0 B';
        var u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'], i = 0;
        while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
        return n.toFixed(1) + ' ' + u[i];
      }
      function fmtRate(bps) {
        if (bps == null || !isFinite(bps)) return null;
        if (bps < 1024) return bps.toFixed(0) + ' B/s';
        return fmtBytes(bps) + '/s';
      }
      function fmtCores(n) {
        n = Number(n);
        if (!isFinite(n) || n <= 0) return '0';
        if (n < 0.1) return n.toFixed(2);
        return n < 10 ? n.toFixed(2) : n.toFixed(1);
      }
      function fmtUptime(iso) {
        if (!iso) return null;
        var t = Date.parse(iso);
        if (isNaN(t)) return null;
        var s = Math.max(0, Math.floor((Date.now() - t) / 1000));
        var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
        if (d > 0) return d + 'd ' + h + 'h';
        if (h > 0) return h + 'h ' + m + 'm';
        return m + 'm';
      }
      function fmtRel(iso) {
        if (!iso) return '';
        var t = Date.parse(iso);
        if (isNaN(t)) return '';
        var s = Math.floor((Date.now() - t) / 1000);
        if (s < 0) return 'now';
        if (s < 60) return s + 's ago';
        var m = Math.floor(s / 60);
        if (m < 60) return m + 'm ago';
        var h = Math.floor(m / 60);
        if (h < 24) return h + 'h ago';
        return Math.floor(h / 24) + 'd ago';
      }
      function pctColor(v) {
        if (v == null) return 'var(--muted)';
        if (v >= 90) return 'var(--destructive)';
        if (v >= 70) return 'var(--warn)';
        return 'var(--ok)';
      }
      function pct(v) {
        if (v == null) return '<span style="color:var(--muted)">N/A</span>';
        var w = v >= 90 ? 'font-weight:600;' : '';
        return '<span style="' + w + 'color:' + pctColor(v) + '">' + v.toFixed(1) + '%</span>';
      }
      function podStatusColor(s) {
        s = String(s || '').toLowerCase();
        if (['failed', 'terminating', 'evicted', 'crashloopbackoff'].indexOf(s) >= 0) return 'var(--destructive)';
        if (['pending', 'containercreating'].indexOf(s) >= 0) return 'var(--warn)';
        if (s === 'completed' || s === 'succeeded') return 'var(--info)';
        return 'var(--ok)';
      }

      // fmt formats every segment including the idle remainder, which is why it's
      // a function rather than a per-segment string: idle is computed here, so
      // only here knows how to render it.
      function bar(segments, capacity, markerVal, fmt) {
        var used = segments.reduce(function (s, x) { return s + Math.max(0, x.value); }, 0);
        var denom = capacity > 0 ? capacity : used;
        var pieces = segments.slice();
        pieces.push({ label: 'idle', value: Math.max(denom - used, 0), color: 'transparent' });
        var title = pieces.filter(function (p) { return p.value > 0; })
          .map(function (p) { return p.label + ': ' + fmt(p.value); }).join(' · ');
        var html = '<div class="bar" title="' + esc(title) + '">';
        pieces.forEach(function (p) {
          if (p.value <= 0) return;
          var w = Math.min(100, denom > 0 ? (p.value / denom) * 100 : 0);
          html += '<i style="width:' + w + '%;background:' + p.color + '"></i>';
        });
        if (markerVal && denom > 0 && markerVal > 0) {
          html += '<div class="marker" style="left:' + Math.min(100, (markerVal / denom) * 100) + '%"></div>';
        }
        return html + '</div>';
      }

      function cpuBar(cpu, reqCores) {
        if (!cpu) return '<div class="sub">N/A</div>';
        var used = cpu.pods + cpu.k3s + cpu.system;
        var p = cpu.capacity > 0 ? (used / cpu.capacity) * 100 : 0;
        var segs = [
          { label: 'pods', value: cpu.pods, color: 'var(--pods)' },
          { label: 'k3s', value: cpu.k3s, color: 'var(--k3s)' },
          { label: 'system', value: cpu.system, color: 'var(--system)' }
        ];
        return bar(segs, cpu.capacity, reqCores, fmtCores) +
          '<div class="barlbl"><span class="mono">' + fmtCores(used) + ' / ' + fmtCores(cpu.capacity) + ' cores' +
          (reqCores > 0 ? '<span class="opt"> · req ' + fmtCores(reqCores) + '</span>' : '') +
          '</span><span>' + pct(p) + '</span></div>';
      }

      function ramBar(ram, reqBytes) {
        if (!ram) return '<div class="sub">N/A</div>';
        var used = Number(ram.podsBytes) + Number(ram.k3sBytes) + Number(ram.systemBytes);
        var cap = Number(ram.capacityBytes);
        var p = cap > 0 ? (used / cap) * 100 : 0;
        var segs = [
          { label: 'pods', value: Number(ram.podsBytes), color: 'var(--pods)' },
          { label: 'k3s', value: Number(ram.k3sBytes), color: 'var(--k3s)' },
          { label: 'system', value: Number(ram.systemBytes), color: 'var(--system)' }
        ];
        return bar(segs, cap, reqBytes, fmtBytes) +
          '<div class="barlbl"><span class="mono">' + fmtBytes(used) + ' / ' + fmtBytes(cap) +
          (reqBytes > 0 ? '<span class="opt"> · req ' + fmtBytes(reqBytes) + '</span>' : '') +
          '</span><span>' + pct(p) + '</span></div>';
      }

      function diskBar(disk) {
        if (!disk) return '<div class="sub">N/A</div>';
        var used = Number(disk.usedBytes), cap = Number(disk.capacityBytes);
        var p = cap > 0 ? (used / cap) * 100 : 0;
        var color = p >= 90 ? 'var(--destructive)' : p >= 70 ? 'var(--system)' : 'var(--pods)';
        return bar([{ label: 'used', value: used, color: color }], cap, 0, fmtBytes) +
          '<div class="barlbl"><span class="mono">' + fmtBytes(used) + ' / ' + fmtBytes(cap) + '</span><span>' + pct(p) + '</span></div>';
      }

      function diskMini(disks) {
        if (!disks || !disks.length) return '<div class="sub">No disks</div>';
        var worst = disks.reduce(function (a, d) { return (d.percent || 0) > (a.percent || 0) ? d : a; });
        var p = worst.percent || 0;
        var color = p >= 90 ? 'var(--destructive)' : p >= 70 ? 'var(--system)' : 'var(--pods)';
        var title = disks.map(function (d) { return d.label + ': ' + d.used + ' / ' + d.total; }).join(' · ');
        return '<div class="bar" title="' + esc(title) + '"><i style="width:' + Math.min(100, p) + '%;background:' + color + '"></i></div>' +
          '<div class="barlbl"><span class="mono trunc" title="' + esc(worst.label) + '">' +
          esc(disks.length === 1 ? worst.label : disks.length + ' disks') + '</span><span>' + pct(worst.percent) + '</span></div>';
      }

      // The question the page exists to answer, worked out from exactly the data
      // everything below is drawn from — so the badge can never disagree with
      // the cards under it.
      //
      // Two tiers, and the split is deliberate. `bad` is "something users would
      // notice": a node gone, a probed endpoint refusing, a pod stuck in a
      // restart loop, a disk with no room left. `warn` is "somebody should
      // look": a finished Job whose pod exited non-zero, a node under pressure,
      // a filesystem heading somewhere.
      //
      // Failed pods are specifically NOT critical. Most of them here are
      // CronJob pods that exited non-zero hours ago and were kept for their
      // logs — a red banner for those trains you to ignore red banners, which
      // costs the one that matters.
      function verdict(d) {
        var bad = [], warn = [];
        var nodes = d.nodeDisks || [];

        // Staleness outranks everything. nginx keeps serving the last
        // status.json after the collector dies, so without this the page would
        // sit there saying "All clear" about a cluster it stopped being able to
        // see — which is the single worst thing a status page can do.
        if (isStale(d)) {
          return {
            level: 'stale', color: 'var(--muted)', label: 'Stale data',
            rest: ['last collected ' + fmtRel(d.generatedAt)]
          };
        }

        var notReady = nodes.filter(function (n) { return !n.ready; });
        if (notReady.length) bad.push(plural(notReady.length, 'node') + ' not ready');

        var down = (d.services || []).filter(function (s) { return !s.ok; });
        if (down.length) bad.push(plural(down.length, 'service') + ' down');

        var ps = (d.totals && d.totals.podStatus) || {};
        if (ps.crashLooping > 0) bad.push(plural(ps.crashLooping, 'pod') + ' crash-looping');
        if (ps.failed > 0) warn.push(plural(ps.failed, 'failed pod'));
        if (ps.pending > 0) warn.push(plural(ps.pending, 'pod') + ' pending');
        if (ps.unknown > 0) warn.push(plural(ps.unknown, 'pod') + ' in unknown state');

        // Worst single filesystem, not the cluster-wide average: the average
        // stays comfortable while one node's root fills up and evicts things.
        var worstDisk = 0, worstDiskNode = null;
        nodes.forEach(function (n) {
          (n.disks || []).forEach(function (disk) {
            if ((disk.percent || 0) > worstDisk) { worstDisk = disk.percent; worstDiskNode = n.name; }
          });
        });
        if (worstDisk >= 90) bad.push('disk ' + worstDisk.toFixed(0) + '% on ' + worstDiskNode);
        else if (worstDisk >= 80) warn.push('disk ' + worstDisk.toFixed(0) + '% on ' + worstDiskNode);

        var pressured = nodes.filter(function (n) {
          var c = n.conditions || {};
          return c.memoryPressure || c.diskPressure || c.pidPressure || c.networkUnavailable;
        });
        if (pressured.length) bad.push(plural(pressured.length, 'node') + ' under pressure');

        // A cordoned node is "somebody should look", not "users would notice" —
        // it is usually a drain in progress, and the one thing you want is for
        // the badge to remember it when the drain is not.
        var cordoned = nodes.filter(function (n) { return n.unschedulable; });
        if (cordoned.length) warn.push(plural(cordoned.length, 'node') + ' cordoned');

        // Same reasoning as the worst-filesystem check above, one layer in: the
        // node aggregate stays comfortable while a single claim fills.
        var worstPvc = null;
        (d.storage || []).forEach(function (r) {
          if (r.percent != null && (!worstPvc || r.percent > worstPvc.percent)) worstPvc = r;
        });
        if (worstPvc && worstPvc.percent >= 90) {
          bad.push('PVC ' + worstPvc.name + ' ' + worstPvc.percent.toFixed(0) + '% full');
        } else if (worstPvc && worstPvc.percent >= 80) {
          warn.push('PVC ' + worstPvc.name + ' ' + worstPvc.percent.toFixed(0) + '% full');
        }
        var unbound = (d.storage || []).filter(function (r) { return r.phase && r.phase !== 'Bound'; });
        if (unbound.length) warn.push(plural(unbound.length, 'PVC') + ' not bound');

        // Warn, not bad, for the same reason Failed pods are: a failed run is
        // usually a flaky scrape that will retry on schedule.
        var failedJobs = (d.jobFailures || []).filter(function (j) { return j.failed; });
        if (failedJobs.length) warn.push(plural(failedJobs.length, 'job') + ' failed');

        // Ingresses with no rule-4 answer are DELIBERATELY not in the verdict,
        // only on the routing card. There are half a dozen of them, they all
        // live in repos this cluster cannot edit, and they change on nobody's
        // schedule — so they would pin the badge amber permanently, which is
        // the same mistake as making Failed pods critical: a badge that is
        // always amber is a badge nobody reads.

        if (bad.length) return { level: 'bad', color: 'var(--destructive)', label: bad[0], rest: bad.slice(1).concat(warn) };
        if (warn.length) return { level: 'warn', color: 'var(--warn)', label: warn[0], rest: warn.slice(1) };
        return {
          level: 'good', color: 'var(--ok)',
          label: 'All clear',
          rest: [plural(nodes.length, 'node') + ' ready', plural(d.totals ? d.totals.podCount : 0, 'pod') + ' running']
        };
      }

      function plural(n, word) {
        return n + ' ' + word + (n === 1 ? '' : 's');
      }

      function setVerdict(v) {
        var el = document.getElementById('verdict');
        el.className = 'verdict ' + v.level;
        el.style.setProperty('--vc', v.color);
        document.getElementById('verdict-t').textContent = v.label;
        el.title = v.rest.length ? v.rest.join(' · ') : v.label;

        // The badge holds one line, so anything else it found goes underneath.
        // A title attribute alone would have hidden it from every phone, which
        // is most of the traffic this page gets.
        var why = document.getElementById('why');
        if (v.level !== 'good' && v.rest.length) {
          // "also:" only where the rest really is a list of further problems.
          // On the stale badge the remainder is the explanation of the badge
          // itself, and "also: last collected 40m ago" reads as a second fault.
          why.textContent = (v.level === 'stale' ? '' : 'also: ') + v.rest.join(' · ');
          why.hidden = false;
        } else {
          why.hidden = true;
        }
      }

      function legend() {
        // Lives with the bars it explains rather than up in the masthead, where
        // it was three wrapped lines of colour key above the fold on a phone —
        // ahead of any actual data.
        return '<div class="legend" style="margin-bottom:.75rem">' +
          '<span><i class="sw" style="background:var(--pods)"></i>Pods (workload)</span>' +
          '<span><i class="sw" style="background:var(--k3s)"></i>k3s (kubelet + runtime)</span>' +
          '<span><i class="sw" style="background:var(--system)"></i>System (non-k3s)</span>' +
          '<span><i class="sw" style="background:var(--muted-bg);border:1px solid var(--border)"></i>Idle / free</span>' +
          '<span><i class="sw" style="width:2px;height:11px;border-radius:1px;background:var(--fg);opacity:.55"></i>Requested</span>' +
          '</div>';
      }

      function stat(label, value, sub) {
        // Sans, not mono. These are the four largest strings on the page and
        // mono set "76.6 GB / 122.6 GB" wide enough to wrap its own unit onto a
        // second line on a phone, which knocked the tile beside it out of
        // alignment. tabular-nums (see the stylesheet) keeps the digits from
        // jittering on repaint, which is the only thing mono was buying here.
        return '<div><div class="stat-l">' + esc(label) + '</div><div class="stat-v">' + esc(value) + '</div>' +
          (sub ? '<div class="stat-s">' + esc(sub) + '</div>' : '') + '</div>';
      }

      function podStatusPills(s) {
        if (!s) return '';
        var tiles = [
          { l: 'Running', n: s.running, c: 'var(--ok)' },
          { l: 'Pending', n: s.pending, c: 'var(--warn)' },
          { l: 'CrashLoop', n: s.crashLooping, c: 'var(--destructive)' },
          { l: 'Failed', n: s.failed, c: 'var(--destructive)' },
          { l: 'Succeeded', n: s.succeeded, c: 'var(--info)' },
          { l: 'Unknown', n: s.unknown, c: 'var(--muted)' }
        ];
        return '<div class="pills">' + tiles.filter(function (t) { return t.n > 0 || t.l === 'Running'; })
          .map(function (t) {
            return '<span class="pill" style="color:' + t.c + ';background:color-mix(in srgb,' + t.c + ' 15%, transparent)">' +
              '<b class="mono">' + t.n + '</b>' + t.l + '</span>';
          }).join('') + '</div>';
      }

      // Which folded cards the reader has opened.
      //
      // A <details> keeps its open state in the DOM, and render() replaces the
      // whole of #root every poll — so every card the reader had opened snapped
      // shut on the next scrape, 15 seconds after they opened it. Long enough
      // to start reading, short enough to be infuriating. Same class of problem
      // as `expanded` for the node rows, and it wants the same answer: the
      // state belongs in the module, not in the markup, because the markup is
      // rebuilt from data and the reader's intent is not part of that data.
      var folds = {};

      function foldCard(key, fold, head, body) {
        // fold decides whether this card COLLAPSES at all — never fold when
        // something is wrong, so a problem can't hide behind a click. folds[key]
        // only decides whether an already-foldable card is currently open.
        if (!fold) return '<div class="card"><div class="card-h">' + head + '</div>' + body + '</div>';
        return '<div class="card"><details data-fold="' + esc(key) + '"' + (folds[key] ? ' open' : '') + '>' +
          '<summary class="card-h">' + head + '</summary>' + body + '</details></div>';
      }

      function tag(text, color, title) {
        // One pill, one colour. Every badge on this page was an inline
        // color-mix string copy-pasted five times before the new panels needed
        // a sixth; this is that string, once.
        var c = color || 'var(--muted)';
        return '<span class="pill"' + (title ? ' title="' + esc(title) + '"' : '') +
          ' style="color:' + c + ';background:color-mix(in srgb,' + c + ' 15%,transparent)">' +
          esc(text) + '</span>';
      }

      function conditionBadges(c) {
        if (!c) return '';
        var flags = [
          { l: 'MemPressure', on: c.memoryPressure }, { l: 'DiskPressure', on: c.diskPressure },
          { l: 'PIDPressure', on: c.pidPressure }, { l: 'NetUnavailable', on: c.networkUnavailable }
        ].filter(function (f) { return f.on; });
        return flags.map(function (f) {
          return '<span class="pill" style="color:var(--destructive);background:color-mix(in srgb,var(--destructive) 20%,transparent)">⚠ ' + f.l + '</span>';
        }).join('');
      }

      function summary(t) {
        var cpuUsed = t.cpu ? t.cpu.pods + t.cpu.k3s + t.cpu.system : 0;
        var ramUsed = t.ram ? Number(t.ram.podsBytes) + Number(t.ram.k3sBytes) + Number(t.ram.systemBytes) : 0;
        var ramCap = t.ram ? Number(t.ram.capacityBytes) : 0;
        var dUsed = t.disk ? Number(t.disk.usedBytes) : 0, dCap = t.disk ? Number(t.disk.capacityBytes) : 0;
        return '<div class="card"><div class="card-h"><span class="card-t">Cluster Summary</span></div><div class="card-c">' +
          '<div class="grid g4">' +
          stat('Nodes', t.readyNodeCount + ' / ' + t.nodeCount, 'ready') +
          stat('Pods', String(t.podCount), 'running across cluster') +
          stat('CPU', fmtCores(cpuUsed) + ' / ' + fmtCores(t.cpu ? t.cpu.capacity : 0), 'cores') +
          stat('RAM', fmtBytes(ramUsed) + ' / ' + fmtBytes(ramCap), t.ram ? fmtBytes(t.ram.availableBytes) + ' available' : '') +
          '</div>' + podStatusPills(t.podStatus) + legend() +
          '<div class="grid g3">' +
          '<div><div class="lbl">CPU</div>' + cpuBar(t.cpu, t.requests ? t.requests.cpuCores : 0) + '</div>' +
          '<div><div class="lbl">RAM</div>' + ramBar(t.ram, t.requests ? Number(t.requests.ramBytes) : 0) + '</div>' +
          '<div><div class="lbl">Disk (' + fmtBytes(dUsed) + ' of ' + fmtBytes(dCap) + ')</div>' + diskBar(t.disk) + '</div>' +
          '</div></div></div>';
      }

      function nodeIdentity(n) {
        // Who this node is, as opposed to how hard it is working. Sits at the
        // top of the expanded detail because it is the context for everything
        // under it — and because a cordoned node with a taint on it explains a
        // pod table that looks emptier than its neighbours'.
        var ip = n.internalIP || n.tailscaleIP || '';
        // The collector deliberately omits tailscaleIP when it equals the
        // internal one (k3s --node-ip on the tailnet reports a single address),
        // so this is a genuine second path when it is present, not a repeat.
        var ipSub = (n.internalIP && n.tailscaleIP) ? 'tailnet ' + n.tailscaleIP : '';
        var alloc = '';
        if (n.allocatable && n.capacity && n.allocatable.cpuCores && n.capacity.cpuCores) {
          // The GAP is the interesting number — what k3s reserves before a pod
          // can have any of it — so both sides are shown rather than either.
          alloc = fmtCores(n.allocatable.cpuCores) + ' / ' + fmtCores(n.capacity.cpuCores) +
            ' cores · ' + fmtBytes(n.allocatable.ramBytes) + ' / ' + fmtBytes(n.capacity.ramBytes);
        }
        var tiles = '<div class="grid g4">' +
          stat('Role', n.role || '—', n.unschedulable ? 'cordoned' : '') +
          stat('Address', ip || '—', ipSub) +
          stat('k3s', n.kubeletVersion || '—', n.containerRuntimeVersion || '') +
          stat('Age', fmtUptime(n.createdAt) || '—', n.createdAt ? 'joined ' + n.createdAt.slice(0, 10) : '') +
          '</div>';

        var pills = '';
        if (n.unschedulable) pills += tag('Cordoned', 'var(--destructive)');
        (n.taints || []).forEach(function (t) {
          pills += '<span class="pill mono" style="background:var(--muted-bg);font-size:11px">' + esc(t) + '</span>';
        });
        if (n.kernelVersion) {
          pills += '<span class="pill mono" style="background:var(--muted-bg);font-size:11px">' + esc(n.kernelVersion) + '</span>';
        }

        return '<div class="lbl">Identity</div>' + tiles +
          (pills ? '<div class="pills" style="margin-top:.5rem">' + pills + '</div>' : '') +
          (alloc ? '<div class="sub" style="margin-top:.5rem">Allocatable: <span class="mono">' + esc(alloc) + '</span></div>' : '');
      }

      function podExtra(p) {
        // The three columns the per-node and problem-pod tables share, so they
        // cannot describe the same pod differently. Image is .opt: it is the
        // longest string on the row and the least useful one at a glance.
        return '<td class="mono opt" style="font-size:11px;color:var(--muted)" data-l="Image">' +
          esc(p.image || '—') + (p.imageCount ? ' +' + (p.imageCount - 1) : '') + '</td>' +
          '<td class="r" style="font-size:11px;color:var(--muted)" data-l="Age">' +
          esc(fmtUptime(p.startedAt) || '—') + '</td>' +
          '<td class="c opt" style="font-size:11px;color:var(--muted)" data-l="QoS">' +
          esc(p.qos || '—') + '</td>';
      }

      function restartReason(p) {
        // OOMKilled is red and everything else is amber, because they are
        // different jobs: an OOM means the limit is wrong and you can fix it
        // now; a non-zero exit means the program is, and you need its logs.
        if (!p.restartReason) return '';
        var oom = p.restartReason.indexOf('OOMKilled') === 0;
        return tag(p.restartReason, oom ? 'var(--destructive)' : 'var(--warn)');
      }

      function nodeRow(n) {
        var open = !!expanded[n.name];
        var cores = n.cpu ? n.cpu.capacity : 0;
        var ramCap = n.ram ? Number(n.ram.capacityBytes) : 0;
        var up = fmtUptime(n.startedAt);
        var net = n.network ? [fmtRate(n.network.rxBytesPerSec), fmtRate(n.network.txBytesPerSec)] : null;
        var meta = [];
        if (cores > 0) meta.push(fmtCores(cores) + ' cores');
        if (ramCap > 0) meta.push(fmtBytes(ramCap) + ' RAM');
        if (n.podCount != null) meta.push(n.podCount + ' pods');
        if (up) meta.push('up ' + up);
        if (net && (net[0] || net[1])) meta.push('↓' + (net[0] || '—') + ' ↑' + (net[1] || '—'));
        if (n.osImage) meta.push(n.osImage);

        var h = '<div class="card"><button class="node-btn" data-node="' + esc(n.name) + '">' +
          '<div style="min-width:0;flex:1"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px">' +
          '<span class="chev">' + (open ? '▾' : '▸') + '</span>' +
          '<span class="mono" style="font-weight:500">' + esc(n.name) + '</span>' +
          '<span class="pill" style="color:' + (n.ready ? 'var(--ok)' : 'var(--destructive)') +
          ';background:color-mix(in srgb,' + (n.ready ? 'var(--ok)' : 'var(--destructive)') + ' 15%,transparent)">' +
          (n.ready ? 'Ready' : 'NotReady') + '</span>' + conditionBadges(n.conditions) + '</div>' +
          '<div class="node-meta">' + meta.map(function (m) { return '<span>' + esc(m) + '</span>'; }).join('') + '</div></div>' +
          '<div class="node-bars">' +
          '<div><div class="tile-l">CPU</div>' + cpuBar(n.cpu, n.requests ? n.requests.cpuCores : 0) + '</div>' +
          '<div><div class="tile-l">RAM</div>' + ramBar(n.ram, n.requests ? Number(n.requests.ramBytes) : 0) + '</div>' +
          '<div><div class="tile-l">Disk</div>' + diskMini(n.disks) + '</div>' +
          '</div></button>';

        if (open) {
          h += '<div class="detail">';
          h += nodeIdentity(n);
          if (n.disks && n.disks.length) {
            h += '<div class="lbl">Disks</div><div class="scroll"><table><thead><tr><th>Mount</th><th class="r">Used</th>' +
              '<th class="r">Total</th><th class="r">Free</th><th class="r">%</th></tr></thead><tbody>' +
              n.disks.map(function (d) {
                return '<tr><td class="mono" data-l="Mount">' + esc(d.label) + '</td>' +
                  '<td class="r" data-l="Used">' + esc(d.used) + '</td>' +
                  '<td class="r" data-l="Total">' + esc(d.total) + '</td>' +
                  '<td class="r" data-l="Free">' + esc(d.free) + '</td>' +
                  '<td class="r" data-l="Full">' + pct(d.percent) + '</td></tr>';
              }).join('') + '</tbody></table></div>';
          }
          if (n.pods && n.pods.length) {
            h += '<div class="lbl" style="margin-top:1rem">Pods (' + n.pods.length + ')</div><div class="scroll"><table><thead><tr>' +
              '<th>Pod</th><th>Namespace</th><th class="opt">Image</th><th class="r">Age</th><th class="c opt">QoS</th>' +
              '<th class="c">Status</th><th class="r">Restarts</th>' +
              '<th class="r">Last Restart</th><th class="r">CPU</th><th class="r">RAM</th></tr></thead><tbody>' +
              n.pods.map(function (p) {
                return '<tr><td class="mono" style="font-size:12px" data-l="Pod">' + esc(p.name) + '</td>' +
                  '<td class="mono" style="font-size:12px;color:var(--muted)" data-l="Namespace">' + esc(p.namespace || '-') + '</td>' +
                  podExtra(p) +
                  '<td class="c" style="color:' + podStatusColor(p.status) + ';text-transform:capitalize" data-l="Status">' + esc(p.status || 'N/A') + '</td>' +
                  '<td class="r" data-l="Restarts">' + (p.restarts || 0) + '</td>' +
                  '<td class="r" style="font-size:11px;color:var(--muted)" data-l="Last restart">' +
                  esc(p.lastRestartTime ? new Date(p.lastRestartTime).toLocaleString() : 'Never') + '</td>' +
                  '<td class="r" data-l="CPU">' + pct(p.cpuPercent) + '</td>' +
                  '<td class="r" data-l="RAM">' + esc(p.ramUsage || '') + ' (' + pct(p.ramPercent) + ')</td></tr>';
              }).join('') + '</tbody></table></div>';
          }
          h += '</div>';
        }
        return h + '</div>';
      }

      function topPods(title, pods, metric) {
        if (!pods || !pods.length) return '';
        return '<div class="card"><div class="card-h"><span class="card-t">' + esc(title) + '</span></div><div class="card-c"><ol>' +
          pods.map(function (p) {
            var v = metric === 'cpu' ? (p.cpuCores ? fmtCores(p.cpuCores) + ' cores' : '') : (p.ramBytes ? fmtBytes(p.ramBytes) : '');
            return '<li><div class="between"><span class="mono trunc">' + esc(p.name) +
              '<span style="font-size:11px;color:var(--muted)"> · ' + esc(p.namespace) + ' · ' + esc(p.node) + '</span></span>' +
              '<span class="mono" style="font-size:11px;flex-shrink:0">' + esc(v) + '</span></div></li>';
          }).join('') + '</ol></div></div>';
      }

      function problemPods(pods) {
        // Only rendered when something is actually wrong — the summary pills
        // already report "all running" on a healthy cluster. This card names the
        // pods behind a non-zero Pending/Failed/CrashLoop/Unknown count, including
        // unscheduled ones that appear in no node's table.
        if (!pods || !pods.length) return '';
        // The README has always carried the caveat that most Failed pods here
        // are CronJob pods kept around for their logs. Now that every row knows
        // its owner, the caveat can be counted instead of remembered.
        var cron = pods.filter(function (p) {
          return String(p.owner || '').indexOf('CronJob/') === 0;
        }).length;
        return '<div class="card"><div class="card-h"><span class="card-t" style="color:var(--destructive)">Problem pods ' +
          '<span class="count">' + pods.length + '</span></span>' +
          (cron ? '<span class="sub">' + cron + ' of these are CronJob pods kept for logs</span>' : '') + '</div>' +
          '<div class="card-c"><div class="scroll"><table><thead><tr><th>Pod</th><th>Namespace</th>' +
          '<th class="opt">Image</th><th class="r">Age</th><th class="c opt">QoS</th>' +
          '<th class="c">Status</th><th>Reason</th><th class="opt">Owner</th><th>Node</th><th class="r">Restarts</th></tr></thead><tbody>' +
          pods.map(function (p) {
            var reason = esc(p.reason || '');
            var extra = restartReason(p);
            return '<tr><td class="mono" style="font-size:12px" data-l="Pod">' + esc(p.name) + '</td>' +
              '<td class="mono" style="font-size:12px;color:var(--muted)" data-l="Namespace">' + esc(p.namespace || '-') + '</td>' +
              podExtra(p) +
              '<td class="c" style="color:' + podStatusColor(p.status) + '" data-l="Status">' + esc(p.status || 'N/A') + '</td>' +
              '<td class="mono" style="font-size:12px" data-l="Reason">' + (reason || '—') +
              (extra ? ' ' + extra : '') + '</td>' +
              '<td class="mono opt" style="font-size:11px;color:var(--muted)" data-l="Owner">' + esc(p.owner || '—') + '</td>' +
              '<td class="mono" style="font-size:12px;color:var(--muted)" data-l="Node">' + esc(p.node || '—') + '</td>' +
              '<td class="r" data-l="Restarts">' + (p.restarts || 0) + '</td></tr>';
          }).join('') + '</tbody></table></div></div></div>';
      }

      function namespaces(list) {
        // "What is actually eating this cluster", one altitude coarser than the
        // top-consumer cards beside it. No publish flag and no API call: every
        // figure is a sum of per-pod numbers already on this page.
        if (!list || !list.length) return '';
        // Folded above 8 rows. The usual rule — never fold when something is
        // wrong — is satisfied vacuously here rather than forgotten: a
        // namespace has no failure state to hide.
        var fold = list.length > 8;
        var head = '<span class="card-t">Namespaces <span class="count">' + list.length + '</span></span>' +
          '<span class="sub">by memory</span>';
        return foldCard('namespaces', fold, head,
          '<div class="card-c"><div class="scroll"><table><thead><tr><th>Namespace</th><th class="r">Pods</th>' +
          '<th class="r">CPU</th><th class="r">RAM</th><th class="r opt">Req CPU</th><th class="r opt">Req RAM</th>' +
          '</tr></thead><tbody>' +
          list.map(function (r) {
            return '<tr><td class="mono" style="font-size:12px" data-l="Namespace">' + esc(r.namespace || '-') + '</td>' +
              '<td class="r mono" style="font-size:12px" data-l="Pods">' + r.pods + '</td>' +
              '<td class="r mono" style="font-size:12px" data-l="CPU">' + esc(fmtCores(r.cpuCores)) + '</td>' +
              '<td class="r mono" style="font-size:12px" data-l="RAM">' + esc(fmtBytes(r.ramBytes)) + '</td>' +
              '<td class="r mono opt" style="font-size:12px;color:var(--muted)" data-l="Req CPU">' + esc(fmtCores(r.reqCpuCores)) + '</td>' +
              '<td class="r mono opt" style="font-size:12px;color:var(--muted)" data-l="Req RAM">' + esc(fmtBytes(r.reqRamBytes)) + '</td></tr>';
          }).join('') + '</tbody></table></div></div>');
      }

      function storage(list) {
        // PersistentVolumeClaims, with live fill from the same kubelet volume
        // stats the node disk bars are drawn from — so the two cannot disagree.
        if (!list || !list.length) return '';
        var unbound = list.filter(function (r) { return r.phase !== 'Bound'; });
        var full = list.filter(function (r) { return (r.percent || 0) >= 80; });
        // Same rule as the workload cards: fold only when there is nothing to
        // say, and never hide a problem behind a click.
        var fold = !unbound.length && !full.length && list.length > 8;
        var head = '<span class="card-t">Storage <span class="count">' + list.length + '</span></span>' +
          (unbound.length ? tag(unbound.length + ' not bound', 'var(--destructive)') : '') +
          (full.length ? tag(full.length + ' over 80%', 'var(--warn)') : '') +
          (!unbound.length && !full.length ? '<span class="sub">all bound, none full</span>' : '');
        return foldCard('storage', fold, head,
          '<div class="card-c"><div class="scroll"><table><thead><tr><th>Claim</th><th>Namespace</th>' +
          '<th class="opt">Class</th><th class="r">Size</th><th class="r">Used</th><th class="r">Full</th>' +
          '<th class="c opt">Phase</th></tr></thead><tbody>' +
          list.map(function (r) {
            // An em dash, NOT 0%. kubelet only reports volumes that are
            // currently mounted, so a Bound claim whose pod is not running has
            // no stats at all — and "0%" would read as empty when the honest
            // answer is unknown.
            var used = r.usedBytes == null ? '<span style="color:var(--muted)">—</span>' : esc(fmtBytes(r.usedBytes));
            var fullCell = r.percent == null ? '<span style="color:var(--muted)">—</span>' : pct(r.percent);
            return '<tr><td class="mono" style="font-size:12px" data-l="Claim">' + esc(r.name) + '</td>' +
              '<td class="mono" style="font-size:12px;color:var(--muted)" data-l="Namespace">' + esc(r.namespace || '-') + '</td>' +
              '<td class="mono opt" style="font-size:11px;color:var(--muted)" data-l="Class">' + esc(r.storageClass || '—') + '</td>' +
              '<td class="r mono" style="font-size:12px" data-l="Size">' + esc(r.capacityBytes ? fmtBytes(r.capacityBytes) : '—') + '</td>' +
              '<td class="r mono" style="font-size:12px" data-l="Used">' + used + '</td>' +
              '<td class="r" data-l="Full">' + fullCell + '</td>' +
              '<td class="c opt" data-l="Phase">' +
              (r.phase === 'Bound' ? '<span class="sub">Bound</span>' : tag(r.phase || 'Unknown', 'var(--destructive)')) +
              '</td></tr>';
          }).join('') + '</tbody></table></div></div>');
      }

      function routing(list) {
        // The routing table for the whole estate. Reference material rather
        // than health, which is why it sits below the workload cards.
        if (!list || !list.length) return '';
        var silent = list.filter(function (r) { return r.auth === 'silent'; });
        var noTls = list.filter(function (r) { return !r.tls; });
        var pub = list.filter(function (r) { return r.exposure === 'public'; }).length;
        var fold = !silent.length && !noTls.length && list.length > 8;
        var head = '<span class="card-t">Routing <span class="count">' + list.length + '</span></span>' +
          '<span class="sub">' + pub + ' on the tunnel</span>' +
          (silent.length ? tag(silent.length + ' unanswered', 'var(--warn)') : '') +
          (noTls.length ? tag(noTls.length + ' without TLS', 'var(--destructive)') : '');

        function authCell(r) {
          // "declared" is NEUTRAL, and getting this backwards would paint most
          // of the cluster red. Authelia cannot sit behind itself, the
          // sms-relay webhook is HMAC-signed, Jellyfin's TV apps need the raw
          // API — all of them correctly unauthenticated, and all of them say
          // so with an annotation. What infra/ingress-policy rule 4 catches is
          // SILENCE: no forward-auth and no annotation, i.e. nobody decided.
          if (r.auth === 'authed') return tag('forward-auth', 'var(--ok)');
          if (r.auth === 'declared') return '<span class="sub">unauth (declared)</span>';
          return tag('no answer', 'var(--warn)', 'No forward-auth middleware and no ' +
            'ingress.zachd/public-unauthenticated annotation — see infra/ingress-policy rule 4');
        }

        return foldCard('routing', fold, head,
          '<div class="card-c"><div class="scroll"><table><thead><tr><th>Host</th><th class="opt">Path</th>' +
          '<th class="opt">Backend</th><th class="c">Exposure</th><th class="c">TLS</th><th class="c">Auth</th>' +
          '</tr></thead><tbody>' +
          list.map(function (r) {
            return '<tr><td class="mono" style="font-size:12px" data-l="Host">' + esc(r.host || '—') + '</td>' +
              '<td class="mono opt" style="font-size:11px;color:var(--muted)" data-l="Path">' + esc(r.path || '/') + '</td>' +
              '<td class="mono opt" style="font-size:11px;color:var(--muted)" data-l="Backend">' + esc(r.backend || '—') + '</td>' +
              '<td class="c" data-l="Exposure">' +
              (r.exposure === 'public'
                ? tag('tunnel', 'var(--warn)', 'Reachable from the internet via the Cloudflare tunnel')
                : '<span class="sub">tailnet</span>') + '</td>' +
              '<td class="c mono" style="font-size:11px" data-l="TLS">' +
              (r.tls ? esc(r.tls) : tag('none', 'var(--destructive)')) + '</td>' +
              '<td class="c" data-l="Auth">' + authCell(r) + '</td></tr>';
          }).join('') + '</tbody></table></div></div>');
      }

      function cronJobs(list) {
        if (!list || !list.length) return '';
        var failing = list.filter(function (r) { return r.lastRunFailed; });
        var fold = !failing.length && list.length > 8;
        var head = '<span class="card-t">CronJobs <span class="count">' + list.length + '</span></span>' +
          (failing.length ? tag(plural(failing.length, 'last run') + ' failed', 'var(--warn)')
                          : '<span class="sub">all last runs succeeded</span>');
        return foldCard('cronjobs', fold, head,
          '<div class="card-c"><div class="scroll"><table><thead><tr><th>Name</th><th>Namespace</th>' +
          '<th class="mono">Schedule</th><th class="r">Last run</th><th class="r">Last success</th>' +
          '<th class="c opt">Active</th></tr></thead><tbody>' +
          list.map(function (r) {
            return '<tr><td class="mono" style="font-size:12px" data-l="Name">' + esc(r.name) +
              (r.suspended ? ' <span class="pill" style="background:var(--muted-bg);font-size:10px">suspended</span>' : '') +
              (r.lastRunFailed ? ' ' + tag('last run failed', 'var(--warn)') : '') + '</td>' +
              '<td class="mono" style="font-size:12px;color:var(--muted)" data-l="Namespace">' + esc(r.namespace || '-') + '</td>' +
              '<td class="mono" style="font-size:11px" data-l="Schedule">' + esc(r.schedule || '—') + '</td>' +
              '<td class="r" style="font-size:11px;color:var(--muted)" data-l="Last run">' +
              esc(fmtRel(r.lastScheduleTime) || '—') + '</td>' +
              '<td class="r" style="font-size:11px;color:' + (r.lastRunFailed ? 'var(--warn)' : 'var(--muted)') + '" data-l="Last success">' +
              esc(fmtRel(r.lastSuccessfulTime) || 'never') + '</td>' +
              '<td class="c opt mono" style="font-size:12px" data-l="Active">' + (r.activeCount || 0) + '</td></tr>';
          }).join('') + '</tbody></table></div></div>');
      }

      function jobFailures(list) {
        // Rendered only when non-empty, like problem pods: a cluster with no
        // failed jobs should not carry a card saying so twice.
        if (!list || !list.length) return '';
        return '<div class="card"><div class="card-h"><span class="card-t" style="color:var(--warn)">Job failures ' +
          '<span class="count">' + list.length + '</span></span></div>' +
          '<div class="card-c"><div class="scroll"><table><thead><tr><th>Job</th><th>Namespace</th>' +
          '<th class="opt">Owner</th><th class="r">Started</th><th class="r">Failed</th><th>Reason</th>' +
          '</tr></thead><tbody>' +
          list.map(function (r) {
            return '<tr><td class="mono" style="font-size:12px" data-l="Job"' +
              (r.message ? ' title="' + esc(r.message) + '"' : '') + '>' + esc(r.name) + '</td>' +
              '<td class="mono" style="font-size:12px;color:var(--muted)" data-l="Namespace">' + esc(r.namespace || '-') + '</td>' +
              '<td class="mono opt" style="font-size:11px;color:var(--muted)" data-l="Owner">' + esc(r.owner || '—') + '</td>' +
              '<td class="r" style="font-size:11px;color:var(--muted)" data-l="Started">' + esc(fmtRel(r.startTime) || '—') + '</td>' +
              '<td class="r mono" style="font-size:12px" data-l="Failed">' + (r.failed || 0) + '</td>' +
              '<td class="mono" style="font-size:11px" data-l="Reason">' + esc(r.reason || '—') + '</td></tr>';
          }).join('') + '</tbody></table></div></div></div>';
      }

      function workloads(title, ds) {
        if (!ds || !ds.length) return '';
        function color(c) {
          if (c === 'Failure') return 'var(--destructive)';
          if (c === 'Progressing') return 'var(--warn)';
          return 'var(--ok)';
        }

        // 71 deployments, all Available, is one fact and 71 rows. Folded away
        // when there is nothing to say about them — and left open the moment
        // there is, because a card that hides a Failure behind a click is worse
        // than no card. On a phone this is the difference between a page you
        // scroll and a page you scroll past.
        var unhealthy = ds.filter(function (d) { return d.condition !== 'Available'; });
        var fold = !unhealthy.length && ds.length > 8;
        var head = '<span class="card-t">' + esc(title) + ' <span class="count">' + ds.length + '</span></span>' +
          (unhealthy.length
            ? '<span class="pill" style="color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)">' +
              unhealthy.length + ' not available</span>'
            : '<span class="sub">all available</span>');

        return foldCard(title, fold, head,
          '<div class="card-c"><div class="scroll"><table><thead><tr><th>Name</th><th>Namespace</th><th class="r">Ready</th>' +
          '<th class="r">Available</th><th class="r">Updated</th><th class="c">Status</th></tr></thead><tbody>' +
          ds.map(function (d) {
            return '<tr><td class="mono" style="font-size:12px" data-l="Name"' + (d.message ? ' title="' + esc(d.message) + '"' : '') + '>' +
              esc(d.name) + '</td><td class="mono" style="font-size:12px;color:var(--muted)" data-l="Namespace">' + esc(d.namespace) + '</td>' +
              '<td class="r mono" style="font-size:12px" data-l="Ready">' + d.ready + ' / ' + d.desired + '</td>' +
              '<td class="r mono" style="font-size:12px" data-l="Available">' + d.available + '</td>' +
              '<td class="r mono" style="font-size:12px" data-l="Updated">' + d.updated + '</td>' +
              '<td class="c" data-l="Status"><span class="pill" style="color:' + color(d.condition) +
              ';background:color-mix(in srgb,' + color(d.condition) + ' 15%,transparent)">' + esc(d.condition) + '</span></td></tr>';
          }).join('') + '</tbody></table></div></div>');
      }

      function events(evs) {
        if (!evs) return '';
        var warns = evs.filter(function (e) { return e.type === 'Warning'; });
        // Two pills, not a dropdown: the whole control is one tap on a phone
        // and its state is readable without opening anything.
        var toggle = ['warn', 'all'].map(function (k) {
          var on = eventFilter === k;
          return '<button class="pill" data-evfilter="' + k + '" style="cursor:pointer;border:0;' +
            (on ? 'color:var(--fg);background:var(--muted-bg);font-weight:600'
                : 'color:var(--muted);background:transparent') + '">' +
            (k === 'warn' ? 'Warnings' : 'All') + '</button>';
        }).join('');
        var shown = eventFilter === 'warn' ? warns : evs;
        var head = '<span class="card-t">Events <span class="count">' + shown.length + '</span></span>' +
          '<span class="sub">' + warns.length + ' warning' + (warns.length === 1 ? '' : 's') +
          ' of ' + evs.length + '</span>' +
          '<span style="margin-left:auto;display:flex;gap:2px">' + toggle + '</span>';
        if (!shown.length) {
          return '<div class="card"><div class="card-h">' + head + '</div>' +
            '<div class="card-c"><div class="sub">Nothing to show.</div></div></div>';
        }
        return '<div class="card"><div class="card-h">' + head + '</div><div class="card-c">' +
          shown.map(function (e) {
            var warn = e.type === 'Warning';
            return '<div class="ev"><div class="ev-h">' +
              '<b style="color:' + (warn ? 'var(--destructive)' : 'var(--muted)') + '">' + esc(e.reason) + '</b>' +
              '<span class="mono" style="font-size:11px;color:var(--muted)">' + esc(e.involvedKind) + '/' + esc(e.involvedName) + '</span>' +
              (e.namespace ? '<span class="mono" style="font-size:11px;color:var(--muted)">in ' + esc(e.namespace) + '</span>' : '') +
              (e.count > 1 ? '<span class="pill" style="background:var(--muted-bg)">×' + e.count + '</span>' : '') +
              '<span style="margin-left:auto;font-size:11px;color:var(--muted)" title="' + esc(e.lastSeen || '') + '">' + esc(fmtRel(e.lastSeen)) + '</span>' +
              '</div><div class="ev-m">' + esc(e.message) + '</div></div>';
          }).join('') + '</div></div>';
      }

      // Stable per name, so a service keeps the same colour across deploys and
      // between the two replicas. Any hash would do; this one is short and the
      // page already has no dependencies.
      function tileHue(s) {
        var h = 0;
        for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
        return h % 360;
      }

      function monogram(name) {
        // Two letters where the name has two parts, one where it doesn't.
        // Splitting on dots as well as spaces is what makes the site tiles
        // legible: 'old.diemer.codes' becomes OD rather than O.
        var parts = String(name).split(/[^A-Za-z0-9]+/).filter(Boolean);
        var s = parts.length > 1 ? parts[0][0] + parts[1][0] : (parts[0] || '?').slice(0, 2);
        return s.toUpperCase();
      }

      function catalog(list, categories) {
        // The launcher. Every service in the house, each one linking to the
        // address you would actually type — which is the PUBLIC name when a
        // service has one, because the tailnet name is a dead link from
        // anywhere else and this page is mostly read on a phone.
        //
        // The collector decides that address; nothing here re-derives it. See
        // build_catalog in extras.py.
        if (!list || !list.length) return '';
        var bad = list.filter(function (s) { return s.state === 'down'; });
        var warn = list.filter(function (s) { return s.state === 'warn'; });
        var order = {};
        (categories || []).forEach(function (c, i) { order[c] = i; });
        var groups = [];
        var seen = {};
        list.forEach(function (s) {
          var c = s.category || 'Other';
          if (!seen[c]) { seen[c] = []; groups.push(c); }
          seen[c].push(s);
        });
        // The configured order first; anything the list doesn't name goes after
        // it, alphabetically — which is where 'Unlisted' lands without being
        // special-cased for it.
        groups.sort(function (a, b) {
          var ai = a in order ? order[a] : 500, bi = b in order ? order[b] : 500;
          return ai - bi || (a < b ? -1 : a > b ? 1 : 0);
        });

        // What the second line of a tile says. NOT the full hostname, which is
        // the obvious choice and the wrong one: `jellyfin.zachd.duckdns.org`
        // does not fit a 110px tile and truncates to `jellyfin.zachd.duc…`,
        // which spends the whole line repeating the tile's own name and then
        // hides the only part a reader wanted — the domain, i.e. whether this
        // opens from anywhere or only from the tailnet.
        //
        // So it shows the registrable domain — the part somebody registered and
        // pays for — which is exactly the public/tailnet distinction and always
        // fits: `diemer.codes`, `talaria.deals`, `kelsey.green`,
        // `zachd.duckdns.org`. Repetitive down a column, and true at every
        // width; the full host is a hover away in the title and one click away
        // in the href.
        //
        // duckdns.org needs the extra label because it is a dynamic-DNS
        // provider: `duckdns.org` is theirs and `zachd.duckdns.org` is ours, so
        // trimming to two labels would name the wrong party AND collapse every
        // tailnet tile onto a string that says nothing about this cluster. It
        // is the same rule a public-suffix list encodes, hardcoded for the one
        // suffix in play here rather than shipping the list.
        var DEEP_SUFFIXES = ['duckdns.org'];
        function shortHost(host) {
          var keep = 2;
          DEEP_SUFFIXES.forEach(function (suf) {
            if (host === suf || host.slice(-(suf.length + 1)) === '.' + suf) keep = 3;
          });
          var parts = host.split('.');
          return parts.length <= keep ? host : parts.slice(parts.length - keep).join('.');
        }

        function tile(s) {
          var href = s.url || '';
          // An address is shown whole, port and all: it is not a link, so the
          // line IS the answer rather than a label for one.
          var addr = s.url ? shortHost(s.url.replace(/^https?:\/\//, '').replace(/\/.*$/, '').split(':')[0])
                           : (s.address || s.note || 'no browser UI');
          var pub = s.exposure === 'public';
          var hint = [s.namespace + '/' + s.service, s.detail || '',
                      s.hosts && s.hosts.length > 1 ? 'also ' + s.hosts.slice(1).join(', ') : '',
                      s.auth === 'authed' ? 'behind Authelia' : '',
                      href ? (pub ? 'public' : 'tailnet only') : ''
                     ].filter(Boolean).join(' · ');
          var mark = s.icon
            ? '<img class="tile-i" src="' + esc(s.icon) + '" alt="" loading="lazy" data-mono="' + esc(monogram(s.name)) + '">'
            : '<span class="tile-m" style="background:hsl(' + tileHue(s.slug || s.name) + ' 42% 42%)">' +
              esc(monogram(s.name)) + '</span>';
          var body = mark +
            '<span class="tile-n">' + esc(s.name) + '</span>' +
            '<span class="tile-h' + (pub ? ' pub' : '') + '">' + esc(addr) + '</span>' +
            '<i class="tile-s ' + esc(s.state || 'unknown') + '"></i>';
          // target=_blank on every one of these: this is a dashboard you come
          // back to, and replacing it with Sonarr costs you the page you were
          // reading. rel is not optional with it.
          return href
            ? '<a class="tile" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer" title="' + esc(hint) + '">' + body + '</a>'
            : '<div class="tile off" title="' + esc(hint) + '">' + body + '</div>';
        }

        var body = groups.map(function (c) {
          var rows = seen[c];
          var trouble = rows.filter(function (s) { return s.state === 'down' || s.state === 'warn'; }).length;
          var head = '<span>' + esc(c) + '</span><span class="count">' + rows.length + '</span>' +
            (trouble ? tag(trouble + ' to look at', 'var(--warn)') : '');
          var grid = '<div class="tiles">' + rows.map(tile).join('') + '</div>';
          // Same rule the workload lists follow: a long group folds, and never
          // when something inside it is wrong. Infrastructure is thirteen tiles
          // nobody opens this page for, and on a phone it is most of the first
          // screen; a group with a red dot in it is not allowed to hide.
          if (rows.length <= 8 || trouble) return '<div class="cat">' + head + '</div>' + grid;
          var key = 'cat:' + c;
          return '<details class="cat-f" data-fold="' + esc(key) + '"' + (folds[key] ? ' open' : '') + '>' +
            '<summary class="cat">' + head + '</summary>' + grid + '</details>';
        }).join('');

        var head = '<span class="card-t"' + (bad.length ? ' style="color:var(--destructive)"' : '') +
          '>Services <span class="count">' + list.length + '</span></span>' +
          (bad.length ? tag(bad.length + ' down', 'var(--destructive)')
            : warn.length ? tag(warn.length + ' degraded', 'var(--warn)')
            : '<span class="sub">all up</span>');
        return '<div class="card"><div class="card-h">' + head + '</div>' +
          '<div class="card-c">' + body + '</div></div>';
      }

      function endpointChecks(list) {
        // Endpoint health for things whose failure is invisible in pod status:
        // a Running pod whose upstream is unreachable still looks green above.
        //
        // NAMED 'Endpoint checks' RATHER THAN 'Services', which is what this
        // card said before the catalog existed. Two cards called Services, one
        // listing six probes and one listing forty-five services, is a page
        // that argues with itself about what a service is. The probes are the
        // narrower thing, so they took the narrower name.
        //
        // The Target column renders only when the collector wrote a url, so
        // publish.serviceCheckUrls can be flipped off without touching this.
        if (!list || !list.length) return '';
        var showUrl = list.some(function (s) { return !!s.url; });
        var down = list.filter(function (s) { return !s.ok; }).length;
        return '<div class="card"><div class="card-h"><span class="card-t"' +
          (down ? ' style="color:var(--destructive)"' : '') + '>Endpoint checks ' +
          '<span class="count">' + list.length + '</span></span>' +
          (down ? '<span class="pill" style="color:var(--destructive);background:color-mix(in srgb,var(--destructive) 15%,transparent)">' +
                  down + ' down</span>' : '<span class="sub">all up</span>') + '</div>' +
          '<div class="card-c"><div class="scroll"><table><thead><tr><th>Service</th>' +
          (showUrl ? '<th class="opt">Target</th>' : '') +
          '<th class="c">State</th><th class="c">Detail</th><th class="r">Latency</th>' +
          '</tr></thead><tbody>' +
          list.map(function (s) {
            var c = s.ok ? 'var(--ok)' : 'var(--destructive)';
            // A reachable-but-unhealthy service reports its HTTP code; an
            // unreachable one reports why the connection failed.
            var detail = s.reason ? s.reason : ('HTTP ' + (s.status == null ? '—' : s.status));
            return '<tr><td data-l="Service">' + esc(s.name) + '</td>' +
              (showUrl ? '<td class="mono opt" style="font-size:11px;color:var(--muted)" data-l="Target">' +
                esc(s.url || '—') + '</td>' : '') +
              '<td class="c" style="color:' + c + '" data-l="State">' + (s.ok ? 'up' : 'down') + '</td>' +
              '<td class="c mono" style="font-size:12px;color:var(--muted)" data-l="Detail">' + esc(detail) + '</td>' +
              '<td class="r mono" style="font-size:12px" data-l="Latency">' +
              (s.latencyMs == null ? '—' : s.latencyMs + 'ms') + '</td></tr>';
          }).join('') + '</tbody></table></div></div></div>';
      }

      function nodeUpdates(u) {
        // Weekly node-lane report (scripts/k3s/versions-report.sh): what apt,
        // kernel, k3s and tailscale upgrades are waiting. Absent until the
        // first report publishes its ConfigMap.
        if (!u || !u.nodes || !u.nodes.length) return '';
        var behind = 0;
        u.nodes.forEach(function (n) {
          if (n.aptPending || n.rebootRequired || n.kernelRunning !== n.kernelNewest ||
              (u.k3sStable && n.k3s !== u.k3sStable) ||
              (u.tailscaleLatest && n.tailscale !== u.tailscaleLatest)) behind++;
        });
        var drift = function (val, want) {
          if (!want || val === want) return '<span class="mono" style="font-size:12px">' + esc(val || '—') + '</span>';
          return '<span class="mono" style="font-size:12px;color:var(--warn)" title="latest: ' + esc(want) + '">' + esc(val || '—') + '</span>';
        };
        return '<div class="card"><div class="card-h"><span class="card-t">Pending upgrades</span>' +
          (behind ? '<span class="pill" style="color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)">' +
                    plural(behind, 'node') + ' behind</span>' : '<span class="sub">all current</span>') +
          '<span style="margin-left:auto;font-size:11px;color:var(--muted)" title="' + esc(u.generatedAt || '') + '">reported ' +
          esc(fmtRel(u.generatedAt) || '—') + '</span></div>' +
          '<div class="card-c"><div class="sub" style="margin-bottom:8px">k3s stable: <span class="mono">' + esc(u.k3sStable || '?') +
          '</span> · tailscale latest: <span class="mono">' + esc(u.tailscaleLatest || '?') + '</span></div>' +
          '<div class="scroll"><table><thead><tr><th>Node</th><th class="r">apt pending (security)</th>' +
          '<th class="c">Reboot</th><th>Kernel</th><th>k3s</th><th>tailscale</th></tr></thead><tbody>' +
          u.nodes.map(function (n) {
            var apt = n.aptPending
              ? '<span style="' + (n.aptSecurity ? 'color:var(--warn);font-weight:600' : '') + '">' +
                n.aptPending + ' (' + n.aptSecurity + ')</span>'
              : '0';
            var kern = n.kernelRunning === n.kernelNewest
              ? '<span class="mono" style="font-size:12px">' + esc(n.kernelRunning) + '</span>'
              : '<span class="mono" style="font-size:12px;color:var(--warn)">' + esc(n.kernelRunning) + ' → ' + esc(n.kernelNewest) + '</span>';
            return '<tr><td class="mono" style="font-size:12px" data-l="Node">' + esc(n.name) + '</td>' +
              '<td class="r" data-l="apt pending (security)">' + apt + '</td>' +
              '<td class="c" data-l="Reboot">' + (n.rebootRequired ? '<span style="color:var(--warn);font-weight:600">yes</span>' : 'no') + '</td>' +
              '<td data-l="Kernel">' + kern + '</td>' +
              '<td data-l="k3s">' + drift(n.k3s, u.k3sStable) + '</td>' +
              '<td data-l="tailscale">' + drift(n.tailscale, u.tailscaleLatest) + '</td></tr>';
          }).join('') + '</tbody></table></div></div></div>';
      }

      function render(d) {
        var h = '';
        if (d.totals) h += summary(d.totals);
        // The launcher, directly under the summary. It is what this page is
        // opened FOR most of the time — "is Jellyfin up, and what was the
        // address" — and every tile carries its own state, so putting it above
        // the problem cards does not bury anything: a service in trouble has a
        // red dot in the grid and a row in the card below it.
        h += catalog(d.catalog, CATEGORIES);
        h += endpointChecks(d.services);
        // Surfaced high, right under the summary: if anything is wrong it should
        // be the first thing you see, not buried below the node list.
        h += problemPods(d.problemPods);
        h += '<h2>Nodes <span class="count">' + d.nodeDisks.length + '</span></h2>';
        if (!d.nodeDisks.length) h += '<div class="sub">No node data available.</div>';
        h += d.nodeDisks.map(nodeRow).join('');
        if (d.totals && d.totals.topCpuPods && d.totals.topCpuPods.length) {
          h += '<div class="grid g2">' + topPods('Top CPU consumers', d.totals.topCpuPods, 'cpu') +
            topPods('Top RAM consumers', d.totals.topRamPods, 'ram') + '</div>';
        }
        // Same question as the two cards above, one altitude coarser.
        h += namespaces(d.totals && d.totals.namespaces);
        h += storage(d.storage);
        h += nodeUpdates(d.nodeUpdates);
        h += workloads('Deployments', d.deployments);
        h += workloads('StatefulSets', d.statefulSets);
        h += workloads('DaemonSets', d.daemonSets);
        // The fourth workload kind, and the failures it explains.
        h += cronJobs(d.cronJobs);
        h += jobFailures(d.jobFailures);
        // Reference material, not health — so it sits below everything that is.
        h += routing(d.ingresses);
        h += events(d.recentEvents);
        document.getElementById('root').innerHTML = h;

        Array.prototype.forEach.call(document.querySelectorAll('[data-node]'), function (b) {
          b.addEventListener('click', function () {
            var k = b.getAttribute('data-node');
            expanded[k] = !expanded[k];
            render(d);
          });
        });
        // Same delegation pattern as the node expander above, deliberately —
        // one more querySelectorAll rather than any new machinery.
        Array.prototype.forEach.call(document.querySelectorAll('[data-evfilter]'), function (b) {
          b.addEventListener('click', function () {
            eventFilter = b.getAttribute('data-evfilter');
            render(d);
          });
        });
        // 'toggle', not 'click' on the summary: a <details> can also be opened
        // by keyboard, by find-in-page, and by the browser restoring it — and
        // only 'toggle' hears all of those. Recording state without re-rendering
        // is the point; the DOM already did the work.
        // An icon that will not load becomes the monogram it would have had.
        // This is not hypothetical: the two replicas fetch icons independently
        // into their own emptyDir, so for a few minutes after a rollout one of
        // them can serve a status.json naming a file the OTHER replica has not
        // written yet — and which replica answers is per request. A broken
        // image icon on a status page reads as a broken service.
        Array.prototype.forEach.call(document.querySelectorAll('img.tile-i'), function (img) {
          img.addEventListener('error', function () {
            var m = document.createElement('span');
            m.className = 'tile-m';
            m.style.background = 'hsl(' + tileHue(img.getAttribute('src') || '') + ' 42% 42%)';
            m.textContent = img.getAttribute('data-mono') || '?';
            if (img.parentNode) img.parentNode.replaceChild(m, img);
          });
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-fold]'), function (el) {
          el.addEventListener('toggle', function () {
            folds[el.getAttribute('data-fold')] = el.open;
          });
        });
      }

      // The page's own liveness check: nginx keeps serving the last status.json
      // even if the collector has died, so a timestamp that keeps aging is the
      // only signal the data has gone stale. Three intervals is the threshold —
      // enough that one slow scrape doesn't cry wolf.
      function isStale(d) {
        var ageSec = Math.max(0, Math.floor((Date.now() - Date.parse(d.generatedAt)) / 1000));
        return isFinite(ageSec) && ageSec > (POLL_MS / 1000) * 3;
      }

      function setMeta(d, err) {
        var el = document.getElementById('meta');
        if (err) { el.innerHTML = '<span style="color:var(--destructive)">' + esc(err) + '</span>'; return; }
        // Data is collected on a fixed schedule, so say how old it is rather than
        // implying it's live.
        var age = fmtRel(d.generatedAt);
        var every = Math.round(POLL_MS / 1000);
        if (isStale(d)) {
          el.innerHTML = '<span style="color:var(--destructive);font-weight:600">Stale — last collected ' +
            esc(age) + '; the collector may be down</span> · expected every ' + every + 's';
          return;
        }
        el.textContent = 'Collected ' + (age || 'just now') + ' · refreshes every ' + every + 's';
      }

      var last = null;
      function tick() {
        fetch('status.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(function (d) { last = d; render(d); setMeta(d); setVerdict(verdict(d)); })
          .catch(function (e) {
            if (!last) document.getElementById('root').innerHTML = '<div class="err">Failed to load cluster status.</div>';
            setMeta(null, 'Failed to refresh: ' + e.message);
            // Whatever the last poll said is no longer something this page can
            // stand behind — leaving a green badge up while the fetch is failing
            // is the same lie as leaving one up over stale data.
            setVerdict({ level: 'stale', color: 'var(--muted)', label: 'Not reachable', rest: [e.message] });
          });
      }
      tick();
      setInterval(tick, POLL_MS);
      // Keep the relative "collected Xs ago" honest between polls — and the
      // badge with it, since going stale is something that happens on the clock
      // rather than on a response.
      setInterval(function () { if (last) { setMeta(last); setVerdict(verdict(last)); } }, 1000);
    })();
