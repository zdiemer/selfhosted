apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cluster-status.fullname" . }}
  labels:
    {{- include "cluster-status.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cluster-status.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the script or the page changes — both are mounted
        # from ConfigMaps, and a ConfigMap edit alone would otherwise leave the
        # running collector on the old code until something else restarted it.
        checksum/collector: {{ include (print $.Template.BasePath "/collector-configmap.yaml") . | sha256sum }}
        checksum/web: {{ include (print $.Template.BasePath "/web-configmap.yaml") . | sha256sum }}
        checksum/brand: {{ include (print $.Template.BasePath "/brand-configmap.yaml") . | sha256sum }}
        checksum/service-icons: {{ include (print $.Template.BasePath "/service-icons-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "cluster-status.selectorLabels" . | nindent 8 }}
        {{- if .Values.ingress.enabled }}
        # Ships this pod's logs to infra/alloy. Derived from the chart's
        # own ingress switch, so the allowlist cannot drift out of sync.
        logging.zachd/external-ingress: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "cluster-status.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Explicit rather than inherited: it has to cover the web container's
      # preStop sleep plus nginx's SIGQUIT drain. The collector sidecar has no
      # shutdown work of its own — it writes a JSON file on an interval — so it
      # is not the constraint here.
      terminationGracePeriodSeconds: 30
      # Spread across nodes: a status page that goes down with one node isn't
      # much of a status page.
      #
      # This was a preferred podAntiAffinity, which is a hint the scheduler is
      # free to ignore — and "currently spread" then depends on scheduling
      # order rather than on anything enforcing it. DoNotSchedule makes it a
      # constraint: with 7 nodes and 2 replicas there is no plausible state
      # where spreading them is unsatisfiable, so the soft form bought nothing
      # except the chance to silently not apply.
      #
      # matchLabelKeys confines the skew calculation to a single
      # pod-template-hash, so during a rollout the new ReplicaSet spreads
      # against its own pods rather than against the outgoing ones. Without it
      # the surge pod is measured against pods that are about to disappear, can
      # find every node "full", and the rollout stalls.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "cluster-status.selectorLabels" . | nindent 14 }}
      volumes:
        - name: data
          emptyDir: {}
        - name: collector
          configMap:
            name: {{ include "cluster-status.fullname" . }}-collector
        - name: web
          configMap:
            name: {{ include "cluster-status.fullname" . }}-web
        # Icons, manifest and preview card. A whole-directory mount rather than
        # per-file subPaths: nginx serves this with `root`, so the set can grow
        # by adding a file to brand/ without touching the Deployment.
        - name: brand
          configMap:
            name: {{ include "cluster-status.fullname" . }}-brand
        # Seeded catalog icons, mounted into the COLLECTOR rather than into
        # nginx. Everything the page serves out of /icons comes from the shared
        # emptyDir, so a seeded file has to be copied there at startup like a
        # fetched one — see seed_icons(). Mounting this into the web container
        # as a second root would mean two places a tile's icon could come from
        # and two cache policies over them.
        - name: service-icons
          configMap:
            name: {{ include "cluster-status.fullname" . }}-service-icons
        # nginx creates its *_temp_path dirs at startup, so an empty volume here
        # is fine — but it needs somewhere writable, and the root fs is not.
        - name: nginx-cache
          emptyDir: {}
        # Separate volume: the unprivileged image writes its pid to /tmp, and
        # sharing one emptyDir would put nginx.pid inside the cache dir.
        - name: nginx-tmp
          emptyDir: {}
      containers:
        # The only thing that talks to the Kubernetes API. Public request volume
        # has no effect on it — it scrapes on its own fixed schedule.
        - name: collector
          image: {{ .Values.collector.image }}
          command: ["python3", "-u", "/app/collect.py"]
          securityContext:
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # collect.py imports extras.py from the same read-only ConfigMap
            # mount, so CPython cannot write __pycache__ there. It degrades
            # silently either way; this makes it a decision rather than a
            # surprise in the logs.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: INTERVAL_SECONDS
              value: {{ .Values.collector.intervalSeconds | quote }}
            - name: SLOW_INTERVAL_SECONDS
              value: {{ .Values.collector.slowIntervalSeconds | quote }}
            - name: PUBLISH_EVENTS
              value: {{ .Values.publish.events | quote }}
            - name: PUBLISH_NODE_VERSIONS
              value: {{ .Values.publish.nodeVersions | quote }}
            - name: PUBLISH_UPTIME
              value: {{ .Values.publish.uptime | quote }}
            - name: PUBLISH_NODE_UPDATES
              value: {{ .Values.publish.nodeUpdates | quote }}
            - name: PUBLISH_NODE_ADDRESSES
              value: {{ .Values.publish.nodeAddresses | quote }}
            - name: PUBLISH_POD_IMAGES
              value: {{ .Values.publish.podImages | quote }}
            - name: PUBLISH_INGRESSES
              value: {{ .Values.publish.ingresses | quote }}
            - name: PUBLISH_STORAGE
              value: {{ .Values.publish.storage | quote }}
            - name: PUBLISH_JOBS
              value: {{ .Values.publish.jobs | quote }}
            - name: PUBLISH_SERVICE_CHECK_URLS
              value: {{ .Values.publish.serviceCheckUrls | quote }}
            # Off if either switch is off: `catalog.enabled` is "do we build the
            # tile grid at all" and `publish.catalog` is the redaction flag that
            # sits with its nine siblings. Two names for one thing would be
            # worse than either, so they AND.
            - name: PUBLISH_CATALOG
              value: {{ and .Values.catalog.enabled .Values.publish.catalog | quote }}
            - name: ICONS_ENABLED
              value: {{ .Values.catalog.icons.enabled | quote }}
            - name: ICONS_PER_CYCLE
              value: {{ .Values.catalog.icons.perCycle | quote }}
            - name: ICON_TTL_HOURS
              value: {{ .Values.catalog.icons.ttlHours | quote }}
            - name: ICON_TIMEOUT_SECONDS
              value: {{ .Values.catalog.icons.timeoutSeconds | quote }}
            - name: ICON_MAX_BYTES
              value: {{ .Values.catalog.icons.maxBytes | quote }}
            - name: OWN_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: SERVICE_CHECKS
              value: {{ .Values.serviceChecks | toJson | quote }}
            # The curated service list. An env var rather than a third
            # ConfigMap: it is values, not code, and it rolls the pods on edit
            # through the pod spec itself — no checksum annotation needed for
            # it, unlike the two script mounts.
            - name: CATALOG
              value: {{ .Values.catalog.services | toJson | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: collector
              mountPath: /app
              readOnly: true
            # Read once at startup and copied into /data/icons. Under /app
            # rather than a path of its own because collect.py already treats
            # /app as "the files this process was shipped with".
            - name: service-icons
              mountPath: /app/icons
              readOnly: true
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}

        # Serves a handful of static files off local disk and nothing else.
        - name: web
          image: {{ .Values.web.image }}
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Endpoint removal races SIGTERM, so Traefik can still route here
          # while nginx is shutting down. Holding the container open covers the
          # propagation window. Native sleep action — read-only root, no shell.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            # Three subPaths rather than one directory mount, because the same
            # ConfigMap also holds default.conf, which belongs in /etc/nginx.
            # Adding a fourth page asset means adding a mount here — the cost of
            # keeping the nginx config in the same object as the page it serves.
            - name: web
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: web
              mountPath: /usr/share/nginx/html/app.css
              subPath: app.css
              readOnly: true
            - name: web
              mountPath: /usr/share/nginx/html/app.js
              subPath: app.js
              readOnly: true
            - name: web
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: brand
              mountPath: /usr/share/nginx/brand
              readOnly: true
            # readOnlyRootFilesystem means nginx needs somewhere writable for
            # its caches and pid.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
