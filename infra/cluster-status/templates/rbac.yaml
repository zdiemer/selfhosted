{{/*
Only inventory reads and direct kubelet /stats/summary access. nodes/stats does
not authorize kubelet exec, logs or pods. Never restore nodes/proxy: GET on that
subresource is powerful enough to authorize container execution. The projected
credential is mounted only in the collector container.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cluster-status.fullname" . }}
  labels:
    {{- include "cluster-status.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cluster-status.fullname" . }}
  labels:
    {{- include "cluster-status.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list"]
---
# Namespaced and name-scoped: the collector may read exactly one ConfigMap —
# the node-lane upgrade report scripts/k3s/versions-report.sh publishes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cluster-status.fullname" . }}-versions-report
  labels:
    {{- include "cluster-status.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["versions-report"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cluster-status.fullname" . }}-versions-report
  labels:
    {{- include "cluster-status.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cluster-status.fullname" . }}-versions-report
subjects:
  - kind: ServiceAccount
    name: {{ include "cluster-status.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cluster-status.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "cluster-status.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cluster-status.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cluster-status.fullname" . }}
    namespace: {{ .Release.Namespace }}
