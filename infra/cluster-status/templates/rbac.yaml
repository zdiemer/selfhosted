{{/*
Read-only, and still narrower than talaria's backend ClusterRole this was ported
from — but the gap has closed. That role also carried pods/log, jobs and
cronjobs; the jobs lane now needs the last two, so pods/log is what remains, and
it is the one that matters: log text is unbounded application output, which is a
different class of disclosure from object metadata and is not going on a page.

Every rule below is `list` or `get`. The five added for the routing, storage and
jobs panels (ingresses, persistentvolumeclaims, persistentvolumes, jobs,
cronjobs) are all plain object reads — none of them is a proxy or subresource
verb, so none of them widens what this ServiceAccount can REACH, only what it
can enumerate.

nodes/proxy remains the powerful one — it's what reaches kubelet's
/stats/summary for the CPU/RAM/disk/network numbers, and it means no
metrics-server is required. It also means this ServiceAccount can proxy to
kubelets, so nothing else should borrow it. That warning still points at exactly
one grant.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cluster-status.fullname" . }}
  labels:
    {{- include "cluster-status.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cluster-status.fullname" . }}
  labels:
    {{- include "cluster-status.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["nodes/proxy", "nodes/stats"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list"]
---
# Namespaced and name-scoped: the collector may read exactly one ConfigMap —
# the node-lane upgrade report scripts/k3s/versions-report.sh publishes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cluster-status.fullname" . }}-versions-report
  labels:
    {{- include "cluster-status.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["versions-report"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cluster-status.fullname" . }}-versions-report
  labels:
    {{- include "cluster-status.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cluster-status.fullname" . }}-versions-report
subjects:
  - kind: ServiceAccount
    name: {{ include "cluster-status.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cluster-status.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "cluster-status.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cluster-status.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cluster-status.fullname" . }}
    namespace: {{ .Release.Namespace }}
