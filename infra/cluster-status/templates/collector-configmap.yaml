    def _catalog_state(workloads, check, cron):
        # Three sources, in the order they can be trusted.
        #
        # A failed endpoint probe OUTRANKS a healthy workload, because that is
        # the entire reason probes exist: a Running pod whose upstream is gone
        # still reports Available. Workload readiness is the next best thing and
        # covers everything without a probe. A service with neither — a bare Pod,
        # or an entry naming a workload that no longer exists — says "unknown"
        # rather than green, because a tile that cannot see its service must not
        # claim it is fine.
        if check is not None and not check.get("ok"):
            detail = check.get("reason") or f"HTTP {check.get('status', '?')}"
            return "down", detail
        # A CronJob's health is its last run, not a replica count. Several real
        # services here are shaped that way — the DuckDNS updater and Renovate
        # own no Pod between ticks — and without this they would sit on
        # "unknown" forever while working perfectly.
        if cron is not None:
            if cron.get("suspended"):
                return "warn", "suspended"
            if cron.get("lastRunFailed"):
                return "down", "last run failed"
            return "ok", cron.get("schedule") or "scheduled"
        if not workloads:
            return ("unknown", "no workload matched")
        desired = sum(w.get("desired", 0) for w in workloads)
        ready = sum(w.get("ready", 0) for w in workloads)
        failing = [w for w in workloads if w.get("condition") == "Failure"]
        if desired and ready == 0:
            return "down", (failing[0].get("condition") if failing else "0 ready")
        if failing:
            return "warn", "Failure"
        if ready < desired:
            return "warn", f"{ready}/{desired} ready"
        if not desired:
            return "warn", "scaled to zero"
        return "ok", f"{ready}/{desired} ready"


    def build_catalog(entries, rows, workloads, cron_jobs, checks, icons):
