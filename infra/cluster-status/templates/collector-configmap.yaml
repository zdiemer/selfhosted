            # cannot see: a hostname published straight off a tunnel connector
            # to a Service, with no Ingress rule of its own. kelsey.green is
            # that shape — it answers on the internet and appears nowhere in
            # `kubectl get ingress`, so deriving the link purely from Ingresses
            # would silently link the tailnet name for a public site.
            url = entry.get("url") or ""
            public_url = entry.get("publicUrl") or ""
            if not url and public_url:
                url = public_url if "://" in public_url else "https://" + public_url
            primary = hosts[0] if hosts else None
            if not url and primary:
                url = "https://" + primary.get("host", "")

            names = [h.get("host", "") for h in hosts]
            if public_url:
                bare = public_url.split("://")[-1].rstrip("/")
                if bare not in names:
                    names.insert(0, bare)

            targets = wl.get((namespace, entry.get("workload") or service), [])
            cron = by_cron.get((namespace, entry.get("cronjob"))) if entry.get("cronjob") else None
            state, detail = _catalog_state(targets, by_check.get(entry.get("check")), cron)

            # `exposure` describes the LINK, not the service: it is what the
            # reader is about to click. A tile whose public host came from
            # publicUrl is public even though no Ingress says so.
            if entry.get("url") or public_url:
                exposure = "public"
            elif primary:
                exposure = primary.get("exposure", "")
            else:
                exposure = ""

            return prune({
                "name": name,
                "category": category,
                "namespace": namespace,
                "service": service,
                "url": url,
                "hosts": names,
                "exposure": exposure,
                "auth": (primary or {}).get("auth", ""),
                "address": entry.get("address", ""),
                "note": entry.get("note", ""),
                "icon": icons.get(slug, ""),
                "slug": slug,
                "state": state,
                "detail": detail,
