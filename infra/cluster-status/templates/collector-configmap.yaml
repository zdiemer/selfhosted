    # ------------------------------------------------------------------ units
    # These live here rather than in collect.py because extras is the module
    # with no dependencies; collect.py imports them back. One definition.

    def fmt_bytes(n):
        n = float(n)
        for unit in ("B", "KB", "MB", "GB", "TB"):
            if n < 1024:
                return f"{n:.1f} {unit}"
            n /= 1024
        return f"{n:.1f} PB"


    def parse_cpu(val):
        val = str(val)
        if val.endswith("m"):
            return float(val[:-1]) / 1000.0
        if val.endswith("n"):
            return float(val[:-1]) / 1e9
        if val.endswith("u"):
            return float(val[:-1]) / 1e6
        return float(val)


    def parse_memory(val):
        val = str(val)
        suffixes = {
            "Ki": 1024, "Mi": 1024**2, "Gi": 1024**3, "Ti": 1024**4,
            "K": 1000, "M": 1000**2, "G": 1000**3, "T": 1000**4,
        }
        for suf, mult in suffixes.items():
            if val.endswith(suf):
                return int(float(val[: -len(suf)]) * mult)
        return int(float(val))


    def prune(d):
        # Drop empty values rather than writing them out. This is not tidiness:
        # "restartReason": null on 250 pods, "message": "" on 90 workloads and
        # so on is most of the payload growth this expansion would otherwise
        # cost, and the page already reads every optional field as `x || ''`.
        # False and 0 are meaningful and survive.
        return {k: v for k, v in d.items()
                if not (v is None or v == "" or v == [] or v == {})}


    # -------------------------------------------------------------- node identity
    # k3s's own vocabulary, not upstream's: a node is a "server" or an "agent".
    # etcd is included because a dedicated etcd node is a server that may carry
    # neither of the other two labels.
    _SERVER_LABELS = (
        "node-role.kubernetes.io/control-plane",
        "node-role.kubernetes.io/master",
        "node-role.kubernetes.io/etcd",
    )


    def _is_cgnat(ip):
        # Tailscale allocates out of 100.64.0.0/10, i.e. first octet 100 and
        # second in [64, 127]. Done by hand rather than with ipaddress so this
        # stays a string transform with no import.
        parts = ip.split(".")
        if len(parts) != 4:
            return False
        try:
            return parts[0] == "100" and 64 <= int(parts[1]) <= 127
        except ValueError:
            return False


    def _node_addresses(addresses):
        internal = None
        tailscale = None
        for a in addresses:
            if a.get("type") != "InternalIP":
                continue
            ip = a.get("address") or ""
            if not ip:
                continue
            if _is_cgnat(ip):
                tailscale = tailscale or ip
            else:
                internal = internal or ip
        out = {}
        if internal:
            out["internalIP"] = internal
        # NOT printed twice when they are the same address. A cluster whose k3s
        # was started with --node-ip on the tailnet reports exactly one
        # InternalIP, and showing it under two labels would suggest the node has
        # two paths to it when it has one.
        if tailscale and tailscale != internal:
            out["tailscaleIP"] = tailscale
        return out


    def _resources(block):
        out = {}
        if block.get("cpu"):
            out["cpuCores"] = parse_cpu(block["cpu"])
        if block.get("memory"):
            out["ramBytes"] = parse_memory(block["memory"])
        if block.get("pods"):
            out["pods"] = int(block["pods"])
        if block.get("ephemeral-storage"):
            out["ephemeralBytes"] = parse_memory(block["ephemeral-storage"])
        return out


    def node_identity(node, publish_addresses=True, publish_versions=True):
        # Everything here comes from the /api/v1/nodes item the caller already
        # holds — no kubelet call. That matters: build_node's stats fetch is the
        # thing that fails when a node is sick, and a node whose kubelet will not
        # answer is exactly when you want to know it is cordoned and what taints
        # are on it. So this is safe to call on the unreachable-node path too.
        meta = node.get("metadata") or {}
        spec = node.get("spec") or {}
        status = node.get("status") or {}
        info = status.get("nodeInfo") or {}
        labels = meta.get("labels") or {}

        taints = []
        for t in spec.get("taints") or []:
            key = t.get("key") or ""
            value = t.get("value")
            effect = t.get("effect") or ""
            taints.append(f"{key}={value}:{effect}" if value else f"{key}:{effect}")

        out = {
            "role": "server" if any(l in labels for l in _SERVER_LABELS) else "agent",
            "createdAt": meta.get("creationTimestamp") or None,
            "unschedulable": spec.get("unschedulable") is True,
            "taints": taints,
            "capacity": _resources(status.get("capacity") or {}),
            "allocatable": _resources(status.get("allocatable") or {}),
