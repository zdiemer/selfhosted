                        "name": meta.get("name", ""),
                        "host": host,
                        "path": p.get("path") or "/",
                        "backend": _backend(p),
                        "ingressClass": spec.get("ingressClassName") or "",
                        "entrypoints": ann.get(_ANN_ENTRYPOINTS) or "",
                        "tls": tls,
