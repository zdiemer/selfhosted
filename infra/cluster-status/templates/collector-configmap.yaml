        if publish_images and containers:
            # First container only, plus a count. Publishing every container's
            # full registry path across ~250 pods is most of the payload growth
            # for almost none of the information: sidecars are overwhelmingly
            # the same handful of images, and the app image is container zero.
            out["image"] = containers[0].get("image") or ""
            if len(containers) > 1:
                out["imageCount"] = len(containers)
        return prune(out)


