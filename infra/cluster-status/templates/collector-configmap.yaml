                pvcs, _age = slow_api_get("/api/v1/persistentvolumeclaims")
                pvs, _age = slow_api_get("/api/v1/persistentvolumes")
                storage = extras.parse_storage(pvcs.get("items", []),
                                               pvs.get("items", []),
                                               totals.pvc_usage)
            except Exception as e:
                log("k8s_storage_api_error", error=e)

        # Pod-status counts walk the full pod list, not the union of per-node
        # lists, so unscheduled Pending/Failed pods are still counted.
        totals.set_pod_status(all_pods)
        return {
            "generatedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
            "nodeDisks": result,
            "totals": totals.build(len(result)),
            "problemPods": parse_problem_pods(all_pods, job_owner, PUBLISH_POD_IMAGES),
            "deployments": deployments,
            "statefulSets": statefulsets,
            "daemonSets": daemonsets,
            "recentEvents": events,
            "services": services,
            "nodeUpdates": node_updates,
            "ingresses": ingresses,
            "storage": storage,
            "cronJobs": cron_jobs,
            "jobFailures": job_failures,
        }


    def write(payload):
        # Write-then-rename: nginx must never see a half-written file.
        tmp = OUT + ".tmp"
        body = json.dumps(payload, separators=(",", ":"))
        with open(tmp, "w") as f:
            f.write(body)
        os.replace(tmp, OUT)
        return len(body)


    def main():
        while True:
            started = time.monotonic()
            try:
                size = write(collect())
                # The measurement for the two things that bound this page:
                # how long a scrape takes (it must finish inside INTERVAL, and
                # every fourth one carries the slow-lane fetches) and how big
                # the payload has become (every open tab re-fetches it on the
                # same interval). Both are cheap to print and expensive to
                # guess at.
                log("scrape_done", seconds=round(time.monotonic() - started, 2),
                    bytes=size)
            except Exception as e:
                log("collect_failed", error=e)
                # Leave the previous status.json in place: stale data with a
                # visible timestamp is more useful than an error page.
            elapsed = time.monotonic() - started
            time.sleep(max(1.0, INTERVAL - elapsed))


    if __name__ == "__main__":
        main()
