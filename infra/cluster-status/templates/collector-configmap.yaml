                "namespace": ns,
                "name": name,
                "phase": status.get("phase") or "",
                "capacityBytes": parse_memory(actual) if actual else None,
                "storageClass": spec.get("storageClassName") or "",
                "accessModes": spec.get("accessModes") or [],
                "volumeName": volume_name,
                "reclaimPolicy": pv_spec.get("persistentVolumeReclaimPolicy") or "",
                # NOT zero when kubelet has nothing to say. kubelet only reports
                # volumes that are currently MOUNTED, so a Bound claim whose pod
                # is not running has no stats at all — and rendering that as 0%
                # would read as "empty" when the truth is "unknown". The page
                # prints an em dash. Same class of mistake as the network
                # counters talaria still gets wrong (see the chart README).
                "usedBytes": used_bytes,
                "percent": percent,
            }))

        # Anything not Bound first, then fullest first, then alphabetical.
        rows.sort(key=lambda r: (r.get("phase") == "Bound",
                                 -(r.get("percent") or 0),
                                 r.get("namespace", ""), r.get("name", "")))
        return rows[:limit]


    # ------------------------------------------------------------------ jobs lane
    def parse_cronjobs(items, limit=100):
        rows = []
        for cj in items:
            meta = cj.get("metadata") or {}
            spec = cj.get("spec") or {}
            status = cj.get("status") or {}
            last_schedule = status.get("lastScheduleTime") or ""
            last_success = status.get("lastSuccessfulTime") or ""
            rows.append(prune({
                "namespace": meta.get("namespace", ""),
                "name": meta.get("name", ""),
                "schedule": spec.get("schedule") or "",
                "suspended": spec.get("suspend") is True,
                "concurrencyPolicy": spec.get("concurrencyPolicy") or "",
                "lastScheduleTime": last_schedule or None,
                "lastSuccessfulTime": last_success or None,
                "activeCount": len(status.get("active") or []),
                # The question this table exists to answer. A CronJob that ran
                # more recently than it last succeeded failed its last run —
                # which is invisible in every other section, because the pod it
                # left behind is Failed and the README's own rule says Failed
                # pods are not critical.
                "lastRunFailed": bool(last_schedule and last_success
                                      and last_success < last_schedule),
            }))
        # Failing first, then suspended last, then alphabetical.
        rows.sort(key=lambda r: (not r.get("lastRunFailed"),
                                 bool(r.get("suspended")),
                                 r.get("namespace", ""), r.get("name", "")))
        return rows[:limit]


    def parse_jobs(items, limit=50):
        # Returns (rows, job_owner). Only ACTIVE and FAILED jobs get rows — a
        # Job that completed is not news, and this cluster keeps hundreds of
        # them. job_owner maps every Job name to its CronJob regardless, because
        # parse_problem_pods needs it for jobs that succeeded too.
        rows = []
        job_owner = {}
        for job in items:
            meta = job.get("metadata") or {}
            status = job.get("status") or {}
            name = meta.get("name", "")
            ns = meta.get("namespace", "")

            owner = ""
            for ref in meta.get("ownerReferences") or []:
                if ref.get("kind") == "CronJob":
                    owner = ref.get("name") or ""
                    break
            if owner:
                job_owner[(ns, name)] = owner

            failed = int(status.get("failed") or 0)
            active = int(status.get("active") or 0)
            if not failed and not active:
                continue

            reason = ""
            message = ""
            for c in status.get("conditions") or []:
                if c.get("type") == "Failed" and c.get("status") == "True":
                    reason = c.get("reason") or ""
                    message = c.get("message") or ""
                    break

            rows.append(prune({
                "namespace": ns,
                "name": name,
                "owner": owner,
                "startTime": status.get("startTime") or None,
                "completionTime": status.get("completionTime") or None,
                "failed": failed,
                "succeeded": int(status.get("succeeded") or 0),
                "active": active,
                "reason": reason,
                "message": message,
            }))

        rows.sort(key=lambda r: (not r.get("failed"), r.get("startTime") or ""),
                  reverse=False)
        return rows[:limit], job_owner


    def pod_owner(pod, job_owner):
        # "CronJob/paperless-backup" for a pod two hops down. The chart README
        # has always carried the caveat that most Failed pods here are CronJob
        # pods kept for their logs; this turns that from something the reader
        # has to remember into a column they can read.
        ns = (pod.get("metadata") or {}).get("namespace", "")
        for ref in (pod.get("metadata") or {}).get("ownerReferences") or []:
            kind = ref.get("kind") or ""
            name = ref.get("name") or ""
            if kind == "Job":
                cron = (job_owner or {}).get((ns, name))
                return f"CronJob/{cron}" if cron else f"Job/{name}"
            if kind:
                return f"{kind}/{name}"
        return ""
