apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cluster-status.fullname" . }}-collector
  labels:
    {{- include "cluster-status.labels" . | nindent 4 }}
data:
  collect.py: |
    # Cluster status collector.
    #
    # A port of talaria's src/api/admin/get_cluster_info.py. That code was already
    # fully generic — this drops its four couplings (the Handler framework, its
    # httpx k8s client, protobuf types, structlog) and emits plain JSON instead.
    # The measurement logic below is otherwise the same, deliberately: it is the
    # valuable part and it was already correct.
    #
    # Stdlib only, so this runs on a stock python image with nothing to build.
    # Loops forever writing /data/status.json; nginx serves that file.
    #
    # extras.py is the one local import — pure parsers for everything the page
    # grew after it left the Cloudflare tunnel (node identity, pod detail,
    # routing, storage, jobs). Everything that TALKS to Kubernetes stays here.

    import json
    import os
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    import extras
    from extras import fmt_bytes, parse_cpu, parse_memory, prune

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    API = "https://kubernetes.default.svc"
    OUT = "/data/status.json"

    INTERVAL = float(os.environ.get("INTERVAL_SECONDS", "15"))
    # How often the deploy-cadence objects are re-fetched. See slow_api_get.
    SLOW_INTERVAL = float(os.environ.get("SLOW_INTERVAL_SECONDS", "60"))
    PUBLISH_EVENTS = os.environ.get("PUBLISH_EVENTS", "true") == "true"
    PUBLISH_NODE_VERSIONS = os.environ.get("PUBLISH_NODE_VERSIONS", "true") == "true"
    PUBLISH_UPTIME = os.environ.get("PUBLISH_UPTIME", "true") == "true"
    PUBLISH_NODE_UPDATES = os.environ.get("PUBLISH_NODE_UPDATES", "true") == "true"
    PUBLISH_NODE_ADDRESSES = os.environ.get("PUBLISH_NODE_ADDRESSES", "true") == "true"
    PUBLISH_POD_IMAGES = os.environ.get("PUBLISH_POD_IMAGES", "true") == "true"
    PUBLISH_INGRESSES = os.environ.get("PUBLISH_INGRESSES", "true") == "true"
    PUBLISH_STORAGE = os.environ.get("PUBLISH_STORAGE", "true") == "true"
    PUBLISH_JOBS = os.environ.get("PUBLISH_JOBS", "true") == "true"
    PUBLISH_SERVICE_CHECK_URLS = os.environ.get("PUBLISH_SERVICE_CHECK_URLS", "true") == "true"
    OWN_NAMESPACE = os.environ.get("OWN_NAMESPACE", "infra")
    SERVICE_CHECKS = json.loads(os.environ.get("SERVICE_CHECKS", "[]"))
    TOP_N = 5


    def log(msg, **kw):
        extra = " ".join(f"{k}={v}" for k, v in kw.items())
        print(f"{msg} {extra}".strip(), file=sys.stderr, flush=True)


    with open(f"{SA}/token") as f:
        TOKEN = f.read().strip()
    CTX = ssl.create_default_context(cafile=f"{SA}/ca.crt")


    def api_get(path, params=None):
        url = f"{API}{path}"
        if params:
            url += "?" + urllib.parse.urlencode(params)
        req = urllib.request.Request(url, headers={"Authorization": f"Bearer {TOKEN}"})
        with urllib.request.urlopen(req, context=CTX, timeout=15) as r:
            return json.load(r)


    # Ingresses, PersistentVolumes, PVCs, Jobs and CronJobs all change on a
    # DEPLOY, not on a tick. Fetching five more lists every 15s would be a 30%
    # larger API bill for data that is byte-identical three cycles out of four,
    # and the numbers on this page that actually move — how full a PVC is —
    # come from /stats/summary, which is still every cycle.
    #
    # So they get their own interval and the page's freshness promise is
    # unchanged. Steady state is ~17 calls per cycle with a +5 spike every
    # fourth, i.e. this whole expansion costs about 7% more API traffic.
    #
    # A failed slow fetch keeps the previous value rather than blanking the
    # panel, which is the same choice main() makes about status.json as a whole:
    # stale data with a visible age beats an error.
    _SLOW_CACHE = {}


    def slow_api_get(path, params=None):
        key = (path, tuple(sorted((params or {}).items())))
        now = time.monotonic()
        cached = _SLOW_CACHE.get(key)
        if cached and now - cached[0] < SLOW_INTERVAL:
            return cached[1], round(now - cached[0])
        try:
            payload = api_get(path, params)
        except Exception:
            if cached:
                log("slow_fetch_stale", path=path, age=round(now - cached[0]))
                return cached[1], round(now - cached[0])
            raise
        _SLOW_CACHE[key] = (now, payload)
        return payload, 0


    def make_disk(label, total, used):
        pct = (used / total * 100) if total > 0 else 0.0
        return {
            "label": label,
            "total": fmt_bytes(total),
            "used": fmt_bytes(used),
            "free": fmt_bytes(max(total - used, 0)),
            "percent": pct,
        }


    # Disks whose capacity lands in the same 64MiB bucket are treated as the same
    # underlying device — kubelet reports the node fs and imagefs separately even
    # when they're one filesystem, and every PVC on local-path shares it too.
    BUCKET = 64 * 1024 * 1024


    def bucket(n):
        return n // BUCKET


    def summarize_pvcs(pvc_refs):
        names = [name for _, name in pvc_refs if name]
        if not names:
            return "PVC storage"
        head = ", ".join(sorted(set(names))[:3])
        extra = len(set(names)) - 3
        return f"{head}{f' (+{extra} more)' if extra > 0 else ''}"


    def pvc_volume_stats(stat_pods):
        # (namespace, claim) -> (capacityBytes, usedBytes), from kubelet's pod
        # volume stats.
        #
        # This traversal used to live inside collect_disks, which walked it,
        # bucketed it, and threw the per-claim identities away. Pulled out so
        # the storage panel and the node disk bars are computed from ONE walk of
        # the same numbers and cannot disagree about how full a claim is.
        #
        # kubelet only reports volumes that are currently MOUNTED, so a Bound
        # claim whose pod is not running is simply absent here — which is not
        # the same as empty, and extras.parse_storage is careful about it.
        out = {}
        for pod in stat_pods:
            for vol in pod.get("volume", []) or []:
                pvc_ref = vol.get("pvcRef") or {}
                ns = pvc_ref.get("namespace")
                name = pvc_ref.get("name")
                if not ns or not name:
                    continue
                cap = int(vol.get("capacityBytes") or 0)
                used = int(vol.get("usedBytes") or 0)
                if cap <= 0:
                    continue
                out[(ns, name)] = (cap, used)
        return out


    def collect_disks(node_stat, vol_stats):
        disks = []
        fs = node_stat.get("fs") or {}
        primary_total = int(fs.get("capacityBytes") or 0)
        primary_used = int(fs.get("usedBytes") or 0)
        primary_bucket = None
        if primary_total > 0:
            disks.append(make_disk("/ (kubelet)", primary_total, primary_used))
            primary_bucket = bucket(primary_total)

        image_fs = (node_stat.get("runtime") or {}).get("imageFs") or {}
        image_total = int(image_fs.get("capacityBytes") or 0)
        image_used = int(image_fs.get("usedBytes") or 0)
        if image_total > 0 and (primary_bucket is None or bucket(image_total) != primary_bucket):
            disks.append(make_disk("imagefs (containers)", image_total, image_used))

        # Bucketing unchanged — it is load-bearing and subtle. The only
        # difference is that the per-claim numbers arrive pre-walked.
        grouped = {}
        for (ns, name), (cap, used) in vol_stats.items():
            key = (bucket(cap), bucket(used))
            entry = grouped.setdefault(key, {"capacity": cap, "used": used, "pvcs": []})
            entry["pvcs"].append((ns, name))

        seen = {bucket(t) for t in (primary_total, image_total) if t}
        for (cap_bucket, _used_bucket), entry in grouped.items():
            if cap_bucket in seen:
                continue
            seen.add(cap_bucket)
            disks.append(make_disk(summarize_pvcs(entry["pvcs"]), entry["capacity"], entry["used"]))
        return disks


    # k3s itself runs in the "kubelet" and "runtime" cgroups; pods aggregate as
    # "pods". The kubelet does not, by default, report a "system" cgroup for
    # non-k8s processes (sshd, systemd, tailscale, the kernel, ...) — that requires
    # --system-cgroups, which k3s doesn't set. So system is the residual:
    # node_total - (k3s + pods).
    K3S_CONTAINERS = {"kubelet", "runtime"}
    PODS_CONTAINERS = {"pods", "kubepods"}


    def build_node_breakdowns(node_stat, cpu_capacity, ram_capacity):
        pods_cpu = k3s_cpu = 0.0
        pods_ram = k3s_ram = 0
        for c in node_stat.get("systemContainers") or []:
            name = (c.get("name") or "").lower()
            cpu = (c.get("cpu") or {}).get("usageNanoCores", 0) / 1e9
            ram = int((c.get("memory") or {}).get("workingSetBytes", 0))
            if name in PODS_CONTAINERS:
                pods_cpu += cpu
                pods_ram += ram
            elif name in K3S_CONTAINERS:
                k3s_cpu += cpu
                k3s_ram += ram

        node_cpu_total = (node_stat.get("cpu") or {}).get("usageNanoCores", 0) / 1e9
        node_ram_total = int((node_stat.get("memory") or {}).get("workingSetBytes", 0))
        system_cpu = max(node_cpu_total - pods_cpu - k3s_cpu, 0.0)
        system_ram = max(node_ram_total - pods_ram - k3s_ram, 0)
        available = int((node_stat.get("memory") or {}).get("availableBytes", 0))

        return (
            {"pods": pods_cpu, "k3s": k3s_cpu, "system": system_cpu, "capacity": cpu_capacity},
            {
                "podsBytes": pods_ram, "k3sBytes": k3s_ram, "systemBytes": system_ram,
                "capacityBytes": ram_capacity, "availableBytes": available,
            },
        )


    def is_node_ready(node):
        for cond in node.get("status", {}).get("conditions", []) or []:
            if cond.get("type") == "Ready":
                return cond.get("status") == "True"
        return False


    # Note: "True" on these means the node is *unhealthy* in that dimension.
    # NetworkUnavailable is the same sense — True means no usable network.
    def parse_node_conditions(node):
        flags = {"MemoryPressure": False, "DiskPressure": False,
                 "PIDPressure": False, "NetworkUnavailable": False}
        for cond in node.get("status", {}).get("conditions", []) or []:
            t = cond.get("type")
            if t in flags:
                flags[t] = cond.get("status") == "True"
        return {
            "memoryPressure": flags["MemoryPressure"],
            "diskPressure": flags["DiskPressure"],
            "pidPressure": flags["PIDPressure"],
            "networkUnavailable": flags["NetworkUnavailable"],
        }


    def node_storage_bytes(node_stat):
        fs = node_stat.get("fs") or {}
        primary_total = int(fs.get("capacityBytes") or 0)
        primary_used = int(fs.get("usedBytes") or 0)
        image_fs = (node_stat.get("runtime") or {}).get("imageFs") or {}
        image_total = int(image_fs.get("capacityBytes") or 0)
        image_used = int(image_fs.get("usedBytes") or 0)
        if image_total > 0 and bucket(image_total) != bucket(primary_total):
            return primary_total + image_total, primary_used + image_used
        return primary_total, primary_used


    def pod_requests(pod):
        cpu_total = 0.0
        ram_total = 0
        for c in pod.get("spec", {}).get("containers", []) or []:
            req = ((c.get("resources") or {}).get("requests") or {}) if c else {}
            if req.get("cpu"):
                cpu_total += parse_cpu(req["cpu"])
            if req.get("memory"):
                ram_total += parse_memory(req["memory"])
        return cpu_total, ram_total


    def pod_status_label(pod):
        # kubelet still reports phase=Running for pods that are flapping, so
        # CrashLoopBackOff is detected by walking containerStatuses and overriding.
        status = pod.get("status", {})
        phase = (status.get("phase") or "Unknown").lower()
        for cs in status.get("containerStatuses", []) or []:
            waiting = (cs.get("state") or {}).get("waiting") or {}
            if waiting.get("reason") == "CrashLoopBackOff":
                return "crash_looping"
        if phase in {"running", "pending", "succeeded", "failed"}:
            return phase
        return "unknown"


    LAST_NETWORK_SAMPLE = {}

    # Interfaces that carry a copy of traffic already counted on the uplink.
    # flannel/cni/veth are the pod overlay; tailscale is a tunnel riding the NIC.
    # Counting any of them alongside the uplink would double-count.
    _VIRTUAL_IFACES = ("flannel", "cni", "veth", "docker", "tailscale", "kube", "br-")


    def iface_counters(net):
        # kubelet embeds the default interface's counters at the top level — but
        # only when it can identify one. On this cluster it can't (it reports
        # name: "" with no rxBytes/txBytes), so the top level is empty and only
        # the per-interface list is populated.
        #
        # NOTE: talaria's original read only the top-level counters and gave up
        # when they were absent, which is why its network column has always been
        # blank. Fall back to the busiest physical interface instead.
        rx, tx = net.get("rxBytes"), net.get("txBytes")
        if rx is not None and tx is not None:
            return int(rx), int(tx)
        best = None
        for i in net.get("interfaces") or []:
            name = i.get("name") or ""
            if name == "lo" or name.startswith(_VIRTUAL_IFACES):
                continue
            r, t = i.get("rxBytes"), i.get("txBytes")
            if r is None or t is None:
                continue
            if best is None or int(r) > best[0]:
                best = (int(r), int(t))
        return best


    def network_rate(node_name, node_stat):
        # rx/tx bytes/sec by diffing kubelet's cumulative counters against the
        # previous scrape. This is why the collector is a long-lived process and
        # not a CronJob: the first scrape after start has no prior sample and
        # returns None, so a fresh-every-run job would never report a rate.
        counters = iface_counters(node_stat.get("network") or {})
        if counters is None:
            return None
        rx_i, tx_i = counters
        now = time.monotonic()
        prev = LAST_NETWORK_SAMPLE.get(node_name)
        LAST_NETWORK_SAMPLE[node_name] = (now, rx_i, tx_i)
        if prev is None:
            return None
        prev_t, prev_rx, prev_tx = prev
        dt = now - prev_t
        if dt <= 0:
            return None
        # Counter reset (reboot, ifupdown) — wait for the next sample.
        if rx_i < prev_rx or tx_i < prev_tx:
            return None
        return {
            "rxBytesPerSec": (rx_i - prev_rx) / dt,
            "txBytesPerSec": (tx_i - prev_tx) / dt,
        }


    def parse_deployments(items):
        out = []
        for d in items:
            meta = d.get("metadata", {})
            spec = d.get("spec", {})
            st = d.get("status", {})
            desired = int(spec.get("replicas", st.get("replicas", 0)) or 0)
            ready = int(st.get("readyReplicas", 0) or 0)
            available = int(st.get("availableReplicas", 0) or 0)
            updated = int(st.get("updatedReplicas", 0) or 0)

            condition = "Available"
            message = None
            for c in st.get("conditions", []) or []:
                ctype = c.get("type")
                cstatus = c.get("status")
                if ctype == "Available" and cstatus != "True":
                    condition = "Failure" if available == 0 else "Progressing"
                    message = c.get("message")
                elif (ctype == "Progressing" and cstatus == "False"
                      and c.get("reason") == "ProgressDeadlineExceeded"):
                    condition = "Failure"
                    message = c.get("message")
            if ready < desired and condition == "Available":
                condition = "Progressing"

            out.append({
                "name": meta.get("name", ""),
                "namespace": meta.get("namespace", ""),
                "desired": desired,
                "ready": ready,
                "available": available,
                "updated": updated,
                "condition": condition,
                "message": message,
            })
        return _sort_workloads(out)


    # Deployments carry Available/Progressing conditions; StatefulSets and
    # DaemonSets don't, so their health is derived from the replica counts the
    # same way. Same output shape as parse_deployments so the page renders all
    # three tables through one function.
    def _count_condition(desired, ready, available):
        if desired == 0:
            return "Available"
        if ready == 0:
            return "Failure"
        if ready < desired or available < desired:
            return "Progressing"
        return "Available"


    def _sort_workloads(out):
        # Failures first, then Progressing, then the rest alphabetically — the
        # things that need attention float to the top of the table.
        out.sort(key=lambda x: (x["condition"] != "Failure",
                                x["condition"] != "Progressing", x["name"]))
        return out


    def parse_statefulsets(items):
        out = []
        for d in items:
            meta = d.get("metadata", {})
            spec = d.get("spec", {})
            st = d.get("status", {})
            desired = int(spec.get("replicas", 0) or 0)
            ready = int(st.get("readyReplicas", 0) or 0)
            # availableReplicas needs minReadySeconds to be meaningful; fall back
            # to ready so a StatefulSet without it doesn't read as unavailable.
            available = int(st.get("availableReplicas", ready) or 0)
            updated = int(st.get("updatedReplicas", 0) or 0)
            out.append({
                "name": meta.get("name", ""),
                "namespace": meta.get("namespace", ""),
                "desired": desired, "ready": ready, "available": available,
                "updated": updated,
                "condition": _count_condition(desired, ready, available),
                "message": None,
            })
        return _sort_workloads(out)


    def parse_daemonsets(items):
        out = []
        for d in items:
            meta = d.get("metadata", {})
            st = d.get("status", {})
            desired = int(st.get("desiredNumberScheduled", 0) or 0)
            ready = int(st.get("numberReady", 0) or 0)
            available = int(st.get("numberAvailable", ready) or 0)
            updated = int(st.get("updatedNumberScheduled", 0) or 0)
            out.append({
                "name": meta.get("name", ""),
                "namespace": meta.get("namespace", ""),
                "desired": desired, "ready": ready, "available": available,
                "updated": updated,
                "condition": _count_condition(desired, ready, available),
                "message": None,
            })
        return _sort_workloads(out)


    # A pod is a "problem" when its effective status is anything other than
    # Running or Succeeded — the same classification the summary pills count, but
    # here we keep the identities so the page can name them. Walks the full pod
    # list, so unscheduled Pending pods (which belong to no node and never appear
    # in a per-node table) are included.
    _PROBLEM_ORDER = {"crash_looping": 0, "failed": 1, "unknown": 2, "pending": 3}
    _STATUS_DISPLAY = {
        "crash_looping": "CrashLoopBackOff", "failed": "Failed",
        "unknown": "Unknown", "pending": "Pending",
    }


    def parse_problem_pods(pods, job_owner=None, publish_images=True, limit=50):
        rows = []
        for p in pods:
            label = pod_status_label(p)
            if label in ("running", "succeeded"):
                continue
            meta = p.get("metadata", {})
            status = p.get("status", {})
            # Pod-level reason first (e.g. "Evicted"), else the first container's
            # waiting/terminated reason (ImagePullBackOff, OOMKilled, Error, ...).
            reason = status.get("reason") or ""
            if not reason:
                for cs in status.get("containerStatuses", []) or []:
                    state = cs.get("state") or {}
                    waiting = state.get("waiting") or {}
                    terminated = state.get("terminated") or {}
                    if waiting.get("reason"):
                        reason = waiting["reason"]
                        break
                    if terminated.get("reason"):
                        reason = terminated["reason"]
                        break
            restarts = sum(cs.get("restartCount", 0)
                           for cs in status.get("containerStatuses", []) or [])
            row = {
                "namespace": meta.get("namespace", ""),
                "name": meta.get("name", ""),
                "node": p.get("spec", {}).get("nodeName") or "",
                "status": _STATUS_DISPLAY.get(label, label),
                "reason": reason,
                "restarts": restarts,
                "owner": extras.pod_owner(p, job_owner),
            }
            row.update(extras.pod_detail(p, publish_images))
            rows.append((_PROBLEM_ORDER.get(label, 9), prune(row)))
        rows.sort(key=lambda r: (r[0], r[1]["namespace"], r[1]["name"]))
        return [r[1] for r in rows[:limit]]


    def parse_events(items, warn_limit=40, all_limit=120):
        # The page now shows Normal events too, behind a filter that defaults to
        # Warnings — so this has to cap TWO populations, not one.
        #
        # The trap: taking the newest `all_limit` of everything lets routine
        # Normal chatter (Scheduled, Pulled, Started — hundreds an hour on a
        # cluster this size) evict warnings from the payload entirely. The
        # default view would then show FEWER warnings than before the feature
        # was added, and nothing on the page would say so.
        #
        # So take the newest warn_limit warnings AND the newest all_limit
        # overall, then union them. The Warnings view is guaranteed no worse
        # than it was when Warning was the only thing collected.
        out = []
        for e in items:
            meta = e.get("metadata", {})
            involved = e.get("involvedObject", {})
            last_seen = e.get("lastTimestamp") or e.get("eventTime") or ""
            out.append({
                "namespace": meta.get("namespace", ""),
                "type": e.get("type", ""),
                "reason": e.get("reason", ""),
                "message": e.get("message", ""),
                "involvedKind": involved.get("kind", ""),
                "involvedName": involved.get("name", ""),
                "lastSeen": last_seen or None,
                "count": int(e.get("count") or 1),
            })
        # Most recent first; events without a timestamp sink to the bottom.
        out.sort(key=lambda x: x["lastSeen"] or "", reverse=True)

        keep = []
        seen = set()
        warnings = [e for e in out if e["type"] == "Warning"][:warn_limit]
        for e in warnings + out[:all_limit]:
            ident = id(e)
            if ident in seen:
                continue
            seen.add(ident)
            keep.append(e)
        keep.sort(key=lambda x: x["lastSeen"] or "", reverse=True)
        return keep


    class Totals:
        def __init__(self):
            self.pods_cpu = self.k3s_cpu = self.system_cpu = self.cpu_cap = 0.0
            self.pods_ram = self.k3s_ram = self.system_ram = 0
            self.ram_cap = self.ram_available = 0
            self.disk_used = self.disk_cap = 0
            self.pod_count = self.ready = 0
            self.req_cpu = 0.0
            self.req_ram = 0
            self.observed = []
            self.pod_status = None
            # (namespace, claim) -> (capacityBytes, usedBytes), unioned across
            # every node's kubelet stats so the storage panel sees every mounted
            # claim regardless of which node its pod landed on.
            self.pvc_usage = {}

        def add(self, cpu, ram, storage_total, storage_used, pod_count, ready, requests):
            self.pods_cpu += cpu["pods"]
            self.k3s_cpu += cpu["k3s"]
            self.system_cpu += cpu["system"]
            self.cpu_cap += cpu["capacity"]
            self.pods_ram += ram["podsBytes"]
            self.k3s_ram += ram["k3sBytes"]
            self.system_ram += ram["systemBytes"]
            self.ram_cap += ram["capacityBytes"]
            self.ram_available += ram["availableBytes"]
            self.disk_cap += storage_total
            self.disk_used += storage_used
            self.pod_count += pod_count
            if ready:
                self.ready += 1
            self.req_cpu += requests["cpuCores"]
            self.req_ram += requests["ramBytes"]

        def add_unreachable(self, ready):
            if ready:
                self.ready += 1

        def set_pod_status(self, pods):
            counts = {"running": 0, "pending": 0, "succeeded": 0,
                      "failed": 0, "unknown": 0, "crash_looping": 0}
            for p in pods:
                counts[pod_status_label(p)] += 1
            self.pod_status = {
                "running": counts["running"], "pending": counts["pending"],
                "succeeded": counts["succeeded"], "failed": counts["failed"],
                "unknown": counts["unknown"], "crashLooping": counts["crash_looping"],
            }

        # observed rows are (namespace, name, node, cpu, ram, req_cpu, req_ram).
        # NOTE if you extend this again: top_pods below indexes positionally AND
        # unpacks the whole row. Appending a field keeps the indices valid and
        # breaks the unpack, silently, at runtime. Both have to move together.
        def top_pods(self, by_cpu):
            idx = 3 if by_cpu else 4
            ranked = sorted(self.observed, key=lambda p: p[idx], reverse=True)[:TOP_N]
            return [
                {"namespace": ns, "name": n, "node": node,
                 "cpuCores": cpu if by_cpu else None,
                 "ramBytes": ram if not by_cpu else None}
                for ns, n, node, cpu, ram, _req_cpu, _req_ram in ranked
                if (cpu if by_cpu else ram) > 0
            ]

        def namespaces(self):
            # "What is actually eating this cluster" at one altitude coarser
            # than the top-consumers cards, out of data already collected — no
            # extra API call, and no publish flag either: every figure here is
            # a sum of per-pod numbers this page already prints one card up.
            agg = {}
            for ns, _name, _node, cpu, ram, req_cpu, req_ram in self.observed:
                row = agg.setdefault(ns, {"namespace": ns, "pods": 0, "cpuCores": 0.0,
                                          "ramBytes": 0, "reqCpuCores": 0.0,
                                          "reqRamBytes": 0})
                row["pods"] += 1
                row["cpuCores"] += cpu
                row["ramBytes"] += ram
                row["reqCpuCores"] += req_cpu
                row["reqRamBytes"] += req_ram
            return sorted(agg.values(), key=lambda r: r["ramBytes"], reverse=True)

        def build(self, node_count):
            if node_count == 0:
                return None
            return {
                "nodeCount": node_count,
                "readyNodeCount": self.ready,
                "podCount": self.pod_count,
                "cpu": {"pods": self.pods_cpu, "k3s": self.k3s_cpu,
                        "system": self.system_cpu, "capacity": self.cpu_cap},
                "ram": {"podsBytes": self.pods_ram, "k3sBytes": self.k3s_ram,
                        "systemBytes": self.system_ram, "capacityBytes": self.ram_cap,
                        "availableBytes": self.ram_available},
                "disk": {"usedBytes": self.disk_used, "capacityBytes": self.disk_cap},
                "podStatus": self.pod_status,
                "topCpuPods": self.top_pods(True),
                "topRamPods": self.top_pods(False),
                "namespaces": self.namespaces(),
                "requests": {"cpuCores": self.req_cpu, "ramBytes": self.req_ram},
            }


    def build_node(node, name, ready, kernel, os_image, all_pods, totals):
        stats = api_get(f"/api/v1/nodes/{name}/proxy/stats/summary")
        node_stat = stats.get("node", {})
        stat_pods = stats.get("pods", []) or []

        vol_stats = pvc_volume_stats(stat_pods)
        totals.pvc_usage.update(vol_stats)
        disks = collect_disks(node_stat, vol_stats)
        disk_percent = max((d["percent"] for d in disks), default=0.0) if disks else None

        cpu_usage = node_stat.get("cpu", {}).get("usageNanoCores", 0) / 1e9
        ram_usage = node_stat.get("memory", {}).get("workingSetBytes", 0)

        capacity = node.get("status", {}).get("capacity", {})
        cpu_cap = parse_cpu(capacity.get("cpu", "1"))
        ram_cap = parse_memory(capacity.get("memory", "1Gi"))

        cpu_breakdown, ram_breakdown = build_node_breakdowns(node_stat, cpu_cap, ram_cap)
        node_pods = [p for p in all_pods if p.get("spec", {}).get("nodeName") == name]

        metrics_by_pod = {
            (p.get("podRef", {}).get("namespace"), p.get("podRef", {}).get("name")): p
            for p in stat_pods
        }

        pods_info = []
        node_req_cpu = 0.0
        node_req_ram = 0
        for p in node_pods:
            pod_name = p["metadata"]["name"]
            pod_ns = p["metadata"].get("namespace", "")
            status = p.get("status", {})
            container_statuses = status.get("containerStatuses", []) or []
            restarts = sum(cs.get("restartCount", 0) for cs in container_statuses)

            last_restart = None
            for cs in container_statuses:
                terminated = (cs.get("lastState") or {}).get("terminated")
                if terminated and terminated.get("finishedAt"):
                    if not last_restart or terminated["finishedAt"] > last_restart:
                        last_restart = terminated["finishedAt"]

            m = metrics_by_pod.get((pod_ns, pod_name), {})
            p_cpu = m.get("cpu", {}).get("usageNanoCores", 0) / 1e9
            p_ram = m.get("memory", {}).get("workingSetBytes", 0)

            row = {
                "name": pod_name,
                "namespace": pod_ns,
                "cpuPercent": (p_cpu / cpu_cap * 100) if cpu_cap > 0 else 0.0,
                "ramPercent": (p_ram / ram_cap * 100) if ram_cap > 0 else 0.0,
                "ramUsage": fmt_bytes(p_ram),
                "status": status.get("phase", "Unknown"),
                "restarts": restarts,
                "lastRestartTime": last_restart,
            }
            row.update(extras.pod_detail(p, PUBLISH_POD_IMAGES))
            pods_info.append(prune(row))

            req_cpu, req_ram = pod_requests(p)
            node_req_cpu += req_cpu
            node_req_ram += req_ram
            totals.observed.append((pod_ns, pod_name, name, p_cpu, p_ram,
                                    req_cpu, req_ram))

        storage_total, storage_used = node_storage_bytes(node_stat)
        requests = {"cpuCores": node_req_cpu, "ramBytes": node_req_ram}
        totals.add(cpu_breakdown, ram_breakdown, storage_total, storage_used,
                   len(node_pods), ready, requests)

        out = {
            "name": name,
            "disks": disks,
            "diskPercent": disk_percent,
            "cpuPercent": (cpu_usage / cpu_cap * 100) if cpu_cap > 0 else 0.0,
            "ramPercent": (ram_usage / ram_cap * 100) if ram_cap > 0 else 0.0,
            "ramUsage": fmt_bytes(ram_usage),
            "pods": pods_info,
            "cpu": cpu_breakdown,
            "ram": ram_breakdown,
            "podCount": len(node_pods),
            "ready": ready,
            "startedAt": node_stat.get("startTime") or "",
            "conditions": parse_node_conditions(node),
            "requests": requests,
            "network": network_rate(name, node_stat),
        }
        if PUBLISH_NODE_VERSIONS:
            out["kernelVersion"] = kernel
            out["osImage"] = os_image
        out.update(extras.node_identity(node, PUBLISH_NODE_ADDRESSES,
                                        PUBLISH_NODE_VERSIONS))
        return out


    def check_service(check):
        # Probe one HTTP endpoint and report whether it answered as expected.
        #
        # THE URL USED TO BE WITHHELD UNCONDITIONALLY, and the comment here said
        # so in capitals. The reason was sound and is now spent: checks point at
        # ClusterIPs and LAN addresses, and while this page was on the Cloudflare
        # tunnel, publishing them would have handed the internet an internal host
        # inventory for free.
        #
        # On the tailnet the target is the most useful column in that table.
        # "SMS relay is down" and "this specific ClusterIP is refusing on :8000"
        # are different diagnoses, and only the second one tells you where to
        # look. So it is published, behind publish.serviceCheckUrls.
        #
        # Turning that flag off restores the old behaviour EXACTLY — the field is
        # never written, so it cannot leak through a later ingress mistake. And
        # upgrade.sh now treats "URLs published" plus "a public host in the
        # Ingress" as a combination worth shouting about at deploy time, which is
        # the interlock that makes flipping this back on safe to forget.
        name = check.get("name") or "service"
        expect = int(check.get("expectStatus", 200))
        timeout = float(check.get("timeoutSeconds", 5))
        started = time.monotonic()
        try:
            req = urllib.request.Request(check["url"], method="GET")
            with urllib.request.urlopen(req, timeout=timeout) as r:
                code = r.status
                r.read(2048)
        except urllib.error.HTTPError as e:
            # An HTTP error is still an answer — a 500 means the service is up
            # and unhealthy, which reads differently from unreachable.
            code = e.code
        except Exception as e:
            return prune({
                "name": name,
                "ok": False,
                "reason": type(e).__name__,
                "latencyMs": round((time.monotonic() - started) * 1000),
                "url": check["url"] if PUBLISH_SERVICE_CHECK_URLS else None,
            })
        return prune({
            "name": name,
            "ok": code == expect,
            "status": code,
            "latencyMs": round((time.monotonic() - started) * 1000),
            "url": check["url"] if PUBLISH_SERVICE_CHECK_URLS else None,
        })


    def collect():
        nodes = api_get("/api/v1/nodes")["items"]

        all_pods = []
        try:
            all_pods = api_get("/api/v1/pods")["items"]
        except Exception as e:
            log("k8s_pods_api_error", error=e)

        deployments = []
        try:
            deployments = parse_deployments(api_get("/apis/apps/v1/deployments").get("items", []))
        except Exception as e:
            log("k8s_deployments_api_error", error=e)

        statefulsets = []
        try:
            statefulsets = parse_statefulsets(api_get("/apis/apps/v1/statefulsets").get("items", []))
        except Exception as e:
            log("k8s_statefulsets_api_error", error=e)

        daemonsets = []
        try:
            daemonsets = parse_daemonsets(api_get("/apis/apps/v1/daemonsets").get("items", []))
        except Exception as e:
            log("k8s_daemonsets_api_error", error=e)

        events = []
        if PUBLISH_EVENTS:
            try:
                # No type filter any more — the page carries a Warnings/All
                # toggle. The limit rises with it, because dropping the filter
                # means Normal chatter now competes for the same window; see
                # parse_events for how the two populations are capped.
                events = parse_events(
                    api_get("/api/v1/events", {"limit": "500"}).get("items", [])
                )
            except Exception as e:
                log("k8s_events_api_error", error=e)

        # The deploy-cadence lane. Each of these is cached by slow_api_get and
        # re-fetched on SLOW_INTERVAL, not every cycle.
        ingresses = []
        if PUBLISH_INGRESSES:
            try:
                items, _age = slow_api_get("/apis/networking.k8s.io/v1/ingresses")
                ingresses = extras.parse_ingresses(items.get("items", []))
            except Exception as e:
                log("k8s_ingresses_api_error", error=e)

        cron_jobs = []
        job_failures = []
        job_owner = {}
        if PUBLISH_JOBS:
            try:
                items, _age = slow_api_get("/apis/batch/v1/cronjobs")
                cron_jobs = extras.parse_cronjobs(items.get("items", []))
            except Exception as e:
                log("k8s_cronjobs_api_error", error=e)
            try:
                items, _age = slow_api_get("/apis/batch/v1/jobs")
                job_failures, job_owner = extras.parse_jobs(items.get("items", []))
            except Exception as e:
                log("k8s_jobs_api_error", error=e)

        # scripts/k3s/versions-report.sh publishes the node-lane upgrade
        # backlog (apt/kernel/k3s/tailscale drift) into this ConfigMap weekly.
        # Absent ConfigMap = feature quietly off; the page hides the panel.
        node_updates = None
        if PUBLISH_NODE_UPDATES:
            try:
                cm = api_get(f"/api/v1/namespaces/{OWN_NAMESPACE}/configmaps/versions-report")
                node_updates = json.loads(cm.get("data", {}).get("report.json", "null"))
            except urllib.error.HTTPError as e:
                if e.code != 404:
                    log("versions_report_error", error=e)
            except Exception as e:
                log("versions_report_error", error=e)

        services = []
        if PUBLISH_UPTIME:
            for check in SERVICE_CHECKS:
                if not check.get("url"):
                    continue
                try:
                    services.append(check_service(check))
                except Exception as e:
                    # A malformed check must not cost the whole scrape.
                    log("service_check_error", name=check.get("name"), error=e)

