    def _restart_reason(status):
        # Why a container last died, from containerStatuses[].lastState.
        #
        # OOMKilled WINS over Error when containers in one pod disagree. They are
        # different faults with different fixes — an OOM means the limit is wrong,
        # a non-zero exit means the program is — and the OOM is the one that is
        # both actionable and invisible everywhere else on this page.
        #
        # An exit code rides along with Error because "Error" on its own says
        # nothing; 137 (SIGKILL) and 1 send you to different places.
        best = None
        for cs in status.get("containerStatuses") or []:
            term = (cs.get("lastState") or {}).get("terminated") or {}
            reason = term.get("reason")
            if not reason:
                continue
            if reason == "OOMKilled":
                return reason
            if best is None:
                code = term.get("exitCode")
                best = (f"{reason} ({code})"
                        if reason == "Error" and code is not None else reason)
        return best


    def pod_detail(pod, publish_images=True):
        # Used by BOTH the per-node pod tables and the problem-pods roll-up, so
        # the two can never drift into describing the same pod differently.
        spec = pod.get("spec") or {}
        status = pod.get("status") or {}
        containers = spec.get("containers") or []
        out = {
            "startedAt": status.get("startTime") or None,
            "qos": status.get("qosClass") or "",
            "restartReason": _restart_reason(status),
