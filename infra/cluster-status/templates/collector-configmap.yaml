    def parse_ingresses(items, limit=200):
        rows = []
        for ing in items:
            meta = ing.get("metadata") or {}
            spec = ing.get("spec") or {}
            ann = meta.get("annotations") or {}

            middlewares = ann.get(_ANN_MIDDLEWARES) or ""
            forward_auth = _FORWARD_AUTH_MARKER in middlewares.lower()
            declared_public = ann.get(_ANN_PUBLIC_UNAUTH) == "true"
            edge_tls = ann.get(_ANN_EDGE_TLS) == "true"
            resolver = ann.get(_ANN_RESOLVER) or ""

            # Rule 4's three states, and the distinction is the whole point:
            #   authed    — a forward-auth middleware is in front of it
            #   declared  — deliberately unauthenticated, and said so
            #   silent    — neither, which is the ONLY failure. Most hosts here
            #               are correctly unauthenticated (Authelia cannot sit
            #               behind itself; the sms-relay webhook is HMAC-signed;
            #               Jellyfin's TV apps need the raw API). Colouring
            #               "declared" as a problem would paint most of the
            #               cluster red and teach the reader to ignore it.
            if forward_auth:
                auth = "authed"
            elif declared_public:
                auth = "declared"
            else:
                auth = "silent"

            # Rule 3's states, in the order the policy accepts them.
            #
            # "wildcard" is the normal answer on this cluster and not a
            # fallback: Traefik holds no ACME state at all any more, and
            # infra/traefik-certs renews the *.zachd.duckdns.org wildcard into
            # the Secret Traefik serves as its defaultCertificate. So
            # `router.tls: "true"` with no certresolver is the healthy,
            # deliberate arrangement — do NOT read it as "Traefik's self-signed
            # default", which is the thing rule 3 exists to catch and which
            # shows up here as an empty tls field instead.
            if resolver:
                tls = resolver
            elif edge_tls:
                tls = "edge"
            elif ann.get(_ANN_TLS) == "true":
                tls = "wildcard"
            else:
                tls = ""

            for rule in spec.get("rules") or []:
                host = rule.get("host") or ""
                paths = ((rule.get("http") or {}).get("paths") or [])
                for p in paths or [{}]:
                    rows.append(prune({
                        "namespace": meta.get("namespace", ""),
                        "name": meta.get("name", ""),
                        "host": host,
                        "path": p.get("path") or "/",
                        "backend": _backend(p),
                        "ingressClass": spec.get("ingressClassName") or "",
                        "entrypoints": ann.get(_ANN_ENTRYPOINTS) or "",
                        "tls": tls,
                        "auth": auth,
                        "exposure": ("tailnet" if host.endswith(_TAILNET_SUFFIX)
                                     else "public"),
                    }))
        # Anything a reader should act on first: a silent host, then one with no
        # TLS answer, then public hosts, then alphabetical.
        rows.sort(key=lambda r: (r.get("auth") != "silent",
                                 bool(r.get("tls")),
                                 r.get("exposure") != "public",
                                 r.get("host", ""), r.get("path", "")))
        return rows[:limit]


    # --------------------------------------------------------------------- storage
    def parse_storage(pvc_items, pv_items, usage, limit=200):
        # `usage` is (namespace, claim) -> (capacityBytes, usedBytes), built by
        # collect.py from the same kubelet volume stats the disk bars are drawn
        # from, so the two can never disagree about how full a claim is.
        pvs = {}
        for pv in pv_items:
            pvs[(pv.get("metadata") or {}).get("name") or ""] = pv

        rows = []
        for pvc in pvc_items:
            meta = pvc.get("metadata") or {}
            spec = pvc.get("spec") or {}
            status = pvc.get("status") or {}
            ns = meta.get("namespace", "")
            name = meta.get("name", "")

            requested = ((spec.get("resources") or {}).get("requests") or {}).get("storage")
            # status.capacity is what was actually provisioned, which can exceed
            # the request; prefer it and fall back to the ask.
            actual = (status.get("capacity") or {}).get("storage") or requested

            volume_name = spec.get("volumeName") or ""
            pv = pvs.get(volume_name) or {}
            pv_spec = pv.get("spec") or {}

            cap_used = usage.get((ns, name))
            used_bytes = None
            percent = None
            if cap_used:
                stat_cap, stat_used = cap_used
                used_bytes = stat_used
                if stat_cap > 0:
                    percent = stat_used / stat_cap * 100

            rows.append(prune({
                "namespace": ns,
                "name": name,
                "phase": status.get("phase") or "",
                "capacityBytes": parse_memory(actual) if actual else None,
                "storageClass": spec.get("storageClassName") or "",
                "accessModes": spec.get("accessModes") or [],
                "volumeName": volume_name,
                "reclaimPolicy": pv_spec.get("persistentVolumeReclaimPolicy") or "",
                # NOT zero when kubelet has nothing to say. kubelet only reports
                # volumes that are currently MOUNTED, so a Bound claim whose pod
                # is not running has no stats at all — and rendering that as 0%
                # would read as "empty" when the truth is "unknown". The page
                # prints an em dash. Same class of mistake as the network
                # counters talaria still gets wrong (see the chart README).
                "usedBytes": used_bytes,
                "percent": percent,
            }))

        # Anything not Bound first, then fullest first, then alphabetical.
        rows.sort(key=lambda r: (r.get("phase") == "Bound",
                                 -(r.get("percent") or 0),
                                 r.get("namespace", ""), r.get("name", "")))
        return rows[:limit]


    # ------------------------------------------------------------------ jobs lane
    def parse_cronjobs(items, limit=100):
        rows = []
        for cj in items:
            meta = cj.get("metadata") or {}
            spec = cj.get("spec") or {}
            status = cj.get("status") or {}
            last_schedule = status.get("lastScheduleTime") or ""
            last_success = status.get("lastSuccessfulTime") or ""
            rows.append(prune({
                "namespace": meta.get("namespace", ""),
                "name": meta.get("name", ""),
                "schedule": spec.get("schedule") or "",
                "suspended": spec.get("suspend") is True,
                "concurrencyPolicy": spec.get("concurrencyPolicy") or "",
                "lastScheduleTime": last_schedule or None,
                "lastSuccessfulTime": last_success or None,
                "activeCount": len(status.get("active") or []),
                # The question this table exists to answer. A CronJob that ran
                # more recently than it last succeeded failed its last run —
                # which is invisible in every other section, because the pod it
                # left behind is Failed and the README's own rule says Failed
                # pods are not critical.
                "lastRunFailed": bool(last_schedule and last_success
                                      and last_success < last_schedule),
            }))
        # Failing first, then suspended last, then alphabetical.
        rows.sort(key=lambda r: (not r.get("lastRunFailed"),
                                 bool(r.get("suspended")),
                                 r.get("namespace", ""), r.get("name", "")))
        return rows[:limit]


    def parse_jobs(items, limit=50):
        # Returns (rows, job_owner). Only ACTIVE and FAILED jobs get rows — a
        # Job that completed is not news, and this cluster keeps hundreds of
        # them. job_owner maps every Job name to its CronJob regardless, because
        # parse_problem_pods needs it for jobs that succeeded too.
        rows = []
        job_owner = {}
        for job in items:
            meta = job.get("metadata") or {}
            status = job.get("status") or {}
            name = meta.get("name", "")
            ns = meta.get("namespace", "")

            owner = ""
            for ref in meta.get("ownerReferences") or []:
                if ref.get("kind") == "CronJob":
                    owner = ref.get("name") or ""
                    break
            if owner:
                job_owner[(ns, name)] = owner

            failed = int(status.get("failed") or 0)
            active = int(status.get("active") or 0)
            if not failed and not active:
                continue

            reason = ""
            message = ""
            for c in status.get("conditions") or []:
                if c.get("type") == "Failed" and c.get("status") == "True":
                    reason = c.get("reason") or ""
                    message = c.get("message") or ""
                    break

            rows.append(prune({
                "namespace": ns,
                "name": name,
                "owner": owner,
                "startTime": status.get("startTime") or None,
                "completionTime": status.get("completionTime") or None,
                "failed": failed,
                "succeeded": int(status.get("succeeded") or 0),
                "active": active,
                "reason": reason,
                "message": message,
            }))

        rows.sort(key=lambda r: (not r.get("failed"), r.get("startTime") or ""),
                  reverse=False)
        return rows[:limit], job_owner


    def pod_owner(pod, job_owner):
        # "CronJob/paperless-backup" for a pod two hops down. The chart README
        # has always carried the caveat that most Failed pods here are CronJob
        # pods kept for their logs; this turns that from something the reader
        # has to remember into a column they can read.
        ns = (pod.get("metadata") or {}).get("namespace", "")
        for ref in (pod.get("metadata") or {}).get("ownerReferences") or []:
            kind = ref.get("kind") or ""
            name = ref.get("name") or ""
            if kind == "Job":
                cron = (job_owner or {}).get((ns, name))
                return f"CronJob/{cron}" if cron else f"Job/{name}"
            if kind:
                return f"{kind}/{name}"
        return ""
