    # Pure parsers for everything the page grew after it left the Cloudflare
    # tunnel: node identity, per-pod detail, the routing table, storage claims,
    # and the job/cronjob lane.
    #
    # WHY A SECOND FILE AND NOT MORE OF collect.py. collect.py is the faithful
    # port of talaria's collector and the README makes a point of the
    # measurement logic being deliberately unchanged. Growing it by another 400
    # lines of unrelated parsing would bury that. More usefully: nothing in here
    # touches the network, reads an environment variable, or holds state, so
    # every function is a value in / value out transform of a list the caller
    # already fetched. That is what makes it testable against a saved
