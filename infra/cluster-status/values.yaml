# cluster-status — the tailnet cluster dashboard at status.zachd.duckdns.org.
#
# Ported from talaria's authed /admin/cluster page. That page's collector was
# already fully generic (no talaria names, no filters); its only coupling was
# plumbing — talaria's Handler framework, its k8s client, and protobuf. Here the
# same logic runs as a plain stdlib-only script emitting JSON.
#
#   collector sidecar ──reads k8s API──▶ /data/status.json (emptyDir)
#                           ──fetches──▶ /data/icons/*    (catalog favicons)
#                                              │
#                             nginx ───serves──┘  index.html + status.json
#                                              │  + /icons/
#                                    Ingress ──┴──▶ status.zachd.duckdns.org
#                                                   (tailnet only — see the
#                                                    ingress block below)
#
# WHY A SIDECAR AND NOT A CRONJOB: network rates are computed by diffing
# kubelet's cumulative rx/tx counters against the previous sample held in
# memory. A CronJob starts fresh every run, so it would never have a previous
# sample and every rate would be null forever. The collector has to be a
# long-lived process.
#
# WHY NOT SERVE FROM AN API: nginx only ever serves static files off local disk, so
# a page view never reaches the Kubernetes API. An always-on API querying k8s per
# request would hand every viewer a way to hammer the API server and every
# kubelet's /stats/summary, unauthenticated. The collector is the only thing that
# talks to k8s, on its own fixed schedule, no matter how much traffic arrives.
#
# This argument was originally written as "this page is PUBLIC", and the page is
# not public any more (see the ingress block). The DESIGN does not change with
# it: the property that makes this safe is that serving cannot amplify into API
# load, which is worth having against a tailnet full of our own devices and
# browser tabs too. Delisting removed the internet from the threat model; it did
# not make an unauthenticated k8s-querying API a good idea.

replicaCount: 2

collector:
  # renovate: datasource=docker depName=python
  image: python:3.14.7-alpine
  # Seconds between scrapes. Also the page's poll interval. Each scrape is
  # 1 nodes + 1 pods + 3 workload lists + 1 events + 1 configmap, plus one
  # /stats/summary per node — so ~14 calls per cycle on a 7-node cluster, per
  # replica. (This said ~14 for a long time; it predated the statefulsets,
  # daemonsets and versions-report calls.)
  intervalSeconds: 15
  # The rest of what this page reads — Ingresses, PVCs, PVs, Jobs, CronJobs —
  # changes on a DEPLOY, not on a tick. Fetching those five every 15s would be
  # a 30% larger API bill for data that is byte-identical three cycles out of
  # four, so they get their own interval: ~17 calls per cycle with a +5 spike
  # every fourth, i.e. about 7% more traffic rather than 30%.
  #
  # Nothing time-sensitive rides on it. The number on that panel that actually
  # moves — how full a PVC is — comes from kubelet's /stats/summary, which is
  # still fetched every cycle with everything else. Raising this only makes
  # "which Ingresses exist" more stale, which is a question with a slow answer.
  slowIntervalSeconds: 60
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 192Mi

web:
  # renovate: datasource=docker depName=nginxinc/nginx-unprivileged
  image: nginxinc/nginx-unprivileged:1.31.3-alpine
  # The unprivileged image listens high and runs as non-root out of the box,
  # which is what we want for anything serving HTTP, tailnet or not.
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# What the collector is allowed to write into status.json. Everything here is
# readable by every viewer the moment it's collected, so this is the redaction
# point — not the page, not the ingress. All ten default on.
#
# THESE FLAGS DID NOT BECOME POINTLESS WHEN THE PAGE LEFT THE TUNNEL, and the
# temptation to treat them that way is exactly why this note exists. Two reasons
# they still earn their place. First, redacting at the collector means the field
# is never written at all, so it cannot leak through a LATER misconfiguration —
# including the obvious one, someone putting a Cloudflare host back in the
# ingress block below. That was always the argument for redacting here rather
# than at the ingress, and it is an argument about future mistakes, not about
# today's threat model. Second, "tailnet-only" is not "private": it is every
# device we have ever added, including phones and laptops that leave the house.
#
#   events        — Kubernetes Warning event messages. Benign on a healthy
#                   cluster (container started, job completed), but the text is
#                   unbounded and on a bad day routinely names Secrets, images,
#                   registries and paths: `secret "x" not found`, `Failed to
#                   pull image ghcr.io/... unauthorized`. Which is to say it's
#                   least safe exactly when the page is most useful.
#   nodeVersions  — kernelVersion and osImage. Publishing exact kernel versions
#                   tells anyone which CVEs apply to these nodes.
#
# Flip either to false and the collector never writes the field at all, so it
# can't leak even if the page or ingress is later misconfigured.
#   uptime        — the serviceChecks results below. Names and up/down only;
#                   the probed URL is never written into status.json (several
#                   point at ClusterIPs and LAN hosts, which are nobody's
#                   business but ours even on the tailnet).
#   nodeUpdates   — the weekly node-lane report scripts/k3s/versions-report.sh
#                   writes into the versions-report ConfigMap: pending apt and
#                   security-update counts, kernel drift, k3s vs stable,
#                   tailscale spread. Same CVE-exposure caveat as nodeVersions —
#                   it advertises exactly how far behind each node is. The two
#                   flags should move together.
#
# The six below were added when the page was expanded for a tailnet-only
# audience. They are the reason the note above is not decorative: each one is a
# class of information that would have been a bad idea to publish on the tunnel,
# and every one of them is off by a single line if that ever changes.
#
#   nodeAddresses — each node's internal IP and its tailnet (100.64/10) address.
#                   Names alone are an inventory; addresses are a map you can
#                   act on. Nothing else on this page has ever carried an IP.
#   podImages     — the first container's image:tag per pod. This is a version
#                   inventory of every piece of software in the house, which is
#                   exactly the nodeVersions argument one layer up: it tells a
#                   reader which CVEs apply without their having to probe. The
#                   two flags should move together.
#   ingresses     — the routing table: host, path, backend service, TLS
#                   resolver, and whether each host answers on the tunnel or
#                   only on the tailnet. This is the strongest disclosure on the
#                   page by some distance — it is a prioritised target list, not
#                   merely an inventory — AND it is the single most useful new
#                   panel for the audience that can actually reach the page.
#                   That tension is the whole reason it gets its own flag rather
#                   than riding on one of the others.
#   storage       — PersistentVolumeClaims: name, class, capacity and how full.
#                   Capacities are dull; claim names are app names and sometimes
#                   person names, and a fill percentage tells an observer which
#                   service is about to break without their touching it.
#   jobs          — CronJob schedules and recent Job failures. A schedule is a
#                   timetable of when this cluster is busy and when the backups
#                   run, which is information about the house rather than about
#                   Kubernetes.
#   serviceCheckUrls
#                 — the target of each uptime probe below. Withheld
#                   unconditionally while the page was public, because the
#                   targets are ClusterIPs and LAN hosts and publishing them
#                   would have handed the internet an internal host inventory.
#                   Published now because "SMS relay is down" and "this
#                   ClusterIP is refusing on :8000" are different diagnoses and
#                   only the second says where to look. upgrade.sh shouts if
#                   this is on at the same time as a public Ingress host.
#
# There is deliberately NO flag for the namespace roll-up. It is a sum of
# per-pod figures this page already publishes one card up, so a flag there would
# redact nothing — and a flag that hides nothing quietly suggests the rest are
# decorative too.
publish:
  events: true
  nodeVersions: true
  uptime: true
  nodeUpdates: true
  nodeAddresses: true
  podImages: true
  ingresses: true
  storage: true
  jobs: true
  serviceCheckUrls: true
  catalog: true

# HTTP endpoints the collector probes each cycle, for services whose failure is
# invisible in pod status — a Running pod whose upstream is unreachable still
# shows green in every other section of this page.
#
# Each entry: name (published), url (NEVER published), expectStatus (default
# 200), timeoutSeconds (default 5). Keep timeouts well under
# collector.intervalSeconds — checks run in series, inside the scrape loop.
#
# ⚠️ Probe the service, not its backend. sms-relay's own health endpoint is the
# right target; the Android gateway phone behind it is deliberately NOT checked
# here. That would need the gateway's basic-auth credentials in this collector,
# and it would publish "the owner's phone is off the network" — a fact about a
# person, not about the cluster. Still true now the page is tailnet-only: the
# objection was never only about who could read it. If you ever do add it, note
# the gateway app answers /health with a 500 and reports real status on /
# instead.
#
# Six checks at 3-5s each is up to ~25s of budget against a 15s interval if
# every one of them hangs — which cannot happen unless the whole cluster is
# already gone, but it is why the timeouts below are tight rather than generous.
# A scrape that overruns the interval just delays the next one; main() sleeps
# for the remainder, never a negative.
serviceChecks:
  - name: SMS relay
    # Cluster-internal Service address, so the check works with no ingress,
    # no TLS, and no dependency on DNS or the tunnel being up. Same for all
    # of the below.
    url: http://sms-relay.infra.svc.cluster.local:8000/api/health
    expectStatus: 200
    timeoutSeconds: 5
  - name: Authelia
    # The biggest blast radius on the cluster: this is the forward-auth for
    # every gated host, so when it stops answering, half the estate returns
    # 502 while every one of those services' own pods stays green — the exact
    # failure this whole section exists to catch, one layer bigger than the
    # sms-relay case that motivated it.
    url: http://authelia.auth.svc.cluster.local:9091/api/health
    expectStatus: 200
    timeoutSeconds: 3
  - name: Jellyfin
    # The most-used service in the house and the one whose outages get
    # reported last, and least politely.
    url: http://jellyfin.media.svc.cluster.local:8096/health
    expectStatus: 200
    timeoutSeconds: 3
  - name: CrowdSec LAPI
    # Traefik's bouncer talks to this. If it is unreachable the bouncer either
    # fails open or fails closed, and neither shows up in pod status.
    url: http://crowdsec-service.crowdsec.svc.cluster.local:8080/health
    expectStatus: 200
    timeoutSeconds: 3
  - name: BlueMap
    # Served on :8100 on every node IP, bypassing Traefik entirely — so it is
    # invisible to anything that checks by ingress host.
    url: http://mc-minecraft-bluemap.minecraft.svc.cluster.local:8100/
    expectStatus: 200
    timeoutSeconds: 5
  - name: Paperless
    # Bundles its own Postgres, Redis, Tika and Gotenberg. The web pod stays
    # 1/1 Running when its database doesn't, which is the sms-relay shape again.
    url: http://paperless.docs.svc.cluster.local:8000/
    expectStatus: 200
    timeoutSeconds: 5
#
# Deliberately NOT checked, so the next person doesn't have to re-derive it:
#
#   egress-proxy    — CONNECT-only squid. A plain GET is not a valid health
#                     signal for it, so a check would be a permanent false red.
#   cluster-status  — infra/alloy already blackbox-probes this Service, and a
#                     page reporting on its own liveness answers the wrong
#                     question anyway: if it can render, it is up.
#   Traefik /ping   — worth having, but the k3s Traefik Service publishes only
#                     80 and 443; port 9000 is not on it. A check aimed at a
#                     closed port burns its entire timeout every single cycle.

# The tile grid at the top of the page: every service in the house, each one
# linking to the address you would actually type.
#
# WHY THIS IS A LIST AND NOT DERIVED. Almost everything on this page is read
# from the cluster, and the catalog reads most of itself the same way — health,
# hostnames, TLS and auth posture all come from objects the collector already
# fetches. Three things cannot be derived, and they are exactly the three that
# make the grid worth having:
#
#   A NAME. Kubernetes knows this Service as `arr-qbittorrent`. Nobody calls it
#   that. A grid of Service names is a `kubectl get svc` with rounded corners.
#
#   A GROUPING. "Which of these is a media thing" is a fact about the household,
#   not about the cluster, and no label on the object carries it.
#
#   THE SERVICES WITH NO INGRESS. A Minecraft server and three Discord bots are
#   services by any definition a person would use, and none of them has an
#   Ingress, a hostname or a browser UI. A catalog derived from Ingresses would
#   omit them and call itself complete.
#
# It does not go stale, because it is not the only input: any Ingress host that
# no entry below claims still gets a tile, under an "Unlisted" heading, named
# after its Service. Deploy a new chart with an Ingress and it appears on the
# page unprompted — looking unloved, which is the nudge to come and name it.
#
# FIELDS. `name` and `category` are the two that only a person can supply.
# `namespace` + `service` are the join key: they match the Service that Ingress
# rules point at, they name the Deployment/StatefulSet/DaemonSet whose readiness
# becomes the tile's state, and they are the slug the icon is filed under.
#
#   workload   — when the workload is not named after the Service. BlueMap is a
#                sidecar of the Minecraft pod; qBittorrent's Service and
#                Deployment agree, CrowdSec's do not.
#   cronjob    — for services that own no Pod between ticks. The DuckDNS updater
#                and Renovate are healthy or not according to their last run,
#                and a replica count would say "unknown" about both forever.
#   check      — the name of a serviceChecks entry above. A failed probe beats a
#                healthy replica count, which is the whole reason probes exist.
#   hosts      — narrows an entry to some of its Service's hostnames. One
#                Service can front two unrelated front doors: claude-workspace
#                answers as both the terminal and the bakery, and merging them
#                into one tile loses whichever you were looking for.
#   publicUrl  — a hostname published straight off a tunnel connector to a
#                Service, with no Ingress rule of its own. kelsey.green is the
#                only one on this cluster, and it is invisible to `kubectl get
#                ingress` — so without this line the tile would link the tailnet
#                name for a site that is on the internet.
#   address    — a non-browser address, shown as text rather than a link.
#   note       — one short line under the name, for the caveat a tile needs.
#   slug       — overrides the icon filename. Two entries sharing a Service want
#                two icons.
#   iconPort   — where to look for a favicon when the port cannot be read off an
#                Ingress: either there is no Ingress at all, or its backend NAMES
#                the port rather than numbering it, and resolving a port name
#                needs the Service object this collector's role cannot read.
#                `iconUrl` replaces the whole base URL.
#
# ORDERING. Tiles sort alphabetically inside a category; the categories
# themselves are in the order listed here, with anything unlisted last.
catalog:
  enabled: true

  categories:
    - Media
    - Games
    - Home
    - Sites
    - Dev
    - Bots
    - Infrastructure

  # Favicons, fetched by the collector from each service's ClusterIP.
  #
  # THE FETCH GOES TO THE CLUSTER IP, NOT THE PUBLIC HOST, and that is not an
  # optimisation — it is the only thing that works. Most of these hosts sit
  # behind Authelia forward-auth at the ingress, so a request for /favicon.ico
  # on the public name is answered by the login portal with a redirect and an
  # HTML body: the browser renders a broken image, and the grid looks worst for
  # the services that are best protected. Going straight to the Service bypasses
  # Traefik and gets the real file.
  #
  # It also keeps the BROWSER out of it. A tile grid that loaded 30 favicons
  # from 30 hosts would have every open tab probing every service in the house
  # on a loop. One collector fetching once a day is the same picture for a
  # rounding error of the traffic — and it is why these are served from this
  # origin, cached, rather than hotlinked.
  icons:
    enabled: true
    # Fetched inside the scrape loop, so this is bounded for the same reason the
    # endpoint probes have tight timeouts: thirty fetches at four seconds each
    # would blow through collector.intervalSeconds on the one cycle where the
    # cluster is having a bad day. Two per cycle fills a cold grid in a couple
    # of minutes and can never delay a scrape by more than two timeouts.
    perCycle: 2
    ttlHours: 24
    timeoutSeconds: 4
    # A favicon that does not fit in 256KB is not a favicon. The cap also bounds
    # what a compromised or confused upstream can write into the pod's emptyDir.
    maxBytes: 262144

  services:
    # ------------------------------------------------------------------ Media
    - name: Jellyfin
      category: Media
      namespace: media
      service: jellyfin
      check: Jellyfin
    - name: Jellyseerr
      category: Media
      namespace: media
      service: jellyseerr
    - name: Prowlarr
      category: Media
      namespace: media
      service: arr-prowlarr
    - name: Radarr
      category: Media
      namespace: media
      service: arr-radarr
    - name: Sonarr
      category: Media
      namespace: media
      service: arr-sonarr
    - name: qBittorrent
      category: Media
      namespace: media
      service: arr-qbittorrent
      note: inside gluetun
    - name: bitmagnet
      category: Media
      namespace: media
      service: bitmagnet

    # ------------------------------------------------------------------ Games
    - name: Minecraft
      category: Games
      namespace: minecraft
      service: mc-minecraft
      # A LoadBalancer on 25565, not an Ingress — there is no URL to link and
      # the address is the point. This is the entry the "browser-reachable
      # only" version of this page would have dropped.
      address: mc.zachd.duckdns.org:25565
    - name: BlueMap
      category: Games
      namespace: minecraft
      service: mc-minecraft-bluemap
      # A sidecar of the Minecraft pod, so its health is that Deployment's.
      workload: mc-minecraft
      check: BlueMap
    - name: RomM
      category: Games
      namespace: games
      service: romm
    - name: Gamedex
      category: Games
      namespace: games
      service: gamedex
    - name: Smite-le
      category: Games
      namespace: discord
      service: smitele-bot-web
    - name: Cloud Retro
      category: Games
      namespace: games
      service: cloud-game
      # Its index declares `<link rel="icon" href="data:,">` — deliberately no
      # favicon — so the mark is seeded in brand/service-icons.
      note: LAN/tailnet only (WebRTC)
    - name: SMT Imagine
      category: Games
      namespace: games
      service: smt-imagine
      # The tile links the account manager (Ingress); the game itself is three
      # raw TCP ports on the node IPs. COMP_hack serves no favicon, so the mark
      # is seeded in brand/service-icons.
      note: client → smt.zachd.duckdns.org:10666, tailnet only
    - name: FFXIV 1.0
      category: Games
      namespace: games
      service: ffxiv-1x
      # No Ingress: the launcher posts to the plain web port and the lobby
      # hands the client an IP. Garlemald serves no favicon; mark is seeded.
      address: 100.84.179.82:54994
      note: Garlemald Server (1.23b), tailnet only

    # ------------------------------------------------------------------- Home
    - name: money
      category: Home
      namespace: finance
      service: money
    - name: Paperless-ngx
      category: Home
      namespace: docs
      service: paperless
      check: Paperless
    - name: Stirling PDF
      category: Home
      namespace: docs
      service: stirling
    - name: KeeWeb
      category: Home
      namespace: auth
      service: keepass-keeweb
    - name: KeePass WebDAV
      category: Home
      namespace: auth
      service: keepass-webdav
      note: vault sync, not a UI
    - name: ntfy
      category: Home
      namespace: infra
      service: ntfy
    - name: SMS relay
      category: Home
      namespace: infra
      service: sms-relay
      check: SMS relay

    # ------------------------------------------------------------------ Sites
    - name: talaria
      category: Sites
      namespace: talaria
      service: talaria-nginx
    - name: rachelfreeman.art
      category: Sites
      namespace: rachel
      service: rachel-freeman
    - name: kelsey.green
      category: Sites
      namespace: web
      service: kelsey-green
      # Its own zone and its own tunnel connector, pointed straight at the
      # Service — so this host appears in no Ingress rule anywhere. See
      # `publicUrl` in the field notes above.
      publicUrl: kelsey.green
    - name: diemer.codes
      category: Sites
      namespace: web
      service: diemer-codes
      note: tailnet until launch
    - name: old.diemer.codes
      category: Sites
      namespace: web
      service: old-diemer-codes
    - name: Luke's birthday
      category: Sites
      namespace: web
      service: luke-birthday
    - name: whatnow.gg
      category: Sites
      namespace: whatnow
      service: whatnowgg
      # Its Ingress NAMES the backend port (`whatnowgg:http`) rather than
      # numbering it, and resolving a port name needs the Service object — which
      # this collector's role deliberately cannot read. The only entry on the
      # cluster shaped this way; the collector logs `icon_no_port` for any
      # other that turns up.
      iconPort: 8080

    # -------------------------------------------------------------------- Dev
    - name: Claude workspace
      category: Dev
      namespace: claude
      service: claude-workspace
      hosts: [claude.zachd.duckdns.org]
    - name: Bakery
      category: Dev
      namespace: claude
      service: claude-workspace
      hosts: [bakery.zachd.duckdns.org]
      # Same Service, same pod, different front door — so it needs its own icon
      # slug or the two tiles would share one mark.
      slug: bakery
    - name: Happy
      category: Dev
      namespace: happy
      service: happy-server
    - name: Rachel workspace
      category: Dev
      namespace: claude-rachel
      service: rachel-workspace
      note: no ingress
    - name: Windows 11
      category: Dev
      namespace: dev
      service: guacamole
      # The KubeVirt guest (dev/win11) is a VirtualMachine, not a workload this
      # collector reads, so the tile's state is Guacamole's — the browser front
      # door to it — which is also the thing a person clicks.
      # Guacamole answers under /guacamole/, not /, so the ClusterIP root 404s
      # and the icon has to be looked for one level down.
      iconUrl: http://guacamole.dev.svc.cluster.local:8080/guacamole/
      note: via Guacamole
    - name: Ollama
      category: Dev
      namespace: ai
      service: ollama
      # Ollama serves no favicon — its `/` is a plain-text banner — so the mark
      # is seeded in brand/service-icons.
      note: local LLM API — basic auth, no UI

    # ------------------------------------------------------------------- Bots
    - name: Smite-le bot
      category: Bots
      namespace: discord
      service: smitele-bot
    - name: Vocard
      category: Bots
      namespace: discord
      service: vocard-bot
    - name: Claude bridge
      category: Bots
      namespace: minecraft
      service: claude-bridge

    # --------------------------------------------------------- Infrastructure
    - name: Authelia
      category: Infrastructure
      namespace: auth
      service: authelia
      check: Authelia
    - name: Traefik
      category: Infrastructure
      namespace: kube-system
      service: traefik
    - name: CrowdSec
      category: Infrastructure
      namespace: crowdsec
      service: crowdsec-service
      workload: crowdsec-lapi
      check: CrowdSec LAPI
    - name: Cloudflare tunnel
      category: Infrastructure
      namespace: infra
      service: cloudflared
    - name: DuckDNS
      category: Infrastructure
      namespace: infra
      service: duckdns
      cronjob: duckdns-updater
    - name: Cluster status
      category: Infrastructure
      namespace: infra
      service: cluster-status
      note: this page
    - name: Headlamp
      category: Infrastructure
      namespace: headlamp
      service: headlamp
      # Deliberately unpublished — reachable by port-forward or NodePort only,
      # so there is no Ingress to take an icon port from.
      note: port-forward only
      iconPort: 80
    - name: BuildKit
      category: Infrastructure
      namespace: buildkit
      service: buildkitd
      workload: buildkit
    - name: Registry
      category: Infrastructure
      namespace: infra
      service: registry
      # distribution serves no favicon (its `/` is a bare 200), so the mark is
      # seeded in brand/service-icons. Pulls never use the public host: every
      # node mirrors it to the pinned ClusterIP (infra/registry README).
      note: images; nodes pull over the LAN
    - name: Egress proxy
      category: Infrastructure
      namespace: infra
      service: egress-proxy
    - name: Grafana Alloy
      category: Infrastructure
      namespace: alloy
      service: alloy
    - name: k8up
      category: Infrastructure
      namespace: k8up
      service: k8up
    - name: Renovate
      category: Infrastructure
      namespace: renovate
      service: renovate
      cronjob: renovate

ingress:
  enabled: true
  className: traefik
  host: status.zachd.duckdns.org
  # DELIBERATELY EMPTY — this dashboard is no longer public.
  #
  # It carried no auth, by design: the collector sidecar writes JSON and nginx
  # serves it statically, so public traffic never touched the k8s API and the
  # worst case was reading it. That reasoning holds for the API and misses
  # what the page actually contains — node names, the full pod inventory,
  # namespaces, deployment health and raw event text. That is a free map of
  # the cluster for anyone deciding whether it is worth attacking, and event
  # messages in particular leak far more than the page intends to show.
  #
  # Nothing is lost by delisting: the audience for this page is us, and the
  # tailnet host above serves it to exactly that audience. A status page whose
  # readers are all on the tailnet does not need a public address.
  #
  # NOTE the availability property this does NOT give up. The tailnet path is
  # independent of the Cloudflare tunnel, so this page still answers when the
  # tunnel is the thing that is broken — which is precisely when a status
  # dashboard earns its keep.
  #
  # As with every delisting, also delete the Public Hostname entry from the
  # tunnel in the Cloudflare dashboard — this list is only half of it.
  cloudflareHosts: []
  tls:
    enabled: true
