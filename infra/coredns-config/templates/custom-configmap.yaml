{{- if or .Values.dnsLogging.enabled .Values.internalNames.enabled }}
{{/*
The ONE object this chart owns.

Name and namespace are both fixed, not derived from the release: the k3s
CoreDNS Deployment mounts a ConfigMap literally named `coredns-custom` from
kube-system, with `optional: true`. A differently-named ConfigMap is mounted by
nothing and fails silently — CoreDNS starts, imports an empty glob, and logs
nothing at all.

The key suffix is load-bearing too. Files matching `*.override` are imported
from INSIDE the `.:53` server block, which is where a `log` directive has to
go. Files matching `*.server` are imported at top level and would be read as a
new server block instead — same content, and CoreDNS would fail to parse it.

Each feature renders its own `*.override` key, and the ConfigMap exists if any
of them is on. Absence is the off state, so turning the last one off removes
the object; upgrade.sh notices that transition and restarts CoreDNS for it,
because CoreDNS keeps its parsed config until it is replaced.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
  labels:
    {{- include "coredns-config.labels" . | nindent 4 }}
data:
{{- if .Values.dnsLogging.enabled }}
  egress-audit.override: |
    # Managed by the coredns-config Helm chart. See infra/coredns-config.
    #
    # Egress inventory instrument, expected to be switched on for a measurement
    # window and off again. `class` is what keeps the volume survivable: the
    # Kubernetes search path turns one real lookup into four or five NXDOMAINs,
    # and success-only discards them here rather than in Alloy.
    log {{ if .Values.dnsLogging.zones }}{{ join " " .Values.dnsLogging.zones }}{{ else }}.{{ end }} {
        class {{ join " " .Values.dnsLogging.classes }}
    }
{{- end }}
{{- if .Values.internalNames.enabled }}
{{- $zone := .Values.internalNames.zone | replace "." "\\." }}
  internal-names.override: |
    # Managed by the coredns-config Helm chart. See infra/coredns-config.
    #
    # infra/duckdns publishes a node's 100.x Tailscale address for this zone,
    # which no pod can reach. Answer it internally with the Service that serves
    # it instead. `answer auto` puts the queried name back in the response, so
    # SNI, the wildcard cert and Traefik's host routing all still see the name
    # the client asked for.
    #
    # Rule order matters: rewrite takes the first match and `stop` ends the
    # chain, so the exceptions have to precede the catch-all.
{{- range $label, $service := .Values.internalNames.exceptions }}
    rewrite stop {
        name regex ^{{ $label }}\.{{ $zone }}\.$ {{ $service }}
        answer auto
    }
{{- end }}
    rewrite stop {
        name regex (.*)\.{{ $zone }}\.$ {{ .Values.internalNames.service }}
        answer auto
    }
{{- end }}
{{- end }}
