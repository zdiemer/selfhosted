apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: steam-runtime-helpers
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [steam-input-runtime, steam-display-devices]
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
