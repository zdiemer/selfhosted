apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: steam-display-devices
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: steam-display-devices}
  template:
    metadata:
      labels: {app.kubernetes.io/name: steam-display-devices}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.node }}
      containers:
        - name: plugin
          image: {{ .Values.devicePluginImage }}
          args:
            - --device
            - '{"name":"steam-display","groups":[{"paths":[{"path":"/dev/dri/card1"},{"path":"/dev/dri/renderD128"},{"path":"/dev/uinput"},{"path":"/dev/tty0"},{"path":"/dev/tty7"}]}]}'
            - --listen=127.0.0.1:8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: plugins, mountPath: /var/lib/kubelet/device-plugins}
            - {name: dri, mountPath: /dev/dri, readOnly: true}
            - {name: uinput, mountPath: /dev/uinput, readOnly: true}
            - {name: tty0, mountPath: /dev/tty0, readOnly: true}
            - {name: tty7, mountPath: /dev/tty7, readOnly: true}
      volumes:
        - name: plugins
          hostPath: {path: /var/lib/kubelet/device-plugins, type: Directory}
        - name: dri
          hostPath: {path: /dev/dri, type: Directory}
        - name: uinput
          hostPath: {path: /dev/uinput, type: CharDevice}
        - name: tty0
          hostPath: {path: /dev/tty0, type: CharDevice}
        - name: tty7
          hostPath: {path: /dev/tty7, type: CharDevice}
