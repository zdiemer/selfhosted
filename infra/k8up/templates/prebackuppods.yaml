{{/*
Database dumps.

A file-level copy of a running database copies it mid-write. It usually restores
— which is worse than never restoring, because you find out during a recovery.
Each of these starts a client pod before its namespace's backup runs, and k8up
captures the dump's STDOUT as a file in the repository alongside the volumes.

The pods are clients over the service, not sidecars: nothing here touches the
charts that own the databases, so those stay independently upgradeable and this
chart owns the whole backup story.

Credentials come from the databases' OWN secrets, referenced rather than copied,
so a rotation there is picked up here with no changes and no second copy of a
password to drift.

Note these do NOT replace the volume backup — k8up still copies the PVC. They
add a consistent logical dump next to the physical files. The dump is what you
restore from; the files are what you have if the dump is somehow unusable.
*/}}
{{- if .Values.databaseDumps.enabled }}
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: paperless-postgres-dump
  namespace: docs
  labels:
    {{- include "k8up-wrapper.labels" . | nindent 4 }}
spec:
  # -F c is the custom format: compressed, and restorable table-by-table with
  # pg_restore rather than all-or-nothing like a plain SQL file.
  # A single string, not a list: k8up copies this verbatim into the pod's
  # k8up.io/backupcommand annotation and shell-word-splits it, so the whole
  # pipeline has to sit inside one quoted -c argument.
  backupCommand: /bin/sh -c 'PGPASSWORD=$POSTGRES_PASSWORD pg_dump -h paperless-postgres -U $POSTGRES_USER -d $POSTGRES_DB -F c'
  fileExtension: .pgdump
  pod:
    spec:
      # No restartPolicy. k8up realises a PreBackupPod as a DEPLOYMENT, and a
      # Deployment's pod template only accepts restartPolicy: Always — "Never"
      # is rejected by the API server, the operator retries forever, and the
      # Backup sits with PreBackupPodReady=True and no job ever created.
      containers:
        - name: dump
          # Matches the server's major version. pg_dump refuses to dump a server
          # newer than itself, so this tracks docs/paperless-ngx's postgres image.
          # renovate: datasource=docker depName=postgres
          image: postgres:16.14-alpine
          command: ["sleep", "infinity"]
          envFrom:
            - secretRef:
                name: paperless-postgres
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: romm-db-dump
  namespace: games
  labels:
    {{- include "k8up-wrapper.labels" . | nindent 4 }}
spec:
  # --single-transaction takes the dump inside one consistent snapshot without
  # locking the tables, which matters here: romm's largest table is ~97k rows and
  # a locking dump would stall the app for the duration.
  backupCommand: /bin/sh -c 'mariadb-dump -h romm-db -u root -p$MARIADB_ROOT_PASSWORD --single-transaction --routines --triggers --all-databases'
  fileExtension: .sql
  pod:
    spec:
      # No restartPolicy. k8up realises a PreBackupPod as a DEPLOYMENT, and a
      # Deployment's pod template only accepts restartPolicy: Always — "Never"
      # is rejected by the API server, the operator retries forever, and the
      # Backup sits with PreBackupPodReady=True and no job ever created.
      containers:
        - name: dump
          # Tracks games/romm's mariadb 11.4 server.
          # renovate: datasource=docker depName=mariadb
          image: mariadb:11.4.12
          command: ["sleep", "infinity"]
          envFrom:
            - secretRef:
                name: romm-db
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 512Mi }
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: vocard-mongo-dump
  namespace: discord
  labels:
    {{- include "k8up-wrapper.labels" . | nindent 4 }}
spec:
  # --archive writes a single stream to stdout, which is what k8up captures.
  backupCommand: /bin/sh -c 'mongodump --host vocard-mongo --username $MONGO_USER --password $MONGO_PASS --authenticationDatabase admin --archive --gzip'
  fileExtension: .archive.gz
  pod:
    spec:
      # No restartPolicy. k8up realises a PreBackupPod as a DEPLOYMENT, and a
      # Deployment's pod template only accepts restartPolicy: Always — "Never"
      # is rejected by the API server, the operator retries forever, and the
      # Backup sits with PreBackupPodReady=True and no job ever created.
      containers:
        - name: dump
          # renovate: datasource=docker depName=mongo
          image: mongo:7.0.39
          command: ["sleep", "infinity"]
          env:
            # This secret uses hyphenated keys, which are not valid shell
            # identifiers, so they cannot be pulled in wholesale with envFrom
            # the way the other two are.
            - name: MONGO_USER
              valueFrom:
                secretKeyRef: { name: vocard-mongo, key: mongo-root-username }
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef: { name: vocard-mongo, key: mongo-root-password }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 512Mi }
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: talaria-postgres-dump
  namespace: talaria
  labels:
    {{- include "k8up-wrapper.labels" . | nindent 4 }}
spec:
  # The most important dump in the cluster: 75G, 45 tables, ~40M rows in the
  # largest. Its VOLUME snapshot is 0 B (see the note at the bottom of this
  # file), so this dump is not a supplement to the file copy, it IS the backup.
  #
  # SOLVED — it was the last hypothesis in the old note, not the networking.
  # k8up does NOT honour `spec.pod.metadata.labels`: the live PreBackupPod
  # reports them empty, and the pods k8up actually creates carry only
  # `k8upjob=true` plus the Job's own labels. talaria's NetworkPolicy admitted
  # `app.kubernetes.io/component: backup`, so it matched nothing and every
  # connection was refused — which reads exactly like a networking fault and is
  # why it was chased as one for so long.
  #
  # What isolated it: pg_dump run by hand from INSIDE the postgres pod, over
  # 127.0.0.1, works perfectly. That rules out the server, the credentials and
  # the database, and leaves only what sits between two pods.
  #
  # The fix is in talaria's own chart (helm/talaria/templates/network-policies.yaml),
  # which now admits `k8upjob: "true"` — the label the operator really sets.
  # The labels below are left in place because they are harmless and describe
  # intent, but nothing reads them.
  #
  # -F c for the same reason as paperless: compressed, and restorable
  # table-by-table with pg_restore rather than all-or-nothing.
  backupCommand: /bin/sh -c 'PGPASSWORD=$POSTGRES_PASSWORD pg_dump -h talaria-postgres -U $POSTGRES_USER -d $POSTGRES_DB -F c'
  fileExtension: .pgdump
  pod:
    metadata:
      labels:
        # talaria's chart puts a NetworkPolicy in front of Postgres that admits
        # only named components — a pod without these three labels gets
        # "connection refused" from the service and the dump produces nothing.
        # The matching ingress rule lives in ~/Code/talaria's network-policies.yaml.
        app.kubernetes.io/name: talaria
        app.kubernetes.io/instance: talaria
        app.kubernetes.io/component: backup
    spec:
      containers:
        - name: dump
          # PostgreSQL 15 here, NOT 16 like paperless. pg_dump refuses to dump a
          # server newer than itself, and silently produces a dump the older
          # server cannot restore if it is older — so this tracks the server.
          # renovate: datasource=docker depName=postgres
          image: postgres:15.18-alpine
          command: ["sleep", "infinity"]
          envFrom:
            - secretRef:
                name: talaria-secrets
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            # A 75G database dumps through a compression pipeline; give it room.
            limits: { memory: 1Gi }
{{- end }}
{{/*
WHY THE DUMPS ARE THE BACKUP, NOT A BONUS.

k8up backs up a PVC by mounting it into a pod. truenas-iscsi is ReadWriteOnce,
and for a block device that means single-node ATTACH: when the application holds
the volume on one node and the backup pod is scheduled onto another, the volume
cannot attach — and k8up snapshots the empty mountpoint instead of failing. The
Backup object reports success.

That is not theoretical. The first scheduled run produced:

  default/data-talaria-postgres-0   75G on disk    0 B snapshot
  discord/data-vocard-mongo-0      459M on disk    0 B snapshot
  games/romm-db                    719M on disk   15 B snapshot
  happy/happy-server-data          210M on disk    0 B snapshot

while romm-data, claude-workspace-home, mc-data and talaria-elasticsearch copied
correctly — the difference being nothing but which node the backup pod landed on.

A green backup containing nothing is the worst failure mode available, so the
databases do not depend on it. These PreBackupPods reach the database over the
SERVICE, which has no attach semantics and works wherever the pod runs. The
volume copies are left enabled as best-effort: when they land right they are a
free extra, and when they do not the dump is unaffected.

Minecraft deliberately has no PreBackupPod. The itzg mc-backup sidecar already
produces consistent world tarballs on its own schedule — RCON save-off,
save-all flush, tar, save-on — into the mc-backups volume, and k8up backs that
volume up like any other. A second flush here would duplicate that work and
fight the sidecar for the RCON connection. mc-data is copied too, and may be
mid-write; the tarball is the consistent artifact to restore from.
*/}}
