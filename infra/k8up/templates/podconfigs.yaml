{{- range .Values.schedules }}
{{- if .tolerations }}
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: backup-{{ .name }}
  namespace: {{ .namespace }}
  labels:
    {{- include "k8up-wrapper.labels" $ | nindent 4 }}
spec:
  template:
    spec:
      # PodConfig takes precedence over the Schedule's security/resources.
      securityContext:
        runAsUser: 0
      containers:
        - name: backup
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: {{ .memoryLimit | default "1Gi" }}
      tolerations:
        {{- toYaml .tolerations | nindent 8 }}
{{- end }}
{{- end }}
