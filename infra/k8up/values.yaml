# k8up — the cluster's backups.
#
# Every PVC that matters gets copied to a restic repository on the NAS, on a
# schedule, with the databases dumped rather than snapshotted mid-write.
#
# WHY THIS EXISTS. Before the storage migration the only backup in the cluster
# was Minecraft's mc-backup sidecar, and it wrote to a volume on the same node
# and the same disk as the world it protected. Everything else had nothing. The
# migration then left every source PV Retained as a rollback, which worked as a
# stopgap but is not a backup: it is one copy, on one node's local disk, of one
# moment in time, and it is meant to be reclaimed.
#
# WHAT PROTECTS WHAT. These are different failure modes and neither replaces
# the other:
#   ZFS snapshots (infra/democratic-csi)  same pool. Instant rollback from a
#                                         mistake. Useless if the pool dies.
#   restic here                           a second copy in a different dataset,
#                                         content-addressed and verifiable, with
#                                         app-consistent dumps for databases.
#
# THE REPOSITORY. One restic repo shared by every namespace, at vault/k8s/restic
# on the NAS, mounted over NFS. Shared rather than per-namespace because restic
# deduplicates within a repo and much of this cluster is the same base images and
# the same Postgres pages; separate repos would store all of it many times over.
#
# The cost of sharing is the prune lock: restic's prune takes the repository
# exclusively, so exactly ONE schedule prunes (see maintenance below) and every
# other schedule only ever writes.

# ------------------------------------------------------------------------------
# The restic repository, mounted from the NAS
# ------------------------------------------------------------------------------
repository:
  # Created by hand on the TrueNAS, not by democratic-csi — the CSI driver only
  # exports datasets it provisioned itself, and this one predates any claim.
  nfs:
    server: 192.168.4.36
    path: /mnt/vault/k8s/restic
  # Where the restic repo is mounted inside every backup pod.
  mountPath: /restic-repo
  # Nominal — NFS enforces the dataset quota, not this number.
  size: 500Gi

# ------------------------------------------------------------------------------
# Retention
# ------------------------------------------------------------------------------
# Applied by the single maintenance schedule below, across the whole repository.
#
# A HARD CEILING on how many snapshots exist, so the repository stops growing
# once it reaches steady state instead of accumulating forever.
#
# These buckets have to match the CADENCE or they silently mean something else.
# restic keeps the newest snapshot per bucket, so a bucket finer than the backup
# interval just pins that many BACKUPS regardless of its name:
#
#   keepHourly with a nightly schedule  pinned the last 24 DAYS
#   keepDaily  with a weekly schedule   would pin the last 7 WEEKS
#
# Both were present at some point and both were wrong. Against a weekly cadence
# the only buckets that mean what they say are weekly and coarser: 6 weeks plus
# 3 months is roughly five months of history, then flat.
#
# keepLast is the floor that ignores the calendar entirely — a volume nobody has
# touched in months still keeps its most recent few, which is what you want when
# a rarely-changing config volume turns out to be corrupt.
#
# Size is bounded by CHANGE, not by snapshot count: restic deduplicates, so nine
# snapshots of a mostly-static 21GB volume cost roughly one copy plus the deltas.
retention:
  keepLast: 3
  keepWeekly: 6
  keepMonthly: 3

# ------------------------------------------------------------------------------
# Schedules
# ------------------------------------------------------------------------------
# WEEKLY, one namespace-group per night, rather than everything every night.
#
# Nightly was more than this cluster needs and more than the NAS enjoys. Spread
# across the week instead, each night carries one real workload, so a run never
# contends with another for the shared restic lock and never bleeds into the
# morning. It also means a bad night costs a week of history at worst, not a day
# — an acceptable trade for volumes that mostly change slowly.
#
# Ordered heaviest-first early in the week, so the long ones have the most room
# before Sunday's prune. Sizes are real data, not declared:
#
#   talaria    ~85G  (talaria postgres 75G + elasticsearch 9.8G)
#   games      ~24G  (romm-data 21G; the 78TB library is excluded)
#   minecraft  ~11G  (world + the sidecar's tarballs)
#   claude      ~6G  (103k small files)
#   everything else is under a gigabyte
schedules:
  # --- Monday: the big one, alone ------------------------------------------
  - name: talaria
    namespace: talaria
    schedule: "0 1 * * 1"

  # --- Tuesday -------------------------------------------------------------
  # Dumps its MariaDB via PreBackupPod first.
  - name: games
    namespace: games
    schedule: "0 1 * * 2"

  # --- Wednesday -----------------------------------------------------------
  # No dump hook — the itzg sidecar already writes consistent world tarballs
  # into mc-backups. See templates/prebackuppods.yaml.
  - name: minecraft
    namespace: minecraft
    schedule: "0 1 * * 3"
  # media was missing from this list entirely until 2026-08-11, which came to
  # light while planning the Jellyseerr->Seerr migration: that migration is
  # one-way and there was nothing to roll back to.
  #
  # Small — ~620M all in: jellyfin 483M, sonarr 69M, radarr 31M, qbittorrent
  # 17M, prowlarr 12M, jellyseerr 5M. All of it is config and state rather than
  # media; the libraries are inline NFS mounts, not PVCs, so k8up never sees
  # them and cannot accidentally try to copy 78TB.
  #
  # Cheap to store and genuinely painful to rebuild by hand — qBittorrent's
  # resume data, the arr apps' indexer and quality profiles, Jellyseerr's
  # request history and its Jellyfin-linked accounts.
  - name: media
    namespace: media
    schedule: "0 3 * * 3"

  # --- Thursday ------------------------------------------------------------
  - name: claude
    namespace: claude
    schedule: "0 1 * * 4"
  - name: docs
    namespace: docs
    schedule: "0 3 * * 4"

  # --- Friday --------------------------------------------------------------
  - name: discord
    namespace: discord
    schedule: "0 1 * * 5"
  - name: auth
    namespace: auth
    schedule: "0 2 * * 5"
  - name: finance
    namespace: finance
    schedule: "30 2 * * 5"

  # --- Saturday ------------------------------------------------------------
  - name: web
    namespace: web
    schedule: "0 1 * * 6"
  # rachel-freeman has its own namespace rather than living in `web`: the
  # delegated workspace that deploys it holds a namespace-scoped helm Role, and
  # helm's Secret list cannot be restricted by label — so whoever can deploy
  # there can read every Secret in the namespace. Namespace = blast radius.
  # Offset from `web` so the two postgres dumps don't overlap.
  - name: rachel
    namespace: rachel
    schedule: "15 1 * * 6"
  - name: infra
    namespace: infra
    schedule: "30 1 * * 6"
  - name: happy
    namespace: happy
    schedule: "0 2 * * 6"

  # --- Sunday, before the prune --------------------------------------------
  - name: whatnow
    namespace: whatnow
    schedule: "0 1 * * 0"
  # Survival tier: on local-path so a NAS outage cannot stop you logging in to
  # fix the NAS. That is a decision about AVAILABILITY and says nothing about
  # durability, so it is still backed up.
  - name: kube-system
    namespace: kube-system
    schedule: "30 1 * * 0"
  # crowdsec was missing from this list entirely until 2026-08-21, found while
  # planning the retirement of the node its volumes are pinned to. Both PVCs are
  # local-path with Delete reclaim and node affinity on a single node, so
  # draining that node for good would have taken the LAPI database with it, and
  # there was nothing to restore from.
  #
  # Small — 100Mi config + 1Gi db. Easy to overlook because the bans themselves
  # rebuild from live traffic; what does not come back is the alert history and
  # the machine registrations. A LAPI that has forgotten its agents answers
  # their re-registration with 403 until each stale name is pruned.
  - name: crowdsec
    namespace: crowdsec
    schedule: "0 2 * * 0"

# ------------------------------------------------------------------------------
# Repository maintenance
# ------------------------------------------------------------------------------
# Exactly one schedule prunes and checks, because both take the repository lock
# and every namespace shares it. Runs after the last backup of the night.
maintenance:
  namespace: k8up
  prune:
    # Sunday morning, after the week's last backup. Daily made sense when the
    # backups were daily; against a weekly cadence it would walk the repository
    # six times for nothing.
    schedule: "0 6 * * 0"
  check:
    # After the prune, so it verifies what the prune left behind.
    schedule: "0 8 * * 0"

# ------------------------------------------------------------------------------
# Not backed up
# ------------------------------------------------------------------------------
# Backups are opt-out, so anything enormous and re-acquirable has to be excluded
# explicitly with k8up.io/backup=false on the PVC. That annotation is declared by
# the chart that OWNS each volume, not here — this chart would otherwise need a
# privileged job to patch objects it does not own, which is a lot of moving parts
# for a label:
#
#   games/romm      romm-library, a ~78TB read-only ROM corpus. Agreed as
#                   not-worth-backing-up when the migration was planned, then
#                   missed when this chart was built: the first run spent nine
#                   hours reaching 1.9% of it.
#   discord/smitele-bot  matchdata, ~500Gi and re-derivable from the Hi-Rez API.
#
# romm-saves is deliberately NOT excluded: small, and save states exist nowhere
# else.

# Logical dumps for the three real databases. See templates/prebackuppods.yaml.
databaseDumps:
  enabled: true

# ------------------------------------------------------------------------------
# Upstream operator
# ------------------------------------------------------------------------------
k8up:
  replicaCount: 1

  k8up:
    # Cron fields above are read in this zone. Without it the operator uses UTC
    # and "02:00" silently means 18:00 or 19:00 local depending on the season —
    # backups landing in the middle of the evening rather than overnight.
    timezone: America/Los_Angeles
    enableLeaderElection: true
    # Back up every PVC found, rather than only those carrying a backup
    # annotation. Opt-out is the safer default for a cluster this size: a new
    # service is protected the day it lands instead of the day someone
    # remembers. Exclude a volume with k8up.io/backup=false on the PVC.
    skipWithoutAnnotation: false

  # The operator itself only schedules; the backup pods do the work. Small, but
  # it watches every namespace, so give it enough headroom to not get OOM-killed
  # mid-schedule on a busy node.
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

  # No nodeSelector or affinity — pinning the thing that backs up the cluster to
  # one node is how you discover it stopped running when that node died.
  nodeSelector: {}
  affinity: {}
