apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: registry
      app.kubernetes.io/component: registry
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: claude}
        # Node containerd pulls. Authentication and TLS remain mandatory.
        - ipBlock: {cidr: 192.168.4.0/24}
        # Flannel uses the node tunnel IP as source for host-to-pod traffic.
        {{- range .Values.nodeConfig.overlaySourceCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {port: 5000, protocol: TCP}
  egress: []
