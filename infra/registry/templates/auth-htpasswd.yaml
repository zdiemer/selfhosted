{{/*
The htpasswd file distribution authenticates against. bcrypt, which is the only
hash distribution accepts. Rendered with Sprig's `htpasswd`, so the vault holds
the plaintext and the cluster only ever sees the hash.

Named `auth-htpasswd.yaml`, not `*-secret.yaml`: this repo's .gitignore swallows
templates by that name (see the root README's conventions).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "registry.fullname" . }}-auth
  labels:
    {{- include "registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  htpasswd: |
    {{ htpasswd .Values.registry.auth.username (include "registry.password" .) }}
