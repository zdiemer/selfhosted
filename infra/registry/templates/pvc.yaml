{{- if .Values.persistence.enabled }}
{{/*
/var/lib/registry — the blob store and every manifest. Rebuildable in principle
(each image has a build.sh), but rebuilding all of them is an afternoon and
needs GitHub/PyPI/npm up, which is the exact situation this registry exists
for. k8up carries it by default (opt-out, not opt-in).
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "registry.fullname" . }}-data
  labels:
    {{- include "registry.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
