# DuckDNS: the cluster's public DNS, and the credential its TLS rides on.
#
# Two jobs, one credential:
#
#   1. DNS  — a CronJob pings the DuckDNS update API every 5 minutes so
#             `zachd.duckdns.org` keeps pointing at the house's current IP.
#             DuckDNS resolves *any* `*.zachd.duckdns.org` label to that same
#             A record, so every sub-subdomain (docs., pdf., map., ...) follows
#             for free — adding a service needs no change here.
#
#   2. TOKEN — the same DuckDNS token Traefik needs to answer an ACME DNS-01
#             challenge, copied into Traefik's namespace. The certresolver
#             config itself lives in infra/traefik; this chart just owns the
#             credential it reads. Still load-bearing for HTTPS cluster-wide:
#             break the Secret and no cert renews. There is no cert-manager.
#
# DNS-01 (not HTTP-01) is what makes the wildcard possible and means port 80
# never has to be open to the internet for a renewal.
#
# WHY THE WILDCARD MATTERS: the DuckDNS API can only set a TXT record at the
# account's top-level subdomain, so a per-host ACME challenge for
# `docs.zachd.duckdns.org` cannot be answered and will fail. Services therefore
# ride a wildcard SAN instead — one `*.zachd.duckdns.org` cert covers every
# present and future sub-subdomain. That's the `ingress.tls.domain` +
# `ingress.tls.wildcardSan` pair in each service's values.yaml. If you add a
# service and its cert mysteriously won't issue, this is why.

# The DuckDNS account subdomain — the label only, no `.duckdns.org` suffix.
# This is what the updater sends as `domains=`, and it anchors the cert names.
domain: zachd

# REQUIRED — set in values.local.yaml (gitignored). The DuckDNS account token
# (a UUID from https://www.duckdns.org after signing in). It grants full control
# of every domain on the account: treat it like a password.
token: ""

# The dynamic-DNS half: re-point the A record at whatever IP we call from.
updater:
  enabled: true
  # Every 5 minutes. DuckDNS is happy to be told the same IP repeatedly, and
  # this bounds how long a residential IP change can black-hole the domain.
  schedule: "*/5 * * * *"
  image: curlimages/curl:8.11.1
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi

# The TLS half USED TO LIVE HERE. It now lives in infra/traefik, which owns the
# HelmChartConfig that teaches k3s's bundled Traefik to answer a DuckDNS DNS-01
# challenge. The split happened because `valuesContent` is Traefik's WHOLE
# config overlay — the ACME storage PVC, the http->https redirect, the rollout
# strategy, and now access logging — none of which are DNS concerns. They were
# only ever here because the certresolver needs this chart's token.
#
# What remains is that token. A secretKeyRef cannot cross namespaces, so Traefik
# needs its own copy of the Secret in its own namespace, and this chart is what
# puts it there.
#
# THE COUPLING IS REAL: infra/traefik references this Secret by name
# (`acme.tokenSecret.name`). Rename it here and the certresolver breaks there.
# Rotate the token here and Traefik keeps the old one until it is restarted —
# see this chart's README.
traefikSecretCopy:
  enabled: true
  # Where the k3s-managed Traefik runs. Must match infra/traefik's
  # `helmChart.namespace`.
  namespace: kube-system
