# DuckDNS: the cluster's public DNS, and the credential its TLS rides on.
#
# Two jobs, one credential:
#
#   1. DNS  — a CronJob pings the DuckDNS update API every 5 minutes so
#             `zachd.duckdns.org` keeps pointing at the house's current IP.
#             DuckDNS resolves *any* `*.zachd.duckdns.org` label to that same
#             A record, so every sub-subdomain (docs., pdf., map., ...) follows
#             for free — adding a service needs no change here.
#
#   2. TOKEN — the same DuckDNS token Traefik needs to answer an ACME DNS-01
#             challenge, copied into Traefik's namespace. The certresolver
#             config itself lives in infra/traefik; this chart just owns the
#             credential it reads. Still load-bearing for HTTPS cluster-wide:
#             break the Secret and no cert renews. There is no cert-manager.
#
# DNS-01 (not HTTP-01) is what makes the wildcard possible and means port 80
# never has to be open to the internet for a renewal.
#
# WHY THE WILDCARD MATTERS: the DuckDNS API can only set a TXT record at the
# account's top-level subdomain, so a per-host ACME challenge for
# `docs.zachd.duckdns.org` cannot be answered and will fail. Services therefore
# ride a wildcard SAN instead — one `*.zachd.duckdns.org` cert covers every
# present and future sub-subdomain. That's the `ingress.tls.domain` +
# `ingress.tls.wildcardSan` pair in each service's values.yaml. If you add a
# service and its cert mysteriously won't issue, this is why.

# The DuckDNS account subdomain — the label only, no `.duckdns.org` suffix.
# This is what the updater sends as `domains=`, and it anchors the cert names.
domain: zachd

# REQUIRED — set in values.local.yaml (gitignored). The DuckDNS account token
# (a UUID from https://www.duckdns.org after signing in). It grants full control
# of every domain on the account: treat it like a password.
token: ""

# The dynamic-DNS half: re-point the A record at whatever IP we call from.
updater:
  enabled: true
  # Every 5 minutes. DuckDNS is happy to be told the same IP repeatedly, and
  # this bounds how long a residential IP change can black-hole the domain.
  schedule: "*/5 * * * *"
  # renovate: datasource=docker depName=curlimages/curl
  image: curlimages/curl:8.21.0

  # WHERE zachd.duckdns.org POINTS. This is the security switch for the whole
  # DuckDNS surface, so it changes the mode, never a secret — safe in git.
  #
  #   wan-echo  the original behaviour: send an empty ip= and let DuckDNS
  #             record the request's source, i.e. the house's public IP.
  #             Every *.zachd.duckdns.org host is then reachable from the
  #             public internet (through whatever the router forwards).
  #
  #   tailnet   send a cluster node's Tailscale (100.x) address instead. The
  #             names still resolve and still serve — but only to devices on
  #             the tailnet, because 100.x is CGNAT and unroutable from the
  #             public internet. This is what lets the home router close its
  #             80/443 forwards: the public path becomes Cloudflare-only, and
  #             *.zachd.duckdns.org becomes the private/admin tier.
  #
  # ACME is unaffected either way — DNS-01 is outbound (Traefik POSTs the TXT
  # record to DuckDNS and lego verifies via 1.1.1.1/8.8.8.8); the A record and
  # inbound ports play no part in issuance or renewal.
  #
  # CUTOVER IS NOT JUST THIS FLAG. Flipping to tailnet and applying is safe and
  # reversible on its own (revert + one tick + TTL). Only after it's verified
  # from a tailnet device — and the Cloudflare paths for the ex-public hosts
  # are confirmed — does the router's port-forward deletion follow. See README.
  mode: tailnet

  # tailnet mode only. The updater walks this list in order and sends the first
  # node that is Ready, so a single node going down is repointed within one
  # tick rather than black-holing the domain — while a stable order avoids
  # flapping the record between healthy nodes. Names must match `kubectl get
  # nodes`; the image switches to one with kubectl (see below).
  tailnet:
    # Needs BOTH kubectl (read node readiness) and an HTTP client in one image.
    # alpine/kubectl is Alpine-based, so busybox provides `sh` and `wget` — the
    # DuckDNS call uses wget here, not curl, for that reason.
    # renovate: datasource=docker depName=alpine/kubectl
    image: alpine/kubectl:1.36.3
    # ORDER MATTERS BEYOND READINESS. The A record points every duckdns host at
    # this node's :443, so a candidate must serve Traefik cleanly on its
    # tailscale interface — something the node-Ready check can't see. Two traps:
    #   * `tailscale serve` on :443. tailscaled's own TLS listener then shadows
    #     Traefik for INBOUND tailnet connections: it works locally on that node
    #     but every other device gets a TLS internal_error alert (no cert for
    #     the duckdns SNI). `zachd-ubuntu` (the workstation) runs exactly this,
    #     so it is deliberately NOT a candidate. Run `tailscale serve status`
    #     before adding any node here.
    #   * laptops sleep and roam — poor targets for a stable ingress address,
    #     so they sit at the end as last-resort fallback only.
    # zachd-ubuntu-1 and -2 are the stable servers, verified clean — keep first.
    candidates:
      - { node: zachd-ubuntu-1,        ip: 100.84.179.82 }
      - { node: zachd-ubuntu-2,        ip: 100.118.242.89 }
      # Fallback only (laptops; verify no `tailscale serve` on :443 first):
      - { node: zachd-ubuntu-laptop,   ip: 100.124.40.81 }
      - { node: zachd-ubuntu-laptop-1, ip: 100.122.194.1 }
      - { node: zachd-ubuntu-laptop-2, ip: 100.81.206.46 }
      - { node: zachd-ubuntu-laptop-5, ip: 100.116.117.82 }
      - { node: zachd-ubuntu-laptop-6, ip: 100.109.25.85 }

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

# The TLS half USED TO LIVE HERE. It now lives in infra/traefik, which owns the
# HelmChartConfig that teaches k3s's bundled Traefik to answer a DuckDNS DNS-01
# challenge. The split happened because `valuesContent` is Traefik's WHOLE
# config overlay — the ACME storage PVC, the http->https redirect, the rollout
# strategy, and now access logging — none of which are DNS concerns. They were
# only ever here because the certresolver needs this chart's token.
#
# What remains is that token. A secretKeyRef cannot cross namespaces, so Traefik
# needs its own copy of the Secret in its own namespace, and this chart is what
# puts it there.
#
# THE COUPLING IS REAL: infra/traefik references this Secret by name
# (`acme.tokenSecret.name`). Rename it here and the certresolver breaks there.
# Rotate the token here and Traefik keeps the old one until it is restarted —
# see this chart's README.
traefikSecretCopy:
  enabled: true
  # Where the k3s-managed Traefik runs. Must match infra/traefik's
  # `helmChart.namespace`.
  namespace: kube-system
