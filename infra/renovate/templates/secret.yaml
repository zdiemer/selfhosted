apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-github
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  RENOVATE_TOKEN: {{ required "github.pat is required (values.local.yaml)" .Values.github.pat | quote }}
  GITHUB_COM_TOKEN: {{ .Values.github.pat | quote }}
