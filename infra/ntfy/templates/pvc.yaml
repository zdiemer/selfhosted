{{- if .Values.persistence.enabled }}
{{/*
/var/lib/ntfy — cache.db (the replayable message log), user.db (accounts and the
ACL) and the attachment directory. Losing this is losing every account, so it is
the volume the backup job should carry rather than the one to treat as a cache.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ntfy.fullname" . }}-data
  labels:
    {{- include "ntfy.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
