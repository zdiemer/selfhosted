{{/*
The user seeder: one password file per user, plus the script that applies them.

WHY A SCRIPT AND NOT AN initContainer
ntfy has no declarative user store — accounts and ACL entries are rows the
`ntfy user` / `ntfy access` CLI writes into user.db. And the CLI refuses to
touch a database that does not exist yet ("auth-file does not exist; please
start the server at least once to create it"), so seeding strictly *follows*
the server rather than preceding it. An initContainer runs before the server,
a Job would need a second attach of a single-node RWO volume, and both would be
two writers against one SQLite file. Running the seeder in the background of
the server's own container keeps a single writer and gets the ordering for
free.

WHY PASSWORDS ARE FILES, NOT SHELL VARIABLES
A password interpolated into the script becomes a quoting problem — one
apostrophe in a generated password and the seeder is a syntax error that only
shows up as "why can't I log in". Each password is its own Secret key, read
with $(cat) at the point of use, so the bytes are never parsed by the shell.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ntfy.fullname" . }}-seed
  labels:
    {{- include "ntfy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $u := .Values.ntfy.users }}
  pw-{{ $u.name }}: {{ required (printf "ntfy.users[%s].password is empty — see values.local.yaml" $u.name) $u.password | quote }}
  {{- end }}
  seed.sh: |
    #!/bin/sh
    # Reconcile ntfy's user.db with the users declared in values.local.yaml.
    # Runs in the background of the server container on every start, so the
    # vault stays authoritative: a rotated password is applied on the next
    # rollout rather than needing a `kubectl exec`.
    set -u
    SEED_DIR=/etc/ntfy/seed
    DB=/var/lib/ntfy/user.db

    # The server creates user.db during startup, then creates its tables. Wait
    # for the file, then let the retry loop below absorb the gap before the
    # schema is actually there.
    n=0
    while [ ! -f "$DB" ]; do
      n=$((n + 1))
      if [ "$n" -gt 120 ]; then
        echo "[seed] $DB never appeared after 120s; users NOT seeded" >&2
        exit 1
      fi
      sleep 1
    done

    # Retry rather than sleep-and-hope: the first attempts fail while the schema
    # is still being created, and a fixed sleep is either too short on a slow
    # NAS or wasted on a fast one.
    retry() {
      i=0
      while [ "$i" -lt 30 ]; do
        if "$@" >/dev/null 2>&1; then return 0; fi
        i=$((i + 1))
        sleep 2
      done
      echo "[seed] giving up on: $*" >&2
      return 1
    }
    {{- range $u := .Values.ntfy.users }}

    # --- {{ $u.name }} ({{ $u.role | default "user" }}) ---
    # `export`, not a `VAR=x cmd` prefix: the command here is a shell function,
    # and an assignment prefixing a function call is not exported to the
    # commands the function runs — ntfy would prompt for a password nobody can
    # type and the retry loop would spin until it gave up.
    NTFY_PASSWORD="$(cat "$SEED_DIR/pw-{{ $u.name }}")"
    export NTFY_PASSWORD
    retry ntfy user add --ignore-exists --role={{ $u.role | default "user" }} {{ $u.name }}
    # Re-applying the vault's password on every start is what makes a rotation
    # there a deploy here rather than a `kubectl exec` nobody remembers.
    retry ntfy user change-pass {{ $u.name }} </dev/null
    unset NTFY_PASSWORD
    retry ntfy user change-role {{ $u.name }} {{ $u.role | default "user" }}
    {{- if $u.access }}
    # change-role clears a user's ACL rows, so the grants are re-applied after
    # it, every time, in that order.
    {{- range $a := $u.access }}
    retry ntfy access {{ $u.name }} {{ $a.topic | quote }} {{ $a.permission }}
    {{- end }}
    {{- end }}
    {{- end }}

    echo "[seed] done"
