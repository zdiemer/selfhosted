{{/*
RomM's config.yml. Two settings here are not cosmetic at this library's scale:

  skip_hash_calculation — controls the expensive initial hash scan over SMB.

  structure — required by RomM 5.3; describes the builder's existing symlink
    tree, preserving the paths already stored in the database.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "romm.fullname" . }}-config
  labels:
    {{- include "romm.labels" . | nindent 4 }}
data:
  config.yml: |
    filesystem:
      structure:
        default: {{ printf "%s/{platform}/{game}" .Values.config.romsFolder | quote }}
        # The builder links NAS firmware into this separate platform tree.
        firmware: {{ printf "%s/{platform}" .Values.config.firmwareFolder | quote }}
      skip_hash_calculation: {{ .Values.config.skipHashCalculation }}
    {{- if .Values.streaming.enabled }}
    streaming:
      enabled: true
      containers:
        - protocol: webstation
          host: /streaming
          subfolder: /streaming
          broker_host: http://{{ include "romm.fullname" . }}-webstation:3000
          library_path: /romm/library
          label: Ubuntu 6
          platforms:
            {{- toYaml .Values.streaming.platforms | nindent 12 }}
    {{- end }}
    exclude:
      {{- with .Values.config.excludePlatforms }}
      platforms:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    {{- with .Values.config.platformMap }}
    system:
      platforms:
        {{- toYaml . | nindent 8 }}
    {{- end }}
