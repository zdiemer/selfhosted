apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "steam-headless.fullname" . }}
  labels:
    {{- include "steam-headless.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Host ports and RWO local volumes: two copies can never coexist.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "steam-headless.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "steam-headless.selectorLabels" . | nindent 8 }}
      annotations:
        steam.zachd/input-policy: virtual-input-v1
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/init: {{ include (print $.Template.BasePath "/configmap-init.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.node | quote }}
      # Only Moonlight's fixed streaming ports are published on the node.
      # Desktop/admin access stays behind the authenticated ingress.
      dnsPolicy: ClusterFirst
      # No hostIPC (upstream's compose sets ipc: host): that exists for
      # "secondary" containers sharing this X server. Everything here is in one
      # container, so MIT-SHM works without reaching into the host's IPC.
      # Steam and Xorg ignore SIGTERM for a while; let them go gracefully.
      terminationGracePeriodSeconds: 60
      containers:
        - name: steam-headless
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, SETGID, SETUID, SETFCAP, SETPCAP, SYS_CHROOT, NET_BIND_SERVICE]
            seccompProfile:
              type: Localhost
              localhostProfile: steam-headless.json
            appArmorProfile:
              type: Localhost
              localhostProfile: steam-headless
          command:
            - /bin/bash
            - -c
            - install -m 0755 /opt/chart-init/*.sh /etc/cont-init.d/ && exec /entrypoint.sh
          env:
            - name: DESKTOP_AUTH_URL
              value: http://{{ .Values.auth.forwardAuth.autheliaService }}.{{ .Values.auth.forwardAuth.autheliaNamespace }}.svc.cluster.local:{{ .Values.auth.forwardAuth.autheliaPort }}{{ .Values.auth.forwardAuth.autheliaPath }}
            - name: DESKTOP_AUTH_ORIGIN
              value: {{ .Values.ingress.desktopHost | quote }}
            - { name: NAME, value: SteamHeadless }
            - { name: TZ, value: {{ .Values.timezone | quote }} }
            - { name: USER_LOCALES, value: "en_US.UTF-8 UTF-8" }
            - { name: DISPLAY, value: {{ .Values.display | quote }} }
            - { name: PUID, value: {{ .Values.puid | quote }} }
            - { name: PGID, value: {{ .Values.pgid | quote }} }
            - { name: UMASK, value: "000" }
            - { name: MODE, value: primary }
            - { name: WEB_UI_MODE, value: vnc }
            - { name: ENABLE_VNC_AUDIO, value: "true" }
            - { name: PORT_NOVNC_WEB, value: {{ .Values.novncPort | quote }} }
            - { name: ENABLE_STEAM, value: "true" }
            - { name: STEAM_ARGS, value: "-silent" }
            - { name: ENABLE_SUNSHINE, value: "true" }
            - { name: SUNSHINE_USER, value: {{ .Values.sunshine.username | quote }} }
            - {name: SDL_JOYSTICK_DISABLE_UDEV, value: "1"}
            - {name: SDL_HIDAPI_JOYSTICK_DISABLE_UDEV, value: "1"}
            - { name: ENABLE_EVDEV_INPUTS, value: "true" }
            # See values.yaml (forceDummyDisplay) before flipping this.
            - { name: FORCE_X11_DUMMY_CONFIG, value: {{ .Values.forceDummyDisplay | quote }} }
          envFrom:
            - secretRef:
                name: {{ include "steam-headless.fullname" . }}
          ports:
            {{- range $port := list 47984 47989 48010 }}
            - {containerPort: {{ $port }}, hostPort: {{ $port }}, protocol: TCP}
            {{- end }}
            {{- range $port := list 47998 47999 48000 48002 48010 }}
            - {containerPort: {{ $port }}, hostPort: {{ $port }}, protocol: UDP}
            {{- end }}
          volumeMounts:
            - {name: input, mountPath: /dev/input, readOnly: true}
            - { name: home, mountPath: /home/default }
            - { name: games, mountPath: /mnt/games }
            - { name: x11, mountPath: /tmp/.X11-unix }
            - { name: pulse, mountPath: /tmp/pulse }
            - { name: shm, mountPath: /dev/shm }
            - { name: init, mountPath: /opt/chart-init, readOnly: true }
          readinessProbe:
            exec:
              command: [bash, -c, "supervisorctl status xorg x11vnc frontend sunshine virtual-inputs >/dev/null"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- $resources := deepCopy .Values.resources }}
            {{- $_ := set $resources.limits "devic.es/steam-display" 1 }}
            {{- toYaml $resources | nindent 12 }}
        - name: input-devices
          image: python:3.14.7-alpine@sha256:9e9fde4d32eedce0b661d9ab91e826b62dddf28e928c230ec55f1866cac66b01
          command: [python3, /scripts/input-devices.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [MKNOD, CHOWN]
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          volumeMounts:
            - {name: input, mountPath: /dev/input}
            - {name: init, mountPath: /scripts, readOnly: true}
      volumes:
        - name: input
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: home
          persistentVolumeClaim:
            claimName: {{ include "steam-headless.fullname" . }}-home
        - name: games
          persistentVolumeClaim:
            claimName: {{ include "steam-headless.fullname" . }}-games
        - name: x11
          emptyDir: {}
        - name: pulse
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.persistence.shmSize }}
        - name: init
          configMap:
            name: {{ include "steam-headless.fullname" . }}-init
