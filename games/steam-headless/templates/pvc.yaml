apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "steam-headless.fullname" . }}-home
  labels:
    {{- include "steam-headless.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.home.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.home.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "steam-headless.fullname" . }}-games
  labels:
    {{- include "steam-headless.labels" . | nindent 4 }}
  annotations:
    # Hundreds of GB, all re-downloadable from Steam. See infra/k8up values.
    k8up.io/backup: "false"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.games.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.games.size }}
