{{/*
Shell script for the stage-library init container: stage the curated games of
every platform from the read-only share onto the data PVC — unzipping the
`unzip: true` ones, copying the `unzip: false` ones that carry an `include`.
Idempotent — a game whose zip has already been extracted (marker file keyed by
zip name) is skipped, so a pod restart costs seconds, not a re-extract.

Games REMOVED from `include` are pruned too, so the dropdown tracks values.yaml
rather than accumulating everything ever listed.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloud-game.fullname" . }}-library-stager
  labels:
    {{- include "cloud-game.labels" . | nindent 4 }}
data:
  stage.sh: |
    #!/bin/sh
    # $NAS   — share root (read-only)
    # $STAGE — data PVC games/ root (read-write)
    set -eu
    stage_platform() {
      core="$1"; src="$NAS/$2"; shift 2
      out="$STAGE/$core"; mkdir -p "$out/.done"
      [ -d "$src" ] || { echo "stage: $core: missing $src on the share"; return 0; }
      wanted="$out/.wanted"; : > "$wanted"
      if [ $# -eq 0 ]; then set -- '*'; fi
      for pat in "$@"; do
        # Patterns are shell globs against the zip filename. IFS is newline
        # so "Mario Kart 64 (USA)*" globs as ONE word instead of four.
        # `|| true` matters: with no match the subshell's last command is a
        # failing [ -f ], and `set -e` would kill the whole init container.
        hits=$( cd "$src" && IFS=$(printf '\nx') && IFS=${IFS%x} && for z in $pat; do [ -f "$z" ] && echo "$z"; done ) || true
        # A pattern that matches nothing is almost always a typo or a No-Intro
        # name that differs from what you assumed. Say so — silently staging
        # one game fewer than values.yaml lists is how it goes unnoticed.
        [ -n "$hits" ] || echo "stage: $core: WARNING no match for include: $pat"
        [ -z "$hits" ] || echo "$hits" >> "$wanted"
      done
      sort -u "$wanted" -o "$wanted"
      n=0
      while IFS= read -r z; do
        [ -n "$z" ] || continue
        marker="$out/.done/$z"
        if [ -f "$marker" ]; then continue; fi
        echo "stage: $core: $z"
        # Extract via a scratch dir so the marker can record exactly which
        # files the zip produced (busybox unzip has no -Z to list them later).
        tmp="$out/.tmp"; rm -rf "$tmp"; mkdir -p "$tmp"
        unzip -oq "$src/$z" -d "$tmp"
        ( cd "$tmp" && find . -type f | sed 's|^\./||' ) > "$marker"
        ( cd "$tmp" && find . -type f | while IFS= read -r f; do
            mkdir -p "$out/$(dirname "$f")"; mv -f "$f" "$out/$f"; done )
        rm -rf "$tmp"
        n=$((n+1))
      done < "$wanted"
      # Prune: every marker without a matching wanted zip, plus its files.
      for marker in "$out/.done"/*; do
        [ -f "$marker" ] || continue
        z="${marker##*/}"
        grep -qxF "$z" "$wanted" && continue
        echo "stage: $core: prune $z"
        while IFS= read -r f; do rm -f "$out/$f"; done < "$marker"
        rm -f "$marker"
      done
      echo "stage: $core: $(wc -l < "$wanted") wanted, $n newly extracted"
    }
    # Same contract as stage_platform, but for sets stored as bare files (PSX
    # is one .chd per game). Those can't be filtered by a subPath mount — it is
    # all or nothing, and "all" is 5.5k entries in one dropdown — so the wanted
    # ones are copied onto the PVC instead and that folder is mounted as the
    # core folder. Marker file per game, so a restart costs a stat, not a copy.
    copy_platform() {
      core="$1"; src="$NAS/$2"; shift 2
      out="$STAGE/$core"; mkdir -p "$out/.done"
      [ -d "$src" ] || { echo "stage: $core: missing $src on the share"; return 0; }
      wanted="$out/.wanted"; : > "$wanted"
      if [ $# -eq 0 ]; then set -- '*'; fi
      for pat in "$@"; do
        hits=$( cd "$src" && IFS=$(printf '\nx') && IFS=${IFS%x} && for f in $pat; do [ -f "$f" ] && echo "$f"; done ) || true
        [ -n "$hits" ] || echo "stage: $core: WARNING no match for include: $pat"
        [ -z "$hits" ] || echo "$hits" >> "$wanted"
      done
      sort -u "$wanted" -o "$wanted"
      n=0
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        marker="$out/.done/$f"
        if [ -f "$marker" ]; then continue; fi
        echo "stage: $core: copy $f"
        # Copy to scratch first so an interrupted pod can't leave a truncated
        # ROM behind that looks complete on the next start.
        tmp="$out/.tmp"; rm -f "$tmp"
        cp "$src/$f" "$tmp"
        mv -f "$tmp" "$out/$f"
        echo "$f" > "$marker"
        n=$((n+1))
      done < "$wanted"
      # Prune, same as stage_platform.
      for marker in "$out/.done"/*; do
        [ -f "$marker" ] || continue
        f="${marker##*/}"
        grep -qxF "$f" "$wanted" && continue
        echo "stage: $core: prune $f"
        while IFS= read -r x; do rm -f "$out/$x"; done < "$marker"
        rm -f "$marker"
      done
      echo "stage: $core: $(wc -l < "$wanted") wanted, $n newly copied"
    }
    {{- range $core, $p := .Values.library.platforms }}
    {{- if $p.unzip }}
    stage_platform {{ $core | quote }} {{ $p.source | quote }}{{ range $p.include }} {{ . | quote }}{{ end }}
    {{- else if $p.include }}
    copy_platform {{ $core | quote }} {{ $p.source | quote }}{{ range $p.include }} {{ . | quote }}{{ end }}
    {{- end }}
    {{- end }}
    echo "stage: done"
