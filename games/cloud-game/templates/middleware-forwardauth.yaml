{{- if and .Values.ingress.enabled .Values.auth.forwardAuth.enabled }}
{{/*
Traefik Middleware that bounces a request through Authelia before it reaches
the coordinator. Rendered into THIS chart's namespace so the Ingress can
reference it without Traefik's allowCrossNamespace — same pattern as
games/romm. Authelia 4.38+ uses /api/authz/forward-auth.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "cloud-game.fullname" . }}-forwardauth
  labels:
    {{- include "cloud-game.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://{{ .Values.auth.forwardAuth.autheliaService }}.{{ .Values.auth.forwardAuth.autheliaNamespace }}.svc.cluster.local:{{ .Values.auth.forwardAuth.autheliaPort }}{{ .Values.auth.forwardAuth.autheliaPath }}
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
{{- end }}
