apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cloud-game.fullname" . }}-library
  annotations:
    # Never back this up: it is the (read-only, re-acquirable) ROM library.
    # Same reasoning as games/romm — k8up once spent nine hours on 1.9% of it.
    k8up.io/backup: "false"
  labels:
    {{- include "cloud-game.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: {{ include "cloud-game.fullname" . }}-library
  resources:
    requests:
      storage: 1Ti
