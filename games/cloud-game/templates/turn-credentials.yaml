{{/*
TURN credential, kept out of values.yaml (and therefore out of git) the same
way the SMB password is. Rendered only when an iceServers entry actually asks
for it, so a TURN-less deployment makes no empty Secret.
*/}}
{{- $needsTurn := false }}
{{- range .Values.webrtc.iceServers }}{{- if .credentialSecret }}{{ $needsTurn = true }}{{- end }}{{- end }}
{{- if $needsTurn }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloud-game.fullname" . }}-turn-creds
  labels:
    {{- include "cloud-game.labels" . | nindent 4 }}
type: Opaque
stringData:
  credential: {{ required "turn.credential required in values.local.yaml (an iceServers entry sets credentialSecret)" .Values.turn.credential | quote }}
{{- end }}
