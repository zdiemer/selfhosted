{{/*
setup.xml seeds the first account when the lobby finds an empty database. It
carries the admin password, so it is a Secret rather than part of the config
ConfigMap, and it is mounted into /etc/comp_hack next to the others.

UserLevel 1000 is the GM tier: every @command in the channel (items, levels,
teleport, spawn) is gated on it. That is the whole point of a solo server.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smt-imagine.fullname" . }}-setup
  labels:
    {{- include "smt-imagine.labels" . | nindent 4 }}
type: Opaque
stringData:
  setup.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <objgen>
        <object name="Account">
            <member name="UID">00000000-0000-0000-0000-000000000a01</member>
            <member name="Username">{{ .Values.admin.username }}</member>
            <member name="DisplayName">Administrator</member>
            <member name="Email">{{ .Values.admin.email }}</member>
            <member name="Password">{{ required "admin.password must be set (values.local via 1Password)" .Values.admin.password }}</member>
            <member name="CP">1000000</member>
            <member name="TicketCount">{{ .Values.admin.characterTickets }}</member>
            <member name="UserLevel">1000</member>
            <member name="Enabled">true</member>
            <member name="IsGM">true</member>
        </object>
    </objgen>
