{{- if .Values.ingress.enabled }}
{{/*
The account manager (/accountmanager/) and the lobby's REST API, on a hostname
with TLS and Authelia in front. The game client never uses this — it POSTs to
the raw LoadBalancer port — so forward-auth here costs it nothing.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "smt-imagine.fullname" . }}
  labels:
    {{- include "smt-imagine.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- if .Values.auth.forwardAuth.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "smt-imagine.fullname" . }}-forwardauth@kubernetescrd
    {{- else }}
    # UNAUTHENTICATED at the edge, DELIBERATELY (infra/ingress-policy rule 4).
    ingress.zachd/public-unauthenticated: "true"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "smt-imagine.fullname" . }}
                port:
                  number: {{ .Values.ports.web }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.auth.forwardAuth.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "smt-imagine.fullname" . }}-forwardauth
  labels:
    {{- include "smt-imagine.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://{{ .Values.auth.forwardAuth.autheliaService }}.{{ .Values.auth.forwardAuth.autheliaNamespace }}.svc.cluster.local:{{ .Values.auth.forwardAuth.autheliaPort }}{{ .Values.auth.forwardAuth.autheliaPath }}
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
{{- end }}
