apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  loadBalancerSourceRanges: {{- toYaml (concat .Values.network.trustedClients .Values.service.translatedClientSources) | nindent 4 }}
  {{- end }}
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: game, port: {{ .Values.service.port }}, targetPort: game, protocol: TCP}
