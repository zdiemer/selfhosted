apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ra2
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ra2
        app.kubernetes.io/instance: {{ .Release.Name }}
        observability.zachd/logs: "true"
      annotations:
        checksum/assets: {{ .Files.Get "prepare-assets.py" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: index-assets
          image: python:3.14-alpine
          command: [python3, /config/prepare-assets.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: assets, mountPath: /assets}
            - name: nas
              mountPath: /nas
              subPath: {{ .Values.nas.subPath | quote }}
              readOnly: true
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          lifecycle:
            preStop:
              sleep: {seconds: 3}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: assets, mountPath: /assets, readOnly: true}
            - name: nas
              mountPath: /nas
              subPath: {{ .Values.nas.subPath | quote }}
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-assets
        - name: assets
          emptyDir: {sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: nas
          persistentVolumeClaim:
            claimName: {{ .Values.nas.existingClaim }}
            readOnly: true
