map $host $game_target {
    default game;
    yuri.zachd.duckdns.org gamemd;
}
server {
    listen 8080;
    absolute_redirect off;
    server_name _;
    root /usr/share/nginx/html/$game_target;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { access_log off; return 200 'ok'; }
    location = / { return 302 /ra2.html?skipintro=1; }
    location = /local-manifest {
        alias /assets/$game_target.json;
        default_type application/json;
    }
    location /local-game/ { alias /assets/files/$game_target/; }
    location = /local-font { alias /usr/share/nginx/html/arial.ttf; }
    location = /LICENSE { alias /usr/share/nginx/html/LICENSE; }
    location = /FFmpeg-LICENSE { alias /usr/share/nginx/html/FFmpeg-LICENSE; }
    location = /ffmpeg-source.tar.gz { alias /usr/share/nginx/html/ffmpeg-source.tar.gz; }
    location / { try_files $uri =404; }
}
